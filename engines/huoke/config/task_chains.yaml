# 任务链配置 — 2026-05-08 P2-2；2026-08-16 获客剧本库 P0 扩充
# 每条链定义了一组按顺序执行的任务步骤。
# 前一步完成后，自动为同一设备创建下一步任务。
# 每步可以定义 params（覆盖默认参数）和 on_fail（失败策略: skip/abort）。
#
# 使用方法:
#   POST /tasks/chain  {"chain_id": "fb_full_funnel", "device_id": "xxx"}
#   或批量: POST /tasks/chain  {"chain_id": "fb_full_funnel", "device_ids": ["a","b","c"]}
#
# 剧本库元数据（货架展示/筛选用，均为可选，由 list_chains 透出）：
#   scene           一句话获客场景（人话，给用户看）
#   funnel_stage    漏斗阶段: warmup(养号) / discover(引流) / first_touch(首触)
#                            / followup(跟进) / harvest(收割) / full(全链路)
#   risk_level      风控风险: low / medium / high
#   prerequisites   前置条件清单（要不要登录账号、要不要先养号等）
#   expected_output 预期产出（人话）
#   params_exposed  建议暴露给用户可调的关键参数键（其余锁默认，出厂保守）
#
# 纪律（由 tests/test_chain_templates.py 门禁保护，防幻觉/防风控事故）：
#   1) 每步 task_type 必须是执行器真实认识的动词
#   2) params 键必须在执行器参数消费面内（防拼写错静默失效）
#   3) 内置剧本元数据字段必须完整
#   4) 频控类参数出厂必须保守（不得超过安全上限）

chains:

  # ── Facebook 全链路客服拓展 (Phase C1 升级) ──────────────────────
  # 对应 full_funnel preset: 养号 → 进群互动 → 群成员打招呼加好友 → 收件箱
  # 拆为 4 步链, 每步可独立重跑; extract_members + add_friends 合并为
  # facebook_group_member_greet (数据上下文需保持)
  fb_full_funnel:
    name: "Facebook 全链路获客"
    description: "养号 → 进群互动 → 群成员打招呼+加好友 → Messenger+消息请求+好友请求"
    platform: facebook
    scene: "从养号到加好友到收件箱回复，一条链跑通 Facebook 获客全流程"
    funnel_stage: full
    risk_level: high
    prerequisites:
      - "设备已登录 Facebook 账号"
      - "账号建议已养号 3 天以上（新号直接跑全链路封号风险高）"
    expected_output: "新增好友 + 收件箱/消息请求回复，线索自动进 CRM"
    params_exposed: ["max_friends_per_run", "outreach_goal", "max_conversations"]
    steps:
      - task_type: facebook_browse_feed
        params:
          scroll_count: 20
          like_probability: 0.35
          duration: 15
        on_fail: skip     # 浏览失败不阻塞后续

      - task_type: facebook_campaign_run
        params:
          steps: ["warmup", "group_engage"]
          warmup_scrolls: 15
          group_max_posts: 4
          like_probability: 0.4
        on_fail: skip     # 进群互动失败不阻塞加好友

      - task_type: facebook_group_member_greet
        params:
          steps: ["extract_members", "add_friends"]
          max_members: 50
          extract_max_members: 50
          max_friends_per_run: 5
          send_greeting_inline: true
          require_verification_note: true
          require_outreach_goal: true
          outreach_goal: 5
          broad_keyword: true
          discover_groups: true
          auto_join_groups: true
          join_if_needed: true
          skip_visited: true
          member_sources: ["feed_authors"]
          feed_max_scrolls: 25
          min_l1_score: 0
          max_groups: 4
          max_groups_to_extract: 4
          max_members_per_group: 50
          do_l2_gate: true
          strict_persona_gate: true
          l2_gate_shots: 1
          walk_candidates: true
          max_l2_calls: 8
        on_fail: skip     # extract/greet 失败不阻塞收件箱检查

      - task_type: facebook_check_inbox
        params:
          auto_reply: true
          max_conversations: 15
        on_fail: skip

      - task_type: facebook_check_message_requests
        params:
          max_requests: 10
        on_fail: skip

      - task_type: facebook_check_friend_requests
        params:
          accept_all: false
          max_requests: 15
        on_fail: skip

  # ── Facebook 养号链（仅浏览+互动）─────────────────────────────
  fb_warmup_only:
    name: "Facebook 纯养号"
    description: "浏览动态 → 兴趣浏览 → 浏览群组"
    platform: facebook
    scene: "新号冷启动：只浏览互动不触达，把账号养熟降低封号风险"
    funnel_stage: warmup
    risk_level: low
    prerequisites:
      - "设备已登录 Facebook 账号"
    expected_output: "账号活跃度提升，为后续触达打底（不产生线索）"
    params_exposed: ["duration", "max_topics"]
    steps:
      - task_type: facebook_browse_feed
        params:
          duration: 15
        on_fail: skip

      - task_type: facebook_browse_feed_by_interest
        params:
          duration: 10
          max_topics: 3
        on_fail: skip

      - task_type: facebook_browse_groups
        params: {}
        on_fail: skip

  # ── TikTok 获客链 ──────────────────────────────────────────────
  tt_warmup_only:
    name: "TikTok 纯养号"
    description: "只刷视频喂算法，不加人不私信，冷启动/恢复期专用"
    platform: tiktok
    scene: "新设备冷启动或风控恢复期，用最低风险动作维持账号活性"
    funnel_stage: warmup
    risk_level: low
    prerequisites:
      - "设备已登录 TikTok 账号"
    expected_output: "喂养算法画像，无对外触达（零封号增量风险）"
    params_exposed: ["video_count"]
    steps:
      # 单步链 on_fail 用 abort：skip 会把失败伪装成 completed
      #（2026-08-17 灰度首跑实锤——预检门拦截后链仍显示"完成"）
      - task_type: tiktok_warmup
        params:
          video_count: 20
        on_fail: abort

  tt_acquisition:
    name: "TikTok 关注获客"
    description: "刷视频养号 → 关注目标 → 检查收件箱 → 回关自动私聊"
    platform: tiktok
    scene: "养号后关注目标用户，回关的自动开聊，适合从零起量"
    funnel_stage: full
    risk_level: medium
    prerequisites:
      - "设备已登录 TikTok 账号"
      - "已在种子账号/关键词里配置目标人群"
    expected_output: "新增关注 + 回关私聊对话，意向线索进 CRM"
    params_exposed: ["video_count", "max_follows"]
    steps:
      - task_type: tiktok_warmup
        params:
          video_count: 15
        on_fail: skip

      - task_type: tiktok_follow
        params:
          max_follows: 15
        on_fail: abort

      - task_type: tiktok_check_inbox
        params: {}
        on_fail: skip

      - task_type: tiktok_check_and_chat_followbacks
        params: {}
        on_fail: skip

  # ── Instagram 种草获客链 ───────────────────────────────────────
  ig_seed_funnel:
    name: "Instagram 种草获客"
    description: "浏览首页 → 搜索潜客 → DM私信"
    platform: instagram
    scene: "养号后按关键词搜潜客并私信首触，适合内容种草型获客"
    funnel_stage: full
    risk_level: medium
    prerequisites:
      - "设备已登录 Instagram 账号"
      - "已配置搜索关键词与首触话术"
    expected_output: "搜索到的潜客收到首条 DM，回复进 CRM"
    params_exposed: ["keyword", "max_leads", "message"]
    steps:
      - task_type: instagram_browse_feed
        params:
          scroll_count: 30
          like_probability: 0.15
        on_fail: skip

      - task_type: instagram_search_leads
        params:
          keyword: ""
          max_leads: 10
        on_fail: abort

      - task_type: instagram_send_dm
        params:
          message: ""
        on_fail: skip

  # ══════════════════════════════════════════════════════════════════
  # 获客剧本库扩充（2026-08-16 P0）：覆盖高频获客场景，动词与参数键
  # 均已对过执行器消费面，频控参数出厂保守。
  # ══════════════════════════════════════════════════════════════════

  # ── TikTok 关键词搜客首触 ──────────────────────────────────────
  tt_keyword_first_touch:
    name: "TikTok 关键词搜客首触"
    description: "养号 → 按关键词搜客并关注 → 收件箱回关自动开聊"
    platform: tiktok
    scene: "用行业关键词精准找人，关注后回关的自动开场白首触"
    funnel_stage: first_touch
    risk_level: medium
    prerequisites:
      - "设备已登录 TikTok 账号"
      - "填写目标行业/人群关键词"
    expected_output: "按关键词命中的新关注 + 回关首触对话"
    params_exposed: ["keywords", "max_follows"]
    steps:
      - task_type: tiktok_warmup
        params:
          video_count: 12
        on_fail: skip
      - task_type: tiktok_keyword_search
        params:
          keywords: []
          max_follows: 15
          target_countries: []
        on_fail: abort
      - task_type: tiktok_check_inbox
        params:
          auto_reply: true
          max_conversations: 15
        on_fail: skip

  # ── TikTok 私信滴灌跟进 ────────────────────────────────────────
  tt_drip_followup:
    name: "TikTok 私信滴灌跟进"
    description: "检查收件箱 → 对未回复线索滴灌跟进 → 回关继续开聊"
    platform: tiktok
    scene: "对已触达但没回复的线索按节奏补跟进，捞回沉默客"
    funnel_stage: followup
    risk_level: low
    prerequisites:
      - "设备已登录 TikTok 账号"
      - "已有前期触达产生的线索（否则无跟进对象）"
    expected_output: "沉默线索被再次触达，回复率提升"
    params_exposed: ["max_conversations"]
    steps:
      - task_type: tiktok_check_inbox
        params:
          auto_reply: false
          max_conversations: 20
        on_fail: skip
      - task_type: tiktok_drip_followup
        params:
          cancel_if_replied: true
        on_fail: skip
      - task_type: tiktok_check_and_chat_followbacks
        params: {}
        on_fail: skip

  # ── TikTok 评论区互动引流 ──────────────────────────────────────
  tt_comment_engage:
    name: "TikTok 评论区互动引流"
    description: "按关键词找视频评论互动+关注评论者 → 检查评论回复"
    platform: tiktok
    scene: "在热门视频评论区曝光互动，把评论者转成关注与线索"
    funnel_stage: discover
    risk_level: medium
    prerequisites:
      - "设备已登录 TikTok 账号"
      - "填写目标视频关键词"
    expected_output: "评论曝光 + 新增关注，评论回复进对话"
    params_exposed: ["keyword", "max_videos"]
    steps:
      - task_type: tiktok_comment_engage
        params:
          keyword: ""
          max_videos: 10
          comments_per_video: 1
          follow_commenters: true
        on_fail: abort
      - task_type: tiktok_check_comment_replies
        params:
          max_replies: 10
        on_fail: skip

  # ── Facebook 名单猎手精准触达 ──────────────────────────────────
  fb_name_hunter:
    name: "Facebook 名单猎手精准触达"
    description: "候选预筛打分 → 对合格线索加好友+打招呼"
    platform: facebook
    scene: "先给候选人打分过滤，只对高分合格线索精准加好友，省额度"
    funnel_stage: first_touch
    risk_level: high
    prerequisites:
      - "设备已登录 Facebook 账号且已养号"
      - "已配置画像 persona 与候选来源"
    expected_output: "高质量新增好友 + 首条打招呼，低质量候选被过滤"
    params_exposed: ["max_targets", "max_friends_per_run"]
    steps:
      - task_type: facebook_name_hunter_prescreen
        params:
          max_targets: 10
          min_seed_score: 0
          shot_count: 1
        on_fail: abort
      - task_type: facebook_name_hunter_touch_qualified
        params:
          max_friends_per_run: 5
          max_targets: 10
          send_greeting_inline: true
        on_fail: skip

  # ── Facebook 搜索获客+打招呼 ───────────────────────────────────
  fb_search_greet:
    name: "Facebook 搜索获客+打招呼"
    description: "按关键词搜索潜客 → 加好友并发送打招呼"
    platform: facebook
    scene: "用关键词直接搜潜客，加好友时自动带个性化打招呼"
    funnel_stage: first_touch
    risk_level: high
    prerequisites:
      - "设备已登录 Facebook 账号且已养号"
      - "填写搜索关键词与打招呼话术"
    expected_output: "搜索命中的潜客新增好友 + 首条打招呼"
    params_exposed: ["keyword", "max_leads"]
    steps:
      - task_type: facebook_search_leads
        params:
          keyword: ""
          max_leads: 10
          skip_visited: true
        on_fail: abort
      - task_type: facebook_add_friend_and_greet
        params:
          greeting_message: ""
          verification_note: ""
          ai_dynamic_greeting: true
        on_fail: skip

  # ── Facebook 收件箱跟进 ────────────────────────────────────────
  fb_inbox_followup:
    name: "Facebook 收件箱跟进"
    description: "检查 Messenger → 处理消息请求 → 发送转介回复"
    platform: facebook
    scene: "把收件箱、消息请求、转介回复三处入口一次跟完，不漏客"
    funnel_stage: followup
    risk_level: medium
    prerequisites:
      - "设备已登录 Facebook 账号"
      - "已有对话/消息请求（否则无处理对象）"
    expected_output: "收件箱与消息请求被回复，线索进 CRM"
    params_exposed: ["max_conversations", "max_requests"]
    steps:
      - task_type: facebook_check_inbox
        params:
          auto_reply: true
          max_conversations: 15
        on_fail: skip
      - task_type: facebook_check_message_requests
        params:
          auto_review: false
          max_requests: 10
        on_fail: skip
      - task_type: facebook_send_referral_replies
        params: {}
        on_fail: skip

  # ── Telegram 拉群+群发 ─────────────────────────────────────────
  tg_group_blast:
    name: "Telegram 进群群发"
    description: "加入目标群 → 群内发送消息"
    platform: telegram
    scene: "加入行业/兴趣群后在群内发布信息触达群成员"
    funnel_stage: discover
    risk_level: high
    prerequisites:
      - "设备已登录 Telegram 账号"
      - "填写目标群与群发内容（注意群规避免被封）"
    expected_output: "群内消息曝光，引导私聊线索"
    params_exposed: ["group", "message"]
    steps:
      - task_type: telegram_join_group
        params:
          group: ""
        on_fail: abort
      - task_type: telegram_send_group
        params:
          group: ""
          message: ""
        on_fail: skip

  # ── Telegram 监听+自动回复 ─────────────────────────────────────
  tg_monitor_reply:
    name: "Telegram 监听自动回复"
    description: "监听目标对话 → 自动回复"
    platform: telegram
    scene: "值守目标对话/群，来消息自动回复，做轻量客服"
    funnel_stage: followup
    risk_level: low
    prerequisites:
      - "设备已登录 Telegram 账号"
    expected_output: "来消息被自动回复，意向线索进对话"
    params_exposed: ["duration"]
    steps:
      - task_type: telegram_monitor_chat
        params:
          duration: 120
        on_fail: skip
      - task_type: telegram_auto_reply
        params:
          duration: 120
        on_fail: skip

  # ── WhatsApp 客服值守自动回复 ──────────────────────────────────
  wa_service_reply:
    name: "WhatsApp 客服值守"
    description: "列出会话 → 自动回复"
    platform: whatsapp
    scene: "值守 WhatsApp 会话，来消息自动回复，不漏询盘"
    funnel_stage: followup
    risk_level: low
    prerequisites:
      - "设备已登录 WhatsApp 账号"
    expected_output: "询盘消息被自动回复，线索进对话"
    params_exposed: ["duration"]
    steps:
      - task_type: whatsapp_list_chats
        params: {}
        on_fail: skip
      - task_type: whatsapp_auto_reply
        params:
          duration: 120
        on_fail: skip

  # ── LinkedIn 破冰连接 ──────────────────────────────────────────
  li_connect:
    name: "LinkedIn 破冰连接"
    description: "搜索目标资料 → 发送连接请求 → 接受回连 → 发送首条消息"
    platform: linkedin
    scene: "B2B 场景按条件搜人，发连接请求，接受后发首条破冰消息"
    funnel_stage: first_touch
    risk_level: medium
    prerequisites:
      - "设备已登录 LinkedIn 账号"
      - "填写搜索条件与破冰话术"
    expected_output: "新增连接 + 首条破冰消息，B2B 线索进 CRM"
    params_exposed: ["query", "note", "message"]
    steps:
      - task_type: linkedin_search_profile
        params:
          query: ""
          max_results: 10
        on_fail: abort
      - task_type: linkedin_send_connection
        params:
          query: ""
          note: ""
        on_fail: skip
      - task_type: linkedin_accept_connections
        params:
          max_accept: 10
        on_fail: skip
      - task_type: linkedin_send_message
        params:
          message: ""
        on_fail: skip

  # ── X/Twitter 搜索互动获客 ─────────────────────────────────────
  x_search_engage:
    name: "X/Twitter 搜索互动获客"
    description: "搜索潜客 → 搜索并互动推文 → DM私信首触"
    platform: twitter
    scene: "按关键词搜潜客，点赞回复推文提升曝光后 DM 首触"
    funnel_stage: first_touch
    risk_level: medium
    prerequisites:
      - "设备已登录 X/Twitter 账号"
      - "填写搜索关键词与首触话术"
    expected_output: "互动曝光 + 潜客收到首条 DM"
    params_exposed: ["keyword", "max_leads", "message"]
    steps:
      - task_type: twitter_search_leads
        params:
          keyword: ""
          max_leads: 10
        on_fail: abort
      - task_type: twitter_search_and_engage
        params:
          keyword: ""
          like_probability: 0.2
          max_tweets: 15
          reply_probability: 0.1
        on_fail: skip
      - task_type: twitter_send_dm
        params:
          message: ""
        on_fail: skip
