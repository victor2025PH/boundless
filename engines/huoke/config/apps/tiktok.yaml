package: com.zhiliaoapp.musically
name: TikTok
behavior_profile: tiktok

# TK-3：脑手分离。local＝既有本地大脑（默认，零 diff）；chengjie＝只把私信交给智聊起草/闸门，本仓不跑 ChatBrain。
# auto_reply=true 与 reply_engine=chengjie 互斥（chengjie 模式下忽略本地回复）。
reply_engine: local
chengjie:
  endpoint: ""                 # 例 http://192.168.0.118:8780 ；也认环境变量 CHENGJIE_TIKTOK_ENDPOINT
  token: ""                    # Bearer，对智聊 api_auth；也认 CHENGJIE_API_TOKEN
  account_id: ""               # 缺省回落 device_id
  username: ""                 # 本机 TikTok 用户名（给智聊登记）
  timezone: ""                 # IANA，例 Asia/Manila；智聊按此时区切日上限
  timeout_sec: 8
  handback_limit: 5
  device_account_map: {}       # {设备序列号: {account_id, username, timezone}}

compliance:
  hourly_total: 45
  daily_total: 200
  actions:
    follow: {hourly: 8, daily: 30}
    like: {hourly: 15, daily: 80}
    comment: {hourly: 8, daily: 50}
    send_dm: {hourly: 5, daily: 15}
    search: {hourly: 12, daily: 60}

actions:
  search_users:
    description: "Search for users/creators"
    params: [query]
    steps:
      - find: "Discover or Search icon"
        action: tap
      - find: "Search input field"
        action: tap
      - find: "Search text box"
        action: type
        param: query
      - find: "Users or Accounts tab"
        action: tap
        optional: true

  follow_user:
    description: "Follow a user"
    steps:
      - find: "Follow button"
        action: tap

  like_video:
    description: "Like the current video"
    steps:
      - find: "Heart or like icon on the right side"
        action: tap

  comment_video:
    description: "Comment on a video"
    params: [comment_text]
    steps:
      - find: "Comment icon (speech bubble)"
        action: tap
        wait_after: 1.0
      - find: "Add comment text input"
        action: type
        param: comment_text
      - find: "Post or send comment button"
        action: tap

  send_dm:
    description: "Send a direct message"
    params: [recipient, message]
    steps:
      - find: "Inbox or messages icon"
        action: tap
      - find: "New message or compose"
        action: tap
      - find: "Search for user input"
        action: type
        param: recipient
      - find: "First matching contact"
        action: tap
        wait_after: 1.0
      - find: "Message text input"
        action: type
        param: message
      - find: "Send button"
        action: tap

  browse_feed:
    description: "Scroll through the For You feed"
    steps:
      - find: "For You feed area"
        action: swipe
        wait_after: 4.0
        context: "Swipe up to see next video. Watch for 3-8 seconds."
