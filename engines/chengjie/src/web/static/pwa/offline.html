<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>正在连接 · AI 客服工作台</title>
<style>
  html,body{height:100%;margin:0;font-family:'Inter','PingFang SC','Microsoft YaHei',system-ui,sans-serif;
    background:#141827;color:#e6edf3;display:flex;align-items:center;justify-content:center;}
  .box{text-align:center;padding:32px;max-width:420px;}
  .mark{width:64px;height:64px;margin:0 auto 20px;display:block;border-radius:16px;}
  h1{font-size:19px;margin:0 0 10px;font-weight:600;letter-spacing:.2px;}
  p{font-size:13px;color:#9aa5c4;line-height:1.75;margin:0 0 18px;}
  .bar{height:3px;border-radius:2px;background:rgba(255,255,255,.08);overflow:hidden;margin:0 0 14px;}
  .bar i{display:block;height:100%;width:0;border-radius:2px;background:#3b82f6;
    transition:width .45s cubic-bezier(.4,0,.2,1);}
  .status{font-size:12px;color:#7d88a8;min-height:18px;margin:0 0 20px;font-variant-numeric:tabular-nums;}
  .status.warn{color:#d9a441;}
  button{background:#3b82f6;color:#fff;border:0;border-radius:9px;padding:10px 22px;font:inherit;
    font-size:14px;cursor:pointer;transition:background .15s;}
  button:hover{background:#2563eb;}
  button[disabled]{opacity:.55;cursor:default;}
  .hint{margin-top:16px;font-size:11.5px;color:#5f6a88;line-height:1.7;}
  code{background:rgba(255,255,255,.07);border-radius:4px;padding:1px 5px;font-size:11px;}
</style>
</head>
<!-- data-ws-offline：给 Electron 壳识别「这是离线壳、不是真工作台」用。
     SW 回落时 URL 仍是 /workspace 且 HTTP 200，壳只看路径会误判为加载成功、
     从而隐藏遮罩并停掉自动重连（0.2.1 实测：用户被迫手点「重新连接」）。 -->
<body data-ws-offline="1">
  <div class="box">
    <svg class="mark" viewBox="0 0 512 512" role="img" aria-label="AI 客服工作台">
      <rect width="512" height="512" rx="112" fill="#1b2038"/>
      <path d="M128 144h256a40 40 0 0 1 40 40v112a40 40 0 0 1-40 40H248l-72 60v-60h-48a40 40 0 0 1-40-40V184a40 40 0 0 1 40-40z" fill="#ffffff"/>
      <circle cx="208" cy="240" r="18" fill="#1b2038"/>
      <circle cx="272" cy="240" r="18" fill="#1b2038"/>
      <circle cx="336" cy="240" r="18" fill="#1b2038"/>
      <path d="M384 92l15 39 39 15-39 15-15 39-15-39-39-15 39-15z" fill="#3b82f6"/>
    </svg>
    <h1 id="ttl">正在连接后台服务…</h1>
    <p id="sub">首次启动需要解压并初始化，通常 15–30 秒。连上后会自动进入，无需操作。</p>
    <div class="bar"><i id="bar"></i></div>
    <div class="status" id="st"></div>
    <button id="btn" onclick="wsRetryNow()">立即重试</button>
    <div class="hint" id="hint"></div>
  </div>
<script>
(function () {
  "use strict";
  window.__WS_OFFLINE_SHELL__ = true;

  var EN = (navigator.language || "").toLowerCase().indexOf("zh") !== 0;
  var T = {
    ttl:      EN ? "Connecting to the backend…"           : "正在连接后台服务…",
    ttlSlow:  EN ? "Still connecting…"                    : "仍在连接…",
    sub:      EN ? "First launch unpacks and initialises — usually 15–30s. You will be taken in automatically."
                 : "首次启动需要解压并初始化，通常 15–30 秒。连上后会自动进入，无需操作。",
    subSlow:  EN ? "This is taking longer than usual. The service may still be starting, or the port may be occupied."
                 : "比平时久。后台可能仍在启动，也可能端口被占用。",
    waiting:  EN ? "Waited {s}s · retry #{n} · next check in {d}s"
                 : "已等待 {s} 秒 · 第 {n} 次探测 · {d} 秒后重试",
    probing:  EN ? "Checking…"                            : "正在探测…",
    ok:       EN ? "Connected — loading workspace…"       : "已连接，正在载入工作台…",
    btn:      EN ? "Retry now"                            : "立即重试",
    btnBusy:  EN ? "Checking…"                            : "探测中…",
    hint:     EN ? "If this persists: check that the backend log has no startup error — <code>%APPDATA%\\telegram-ai-desktop\\logs\\backend.log</code>"
                 : "长时间不通请看后台日志有无启动报错：<code>%APPDATA%\\telegram-ai-desktop\\logs\\backend.log</code>"
  };

  var $ = function (id) { return document.getElementById(id); };
  var t0 = Date.now(), tries = 0, timer = null, busy = false;
  var SLOW_AFTER_MS = 45000;

  $("ttl").textContent = T.ttl;
  $("sub").textContent = T.sub;
  $("btn").textContent = T.btn;

  function elapsed() { return Math.round((Date.now() - t0) / 1000); }

  // 进度条是「预期进度」而非真实进度：30s 内走到 ~85%，之后缓慢逼近但永不满格
  // （满格=已连上）。目的是把「不确定的等待」变成「有终点的等待」，降低首启焦虑。
  function paint(nextInSec) {
    var e = elapsed();
    var pct = e < 30 ? (e / 30) * 85 : 85 + Math.min(13, (e - 30) / 10);
    $("bar").style.width = pct.toFixed(1) + "%";
    var slow = Date.now() - t0 > SLOW_AFTER_MS;
    $("ttl").textContent = slow ? T.ttlSlow : T.ttl;
    $("sub").textContent = slow ? T.subSlow : T.sub;
    $("st").className = slow ? "status warn" : "status";
    $("hint").innerHTML = slow ? T.hint : "";
    $("st").textContent = busy
      ? T.probing
      : T.waiting.replace("{s}", e).replace("{n}", tries).replace("{d}", nextInSec);
  }

  // 退避：1,1,2,2,3,3,5,5,5… 上限 5s。够快（后台一起来就进），也不至于把
  // 启动中的后端打满请求。
  function backoffSec() {
    var steps = [1, 1, 2, 2, 3, 3];
    return tries < steps.length ? steps[tries] : 5;
  }

  // 探针打 /login：sw.js 明确不拦截 /login，所以这是一次真实网络请求，
  // 不会被 Service Worker 的缓存层骗过。任何 HTTP 响应都代表后台已可达。
  function probe() {
    return fetch("/login", { method: "GET", cache: "no-store", redirect: "manual" })
      .then(function () { return true; })
      .catch(function () { return false; });
  }

  function schedule() {
    if (timer) { clearTimeout(timer); timer = null; }
    var wait = backoffSec(), left = wait;
    paint(left);
    var tick = function () {
      left -= 1;
      if (left > 0) { paint(left); timer = setTimeout(tick, 1000); return; }
      run();
    };
    timer = setTimeout(tick, 1000);
  }

  function run() {
    if (busy) return;
    busy = true; tries += 1;
    $("btn").disabled = true; $("btn").textContent = T.btnBusy;
    paint(0);
    probe().then(function (ok) {
      busy = false;
      $("btn").disabled = false; $("btn").textContent = T.btn;
      if (ok) {
        $("bar").style.width = "100%";
        $("st").className = "status";
        $("st").textContent = T.ok;
        setTimeout(function () { location.reload(); }, 220);
        return;
      }
      schedule();
    });
  }

  window.wsRetryNow = function () { tries = 0; run(); };

  // 回到前台立刻探一次（用户切走一会儿再回来时不用等退避）
  document.addEventListener("visibilitychange", function () {
    if (!document.hidden && !busy) run();
  });

  run();
})();
</script>
</body>
</html>
