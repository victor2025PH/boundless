<!doctype html>
<html lang="{{ 'zh-CN' if (ui_lang|default('zh')) == 'zh' else 'en' }}"><head><meta charset="utf-8">
<title>Merge Reviews · Ops</title>
{% include "_i18n_bootstrap.html" %}
{% include "_boot_error_guard.html" %}
{% include "_api_fetch.html" %}
<link rel="stylesheet" href="/static/brand/brand.css">
<link rel="stylesheet" href="/static/brand/brand-fonts.css">
<link rel="stylesheet" href="/static/theme-tokens.css?v=20260816a">
<style>
body{font-family:var(--bl-font-sans,-apple-system,'Segoe UI',sans-serif);max-width:1100px;margin:20px auto;padding:0 20px;background:#fafafa;color:#222}
h1{font-size:20px;margin-bottom:4px}
.card{background:#fff;border:1px solid #ddd;border-radius:8px;padding:14px 18px;margin:12px 0}
.conf{font-weight:600;color:var(--bl-growth-600,#0d76d9)}
.breakdown{font-size:12px;color:#555;margin:6px 0}
.breakdown span{display:inline-block;padding:2px 6px;background:#f3f4f6;border-radius:3px;margin-right:4px}
.actions{margin-top:10px}
button{padding:6px 14px;margin-right:8px;border:1px solid #ccc;border-radius:5px;background:#fff;cursor:pointer;font-size:13px}
.btn-ok{background:#10b981;color:#fff;border-color:#10b981}
.btn-reject{background:#ef4444;color:#fff;border-color:#ef4444}
.empty{padding:40px;text-align:center;color:#888}
.nav{margin-bottom:20px}
.nav a{margin-right:14px;font-size:13px;color:var(--bl-growth-600,#0d76d9);text-decoration:none}
.nav a.active{font-weight:700;color:#1e3a8a;border-bottom:2px solid var(--bl-growth-600,#0d76d9);padding-bottom:2px}
</style></head>
<body>
{% include "ops/_ops_nav.html" %}
<h1>{{ (i18n or {}).get('ops.mr.title', '合并审核队列') }}</h1>
<!-- 批量通过 + 主动扫描（自 /ai-studio 迁入 2026-08-01；API 早已存在，此前只有那边有入口） -->
<div style="display:flex;gap:8px;align-items:center;margin:10px 0 14px;flex-wrap:wrap">
  <button onclick="mrToggleHighConf()" title="{{ (i18n or {}).get('as_s054', '一键勾选所有高置信候选') }}(≥0.85)">☑ {{ (i18n or {}).get('as_s055', '选高置信') }}</button>
  <button class="btn-ok" id="mr-batch-btn" disabled onclick="mrBatchApprove()" title="{{ (i18n or {}).get('as_s051', '批量审核选中候选（默认仅处理') }} ≥0.85 {{ (i18n or {}).get('as_s052', '高置信，安全护栏）') }}">⚡ {{ (i18n or {}).get('as_s053', '批量合并') }}</button>
  <button onclick="mrScan()" title="{{ (i18n or {}).get('as_s056', '主动扫描历史孤立 LINE 用户，弥补被动触发的盲区') }}">🔍 {{ (i18n or {}).get('as_s057', '扫描') }}</button>
  <button onclick="load()">{{ (i18n or {}).get('dash.refresh', '刷新') }}</button>
</div>
<div id="list"></div>
<script>
function escapeHtml(s){return (s+'').replace(/[&<>"']/g,c=>({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
async function load(){
  const data = await apiFetch('/api/merge-reviews').then(r=>r.json());
  const list = document.getElementById('list');
  mrUpdateBatchBtn();
  if(!data.items||data.items.length===0){
    list.innerHTML='<div class="empty">'+window.T('ops.mr.empty')+'</div>';return;
  }
  list.innerHTML = data.items.map(it=>{
    const cand = it.candidate_ci||{};
    const tgt = it.target_contact||{};
    const bd = Object.entries(it.breakdown||{}).map(([k,v])=>`<span>${escapeHtml(k)}: ${v}</span>`).join('');
    return `<div class="card" id="card-${it.review_id}" data-rid="${escapeHtml(it.review_id)}" data-conf="${(it.confidence||0).toFixed(3)}">
      <div style="display:flex;align-items:flex-start;gap:10px">
        <input type="checkbox" class="mr-check" style="margin-top:4px" onchange="mrUpdateBatchBtn()" title="${window.T('as_js042')}">
        <div style="flex:1">
          <div><b>${window.T('ops.mr.candidate')}</b>${window.Tf('ops.mr.cand_rest',{name:escapeHtml(cand.display_name||'-'),ch:'<b>'+escapeHtml(cand.channel||'-')+'</b>',id:escapeHtml(cand.external_id||'-')})}</div>
          <div><b>${window.T('ops.mr.target')}</b>${window.Tf('ops.mr.tgt_rest',{name:escapeHtml(tgt.primary_name||'-'),lang:escapeHtml(tgt.language_hint||'-'),tz:escapeHtml(tgt.timezone_hint||'-')})}</div>
          <div>${window.T('ops.mr.confidence')} <span class="conf">${(it.confidence*100).toFixed(1)}%</span></div>
          <div class="breakdown">${bd}</div>
          <div class="actions">
            <button class="btn-ok" onclick="act('${it.review_id}','approve')">${window.T('ops.mr.approve')}</button>
            <button class="btn-reject" onclick="act('${it.review_id}','reject')">${window.T('ops.mr.reject')}</button>
          </div>
        </div>
      </div>
    </div>`;
  }).join('');
}
async function act(rid, kind){
  const r = await apiFetch(`/api/merge-reviews/${rid}/${kind}`, {method:'POST'}, {timeoutMs: 60000});
  if(r.ok){
    document.getElementById(`card-${rid}`).style.opacity='0.4';
    setTimeout(load, 500);
  } else {
    alert(window.T('ops.mr.op_fail')+' status='+r.status);
  }
}
// ── 批量审核（复选框 + 高置信一键勾选 + batch-approve，与旧 ai_studio 同一后端护栏 ≥0.85）──
function mrUpdateBatchBtn(){
  const btn=document.getElementById('mr-batch-btn');
  if(!btn)return;
  const n=document.querySelectorAll('.mr-check:checked').length;
  btn.disabled=n===0;
  btn.textContent=n>0?('⚡ '+window.T('as_s053')+' ('+n+')'):('⚡ '+window.T('as_s053'));
}
function mrToggleHighConf(){
  const rows=[...document.querySelectorAll('.card[data-conf]')];
  const high=rows.filter(r=>parseFloat(r.dataset.conf)>=0.85);
  if(!high.length){alert(window.T('as_js008')+' ≥0.85 '+window.T('as_js009'));return;}
  const allChecked=high.every(r=>r.querySelector('.mr-check')?.checked);
  high.forEach(r=>{const cb=r.querySelector('.mr-check');if(cb)cb.checked=!allChecked;});
  mrUpdateBatchBtn();
}
async function mrBatchApprove(){
  const ids=[...document.querySelectorAll('.mr-check:checked')]
    .map(cb=>cb.closest('.card')?.dataset.rid).filter(Boolean);
  if(!ids.length)return;
  if(!confirm(window.Tf('as_confirm_batch',{n:ids.length})))return;
  try{
    const r=await apiFetch('/api/merge-reviews/batch-approve',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({review_ids:ids,min_confidence:0.85}),
    },{timeoutMs:60000});
    if(!r.ok){const txt=await r.text().catch(()=>'');throw new Error('HTTP '+r.status+' '+txt);}
    const d=await r.json();
    const parts=[window.Tf('as_merged_ok',{n:d.approved.length})];
    if(d.skipped_low_conf?.length)parts.push(window.Tf('as_skipped_lc',{n:d.skipped_low_conf.length,c:d.min_confidence}));
    if(d.failed?.length)parts.push(window.Tf('as_failed_n',{n:d.failed.length}));
    alert(parts.join('; '));
    load();
  }catch(e){alert(window.Tf('as_batch_fail',{msg:e.message}));}
}
async function mrScan(){
  if(!confirm(window.T('as_js010')))return;
  const list=document.getElementById('list');
  if(list)list.innerHTML='<div class="empty">'+window.T('ln_js_028')+'</div>';
  try{
    const r=await apiFetch('/api/merge-reviews/scan',{method:'POST'},{timeoutMs:60000});
    if(!r.ok){const txt=await r.text().catch(()=>'');throw new Error('HTTP '+r.status+' '+txt);}
    const d=await r.json();
    alert(window.Tf('as_scan_done',{scanned:d.scanned,enq:d.enqueued,auto:d.auto_eligible}));
    load();
  }catch(e){if(list)list.innerHTML='<div class="empty" style="color:red">'+window.T('ln_js_031')+': '+escapeHtml(e.message)+'</div>';}
}
load().catch(e=>document.body.innerHTML+='<p style="color:red">'+window.T('ops.mr.load_fail')+': '+e+'</p>');
</script>
</body></html>
