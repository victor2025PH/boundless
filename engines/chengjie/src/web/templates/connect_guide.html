{% extends "workspace_base.html" %}
{% block title %}{{ (i18n or {}).get('cg.title_' ~ guide_platform, '接入引导') }}{% endblock %}
{% block head %}
<style>
  /* 实施97 · 多步引导型接入页：左步骤轨 + 右内容区 + 底部动作条。全部走 --tk-* 令牌；
     企微侧步骤（授权/凭证）用企微蓝 --cg-wecom，客户侧（二维码）与个人微信用微信绿 --cg-wx。 */
  .cg-wrap{--cg-wecom:#1b6df5;--cg-wx:#07c160;--cg-badge-gray:#4b5563;--cg-on-badge:#fff;height:100%;overflow-y:auto;background:var(--tk-bg);padding:18px;}
  .cg-shell{max-width:960px;margin:0 auto;}
  .cg-head{display:flex;align-items:flex-start;gap:14px;margin-bottom:14px;}
  .cg-head .cg-ico{flex:none;width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:color-mix(in srgb,var(--cg-accent,var(--tk-brand)) 13%,transparent);}
  .cg-head h1{font-size:18px;font-weight:800;color:var(--tk-text);margin:0 0 3px;letter-spacing:.2px;}
  .cg-head .cg-sub{font-size:12.5px;color:var(--tk-text-muted);line-height:1.5;}
  .cg-head .cg-meta{margin-top:6px;display:flex;gap:10px;font-size:11.5px;color:var(--tk-text-muted);flex-wrap:wrap;}
  .cg-back{font-size:12px;color:var(--tk-text-muted);text-decoration:none;display:inline-block;margin-bottom:10px;}
  .cg-back:hover{color:var(--tk-brand);}
  .cg-body{display:grid;grid-template-columns:210px 1fr;gap:14px;align-items:start;}
  .cg-rail{background:var(--tk-surface);border:1px solid var(--tk-border);border-radius:var(--tk-radius-lg,14px);padding:10px 8px;box-shadow:var(--tk-shadow);position:sticky;top:0;}
  .cg-rail button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:transparent;padding:9px 8px;border-radius:10px;cursor:pointer;color:var(--tk-text-muted);font-size:12.5px;}
  .cg-rail button:hover{background:var(--tk-surface-2);}
  .cg-rail button.on{background:color-mix(in srgb,var(--cg-accent,var(--tk-brand)) 10%,transparent);color:var(--tk-text);font-weight:700;}
  .cg-rail .n{flex:none;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--tk-border);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--tk-text-muted);background:var(--tk-surface);}
  .cg-rail button.on .n{border-color:var(--cg-accent,var(--tk-brand));color:var(--cg-accent,var(--tk-brand));}
  .cg-rail button.done .n{background:var(--tk-ok-ink,#15803d);border-color:var(--tk-ok-ink,#15803d);color:#fff;}
  .cg-rail .lbl{flex:1;min-width:0;line-height:1.3;}
  .cg-rail .lbl small{display:block;font-size:10.5px;color:var(--tk-text-muted);font-weight:400;margin-top:1px;}
  .cg-panel{background:var(--tk-surface);border:1px solid var(--tk-border);border-radius:var(--tk-radius-lg,14px);box-shadow:var(--tk-shadow);overflow:hidden;min-height:420px;display:flex;flex-direction:column;}
  .cg-panel-hd{padding:14px 18px 10px;border-bottom:1px solid var(--tk-border);display:flex;align-items:center;gap:10px;}
  .cg-panel-hd .k{font-size:11px;color:var(--tk-text-muted);letter-spacing:.3px;}
  .cg-panel-hd h2{font-size:15px;font-weight:800;margin:0;color:var(--tk-text);}
  .cg-panel-bd{padding:16px 18px;flex:1;font-size:13px;color:var(--tk-text);line-height:1.6;}
  .cg-panel-ft{padding:12px 18px;border-top:1px solid var(--tk-border);display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--tk-surface-2);}
  .cg-btn{border:1px solid var(--tk-border);background:var(--tk-surface);color:var(--tk-text);border-radius:10px;padding:0 14px;height:36px;font-size:13px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;}
  .cg-btn:hover{background:var(--tk-surface-2);}
  .cg-btn.primary{background:var(--cg-accent,var(--tk-brand));border-color:var(--cg-accent,var(--tk-brand));color:#fff;}
  .cg-btn.primary:hover{filter:brightness(1.06);}
  .cg-btn.ghost{background:transparent;}
  .cg-btn:disabled{opacity:.5;cursor:not-allowed;}
  .cg-btn.sm{height:30px;padding:0 10px;font-size:12px;border-radius:8px;}
  .cg-lead{margin:0 0 12px;color:var(--tk-text);}
  .cg-list{margin:0 0 12px;padding-left:0;list-style:none;display:flex;flex-direction:column;gap:8px;}
  .cg-list li{display:flex;gap:10px;align-items:flex-start;}
  .cg-list .dot{flex:none;width:22px;height:22px;border-radius:50%;background:color-mix(in srgb,var(--cg-accent,var(--tk-brand)) 12%,transparent);color:var(--cg-accent,var(--tk-brand));font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:1px;}
  .cg-card{border:1px solid var(--tk-border);border-radius:12px;padding:12px 14px;background:var(--tk-surface-2);margin:10px 0;}
  .cg-card.accent{border-color:color-mix(in srgb,var(--cg-accent,var(--tk-brand)) 40%,transparent);background:color-mix(in srgb,var(--cg-accent,var(--tk-brand)) 7%,transparent);}
  .cg-card.warn{border-color:rgba(245,158,11,.45);background:rgba(245,158,11,.10);}
  .cg-card.ok{border-color:color-mix(in srgb,var(--tk-ok-ink,#15803d) 40%,transparent);background:color-mix(in srgb,var(--tk-ok-ink,#15803d) 8%,transparent);}
  .cg-kv{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .cg-kv code{font-size:15px;font-weight:700;letter-spacing:.5px;background:var(--tk-surface);border:1px solid var(--tk-border);border-radius:8px;padding:4px 10px;}
  .cg-field{margin:10px 0;}
  .cg-field label{display:block;font-size:12.5px;font-weight:700;margin-bottom:4px;}
  .cg-field label .req{color:var(--tk-danger,#e11d48);margin-left:2px;}
  .cg-field input,.cg-field textarea,.cg-field select{width:100%;box-sizing:border-box;height:38px;border:1px solid var(--tk-border);border-radius:9px;padding:0 10px;font-size:13px;background:var(--tk-surface);color:var(--tk-text);}
  .cg-field textarea{height:76px;padding:8px 10px;resize:vertical;}
  .cg-field .hint{font-size:11px;color:var(--tk-text-muted);margin-top:4px;}
  .cg-field .bad{font-size:11px;color:var(--tk-danger-ink,#b91c1c);margin-top:4px;}
  .cg-checks{list-style:none;padding:0;margin:12px 0 0;display:flex;flex-direction:column;gap:8px;}
  .cg-checks li{display:flex;gap:10px;align-items:flex-start;padding:9px 12px;border-radius:10px;border:1px solid var(--tk-border);background:var(--tk-surface);}
  .cg-checks li .st{flex:none;width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:#fff;background:#9ca3af;}
  .cg-checks li.ok .st{background:var(--tk-ok-ink,#15803d);} .cg-checks li.bad .st{background:var(--tk-danger,#e11d48);}
  .cg-checks li .t{flex:1;min-width:0;} .cg-checks li .t small{display:block;color:var(--tk-text-muted);font-size:11.5px;margin-top:2px;line-height:1.5;}
  .cg-acct{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;margin:10px 0;}
  .cg-acct label{border:1px solid var(--tk-border);border-radius:12px;padding:10px 12px;display:flex;gap:10px;align-items:center;cursor:pointer;background:var(--tk-surface);}
  .cg-acct label.sel{border-color:var(--cg-accent,var(--tk-brand));background:color-mix(in srgb,var(--cg-accent,var(--tk-brand)) 8%,transparent);}
  .cg-acct label.dis{opacity:.55;cursor:not-allowed;}
  .cg-acct .av{flex:none;width:36px;height:36px;border-radius:10px;background:var(--tk-surface-2);object-fit:cover;}
  .cg-acct .nm{font-weight:700;font-size:13px;line-height:1.3;} .cg-acct .id{font-size:10.5px;color:var(--tk-text-muted);word-break:break-all;}
  .cg-pill{display:inline-block;font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:999px;margin-top:3px;}
  .cg-pill.on{background:color-mix(in srgb,var(--tk-ok-ink,#15803d) 14%,transparent);color:var(--tk-ok-ink,#15803d);}
  .cg-pill.warn{background:rgba(245,158,11,.16);color:var(--tk-warn-ink,#b45309);}
  .cg-pill.muted{background:var(--tk-surface-2);color:var(--tk-text-muted);}
  .cg-tiers{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:10px 0;}
  .cg-tiers label{border:1px solid var(--tk-border);border-radius:12px;padding:12px;cursor:pointer;background:var(--tk-surface);position:relative;}
  .cg-tiers label.sel{border-color:var(--cg-accent,var(--tk-brand));box-shadow:0 0 0 2px color-mix(in srgb,var(--cg-accent,var(--tk-brand)) 25%,transparent);}
  .cg-tiers .tn{font-weight:800;font-size:13px;} .cg-tiers .td{font-size:11.5px;color:var(--tk-text-muted);margin-top:4px;line-height:1.45;}
  .cg-tiers .rec{position:absolute;top:-8px;right:10px;font-size:10px;font-weight:800;background:var(--cg-accent,var(--tk-brand));color:#fff;border-radius:999px;padding:1px 7px;}
  .cg-qr{display:flex;gap:18px;align-items:flex-start;flex-wrap:wrap;}
  .cg-qr .box{width:220px;height:220px;border-radius:12px;border:1px solid var(--tk-border);background:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden;}
  .cg-qr .box img{width:100%;height:100%;object-fit:contain;}
  .cg-recent{border:1px dashed var(--tk-border);border-radius:12px;padding:10px 12px;min-height:56px;font-size:12.5px;color:var(--tk-text-muted);}
  .cg-recent .msg{color:var(--tk-text);} .cg-recent .who{font-size:11px;font-weight:700;margin-right:6px;color:var(--cg-accent,var(--tk-brand));}
  /* 测试消息三态：等待（脉冲点 + 上一条灰显）/ 收到了（实线绿卡）/ 未在线（纯提示） */
  .cg-recent.waiting{display:flex;flex-wrap:wrap;align-items:center;gap:8px;}
  .cg-recent .pulse{width:8px;height:8px;border-radius:50%;background:var(--cg-accent,var(--tk-brand));animation:cgPulse 1.4s ease-in-out infinite;flex:none;}
  .cg-recent .prev{flex-basis:100%;opacity:.7;}
  .cg-recent.got{border:1px solid rgba(22,163,74,.45);background:rgba(22,163,74,.07);color:var(--tk-text);}
  .cg-recent.got .got-h{display:flex;align-items:center;gap:6px;font-weight:800;color:#16a34a;margin-bottom:6px;}
  .cg-recent.got .got-f{margin-top:8px;font-size:11.5px;color:var(--tk-text-muted);} .cg-recent.got .got-f a{color:var(--cg-accent,var(--tk-brand));font-weight:700;}
  @keyframes cgPulse{0%,100%{opacity:.35;transform:scale(.85);}50%{opacity:1;transform:scale(1);}}
  .cg-rules{margin:14px 0 0;padding:0;list-style:none;font-size:12px;color:var(--tk-text-muted);display:flex;flex-direction:column;gap:5px;}
  .cg-rules li::before{content:'•';margin-right:6px;color:var(--cg-accent,var(--tk-brand));}
  /* 命令块：overflow-wrap:anywhere 只在必要处折行，不再把路径/参数劈成单字符（P0 劈词修复） */
  .cg-cmd{font-family:ui-monospace,Consolas,monospace;font-size:12px;background:var(--tk-surface);border:1px solid var(--tk-border);border-radius:9px;padding:10px 12px;white-space:pre-wrap;overflow-wrap:anywhere;word-break:normal;line-height:1.55;color:var(--tk-text);user-select:all;}
  table.cg-faq{width:100%;border-collapse:collapse;font-size:12px;margin-top:8px;}
  table.cg-faq th,table.cg-faq td{border-bottom:1px solid var(--tk-border);padding:7px 8px;text-align:left;vertical-align:top;line-height:1.5;}
  table.cg-faq th{color:var(--tk-text-muted);font-weight:700;font-size:11px;}
  .cg-status{font-size:12px;color:var(--tk-text-muted);}
  .cg-status.ok{color:var(--tk-ok-ink,#15803d);font-weight:700;} .cg-status.bad{color:var(--tk-danger-ink,#b91c1c);font-weight:700;}
  /* ── 个人微信 · 一键启停（2026-09-19 P1/P2）── */
  .cg-trusts{display:inline-flex;gap:6px;flex-wrap:wrap;}
  .cg-trust{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:700;color:var(--tk-text-muted);border:1px solid var(--tk-border);border-radius:999px;padding:1px 8px;background:var(--tk-surface);}
  .cg-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0 4px;}
  .cg-btn .ui-ic{margin-left:-2px;}
  .cg-sec{margin-top:18px;}
  .cg-sec-h{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:800;color:var(--tk-text);margin-bottom:6px;}
  /* 状态机卡：左侧一枚状态点（在线呼吸），标题一句人话 + 一行解释 + 动作按钮；颜色只用 ok/warn/bad/busy 四态 */
  .cg-live{--lv:#9ca3af;display:flex;gap:14px;align-items:flex-start;border:1px solid var(--tk-border);border-left:4px solid var(--lv);border-radius:12px;padding:14px 16px;background:var(--tk-surface-2);margin:8px 0 12px;transition:border-color .25s,background .25s;}
  .cg-live .dot{flex:none;width:12px;height:12px;border-radius:50%;background:var(--lv);margin-top:5px;box-shadow:0 0 0 4px color-mix(in srgb,var(--lv) 18%,transparent);}
  .cg-live .body{flex:1;min-width:0;}
  .cg-live .ttl{font-size:14px;font-weight:800;color:var(--tk-text);line-height:1.35;}
  .cg-live .dsc{font-size:12.5px;color:var(--tk-text-muted);margin-top:3px;line-height:1.5;}
  .cg-live .meta{font-size:11px;color:var(--tk-text-muted);margin-top:4px;font-family:ui-monospace,Consolas,monospace;}
  .cg-live .dsc:empty,.cg-live .meta:empty{display:none;}
  .cg-live .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;}
  .cg-live.ok{--lv:var(--cg-wx);border-color:color-mix(in srgb,var(--cg-wx) 45%,transparent);background:color-mix(in srgb,var(--cg-wx) 7%,transparent);}
  .cg-live.ok .dot{animation:cg-breathe 2.2s ease-in-out infinite;}
  .cg-live.warn{--lv:#f59e0b;border-color:rgba(245,158,11,.5);background:rgba(245,158,11,.09);}
  .cg-live.bad{--lv:var(--tk-danger,#e11d48);border-color:color-mix(in srgb,var(--tk-danger,#e11d48) 45%,transparent);background:color-mix(in srgb,var(--tk-danger,#e11d48) 6%,transparent);}
  .cg-live.busy{--lv:var(--cg-accent,var(--tk-brand));} .cg-live.busy .dot{animation:cg-spin-fade 1s linear infinite;}
  .cg-live.manual{--lv:var(--tk-text-muted);border-style:dashed;}
  @keyframes cg-breathe{0%,100%{box-shadow:0 0 0 4px color-mix(in srgb,var(--lv) 18%,transparent);}50%{box-shadow:0 0 0 8px color-mix(in srgb,var(--lv) 6%,transparent);}}
  @keyframes cg-spin-fade{0%,100%{opacity:1;}50%{opacity:.35;}}
  .cg-log{margin:10px 0 0;padding:8px 10px;max-height:160px;overflow:auto;font-family:ui-monospace,Consolas,monospace;font-size:11px;line-height:1.5;background:var(--tk-surface);border:1px solid var(--tk-border);border-radius:8px;white-space:pre-wrap;overflow-wrap:anywhere;color:var(--tk-text-muted);}
  /* 自启开关：iOS 式滑块 + 一句解释，比「复制注册计划任务命令」少三步 */
  .cg-toggle{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--tk-border);border-radius:12px;padding:12px 14px;background:var(--tk-surface);cursor:pointer;margin:0 0 6px;}
  .cg-toggle input{position:absolute;opacity:0;width:0;height:0;}
  .cg-toggle .sw{flex:none;width:38px;height:22px;border-radius:999px;background:var(--tk-border);position:relative;transition:background .2s;margin-top:2px;}
  .cg-toggle .sw::after{content:'';position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:left .2s;}
  .cg-toggle input:checked+.sw{background:var(--cg-wx);} .cg-toggle input:checked+.sw::after{left:19px;}
  .cg-toggle input:focus-visible+.sw{outline:2px solid var(--tk-brand);outline-offset:2px;}
  .cg-toggle .txt{flex:1;min-width:0;font-size:13px;line-height:1.4;} .cg-toggle .txt small{display:block;font-size:11.5px;color:var(--tk-text-muted);margin-top:2px;}
  /* 折叠区（FAQ / 高级命令）：默认收起，summary 一行带图标 */
  .cg-adv{border:1px solid var(--tk-border);border-radius:12px;background:var(--tk-surface);margin:10px 0;}
  .cg-adv summary{list-style:none;cursor:pointer;padding:10px 14px;font-size:12.5px;font-weight:700;color:var(--tk-text);display:flex;align-items:center;gap:6px;}
  .cg-adv summary::-webkit-details-marker{display:none;}
  .cg-adv summary::after{content:'';margin-left:auto;width:7px;height:7px;border-right:1.5px solid var(--tk-text-muted);border-bottom:1.5px solid var(--tk-text-muted);transform:rotate(-45deg);transition:transform .15s;}
  .cg-adv[open] summary::after{transform:rotate(45deg);}
  .cg-adv>*:not(summary){padding:0 14px 12px;}
  .cg-adv .cg-list{margin-bottom:0;}
  @media (max-width:720px){
    .cg-body{grid-template-columns:1fr;}
    .cg-rail{position:static;display:flex;overflow-x:auto;gap:4px;padding:8px;}
    .cg-rail button{width:auto;flex:none;} .cg-rail .lbl small{display:none;}
    .cg-tiers{grid-template-columns:1fr;}
    .cg-trusts{display:none;}
  }
</style>
{% endblock %}
{% block content %}
<div class="cg-wrap" id="cg-wrap" data-plat="{{ guide_platform }}" data-supervisor="{{ '1' if is_supervisor else '0' }}"
     data-faq='{{ (guide_faq or []) | tojson }}' data-rules='{{ (guide_rules or []) | tojson }}'>
  <div class="cg-shell">
    <a class="cg-back" href="/workspace?drawer=1" data-i18n="cg.back">← 返回工作台</a>
    <div class="cg-head">
      <div class="cg-ico" id="cg-ico"></div>
      <div style="flex:1;min-width:0;">
        <h1 id="cg-title"></h1>
        <div class="cg-sub" id="cg-sub"></div>
        <div class="cg-meta"><span id="cg-eta"></span><a id="cg-tutorial" href="#" target="_blank" rel="noopener" style="color:var(--tk-brand);text-decoration:none;"></a></div>
      </div>
    </div>
    <div class="cg-body">
      <nav class="cg-rail" id="cg-rail" aria-label="steps"></nav>
      <section class="cg-panel">
        <div class="cg-panel-hd"><span class="k" id="cg-step-k"></span><h2 id="cg-step-h"></h2></div>
        <div class="cg-panel-bd" id="cg-panel"></div>
        <div class="cg-panel-ft">
          <button class="cg-btn ghost" id="cg-prev" type="button"></button>
          <span class="cg-status" id="cg-foot-status"></span>
          <button class="cg-btn primary" id="cg-next" type="button"></button>
        </div>
      </section>
    </div>
  </div>
</div>
<script>
(function(){
  'use strict';
  var T=window.T, Tf=window.Tf;
  var root=document.getElementById('cg-wrap');
  var PLAT=root.getAttribute('data-plat')||'wechat_kf';
  var IS_SUP=root.getAttribute('data-supervisor')==='1';
  var FAQ=[], RULES=[];
  try{ FAQ=JSON.parse(root.getAttribute('data-faq')||'[]'); }catch(_){ FAQ=[]; }
  try{ RULES=JSON.parse(root.getAttribute('data-rules')||'[]'); }catch(_){ RULES=[]; }
  var isKF=PLAT==='wechat_kf';
  var accent=isKF?'var(--cg-wecom)':'var(--cg-wx)';
  root.style.setProperty('--cg-accent',accent);
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function el(id){ return document.getElementById(id); }
  function setStatus(txt,cls){ var s=el('cg-foot-status'); s.textContent=txt||''; s.className='cg-status'+(cls?' '+cls:''); }
  async function api(path,opts){
    var r=await window.apiFetch(path,opts||{},{timeoutMs:30000});
    var d=null; try{ d=await r.json(); }catch(_){ d={}; }
    if(!r.ok){ var why=(d&&(d.detail||d.error))||('HTTP '+r.status); throw new Error(typeof why==='string'?why:JSON.stringify(why)); }
    return d;
  }
  async function copyText(t,btn){
    try{ await navigator.clipboard.writeText(t); if(btn){ var o=btn.textContent; btn.textContent=T('cg.copied'); setTimeout(function(){ btn.textContent=o; },1400);} }
    catch(_){ setStatus(T('cg.copy_failed'),'bad'); }
  }
  function inviteCard(){
    var link=location.origin+location.pathname;
    return '<div class="cg-card warn"><b>'+esc(T('cg.invite_title'))+'</b><div style="margin:6px 0 8px;font-size:12.5px;">'+esc(T('cg.invite_body'))+'</div>'

  // 步骤轨副行：完成态显示证据（微信版本 / 档位 / 在线），当前步显示「进行中」，其余显示预计时长
  function railSub(s,i){
    if(done[s.key]) return doneSub[s.key]||T('cg.done_badge');

  function rail(){

  function markUndone(key){ if(done[key]){ delete done[key]; delete doneSub[key]; rail(); } }

    el('cg-step-h').textContent=s.title;

    if(s.sup && !IS_SUP){ p.innerHTML=inviteCard()+'<div class="cg-status">'+esc(T('cg.waiting_admin'))+'</div>'; }
    else { p.innerHTML='<div class="cg-status">'+esc(T('cg.loading'))+'</div>'; try{ Promise.resolve(s.render(p)).catch(fail); }catch(e){ fail(e); } }
    rail();

  }

    show(cur+1);

  /* PC 第 ③ 步「发一条测试消息」有明确完成态：以进入本步时最新一条 last_ts 为基线，之后凡有更新的对方

  async function pollRecentPc(){
    var b=el('cg-recent'); if(!b) return;
    var online=state.live&&(state.live.state==='online');
    try{
      var d=await api('/api/unified-inbox/chats?limit=3&platform=wechat');
      var chats=(d.chats||[]).filter(function(c){ return c.platform==='wechat'; });
      var newest=0; chats.forEach(function(c){ newest=Math.max(newest,Number(c.last_ts)||0); });
      if(state.recentBaseline===undefined) state.recentBaseline=newest;
      if(!state.testReceived){
        var fresh=chats.filter(function(c){ return (Number(c.last_ts)||0)>state.recentBaseline&&c.last_direction!=='out'; })
          .sort(function(x,y){ return (Number(y.last_ts)||0)-(Number(x.last_ts)||0); })[0];
        if(fresh){ state.testReceived={name:fresh.name||T('cg.kf.recent_in'),msg:fresh.last_msg||''}; track('test_msg_received'); if(state.live) paintLive(state.live); }
      }
      var html;
      if(state.testReceived){
        html='<div class="cg-recent got"><div class="got-h">'+ic('check')+esc(T('cg.pc.test_got'))+'</div><div><span class="who">'+esc(state.testReceived.name)+'</span><span class="msg">'+esc(state.testReceived.msg)+'</span></div>'
          +'<div class="got-f">'+esc(T('cg.pc.test_got_d'))+' <a href="/workspace">'+esc(T('cg.pc.test_go_ws'))+'</a></div></div>';
      } else if(!online){
        html='<div class="cg-recent">'+esc(T('cg.pc.test_wait_online'))+'</div>';
      } else {
        var last=chats[0];
        html='<div class="cg-recent waiting"><span class="pulse"></span>'+esc(T('cg.pc.test_waiting'))
          +(last?'<div class="prev"><span class="who">'+esc(last.name||'')+'</span><span class="msg">'+esc(last.last_msg||'')+'</span></div>':'')+'</div>';
      }
      if(b.dataset.html!==html){ b.dataset.html=html; b.innerHTML=html; }
    }catch(_){}
  }

  function tierName(t){ return T(t==='semi'?'cg.pc.tier_semi':t==='auto_reply'?'cg.pc.tier_auto':'cg.pc.tier_copilot'); }

  function envRows(env){
    var rows=[];
    if(!env.os_windows){ rows.push(['bad',T('cg.pc.env_not_windows')]); return rows; }
    if(env.running) rows.push(['ok',T('cg.pc.env_running')]);
    else rows.push(env.installed?['warn',T('cg.pc.env_installed')]:['bad',T('cg.pc.env_not_installed')]);
    if(env.running){
      if(env.version) rows.push([env.version_ok?'ok':'bad',Tf('cg.pc.env_version',{v:env.version})+(env.version_ok?'':' · '+T('cg.pc.env_version_bad'))]);
      else rows.push(['warn',T('cg.pc.env_version_unknown')]);
      if(env.main_window) rows.push(['ok',T('cg.pc.env_main')]);
      else if(env.login_window) rows.push(['warn',T('cg.pc.env_login')]);
      else rows.push(['warn',T('cg.pc.env_hidden')]);
    }
    if(env.can_manage===false) rows.push(['bad',T('cg.pc.env_no_driver')]);
    var vr=voiceRow(env); if(vr) rows.push(vr);

  // 语音回复是可选能力：任何一项不满足都只是 warn（副驾照常发文字），不影响第 ① 步完成态。
  // 判序 = 驱动 voice_ready 的判序：版本门 → 音频库 → 声卡在不在 → 两端采样率。
  function voiceState(env){
    var v=env&&env.voice; if(!v||!env.running||!v.os_windows) return '';
    if(!v.voice_version_ok) return 'version';
    if(!v.audio_libs) return 'libs';
    var c=v.cable||{};
    if(!c.present) return 'cable';
    if(!c.rates_match) return 'rates';
    return 'ready';
  }
  function voiceRow(env){
    var s=voiceState(env); if(!s) return null;
    var v=env.voice, c=v.cable||{};
    switch(s){
      case 'version': return ['warn',Tf('cg.pc.voice_version_low',{v:v.min_version||'4.1.9'})];
      case 'libs': return ['warn',T('cg.pc.voice_no_libs')];
      case 'cable': return ['warn',T('cg.pc.voice_no_cable')];
      case 'rates': return ['warn',Tf('cg.pc.voice_rates',{a:c.render_sr||'?',b:c.capture_sr||'?'})];
      default: return ['ok',Tf('cg.pc.voice_ready',{rate:c.render_sr||''})];
    }

      el('cg-recheck').onclick=function(){ _envSig=''; loadEnv(); };

        _envSig=''; loadEnv(); };
      var vt=el('cg-voice-test'); if(vt) vt.onclick=async function(){ vt.disabled=true; vt.textContent=T('cg.pc.voice_testing'); track('voice_selftest');
        try{ var d=await post('/api/setup/wechat_pc/voice/selftest'); var st=d.selftest||{};
          if(d.ok) setStatus(Tf('cg.pc.voice_selftest_ok',{f:Math.round(st.dominant_hz||st.expected_hz||1000)}),'ok'); else setStatus(Tf('cg.pc.voice_selftest_fail',{why:st.error||(st.ok===false?(st.dominant_hz||0)+' Hz / rms '+(st.rms||0):'')||d.error||''}),'bad');
          track(d.ok?'voice_selftest_ok':'voice_selftest_fail'); }
        catch(e){ setStatus(Tf('cg.pc.voice_selftest_fail',{why:String(e&&e.message||e)}),'bad'); }
        _envSig=''; loadEnv(); };
    }
    var hint=el('cg-scan-hint'); if(hint) hint.style.display=(env.running&&env.login_window)?'':'none';
    }
    if(wxReady(env)){
      markDone('pc1',Tf('cg.rail.done_env',{v:env.version||''}));
      // 首次检测到登录且用户还停在第 ① 步 → 提示后自动进下一步（不抢用户正在看的其它步）
      if(cur===0&&!state.autoAdvanced){ state.autoAdvanced=true; setStatus(T('cg.pc.login_detected'),'ok'); track('login_detected'); setTimeout(function(){ if(cur===0) show(1); },1600); }

  function fmtUp(sec){ sec=Math.max(0,sec|0); if(sec<60) return sec+'s'; if(sec<3600) return Math.floor(sec/60)+'m'; return Math.floor(sec/3600)+'h'+Math.floor((sec%3600)/60)+'m'; }
  // 心跳 voice_ready：true/false 来自驱动实测（版本门 ∧ 声卡 ∧ 「发语音」锚点）；老驱动不报 → 不显示
  // voice_mic_busy（P2）：坐席正在开会/通话——能力在、此刻不排语音；voice_today/voice_daily_cap：今日语音配额用量
  function voiceChip(hb){
    if(!hb) return '';
    if(hb.voice_ready===true){
      var s=hb.stats||{}, out=' · ';
      if(hb.voice_mic_busy) out+=Tf('cg.pc.live_voice_busy',{p:hb.voice_mic_busy_by||'?'});

    if(manual&&!(hb.alive)) return {cls:'manual',title:T('cg.pc.live_manual'),desc:T('cg.pc.live_manual_d'),acts:[]};
    switch(st.state){
      case 'online': return {cls:'ok',title:Tf('cg.pc.live_online',{tier:tierName(st.tier||hb.tier||'copilot')}),desc:Tf('cg.pc.live_online_d',{s:hb.age_sec||0,a:pol.work_hours[0],b:pol.work_hours[1]})+(st.attached?' · '+T('cg.pc.live_attached'):'')+voiceChip(hb),acts:st.attached?[]:['restart','stop']};
      case 'blind': return {cls:'warn',title:T('cg.pc.live_blind'),desc:T('cg.pc.live_blind_d'),acts:['focus'].concat(st.attached?[]:['stop'])};
      case 'starting': return {cls:'busy',title:T('cg.pc.live_starting'),desc:T('cg.pc.live_starting_d'),acts:['stop']};
      case 'error': return {cls:'bad',title:T('cg.pc.live_error'),desc:(st.reason==='no_heartbeat'?T('cg.pc.live_error_nohb'):Tf('cg.pc.live_error_exit',{code:String(st.reason||'').replace('exit_',''),n:st.backoff_sec||0})),acts:['retry','log']};
      case 'offline': return {cls:'',title:T('cg.pc.live_offline'),desc:(hb.age_sec?Tf('cg.pc.live_offline_d',{m:Math.max(1,Math.round(hb.age_sec/60))}):''),acts:['start','log']};
      default:
        if(wxReady(env)) return {cls:'',title:T('cg.pc.live_idle'),desc:T('cg.pc.live_idle_d'),acts:['start']};
        // 微信在跑但主窗不可见（收进托盘）：就地给「还原窗口」，不把用户赶回第 ① 步
        if(env&&env.running&&env.version_ok&&!env.main_window&&!env.login_window) return {cls:'warn',title:T('cg.pc.live_idle'),desc:T('cg.pc.live_idle_tray'),acts:['focus']};
        return {cls:'',title:T('cg.pc.live_idle'),desc:T('cg.pc.live_idle_nowx'),acts:['back1']};
    }
  }
  function actBtn(a,st){
    var m={start:['primary','zap','cg.pc.btn_start'],retry:['primary','refresh','cg.pc.btn_retry'],restart:['','refresh','cg.pc.btn_restart'],stop:['ghost','pause','cg.pc.btn_stop'],
           focus:['primary','arrow-up-right','cg.pc.focus_wechat'],log:['ghost','scroll','cg.pc.btn_log'],back1:['','reply','cg.pc.s1']}[a];
    if(!m) return '';
    // 退避倒计时也是每拍变的文本：按钮本身不重建，只改 <span> 文字（见 paintLive 末尾）
    if(a==='retry'&&st.backoff_sec>0) return '<button class="cg-btn" type="button" disabled>'+ic(m[1])+'<span id="cg-retry-in"></span></button>';
    return '<button class="cg-btn '+m[0]+'" type="button" data-act="'+a+'">'+ic(m[1])+esc(T(m[2]))+'</button>';
  }
  function paintLive(st){
    var box=el('cg-live'); if(!box) return;
    state.live=st;
    var v=liveView(st,state.env);
    // pid/已运行 每拍都变：放独立元素只改文本，卡片主体（含按钮）只在状态/文案变化时重建，
    // 否则每 3 秒 innerHTML 一次会把用户正要点的按钮换掉、日志区滚动归零
    var metaTxt=st.managed&&st.pid?Tf('cg.pc.meta_pid',{pid:st.pid,t:fmtUp(st.uptime_sec)}):'';
    var acts=IS_SUP?v.acts.map(function(a){ return actBtn(a,st); }).join(''):'';
    var agent=(!IS_SUP&&st.state!=='online'&&st.state!=='blind')?'<div class="meta">'+esc(T('cg.pc.agent_wait'))+'</div>':'';
    var log=(state.logOpen||st.state==='error')&&st.log_tail?'<pre class="cg-log">'+esc((st.log_tail||[]).join('\n')||T('cg.pc.log_empty'))+'</pre>':'';
    box.className='cg-live '+v.cls;
    var html='<div class="dot"></div><div class="body"><div class="ttl" id="cg-live-ttl"></div><div class="dsc" id="cg-live-dsc"></div><div class="meta" id="cg-live-meta"></div>'+agent+(acts?'<div class="acts">'+acts+'</div>':'')+log+'</div>';
    if(box.dataset.html!==html){ box.dataset.html=html; box.innerHTML=html; }
    el('cg-live-ttl').textContent=v.title; el('cg-live-dsc').textContent=v.desc;
    var mt=el('cg-live-meta'); if(mt){ mt.textContent=metaTxt; mt.style.display=metaTxt?'':'none'; }
    var ri=el('cg-retry-in'); if(ri) ri.textContent=Tf('cg.pc.btn_retry_in',{n:st.backoff_sec||0});
    if(st.state==='online'||st.state==='blind') markDone('pc3',T(state.testReceived?'cg.rail.done_live_msg':'cg.rail.done_live')); else markUndone('pc3');
    // 漏斗关键转化：本次会话首次看到在线（不管是点按钮、自启还是别处拉起的）
    if(st.state==='online'&&!state.trackedOnline){ state.trackedOnline=true; track(st.attached?'online_attached':'online'); }
    var m=el('cg-manual'); if(m){ var showManual=(state.env&&state.env.can_manage===false); if(showManual&&!m.open&&!m.dataset.touched){ m.open=true; loadManual(); } }
  }
  async function pollLive(){
    try{ if(!state.env) { try{ state.env=await api('/api/setup/wechat_pc/env'); }catch(_){ } }
      var st=await api('/api/setup/wechat_pc/copilot/status'); paintLive(st);
      // 在线 → 顺手刷新最近一条
      if(st.state==='online') pollRecentPc();
    }catch(e){ var b=el('cg-live'); if(b){ b.className='cg-live bad'; b.innerHTML='<div class="dot"></div><div class="body"><div class="ttl">'+esc(Tf('cg.error_generic',{why:String(e&&e.message||e)}))+'</div></div>'; } }
  }
  var _envTick=0;
  async function pollLiveAndEnv(){ if((_envTick++%3)===0){ try{ state.env=await api('/api/setup/wechat_pc/env'); syncRailFromState(); }catch(_){ } } await pollLive(); }
  async function doAct(a,btn){
    var box=el('cg-live');
    if(a==='back1'){ show(0); return; }
    if(a==='log'){ state.logOpen=!state.logOpen; if(state.live) paintLive(state.live); return; }
    if(a==='focus'){ track('focus_wechat'); try{ await post('/api/setup/wechat_pc/launch-wechat'); }catch(e){ setStatus(Tf('cg.error_generic',{why:String(e&&e.message||e)}),'bad'); } setTimeout(pollLive,1200); return; }
    var path={start:'start',retry:'restart',restart:'restart',stop:'stop'}[a]; if(!path) return;
    if(btn){ btn.disabled=true; if(a!=='stop') btn.textContent=T('cg.pc.btn_starting'); }
    if(box&&a!=='stop'){ box.className='cg-live busy'; }
    track(a);
    try{ var st=await post('/api/setup/wechat_pc/copilot/'+path); paintLive(st); track(a+'_ok'); }
    catch(e){ var why=String(e&&e.message||e); var msg=why.indexOf('driver_not_ready')>=0?T('cg.pc.err_driver'):why.indexOf('admin_token_missing')>=0?T('cg.pc.err_token'):Tf('cg.pc.err_start',{why:why});
      setStatus(msg,'bad'); track(a+'_fail'); pollLive(); }
  }
  async function loadManual(){
    var m=el('cg-manual-body'); if(!m) return;
    m.innerHTML='<div class="cg-status">'+esc(T('cg.loading'))+'</div>';
    try{
      if(IS_SUP){ try{ await post('/api/setup/wechat_pc/prepare'); }catch(_){} }
      var d=await api('/api/setup/wechat_pc/start-command'); state.manual=d;
      m.innerHTML='<p class="cg-lead" style="margin-top:6px;">'+esc(T('cg.pc.adv_lead'))+'</p>'
        +'<div class="cg-cmd">'+esc(d.command)+'</div><div class="cg-actions"><button class="cg-btn sm" type="button" data-copy="'+esc(d.command)+'">'+esc(T('cg.pc.copy_cmd'))+'</button></div>'
        +'<p class="cg-lead">'+esc(T('cg.pc.adv_autostart_lead'))+'</p><div class="cg-cmd">'+esc(d.autostart_command)+'</div><div class="cg-actions"><button class="cg-btn sm" type="button" data-copy="'+esc(d.autostart_command)+'">'+esc(T('cg.pc.copy_autostart'))+'</button></div>'
        +'<div class="hint" style="font-size:11.5px;color:var(--tk-text-muted);">'+esc(T(d.prepared?'cg.pc.adv_token_note':'cg.pc.token_missing'))+'</div>';
    }catch(e){ m.innerHTML='<div class="cg-card warn">'+esc(Tf('cg.pc.adv_load_fail',{why:String(e&&e.message||e)}))+' <button class="cg-btn sm" type="button" id="cg-manual-retry">'+esc(T('cg.pc.adv_retry'))+'</button></div>'; var r=el('cg-manual-retry'); if(r) r.onclick=loadManual; }
  }
  async function renderPc3(p){
    await loadPolicy();
    syncRailFromState();
    var auto=!!(state.policy&&state.policy.autostart);
    p.innerHTML='<p class="cg-lead">'+esc(T('cg.pc.s3_lead'))+'</p>'
      +'<div class="cg-live" id="cg-live" role="status" aria-live="polite"><div class="dot"></div><div class="body"><div class="ttl">'+esc(T('cg.loading'))+'</div></div></div>'
      +(IS_SUP?'<label class="cg-toggle"><input type="checkbox" id="cg-auto" '+(auto?'checked':'')+'><span class="sw"></span><span class="txt"><b>'+esc(T('cg.pc.autostart'))+'</b><small>'+esc(T('cg.pc.autostart_d'))+'</small></span><span class="cg-status" id="cg-auto-st"></span></label>':'')
      +'<div class="cg-sec"><div class="cg-sec-h">'+ic('chat')+esc(T('cg.pc.test_title'))+'</div><p class="cg-lead">'+esc(T('cg.pc.test_lead'))+'</p><div id="cg-recent"></div></div>'
      +'<details class="cg-adv"><summary>'+ic('help')+esc(T('cg.pc.faq_title'))+'</summary><table class="cg-faq"><thead><tr><th>'+esc(T('cg.pc.faq_symptom'))+'</th><th>'+esc(T('cg.pc.faq_cause'))+'</th><th>'+esc(T('cg.pc.faq_fix'))+'</th></tr></thead><tbody>'
      +FAQ.map(function(f){ return '<tr><td>'+esc(f.code)+'</td><td>'+esc(f.meaning)+'</td><td>'+esc(f.fix)+'</td></tr>'; }).join('')+'</tbody></table></details>'
      +'<details class="cg-adv" id="cg-manual"><summary>'+ic('wrench')+esc(T('cg.pc.adv_title'))+'</summary><div id="cg-manual-body"></div></details>';
    el('cg-live').addEventListener('click',function(e){ var b=e.target.closest('button[data-act]'); if(b) doAct(b.getAttribute('data-act'),b); });
    var man=el('cg-manual'); man.addEventListener('toggle',function(){ man.dataset.touched='1'; if(man.open&&!state.manual) loadManual(); });
    var ck=el('cg-auto'); if(ck) ck.onchange=async function(){
      var on=ck.checked; ck.disabled=true; el('cg-auto-st').textContent=T('cg.kf.saving'); el('cg-auto-st').className='cg-status';
      try{ var d=await post('/api/setup/wechat_pc/autostart',{enabled:on}); state.policy.autostart=d.autostart; el('cg-auto-st').textContent=T(d.autostart?'cg.pc.autostart_on':'cg.pc.autostart_off'); el('cg-auto-st').className='cg-status ok'; track(on?'autostart_on':'autostart_off'); }
      catch(e){ ck.checked=!on; el('cg-auto-st').textContent=Tf('cg.error_generic',{why:String(e&&e.message||e)}); el('cg-auto-st').className='cg-status bad'; }
      finally{ ck.disabled=false; }
    };
    every(pollLiveAndEnv,3000);
    every(pollRecentPc,6000);
  }

  head();
  var m=(location.hash||'').match(/^#s(\d+)$/); show(m?parseInt(m[1],10)-1:0);
})();
</script>
{% endblock %}
