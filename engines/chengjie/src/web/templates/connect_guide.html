{% extends "workspace_base.html" %}
{% block title %}{{ (i18n or {}).get('cg.title_' ~ guide_platform, '接入引导') }}{% endblock %}
{% block head %}
<style>
  /* 实施97 · 多步引导型接入页：左步骤轨 + 右内容区 + 底部动作条。全部走 --tk-* 令牌；
     企微侧步骤（授权/凭证）用企微蓝 --cg-wecom，客户侧（二维码）与个人微信用微信绿 --cg-wx。 */
  .cg-wrap{--cg-wecom:#1b6df5;--cg-wx:#07c160;--cg-badge-gray:#4b5563;--cg-on-badge:#fff;height:100%;overflow-y:auto;background:var(--tk-bg);padding:18px;}
  .cg-shell{max-width:960px;margin:0 auto;}
  .cg-head{display:flex;align-items:flex-start;gap:14px;margin-bottom:14px;}
  .cg-head .cg-ico{flex:none;width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:color-mix(in srgb,var(--cg-accent,var(--tk-brand)) 13%,transparent);}
  .cg-head h1{font-size:18px;font-weight:800;color:var(--tk-text);margin:0 0 3px;letter-spacing:.2px;}
  .cg-head .cg-sub{font-size:12.5px;color:var(--tk-text-muted);line-height:1.5;}
  .cg-head .cg-meta{margin-top:6px;display:flex;gap:10px;font-size:11.5px;color:var(--tk-text-muted);flex-wrap:wrap;}
  .cg-back{font-size:12px;color:var(--tk-text-muted);text-decoration:none;display:inline-block;margin-bottom:10px;}
  .cg-back:hover{color:var(--tk-brand);}
  .cg-body{display:grid;grid-template-columns:210px 1fr;gap:14px;align-items:start;}
  .cg-rail{background:var(--tk-surface);border:1px solid var(--tk-border);border-radius:var(--tk-radius-lg,14px);padding:10px 8px;box-shadow:var(--tk-shadow);position:sticky;top:0;}
  .cg-rail button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:transparent;padding:9px 8px;border-radius:10px;cursor:pointer;color:var(--tk-text-muted);font-size:12.5px;}
  .cg-rail button:hover{background:var(--tk-surface-2);}
  .cg-rail button.on{background:color-mix(in srgb,var(--cg-accent,var(--tk-brand)) 10%,transparent);color:var(--tk-text);font-weight:700;}
  .cg-rail .n{flex:none;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--tk-border);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--tk-text-muted);background:var(--tk-surface);}
  .cg-rail button.on .n{border-color:var(--cg-accent,var(--tk-brand));color:var(--cg-accent,var(--tk-brand));}
  .cg-rail button.done .n{background:var(--tk-ok-ink,#15803d);border-color:var(--tk-ok-ink,#15803d);color:#fff;}
  .cg-rail .lbl{flex:1;min-width:0;line-height:1.3;}
  .cg-rail .lbl small{display:block;font-size:10.5px;color:var(--tk-text-muted);font-weight:400;margin-top:1px;}
  .cg-panel{background:var(--tk-surface);border:1px solid var(--tk-border);border-radius:var(--tk-radius-lg,14px);box-shadow:var(--tk-shadow);overflow:hidden;min-height:420px;display:flex;flex-direction:column;}
  .cg-panel-hd{padding:14px 18px 10px;border-bottom:1px solid var(--tk-border);display:flex;align-items:center;gap:10px;}
  .cg-panel-hd .k{font-size:11px;color:var(--tk-text-muted);letter-spacing:.3px;}
  .cg-panel-hd h2{font-size:15px;font-weight:800;margin:0;color:var(--tk-text);}
  .cg-panel-bd{padding:16px 18px;flex:1;font-size:13px;color:var(--tk-text);line-height:1.6;}
  .cg-panel-ft{padding:12px 18px;border-top:1px solid var(--tk-border);display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--tk-surface-2);}
  .cg-btn{border:1px solid var(--tk-border);background:var(--tk-surface);color:var(--tk-text);border-radius:10px;padding:0 14px;height:36px;font-size:13px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;}
  .cg-btn:hover{background:var(--tk-surface-2);}
  .cg-btn.primary{background:var(--cg-accent,var(--tk-brand));border-color:var(--cg-accent,var(--tk-brand));color:#fff;}
  .cg-btn.primary:hover{filter:brightness(1.06);}
  .cg-btn.ghost{background:transparent;}
  .cg-btn:disabled{opacity:.5;cursor:not-allowed;}
  .cg-btn.sm{height:30px;padding:0 10px;font-size:12px;border-radius:8px;}
  .cg-lead{margin:0 0 12px;color:var(--tk-text);}
  .cg-list{margin:0 0 12px;padding-left:0;list-style:none;display:flex;flex-direction:column;gap:8px;}
  .cg-list li{display:flex;gap:10px;align-items:flex-start;}
  .cg-list .dot{flex:none;width:22px;height:22px;border-radius:50%;background:color-mix(in srgb,var(--cg-accent,var(--tk-brand)) 12%,transparent);color:var(--cg-accent,var(--tk-brand));font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:1px;}
  .cg-card{border:1px solid var(--tk-border);border-radius:12px;padding:12px 14px;background:var(--tk-surface-2);margin:10px 0;}
  .cg-card.accent{border-color:color-mix(in srgb,var(--cg-accent,var(--tk-brand)) 40%,transparent);background:color-mix(in srgb,var(--cg-accent,var(--tk-brand)) 7%,transparent);}
  .cg-card.warn{border-color:rgba(245,158,11,.45);background:rgba(245,158,11,.10);}
  .cg-card.ok{border-color:color-mix(in srgb,var(--tk-ok-ink,#15803d) 40%,transparent);background:color-mix(in srgb,var(--tk-ok-ink,#15803d) 8%,transparent);}
  .cg-kv{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .cg-kv code{font-size:15px;font-weight:700;letter-spacing:.5px;background:var(--tk-surface);border:1px solid var(--tk-border);border-radius:8px;padding:4px 10px;}
  .cg-field{margin:10px 0;}
  .cg-field label{display:block;font-size:12.5px;font-weight:700;margin-bottom:4px;}
  .cg-field label .req{color:var(--tk-danger,#e11d48);margin-left:2px;}
  .cg-field input,.cg-field textarea,.cg-field select{width:100%;box-sizing:border-box;height:38px;border:1px solid var(--tk-border);border-radius:9px;padding:0 10px;font-size:13px;background:var(--tk-surface);color:var(--tk-text);}
  .cg-field textarea{height:76px;padding:8px 10px;resize:vertical;}
  .cg-field .hint{font-size:11px;color:var(--tk-text-muted);margin-top:4px;}
  .cg-field .bad{font-size:11px;color:var(--tk-danger-ink,#b91c1c);margin-top:4px;}
  .cg-checks{list-style:none;padding:0;margin:12px 0 0;display:flex;flex-direction:column;gap:8px;}
  .cg-checks li{display:flex;gap:10px;align-items:flex-start;padding:9px 12px;border-radius:10px;border:1px solid var(--tk-border);background:var(--tk-surface);}
  .cg-checks li .st{flex:none;width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:#fff;background:#9ca3af;}
  .cg-checks li.ok .st{background:var(--tk-ok-ink,#15803d);} .cg-checks li.bad .st{background:var(--tk-danger,#e11d48);}
  .cg-checks li .t{flex:1;min-width:0;} .cg-checks li .t small{display:block;color:var(--tk-text-muted);font-size:11.5px;margin-top:2px;line-height:1.5;}
  .cg-acct{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;margin:10px 0;}
  .cg-acct label{border:1px solid var(--tk-border);border-radius:12px;padding:10px 12px;display:flex;gap:10px;align-items:center;cursor:pointer;background:var(--tk-surface);}
  .cg-acct label.sel{border-color:var(--cg-accent,var(--tk-brand));background:color-mix(in srgb,var(--cg-accent,var(--tk-brand)) 8%,transparent);}
  .cg-acct label.dis{opacity:.55;cursor:not-allowed;}
  .cg-acct .av{flex:none;width:36px;height:36px;border-radius:10px;background:var(--tk-surface-2);object-fit:cover;}
  .cg-acct .nm{font-weight:700;font-size:13px;line-height:1.3;} .cg-acct .id{font-size:10.5px;color:var(--tk-text-muted);word-break:break-all;}
  .cg-pill{display:inline-block;font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:999px;margin-top:3px;}
  .cg-pill.on{background:color-mix(in srgb,var(--tk-ok-ink,#15803d) 14%,transparent);color:var(--tk-ok-ink,#15803d);}
  .cg-pill.warn{background:rgba(245,158,11,.16);color:var(--tk-warn-ink,#b45309);}
  .cg-pill.muted{background:var(--tk-surface-2);color:var(--tk-text-muted);}
  .cg-tiers{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:10px 0;}
  .cg-tiers label{border:1px solid var(--tk-border);border-radius:12px;padding:12px;cursor:pointer;background:var(--tk-surface);position:relative;}
  .cg-tiers label.sel{border-color:var(--cg-accent,var(--tk-brand));box-shadow:0 0 0 2px color-mix(in srgb,var(--cg-accent,var(--tk-brand)) 25%,transparent);}
  .cg-tiers .tn{font-weight:800;font-size:13px;} .cg-tiers .td{font-size:11.5px;color:var(--tk-text-muted);margin-top:4px;line-height:1.45;}
  .cg-tiers .rec{position:absolute;top:-8px;right:10px;font-size:10px;font-weight:800;background:var(--cg-accent,var(--tk-brand));color:#fff;border-radius:999px;padding:1px 7px;}
  .cg-qr{display:flex;gap:18px;align-items:flex-start;flex-wrap:wrap;}
  .cg-qr .box{width:220px;height:220px;border-radius:12px;border:1px solid var(--tk-border);background:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden;}
  .cg-qr .box img{width:100%;height:100%;object-fit:contain;}
  .cg-recent{border:1px dashed var(--tk-border);border-radius:12px;padding:10px 12px;min-height:56px;font-size:12.5px;color:var(--tk-text-muted);}
  .cg-recent .msg{color:var(--tk-text);} .cg-recent .who{font-size:11px;font-weight:700;margin-right:6px;color:var(--cg-accent,var(--tk-brand));}
  .cg-rules{margin:14px 0 0;padding:0;list-style:none;font-size:12px;color:var(--tk-text-muted);display:flex;flex-direction:column;gap:5px;}
  .cg-rules li::before{content:'•';margin-right:6px;color:var(--cg-accent,var(--tk-brand));}
  .cg-cmd{font-family:ui-monospace,Consolas,monospace;font-size:12px;background:var(--tk-surface);border:1px solid var(--tk-border);border-radius:9px;padding:10px 12px;white-space:pre-wrap;word-break:break-all;color:var(--tk-text);}
  table.cg-faq{width:100%;border-collapse:collapse;font-size:12px;margin-top:8px;}
  table.cg-faq th,table.cg-faq td{border-bottom:1px solid var(--tk-border);padding:7px 8px;text-align:left;vertical-align:top;line-height:1.5;}
  table.cg-faq th{color:var(--tk-text-muted);font-weight:700;font-size:11px;}
  .cg-status{font-size:12px;color:var(--tk-text-muted);}
  .cg-status.ok{color:var(--tk-ok-ink,#15803d);font-weight:700;} .cg-status.bad{color:var(--tk-danger-ink,#b91c1c);font-weight:700;}
  @media (max-width:720px){
    .cg-body{grid-template-columns:1fr;}
    .cg-rail{position:static;display:flex;overflow-x:auto;gap:4px;padding:8px;}
    .cg-rail button{width:auto;flex:none;} .cg-rail .lbl small{display:none;}
    .cg-tiers{grid-template-columns:1fr;}
  }
</style>
{% endblock %}
{% block content %}
<div class="cg-wrap" id="cg-wrap" data-plat="{{ guide_platform }}" data-supervisor="{{ '1' if is_supervisor else '0' }}"
     data-faq='{{ (guide_faq or []) | tojson }}' data-rules='{{ (guide_rules or []) | tojson }}'>
  <div class="cg-shell">
    <a class="cg-back" href="/workspace?drawer=1" data-i18n="cg.back">← 返回工作台</a>
    <div class="cg-head">
      <div class="cg-ico" id="cg-ico"></div>
      <div style="flex:1;min-width:0;">
        <h1 id="cg-title"></h1>
        <div class="cg-sub" id="cg-sub"></div>
        <div class="cg-meta"><span id="cg-eta"></span><a id="cg-tutorial" href="#" target="_blank" rel="noopener" style="color:var(--tk-brand);text-decoration:none;"></a></div>
      </div>
    </div>
    <div class="cg-body">
      <nav class="cg-rail" id="cg-rail" aria-label="steps"></nav>
      <section class="cg-panel">
        <div class="cg-panel-hd"><span class="k" id="cg-step-k"></span><h2 id="cg-step-h"></h2></div>
        <div class="cg-panel-bd" id="cg-panel"></div>
        <div class="cg-panel-ft">
          <button class="cg-btn ghost" id="cg-prev" type="button"></button>
          <span class="cg-status" id="cg-foot-status"></span>
          <button class="cg-btn primary" id="cg-next" type="button"></button>
        </div>
      </section>
    </div>
  </div>
</div>
<script>
(function(){
  'use strict';
  var T=window.T, Tf=window.Tf;
  var root=document.getElementById('cg-wrap');
  var PLAT=root.getAttribute('data-plat')||'wechat_kf';
  var IS_SUP=root.getAttribute('data-supervisor')==='1';
  var FAQ=[], RULES=[];
  try{ FAQ=JSON.parse(root.getAttribute('data-faq')||'[]'); }catch(_){ FAQ=[]; }
  try{ RULES=JSON.parse(root.getAttribute('data-rules')||'[]'); }catch(_){ RULES=[]; }
  var isKF=PLAT==='wechat_kf';
  var accent=isKF?'var(--cg-wecom)':'var(--cg-wx)';
  root.style.setProperty('--cg-accent',accent);
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function el(id){ return document.getElementById(id); }
  function setStatus(txt,cls){ var s=el('cg-foot-status'); s.textContent=txt||''; s.className='cg-status'+(cls?' '+cls:''); }
  async function api(path,opts){
    var r=await window.apiFetch(path,opts||{},{timeoutMs:30000});
    var d=null; try{ d=await r.json(); }catch(_){ d={}; }
    if(!r.ok){ var why=(d&&(d.detail||d.error))||('HTTP '+r.status); throw new Error(typeof why==='string'?why:JSON.stringify(why)); }
    return d;
  }
  async function copyText(t,btn){
    try{ await navigator.clipboard.writeText(t); if(btn){ var o=btn.textContent; btn.textContent=T('cg.copied'); setTimeout(function(){ btn.textContent=o; },1400);} }
    catch(_){ setStatus(T('cg.copy_failed'),'bad'); }
  }
  function inviteCard(){
    var link=location.origin+location.pathname;
    return '<div class="cg-card warn"><b>'+esc(T('cg.invite_title'))+'</b><div style="margin:6px 0 8px;font-size:12.5px;">'+esc(T('cg.invite_body'))+'</div>'
      +'<div class="cg-kv"><code style="font-size:12px;font-weight:500;">'+esc(link)+'</code><button class="cg-btn sm" type="button" data-copy="'+esc(link)+'">'+esc(T('cg.copy_link'))+'</button></div></div>';
  }

  // ── 步骤定义 ──
  var STEPS = isKF ? [
    {key:'kf1', title:T('cg.kf.s1'), eta:5, render:renderKf1},
    {key:'kf2', title:T('cg.kf.s2'), eta:2, render:renderKf2, sup:true},
    {key:'kf3', title:T('cg.kf.s3'), eta:1, render:renderKf3, sup:true},
    {key:'kf4', title:T('cg.kf.s4'), eta:1, render:renderKf4, sup:true},
    {key:'kf5', title:T('cg.kf.s5'), eta:1, render:renderKf5}
  ] : [
    {key:'pc1', title:T('cg.pc.s1'), eta:1, render:renderPc1},
    {key:'pc2', title:T('cg.pc.s2'), eta:1, render:renderPc2},
    {key:'pc3', title:T('cg.pc.s3'), eta:1, render:renderPc3},
    {key:'pc4', title:T('cg.pc.s4'), eta:1, render:renderPc4, sup:true},
    {key:'pc5', title:T('cg.pc.s5'), eta:1, render:renderPc5},
    {key:'pc6', title:T('cg.pc.s6'), eta:1, render:renderPc6}
  ];
  var cur=0, done={}, timers=[];
  var state={ egress:'', checks:null, accounts:[], selected:{}, bound:[], kfid:'', kfname:'', personas:[], qr:null, env:null, policy:null };

  function head(){
    el('cg-title').textContent=T(isKF?'cg.title_wechat_kf':'cg.title_wechat_pc');
    el('cg-sub').textContent=T(isKF?'cg.sub_wechat_kf':'cg.sub_wechat_pc');
    var total=STEPS.reduce(function(a,s){ return a+(s.eta||1); },0);
    el('cg-eta').textContent=Tf('cg.eta',{n:total});
    var tu=el('cg-tutorial'); tu.textContent=T('cg.tutorial'); tu.href='/help/onboarding/'+PLAT;
    try{
      var svg=window.platformIconSVG?window.platformIconSVG('wechat',{size:28}):'';
      // 与抽屉同一枚角标（企 / PC）：管理者一眼分清「企业官方客服号」与「我自己的个人号」
      var badge=isKF?T('inbox.plat.badge_wechat_kf'):T('inbox.plat.badge_wechat');
      el('cg-ico').innerHTML='<span style="position:relative;display:inline-flex;width:28px;height:28px;">'+svg
        +'<span style="position:absolute;right:-5px;bottom:-5px;min-width:13px;height:13px;padding:0 3px;border-radius:5px;background:'+(isKF?'var(--cg-wecom)':'var(--cg-badge-gray)')+';color:var(--cg-on-badge);font-size:9px;line-height:13px;font-weight:800;text-align:center;box-shadow:0 0 0 1.5px var(--tk-surface,#fff);">'+esc(badge)+'</span></span>';
    }catch(_){}
  }
  function rail(){
    var h='';
    STEPS.forEach(function(s,i){
      h+='<button type="button" data-i="'+i+'" class="'+(i===cur?'on':'')+(done[s.key]?' done':'')+'"><span class="n">'+(done[s.key]?'✓':(i+1))+'</span><span class="lbl">'+esc(s.title)+'<small>'+esc(Tf('cg.eta',{n:s.eta||1}))+'</small></span></button>';
    });
    el('cg-rail').innerHTML=h;
  }
  function clearTimers(){ timers.forEach(clearInterval); timers=[]; }
  function every(fn,ms){ fn(); timers.push(setInterval(fn,ms)); }
  function show(i){
    clearTimers();
    cur=Math.max(0,Math.min(STEPS.length-1,i));
    var s=STEPS[cur];
    el('cg-step-k').textContent=Tf('cg.step_of',{i:cur+1,n:STEPS.length});
    el('cg-step-h').textContent=s.title;
    el('cg-prev').textContent=T('cg.prev'); el('cg-prev').disabled=cur===0;
    el('cg-next').textContent=cur===STEPS.length-1?T('cg.finish'):T('cg.next');
    setStatus('');
    var p=el('cg-panel');
    if(s.sup && !IS_SUP){ p.innerHTML=inviteCard()+'<div class="cg-status">'+esc(T('cg.waiting_admin'))+'</div>'; }
    else { p.innerHTML='<div class="cg-status">'+esc(T('cg.loading'))+'</div>'; try{ s.render(p); }catch(e){ p.innerHTML='<div class="cg-card warn">'+esc(Tf('cg.error_generic',{why:String(e&&e.message||e)}))+'</div>'; } }
    rail();
    try{ history.replaceState(null,'',location.pathname+'#s'+(cur+1)); }catch(_){}
  }
  el('cg-prev').onclick=function(){ show(cur-1); };
  el('cg-next').onclick=function(){ if(cur===STEPS.length-1){ location.href='/workspace?drawer=1'; return; } done[STEPS[cur].key]=true; show(cur+1); };
  el('cg-rail').addEventListener('click',function(e){ var b=e.target.closest('button[data-i]'); if(b) show(parseInt(b.getAttribute('data-i'),10)); });
  document.addEventListener('click',function(e){ var b=e.target.closest('[data-copy]'); if(b){ copyText(b.getAttribute('data-copy'),b); } });

  // ══════════ 企微 ══════════
  function egressBlock(){
    return '<div class="cg-card accent"><div style="font-size:11.5px;color:var(--tk-text-muted);margin-bottom:6px;">'+esc(T('cg.kf.egress_label'))+'</div>'
      +'<div class="cg-kv"><code id="cg-egress">'+esc(state.egress||T('cg.kf.egress_detecting'))+'</code><button class="cg-btn sm" type="button" id="cg-copy-ip" '+(state.egress?'':'disabled')+'>'+esc(T('cg.kf.copy_ip'))+'</button></div>'
      +'<div class="hint" style="font-size:11px;color:var(--tk-text-muted);margin-top:6px;">'+esc(T('cg.kf.egress_hint'))+'</div></div>';
  }
  async function loadEgress(){
    if(!IS_SUP) return;
    try{ var d=await api('/api/setup/wechat_kf/egress-ip'); state.egress=d.ok?d.ip:''; }catch(_){ state.egress=''; }
    var c=el('cg-egress'); if(c){ c.textContent=state.egress||T('cg.kf.egress_fail'); var b=el('cg-copy-ip'); if(b){ b.disabled=!state.egress; b.onclick=function(){ copyText(state.egress,b); }; } }
  }
  // 公网前缀（配置的可信域名 / 官网中继设备前缀 / 当前来源）：回调地址、登录回跳都从这里派生
  state.publicBase=''; state.relay=null;
  async function loadPublicBase(){
    try{ var d=await api('/api/auth/wecom/status'); state.publicBase=String(d.public_base||''); state.relay=d.relay||null; state.redirectSource=d.redirect_source||''; }catch(_){}
    return state.publicBase;
  }
  function callbackUrlBlock(){
    var base=state.publicBase||location.origin;
    var relayNote='';
    if(state.relay&&state.relay.enabled){
      relayNote=' <span class="cg-pill '+(state.relay.connected?'on':'warn')+'">'+esc(T(state.relay.connected?'cg.kf.relay_on':'cg.kf.relay_off'))+'</span>';
    } else if(state.redirectSource==='request'){

  function envRows(env){
    var rows=[];

    rows.push(env.running?['ok',T('cg.pc.env_running')]:['bad',T('cg.pc.env_not_running')]);
    if(env.running){
      if(env.version) rows.push([env.version_ok?'ok':'bad',Tf('cg.pc.env_version',{v:env.version})+(env.version_ok?'':' · '+T('cg.pc.env_version_bad'))]);
      else rows.push(['warn',T('cg.pc.env_version_unknown')]);
      if(env.main_window) rows.push(['ok',T('cg.pc.env_main')]);
      else if(env.login_window) rows.push(['warn',T('cg.pc.env_login')]);
      else rows.push(['warn',T('cg.pc.env_hidden')]);
    }
    return rows;
  }

    state.tier=state.policy.tier||'copilot';
    p.innerHTML='<p class="cg-lead">'+esc(T('cg.pc.s4_lead'))+'</p><div class="cg-tiers" id="cg-tiers">'+pcTierCard('copilot',T('cg.pc.tier_copilot'),T('cg.pc.tier_copilot_d'))+pcTierCard('semi',T('cg.pc.tier_semi'),T('cg.pc.tier_semi_d'))+pcTierCard('auto_reply',T('cg.pc.tier_auto'),T('cg.pc.tier_auto_d'))+'</div>'
      +'<div class="cg-field"><label>'+esc(T('cg.pc.work_hours'))+'</label><div style="display:flex;gap:8px;align-items:center;"><input id="cg-wh-a" type="number" min="0" max="23" value="'+esc(state.policy.work_hours[0])+'" style="width:80px;"> — <input id="cg-wh-b" type="number" min="1" max="24" value="'+esc(state.policy.work_hours[1])+'" style="width:80px;"></div><div class="hint">'+esc(T('cg.pc.work_hours_hint'))+'</div></div>'
      +'<div class="cg-card warn" id="cg-risk" style="'+(state.tier==='auto_reply'?'':'display:none;')+'"><b>'+esc(T('cg.pc.risk_title'))+'</b><ul class="cg-list" style="margin-top:8px;">'+['cg.pc.risk_a','cg.pc.risk_b','cg.pc.risk_c'].map(function(k,i){ return '<li><span class="dot">'+(i+1)+'</span><span>'+esc(T(k))+'</span></li>'; }).join('')+'</ul>'
      +'<label style="display:flex;gap:8px;align-items:center;font-weight:700;font-size:12.5px;"><input type="checkbox" id="cg-risk-ck" '+(state.policy.risk_ack?'checked':'')+' style="width:16px;height:16px;">'+esc(T('cg.pc.risk_check'))+'</label></div>'
      +'<div style="display:flex;gap:10px;align-items:center;margin-top:10px;"><button class="cg-btn primary" type="button" id="cg-save-tier">'+esc(T('cg.pc.save_tier'))+'</button><span class="cg-status" id="cg-tier-st">'+esc(Tf('cg.pc.tier_current',{tier:T(state.tier==='semi'?'cg.pc.tier_semi':state.tier==='auto_reply'?'cg.pc.tier_auto':'cg.pc.tier_copilot')}))+'</span></div>';
    el('cg-tiers').addEventListener('click',function(e){ var l=e.target.closest('label[data-tier]'); if(!l) return; state.tier=l.getAttribute('data-tier'); Array.prototype.forEach.call(el('cg-tiers').children,function(c){ c.classList.toggle('sel',c.getAttribute('data-tier')===state.tier); }); el('cg-risk').style.display=state.tier==='auto_reply'?'':'none'; });
    el('cg-save-tier').onclick=async function(){
      var ack=el('cg-risk-ck').checked;
      if(state.tier==='auto_reply'&&!ack&&!state.policy.risk_ack){ el('cg-tier-st').textContent=T('cg.pc.risk_required'); el('cg-tier-st').className='cg-status bad'; return; }
      this.disabled=true;
      try{ var d=await api('/api/setup/wechat_pc/policy',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({tier:state.tier,work_hours:[parseInt(el('cg-wh-a').value,10),parseInt(el('cg-wh-b').value,10)],risk_ack:ack})});
        state.policy=d; el('cg-tier-st').textContent=T('cg.pc.tier_saved'); el('cg-tier-st').className='cg-status ok'; done.pc4=true; rail();
      }catch(e){ el('cg-tier-st').textContent=Tf('cg.error_generic',{why:String(e&&e.message||e)}); el('cg-tier-st').className='cg-status bad'; }
      finally{ this.disabled=false; }
    };
  }
  function tierName(t){ return T(t==='semi'?'cg.pc.tier_semi':t==='auto_reply'?'cg.pc.tier_auto':'cg.pc.tier_copilot'); }
  async function pollPresence(){
    try{ var d=await api('/api/setup/wechat_pc/env'); var c=d.copilot; var b=el('cg-presence'); if(!b) return;
      if(c&&c.alive&&c.readable===false){ b.className='cg-card warn'; b.textContent=T('cg.pc.presence_blind'); }
      else if(c&&c.alive){ b.className='cg-card ok'; b.textContent='● '+Tf('cg.pc.presence_on',{tier:tierName(c.tier)}); done.pc5=true; rail(); }
      else if(c){ b.className='cg-card warn'; b.textContent=Tf('cg.pc.presence_off',{m:Math.max(1,Math.round((c.age_sec||0)/60))}); }
      else { b.className='cg-card'; b.textContent=T('cg.pc.presence_waiting'); }
    }catch(_){}
  }
  function renderPc5(p){
    p.innerHTML='<p class="cg-lead">'+esc(T('cg.pc.s5_lead'))+'</p><div class="cg-card" id="cg-presence">'+esc(T('cg.pc.presence_waiting'))+'</div>';
    every(pollPresence,4000);
  }
  function renderPc6(p){
    p.innerHTML='<p class="cg-lead">'+esc(T('cg.pc.s6_lead'))+'</p><div id="cg-recent"></div>'
      +'<div style="font-size:12px;font-weight:700;margin-top:16px;">'+esc(T('cg.pc.faq_title'))+'</div>'
      +'<table class="cg-faq"><thead><tr><th>'+esc(T('cg.pc.faq_symptom'))+'</th><th>'+esc(T('cg.pc.faq_cause'))+'</th><th>'+esc(T('cg.pc.faq_fix'))+'</th></tr></thead><tbody>'
      +FAQ.map(function(f){ return '<tr><td>'+esc(f.code)+'</td><td>'+esc(f.meaning)+'</td><td>'+esc(f.fix)+'</td></tr>'; }).join('')+'</tbody></table>';
    every(function(){ pollRecent('wechat','','cg-recent','cg.pc.recent_none'); },5000);
  }

  head();
  var m=(location.hash||'').match(/^#s(\d+)$/); show(m?parseInt(m[1],10)-1:0);
})();
</script>
{% endblock %}
