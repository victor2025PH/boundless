<!doctype html>
<!--
  Telegram 群成员提取 · 管理台（独立自包含页，不 extends base.html）。

  刻意自包含：内联 zh/en i18n（无 window.T 依赖）、纯 fetch 驱动、只用 addEventListener
  （无内联 on* handler）→ 重启前完全惰性、可被渲染冒烟测试验证、不牵动任何在跑页面。
  由 group_members_routes.py 的 GET /tools/tg-members 直接返回本文件内容。
  数据源：/api/accounts、/api/tg-members/{jobs,groups,members,members/export,quota}。
  正式上线时的 nav 集成 / base.html 主题化 / 更细粒度 UX 属部署窗口内的真机打磨项。
-->
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TG 群成员提取</title>
  <style>
    :root { --bg:#f6f7f9; --card:#fff; --border:#e5e7eb; --text:#1f2937; --dim:#6b7280;
            --accent:#1e8cf2; --ok:#0f9d75; --warn:#d97706; --danger:#dc2626; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#0f141a; --card:#161c24; --border:#2a333d; --text:#e5e9ef; --dim:#93a1b0; }
    }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--bg); color:var(--text);
           font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"Microsoft Yahei",sans-serif; }
    .wrap { max-width:1080px; margin:0 auto; padding:20px 16px 60px; }
    h1 { font-size:20px; margin:0 0 4px; }
    .sub { color:var(--dim); font-size:12.5px; margin-bottom:16px; }
    .card { background:var(--card); border:1px solid var(--border); border-radius:12px;
            padding:16px; margin-bottom:16px; }
    .card h2 { font-size:15px; margin:0 0 12px; }
    .row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:10px; }
    label { color:var(--dim); font-size:12.5px; }
    input, select { font:inherit; padding:6px 9px; border:1px solid var(--border);
                    border-radius:8px; background:var(--card); color:var(--text); }
    input[type=text], input[type=number] { min-width:200px; }
    button { font:inherit; cursor:pointer; border:1px solid var(--border); background:var(--card);
             color:var(--text); border-radius:8px; padding:6px 12px; }
    button:hover { border-color:var(--accent); }
    button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
    button[disabled] { opacity:.5; cursor:not-allowed; }
    .accts { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:10px; }
    .accts label { display:inline-flex; align-items:center; gap:6px; padding:5px 10px;
                   border:1px solid var(--border); border-radius:999px; color:var(--text); font-size:12.5px; }
    .accts label.off { opacity:.45; }
    .msg { font-size:12.5px; color:var(--dim); margin-top:6px; }
    .banner { background:#fef3c7; color:#92400e; border:1px solid #fcd34d; border-radius:10px;
              padding:10px 12px; margin-bottom:16px; font-size:13px; }
    table { width:100%; border-collapse:collapse; font-size:13px; }
    th, td { text-align:left; padding:7px 8px; border-bottom:1px solid var(--border); }
    th { color:var(--dim); font-weight:600; font-size:12px; }
    .pill { display:inline-block; padding:1px 8px; border-radius:999px; font-size:11.5px; }
    .pill.run { background:color-mix(in srgb, var(--bl-growth,#1e8cf2) 14%, transparent); color:var(--accent); }
    .pill.done { background:rgba(15,157,117,.14); color:var(--ok); }
    .pill.err { background:rgba(220,38,38,.14); color:var(--danger); }
    .pill.adm { background:rgba(217,119,6,.14); color:var(--warn); }
    .job { border:1px solid var(--border); border-radius:10px; padding:10px 12px; margin-bottom:8px; }
    .job .jhd { display:flex; justify-content:space-between; gap:8px; align-items:center; }
    .empty { color:var(--dim); padding:8px 2px; }
    /* 第④步：每人一张开口卡 */
    .ocard { border:1px solid var(--border); border-radius:10px; padding:10px 12px; margin-bottom:10px; }
    .ocard.approved { border-color:rgba(15,157,117,.5); }
    .ocard .ohd { display:flex; justify-content:space-between; gap:8px; align-items:center; flex-wrap:wrap; }
    .ocard .osaid { color:var(--dim); font-size:12.5px; margin:6px 0 4px; }
    .ocard .osaid q { font-style:italic; }
    .ocard textarea { width:100%; min-height:54px; font:inherit; padding:7px 9px; border:1px solid var(--border);
                      border-radius:8px; background:var(--card); color:var(--text); resize:vertical; }
    .ocard .oact { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-top:6px; }
    .ocard .ocount { color:var(--dim); font-size:11.5px; margin-left:auto; }
    .pill.ai { background:rgba(30,140,242,.14); color:var(--accent); }
    .pill.tpl { background:rgba(107,114,128,.16); color:var(--dim); }
    .pill.man { background:rgba(217,119,6,.14); color:var(--warn); }
    .pill.ok { background:rgba(15,157,117,.14); color:var(--ok); }
    .ocard.fu { border-style:dashed; }
    .ocard.replied { border-color:rgba(15,157,117,.5); background:rgba(15,157,117,.04); }
    .ocard.replied.stalled { border-color:rgba(217,119,6,.6); background:rgba(217,119,6,.05); }
    .pill.warn { background:rgba(217,119,6,.14); color:var(--warn); }
    .msg.warn { color:var(--warn); }
    .ocard.replied a { color:inherit; text-decoration:none; }
    .ocard.replied a:hover { text-decoration:underline; }
    .funnel { display:flex; gap:6px; flex-wrap:wrap; align-items:center; margin:8px 0; font-size:12.5px; }
    .funnel b { font-size:15px; }
    .funnel .arr { color:var(--dim); }
    .stats-grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(230px, 1fr)); gap:12px; }
    .stats-grid table { font-size:12.5px; }
    .stats-grid h3 { font-size:13px; margin:0 0 6px; color:var(--dim); }
    .bar { display:inline-block; height:8px; background:var(--dim); opacity:.55; border-radius:4px; vertical-align:middle; }
    .bar.hot { background:var(--ok); opacity:1; }
    .bar.warm { background:var(--accent); opacity:1; }
    .bar.cold { background:var(--danger); opacity:.8; }
    /* 账号卡片（头像+昵称+@+在线点，多选） */
    .gm-acct-card { display:inline-flex; align-items:center; gap:8px; padding:5px 12px 5px 5px;
                    border:1px solid var(--border); border-radius:999px; cursor:pointer;
                    background:var(--card); user-select:none; }
    .gm-acct-card.sel { border-color:var(--accent); box-shadow:0 0 0 1px var(--accent) inset; }
    .gm-acct-card input { position:absolute; opacity:0; width:0; height:0; }
    .gm-av { width:30px; height:30px; border-radius:50%; object-fit:cover; flex:none;
             display:inline-flex; align-items:center; justify-content:center; color:#fff;
             font-size:12px; font-weight:700; }
    .gm-acct-meta { display:flex; flex-direction:column; line-height:1.2; }
    .gm-acct-nm { font-size:12.5px; font-weight:600; color:var(--text); }
    .gm-acct-un { font-size:11px; color:var(--dim); }
    .gm-dot { width:7px; height:7px; border-radius:50%; background:var(--ok); flex:none; }
    /* 可聊度色块 */
    .sc { display:inline-block; min-width:24px; text-align:center; padding:1px 7px;
          border-radius:999px; font-size:11.5px; font-weight:700; }
    .sc.hi { background:rgba(15,157,117,.16); color:var(--ok); }
    .sc.mid { background:rgba(217,119,6,.16); color:var(--warn); }
    .sc.lo { background:rgba(107,114,128,.16); color:var(--dim); }
    .adv-toggle { font-size:11.5px; color:var(--accent); cursor:pointer; text-decoration:none; }
    .gm-acct-q { font-size:10.5px; color:var(--dim); }
    /* 任务进度条 */
    .jbar { height:5px; background:var(--border); border-radius:999px; overflow:hidden; margin:8px 0 2px; }
    .jbar > i { display:block; height:100%; width:0; background:var(--accent);
                border-radius:999px; transition:width .4s ease; }
    .job.jdone .jbar > i { background:var(--ok); }
    .job.jerr  .jbar > i { background:var(--danger); }
    /* 配额迷你条（选号卡片内） */
    .qbar { display:inline-block; width:34px; height:4px; background:var(--border);
            border-radius:999px; overflow:hidden; vertical-align:middle; margin-right:4px; }
    .qbar > i { display:block; height:100%; background:var(--accent); }
  </style>
</head>
<body>
  <div class="wrap">
    <h1 id="t-title"></h1>
    <div class="sub" id="t-sub"></div>
    <div class="banner" id="gm-disabled" hidden></div>

    <section class="card">
      <h2 id="t-extract"></h2>
      <div class="msg" id="t-accts-l"></div>
      <div class="accts" id="gm-accts"><span class="empty" id="gm-accts-empty"></span></div>
      <div class="msg" id="gm-accts-total"></div>
      <div class="row">
        <label id="t-group-l" for="gm-group-sel"></label>
        <select id="gm-group-sel"><option value=""></option></select>
        <button type="button" id="gm-eg-refresh" title="刷新群列表">⟳</button>
        <a href="#" id="gm-group-adv-toggle" class="adv-toggle"></a>
      </div>
      <div class="row" id="gm-group-adv" hidden>
        <label id="t-group-manual-l" for="gm-group-manual"></label>
        <input type="text" id="gm-group-manual" placeholder="-1001234567890 / @username" />
      </div>
      <div class="msg" id="gm-group-note"></div>
      <div class="row">
        <label id="t-filter-l" for="gm-filter"></label>
        <select id="gm-filter">
          <option value="spoke_no_admin"></option>
          <option value="spoke"></option>
          <option value="all"></option>
        </select>
        <label id="t-cap-l" for="gm-cap"></label>
        <input type="number" id="gm-cap" value="200" min="1" max="100000" />
      </div>
      <button class="primary" id="gm-start"></button>
      <div class="msg" id="gm-start-msg"></div>
    </section>

    <section class="card">
      <h2 id="t-jobs"></h2>
      <div id="gm-jobs"><div class="empty" id="gm-jobs-empty"></div></div>
    </section>

    <section class="card">
      <h2 id="t-members"></h2>
      <div class="row">
        <label id="t-mgroup-l" for="gm-mgroup"></label>
        <select id="gm-mgroup"></select>
        <select id="gm-monly">
          <option value="spoke_no_admin"></option>
          <option value="spoke"></option>
          <option value=""></option>
          <option value="admins"></option>
        </select>
        <select id="gm-msort">
          <option value="score"></option>
          <option value="recent"></option>
        </select>
        <input type="text" id="gm-mq" />
        <button id="gm-refresh"></button>
        <button id="gm-export"></button>
      </div>
      <div class="msg" id="gm-mstats"></div>
      <table>
        <thead><tr>
          <th id="th-user"></th><th id="th-name"></th><th id="th-score"></th>
          <th id="th-spoke"></th><th id="th-admin"></th><th id="th-src"></th>
          <th id="th-state"></th>
        </tr></thead>
        <tbody id="gm-mbody"></tbody>
      </table>
    </section>

    <section class="card" id="gm-outreach">
      <h2 id="t-outreach"></h2>
      <div class="msg" id="t-outreach-l"></div>
      <div class="row">
        <label id="t-out-acct-l" for="gm-out-acct"></label>
        <select id="gm-out-acct"></select>
        <label id="t-out-mode-l" for="gm-out-mode"></label>
        <select id="gm-out-mode">
          <option value="manual"></option>
          <option value="approve"></option>
          <option value="auto"></option>
        </select>
        <span class="msg" id="gm-out-persona"></span>
      </div>
      <div class="row">
        <button type="button" id="gm-out-queue"></button>
        <button type="button" id="gm-out-compose"></button>
        <button type="button" class="primary" id="gm-out-approve-all"></button>
        <button type="button" id="gm-out-stop"></button>
        <button type="button" id="gm-out-resume"></button>
      </div>
      <div class="row gm-out-settings">
        <label id="t-out-hours-l"></label>
        <input type="number" id="gm-out-h0" min="0" max="23" style="min-width:64px;width:64px" />
        <span>–</span>
        <input type="number" id="gm-out-h1" min="1" max="24" style="min-width:64px;width:64px" />
        <label id="t-out-cap-l"></label>
        <input type="number" id="gm-out-cap" min="5" max="10" style="min-width:64px;width:64px" />
        <button type="button" id="gm-out-save"></button>
        <span class="msg" id="gm-out-save-note"></span>
      </div>
      <div class="msg" id="gm-out-stats"></div>
      <div class="msg" id="gm-out-summary"></div>
      <div id="gm-out-list"></div>
      <div id="gm-out-replied"></div>
      <div id="gm-out-followups"></div>
      <div class="row" style="margin-top:12px">
        <button type="button" id="gm-out-stats-btn"></button>
        <select id="gm-out-stats-days">
          <option value="7">7d</option><option value="14">14d</option><option value="30">30d</option>
        </select>
        <select id="gm-out-stats-scope">
          <option value="acct"></option><option value="all"></option>
        </select>
      </div>
      <div id="gm-out-statsbox" hidden></div>
    </section>
  </div>

  <script>
  (function () {
    "use strict";
    var EN = (document.documentElement.lang || "").toLowerCase().indexOf("en") === 0;
    function t(zh, en) { return EN ? en : zh; }
    function $(id) { return document.getElementById(id); }
    function esc(s) {
      return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
        return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
      });
    }
    function csrfToken() {
      var m = document.cookie.match(/(?:^|;\s*)csrf_token=([^;]+)/);
      return m ? decodeURIComponent(m[1]) : "";
    }
    async function api(url, opts) {
      opts = opts || {};
      var headers = Object.assign({ Accept: "application/json" }, opts.headers || {});
      var method = (opts.method || "GET").toUpperCase();
      if (method !== "GET" && method !== "HEAD") {
        var tok = csrfToken();          // 同源 POST 中间件走 Origin 放行；带上 token 更稳
        if (tok) headers["X-CSRF-Token"] = tok;
      }
      var res = await fetch(url, Object.assign(
        { credentials: "same-origin" }, opts, { headers: headers }));
      var data = {};
      try { data = await res.json(); } catch (e) { data = {}; }
      return { ok: res.ok, status: res.status, data: data };
    }

    var _jobPoll = null;
    var _extractGroupsCache = {};   // account_id -> [{id,title,members}] | null（发起区群下拉缓存；null=拉过但失败）
    var _egMembers = {};            // group_id -> members_count（并集口径，取最大）
    var _egCoverage = {};           // group_id -> [account_ids]（所选号里谁在这个群）
    var _acctName = {};             // account_id -> 展示名（self_name||label||id）
    var _jobRate = {};              // job_id -> {pulled, ts}（相邻轮询算速率估 ETA）

    function avatarColor(seed) {
      var s = String(seed || ""), h = 0;
      for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) & 0xffffff;
      return "hsl(" + (h % 360) + ",42%,45%)";
    }
    function initial(name) {
      var s = String(name || "").trim();
      return s ? s.charAt(0).toUpperCase() : "#";
    }
    function scoreChip(s) {
      if (s == null || s === "") return "";
      var cls = s >= 80 ? "hi" : (s >= 60 ? "mid" : "lo");
      return '<span class="sc ' + cls + '">' + s + "</span>";
    }
    function fmtDur(sec) {
      sec = Math.max(0, Math.round(sec));
      if (sec < 60) return sec + "s";
      var m = Math.floor(sec / 60), s = sec % 60;
      if (m < 60) return m + "m" + (s ? " " + s + "s" : "");
      var h = Math.floor(m / 60); m = m % 60;
      return h + "h" + (m ? " " + m + "m" : "");
    }

    function setText() {
      $("t-title").textContent = t("Telegram 群成员提取", "Telegram group member extraction");
      $("t-sub").textContent = t(
        "入库和开口分开。提取只把人放进库；开口在第④步，每号每天 5–10 人，逐条确认才发。",
        "Pulling people in and opening a chat are separate. Extraction only fills the library; step 4 sends 5-10 openers a day per account, one confirmed line at a time.");
      $("t-extract").textContent = t("① 发起提取", "① Start extraction");
      $("t-accts-l").textContent = t("选择用哪些号拉（仅显示在线的 Telegram 号；多选=多号并行、各拉不同批次）",
        "Pick accounts (online Telegram only; multi-select = parallel, disjoint batches)");
      $("t-group-l").textContent = t("目标群（选号后自动列出）", "Target group (auto-listed after picking accounts)");
      $("gm-eg-refresh").title = t("刷新群列表", "Refresh groups");
      $("gm-group-adv-toggle").textContent = t("高级：手输群 id / @用户名", "Advanced: manual id / @username");
      $("t-group-manual-l").textContent = t("手输群", "Manual group");
      $("t-filter-l").textContent = t("过滤器", "Filter");
      $("t-cap-l").textContent = t("每号每日上限", "Daily cap / account");
      $("gm-start").textContent = t("🧲 发起提取", "🧲 Start");
      $("t-jobs").textContent = t("② 提取任务", "② Extraction jobs");
      $("gm-jobs-empty").textContent = t("暂无任务", "No jobs yet");
      $("t-members").textContent = t("③ 成员库", "③ Member DB");
      $("t-mgroup-l").textContent = t("群", "Group");
      $("gm-refresh").textContent = t("刷新", "Refresh");
      $("gm-export").textContent = t("导出 CSV", "Export CSV");
      $("gm-mq").placeholder = t("搜名字/用户名", "search name/username");
      $("th-user").textContent = "user_id";
      $("th-name").textContent = t("名字", "Name");
      $("th-score").textContent = t("可聊度", "Score");
      $("th-spoke").textContent = t("发言", "Spoke");
      $("th-admin").textContent = t("管理员", "Admin");
      $("th-src").textContent = t("来源号", "By account");
      $("th-state").textContent = t("开口", "Outreach");
      $("t-outreach").textContent = t("④ 今日开口", "④ Today's openers");
      $("t-outreach-l").textContent = t(
        "只用「当时拉到这个人的那个号」发第一条私聊。生成队列 → AI 按这个号的人设和目标拟一句开场（可改）→ 批准。「批准后自动发」由后台在时段内每 25–90 分钟随机发一条；「手动」则逐条点发。新号从每天 3 条爬坡，也占这个号的总发送额度。对方回了交给收件箱，对方说别发了就全线不再碰。",
        "The account that captured the person sends the first private line. Build the queue, let AI draft one opener per person from this account's persona and goal (editable), then approve. In 'approve then auto-send' the scheduler sends one every 25-90 min inside the window; 'manual' sends on click. New accounts ramp from 3 a day and each send counts toward the account's overall cap. Replies go to the inbox; a 'stop messaging me' blocks that person everywhere.");
      $("t-out-acct-l").textContent = t("用哪个号", "Account");
      $("t-out-mode-l").textContent = t("开口方式", "Mode");
      var mo2 = $("gm-out-mode").options;
      mo2[0].textContent = t("手动：逐条点发", "Manual: send on click");
      mo2[1].textContent = t("批准后自动发", "Approve, then auto-send");
      mo2[2].textContent = t("全自动（排队+拟稿+发）", "Fully automatic");
      $("gm-out-queue").textContent = t("生成今日队列", "Build today's queue");
      $("gm-out-compose").textContent = t("AI 拟稿", "AI draft");
      $("gm-out-approve-all").textContent = t("一键批准今日队列", "Approve whole queue");
      $("gm-out-stop").textContent = t("停止这个号", "Stop this account");
      $("gm-out-resume").textContent = t("恢复开口", "Resume");
      $("t-out-hours-l").textContent = t("时段", "Window");
      $("t-out-cap-l").textContent = t("每天最多", "Daily max");
      $("gm-out-save").textContent = t("保存", "Save");
      $("gm-out-stats-btn").textContent = t("回复率 / 漏斗", "Reply rate / funnel");
      var sc = $("gm-out-stats-scope").options;
      sc[0].textContent = t("只看这个号", "This account");
      sc[1].textContent = t("全部号", "All accounts");
      var so = $("gm-msort").options;
      so[0].textContent = t("可聊度优先", "Score first");
      so[1].textContent = t("近发言优先", "Recent first");
      var fo = $("gm-filter").options;
      fo[0].textContent = t("发过言 · 非管理员（默认）", "Active · non-admin (default)");
      fo[1].textContent = t("发过言", "Active (spoke)");
      fo[2].textContent = t("全部成员", "All members");
      var mo = $("gm-monly").options;
      mo[0].textContent = t("发言非管理员", "Active non-admin");
      mo[1].textContent = t("发过言", "Spoke");
      mo[2].textContent = t("全部", "All");
      mo[3].textContent = t("管理员", "Admins");
    }

    async function loadAccounts() {
      var box = $("gm-accts");
      var r = await api("/api/accounts");
      var list = (r.data && r.data.accounts) || [];
      var tg = list.filter(function (a) {
        return a.platform === "telegram" && (a.status === "online" || a.running);
      });
      if (!tg.length) {
        box.innerHTML = '<span class="empty">' +
          t("没有在线的 Telegram 号", "No online Telegram accounts") + "</span>";
        if ($("gm-out-stats")) {
          $("gm-out-stats").textContent = t("没有在线的 Telegram 号", "No online Telegram accounts");
        }
        return;
      }
      _acctName = {};
      box.innerHTML = tg.map(function (a) {
        var id = esc(a.account_id);
        var nm = a.self_name || a.label || a.account_id;
        _acctName[a.account_id] = nm;
        var un = a.self_username ? "@" + a.self_username : "";
        var av = a.self_avatar
          ? '<img class="gm-av" src="' + esc(a.self_avatar) + '" alt="" />'
          : '<span class="gm-av" style="background:' + avatarColor(a.account_id) + '">' +
            esc(initial(nm)) + "</span>";
        return '<label class="gm-acct-card">' +
          '<input type="checkbox" class="gm-acct" value="' + id + '" />' + av +
          '<span class="gm-acct-meta"><span class="gm-acct-nm">' + esc(nm) + "</span>" +
          (un ? '<span class="gm-acct-un">' + esc(un) + "</span>" : "") +
          '<span class="gm-acct-q" data-q="' + id + '"></span></span>' +
          '<span class="gm-dot" title="online"></span></label>';
      }).join("");
      Array.prototype.slice.call(box.querySelectorAll(".gm-acct")).forEach(function (c) {
        c.addEventListener("change", function () {
          var card = c.closest(".gm-acct-card");
          if (card) card.classList.toggle("sel", c.checked);
          onAccountsChanged();
        });
      });
      loadAcctQuotas(tg);
      var osel = $("gm-out-acct");
      if (osel) {
        var prev = osel.value;
        osel.innerHTML = tg.map(function (a) {
          var nm = a.self_name || a.label || a.account_id;
          return '<option value="' + esc(a.account_id) + '">' + esc(nm) + "</option>";
        }).join("");
        if (prev) osel.value = prev;
        loadOutreach();

    // 每号今日配额余量（"今日 used/cap"）填进卡片 chip；满额标红。未开启/失败静默跳过。
    async function loadAcctQuotas(list) {
      var chips = {};
      Array.prototype.slice.call(document.querySelectorAll(".gm-acct-q"))
        .forEach(function (el) { chips[el.getAttribute("data-q")] = el; });
      var sumUsed = 0, sumCap = 0, got = 0;
      await Promise.all(list.map(function (a) {
        return api("/api/tg-members/quota?account_id=" + encodeURIComponent(a.account_id))
          .then(function (r) {
            if (!r.ok) return;
            var used = r.data.used_today || 0, cap = r.data.cap || 0;
            sumUsed += used; sumCap += cap; got++;
            var chip = chips[a.account_id];
            if (!chip) return;
            var pctq = cap > 0 ? Math.min(100, Math.round(used / cap * 100)) : 0;
            var full = cap && used >= cap;
            chip.innerHTML = '<span class="qbar"><i style="width:' + pctq + '%' +
              (full ? ";background:var(--danger)" : "") + '"></i></span>' +
              t("入库 ", "pulled ") + used + "/" + cap;
            if (full) chip.style.color = "var(--danger)";
          }).catch(function () {});
      }));
      var tot = $("gm-accts-total");
      if (tot) {
        if (got && sumCap > 0) {
          var tp = Math.min(100, Math.round(sumUsed / sumCap * 100));
          tot.textContent = t("全机群今日入库 ", "fleet pulled today ") + sumUsed + "/" + sumCap + " (" + tp + "%)";
        } else { tot.textContent = ""; }
      }
    }

    function selectedAccounts() {
      return Array.prototype.slice.call(document.querySelectorAll(".gm-acct:checked"))
        .map(function (c) { return c.value; });
    }

    // 选号变化 → 并行列出「所有所选号」的群，合并成并集填进下拉；记录每群被哪些号覆盖。
    async function onAccountsChanged() {
      var accts = selectedAccounts();
      var sel = $("gm-group-sel");
      $("gm-group-note").textContent = "";
      if (!accts.length) {
        sel.innerHTML = '<option value="">' +
          t("先选账号，自动列出其群", "pick account(s) to list groups") + "</option>";
        return;
      }
      sel.innerHTML = '<option value="">' + t("加载群列表…", "loading groups…") + "</option>";
      var need = accts.filter(function (a) { return _extractGroupsCache[a] === undefined; });
      if (need.length) {
        await Promise.all(need.map(function (a) {
          return api("/api/tg-members/account-groups?account_id=" + encodeURIComponent(a))
            .then(function (r) { _extractGroupsCache[a] = r.ok ? (r.data.groups || []) : null; })
            .catch(function () { _extractGroupsCache[a] = null; });
        }));
      }
      var union = {}, failed = [];
      accts.forEach(function (a) {
        var gs = _extractGroupsCache[a];
        if (gs == null) { failed.push(a); return; }
        gs.forEach(function (g) {
          var u = union[g.id] || (union[g.id] = { title: g.title || g.id, members: 0, accts: [] });
          if (g.title) u.title = g.title;
          if (g.members && g.members > u.members) u.members = g.members;
          u.accts.push(a);
        });
      });
      var ids = Object.keys(union);
      _egMembers = {}; _egCoverage = {};
      if (!ids.length) {
        sel.innerHTML = '<option value="">' + (failed.length
          ? t("所选号都无法列群，用下方「手输」", "can't list groups; use manual below")
          : t("所选号没有群", "no groups for selected accounts")) + "</option>";
        return;
      }
      var total = accts.length;
      ids.sort(function (a, b) {
        var d = union[b].accts.length - union[a].accts.length;
        return d !== 0 ? d : (union[b].members - union[a].members);
      });
      sel.innerHTML = '<option value="">' + t("选择群…", "select a group…") + "</option>" +
        ids.map(function (gid) {
          var u = union[gid];
          _egMembers[gid] = u.members;
          _egCoverage[gid] = u.accts.slice();
          var cov = (u.accts.length < total)
            ? " · " + t("覆盖 ", "cov ") + u.accts.length + "/" + total : "";
          return '<option value="' + esc(gid) + '">' + esc(u.title) +
            (u.members ? " (" + u.members + ")" : "") + cov + "</option>";
        }).join("");
      if (failed.length) {
        $("gm-group-note").textContent = t("注：", "Note: ") + failed.length +
          t(" 个号无法列群（离线？），未计入。", " account(s) couldn't list groups (offline?), excluded.");
      }
    }

    function acctName(id) { return _acctName[id] || id; }

    function _updateGroupNote() {
      var gid = $("gm-group-sel").value;
      if (!gid) { $("gm-group-note").textContent = ""; return; }
      var n = _egMembers[gid], cov = _egCoverage[gid] || [];
      var accts = selectedAccounts();
      var inSet = {};
      cov.forEach(function (a) { inSet[a] = 1; });
      var notIn = accts.filter(function (a) { return !inSet[a]; });
      var s = "";
      if (n) s += t("该群约 ", "~") + n + t(" 人 · ", " members · ");
      s += t("所选 ", "") + accts.length + t(" 号中 ", " picked, ") +
        cov.length + t(" 个在此群", " in this group");
      if (notIn.length) {
        s += t("；不在的会空拉：", "; not in (pull nothing): ") + notIn.map(acctName).join("、");
      }
      $("gm-group-note").textContent = s;
    }

    async function startExtract() {
      var accounts = selectedAccounts();
      var manualEl = $("gm-group-manual");
      var manual = (!$("gm-group-adv").hidden && manualEl) ? manualEl.value.trim() : "";
      var group = manual || $("gm-group-sel").value;
      var filter = $("gm-filter").value;
      var cap = parseInt($("gm-cap").value, 10) || 200;
      var msg = $("gm-start-msg");
      if (!accounts.length || !group) {
        msg.textContent = t("请先选号并选群（或用高级手输）", "Pick account(s) and a group (or manual id)");
        return;
      }
      $("gm-start").disabled = true;
      msg.textContent = t("发起中…", "Starting…");
      var r = await api("/api/tg-members/jobs", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ account_ids: accounts, group: group, filter: filter,
                               daily_cap_per_account: cap })
      });
      $("gm-start").disabled = false;
      if (!r.ok) {
        msg.textContent = t("失败：", "Failed: ") + esc((r.data && r.data.detail) || r.status);
        return;
      }
      var skipped = (r.data.skipped || []);
      msg.textContent = t("已发起 ", "Started ") + (r.data.jobs || []).length +
        t(" 个任务（分片 ", " job(s) (shards ") + (r.data.shards || 1) + "）" +
        (skipped.length ? t("；跳过离线号 ", "; skipped offline ") + skipped.join(",") : "");
      loadJobs();
    }

    function jobStatusPill(st) {
      var cls = st === "done" ? "done" : (st === "error" ? "err" : "run");
      return '<span class="pill ' + cls + '">' + esc(st) + "</span>";
    }

    async function loadJobs() {
      var box = $("gm-jobs");
      var r = await api("/api/tg-members/jobs?limit=40");
      var jobs = (r.data && r.data.jobs) || [];
      if (!jobs.length) {
        box.innerHTML = '<div class="empty">' + t("暂无任务", "No jobs yet") + "</div>";
        return;
      }
      box.innerHTML = jobs.map(function (j) {
        var acct = (j.account_ids || []).join(",");
        var running = j.status === "running";
        var cap = j.daily_cap_per_account || 0;
        var pulled = j.pulled_total || 0;
        var pct = cap > 0 ? Math.min(100, Math.round(pulled / cap * 100)) : 0;
        var jcls = j.status === "done" ? " jdone" : (j.status === "error" ? " jerr" : "");
        var bar = cap > 0 ? '<div class="jbar"><i style="width:' + pct + '%"></i></div>' : "";
        // 客户端估算：相邻两次轮询的入库增量算速率 → 剩余配额 ÷ 速率 = ETA；停滞且有限速 → 等待提示
        var etaTxt = "";
        var prev = _jobRate[j.job_id], now = Date.now();
        if (running) {
          if (prev && pulled > prev.pulled && now > prev.ts) {
            var rate = (pulled - prev.pulled) / ((now - prev.ts) / 1000);
            if (rate > 0 && cap > pulled) etaTxt = " · " + t("约剩 ", "~") + fmtDur((cap - pulled) / rate);
          } else if (prev && pulled === prev.pulled && j.floodwaits) {
            etaTxt = ' · <span style="color:var(--warn)">' +
              t("⏳ 限速等待中", "⏳ waiting (floodwait)") + "</span>";
          }
          _jobRate[j.job_id] = { pulled: pulled, ts: now };
        } else { delete _jobRate[j.job_id]; }
        return '<div class="job' + jcls + '"><div class="jhd">' +
          "<div><b>" + esc(j.group_title || j.group_id) + "</b> · " + esc(acct) +
          " · shard " + (j.shard_index + 1) + "/" + j.num_shards + "</div>" +
          "<div>" + jobStatusPill(j.status) +
          (running ? ' <button data-stop="' + esc(j.job_id) + '">' +
            t("停止", "Stop") + "</button>" : "") +
          (j.group_id ? ' <button data-view="' + esc(j.group_id) + '">' +
            t("看成员", "Members") + "</button>" : "") + "</div></div>" + bar +
          '<div class="msg">' + t("已入库 ", "pulled ") + pulled +
          (cap > 0 ? "/" + cap + " (" + pct + "%)" : "") + etaTxt +
          t(" · 去重 ", " · dedup ") + (j.dedup_skipped || 0) +
          t(" · 剔管理员 ", " · admins ") + (j.admins_excluded || 0) +
          (j.floodwaits ? t(" · 限速 ", " · floodwait ") + j.floodwaits : "") +
          (j.last_error ? ' · <span style="color:var(--danger)">' + esc(j.last_error) + "</span>" : "") +
          "</div></div>";
      }).join("");
      Array.prototype.slice.call(box.querySelectorAll("button[data-stop]")).forEach(function (b) {
        b.addEventListener("click", function () { stopJob(b.getAttribute("data-stop")); });
      });
      Array.prototype.slice.call(box.querySelectorAll("button[data-view]")).forEach(function (b) {
        b.addEventListener("click", function () { jumpToMembers(b.getAttribute("data-view")); });
      });
      if (jobs.some(function (j) { return j.status === "running"; })) {
        if (!_jobPoll) _jobPoll = setInterval(loadJobs, 3000);
      } else if (_jobPoll) { clearInterval(_jobPoll); _jobPoll = null; }
    }

    async function stopJob(jid) {
      await api("/api/tg-members/jobs/" + encodeURIComponent(jid) + "/stop", { method: "POST" });
      loadJobs();
    }

    async function loadGroups(preferGid) {
      var sel = $("gm-mgroup");
      var prev = preferGid || sel.value;   // 保留当前选中（轮询/直达刷新不打断查看）
      var r = await api("/api/tg-members/groups");
      var groups = (r.data && r.data.groups) || [];
      sel.innerHTML = groups.map(function (g) {
        return '<option value="' + esc(g.group_id) + '">' +
          esc(g.group_title || g.group_id) + " (" + g.total +
          (g.spoke ? " · " + g.spoke + t(" 可聊", " active") : "") + ")</option>";
      }).join("");
      if (prev) {
        var has = Array.prototype.some.call(sel.options, function (o) { return o.value === prev; });
        if (has) sel.value = prev;
      }
      if (sel.value) loadMembers();
      else if (groups.length) { sel.selectedIndex = 0; loadMembers(); }
    }

    // 从任务卡「看成员」直达：确保群在下拉里（缺则刷新）→ 选中 → 加载 → 滚到成员区。
    async function jumpToMembers(gid) {
      if (!gid) return;
      var sel = $("gm-mgroup");
      var has = Array.prototype.some.call(sel.options, function (o) { return o.value === gid; });
      if (!has) await loadGroups(gid);
      sel.value = gid;
      // 直达自带「最该聊的人」视角：只看发言非管理员 + 可聊度优先；清掉残留搜索词免藏结果
      $("gm-monly").value = "spoke_no_admin";
      $("gm-msort").value = "score";
      $("gm-mq").value = "";
      var d = await loadMembers();
      // 兜底：该群有成员但「发言非管理员」为空（多为按「全部」提取的群）→ 自动切「全部」再看一次
      if (d && !((d.items || []).length) && (d.total || 0) > 0) {
        $("gm-monly").value = "";
        await loadMembers();
      }
      var sec = $("t-members");
      if (sec && sec.scrollIntoView) sec.scrollIntoView({ behavior: "smooth", block: "start" });
    }

    async function loadMembers() {
      var gid = $("gm-mgroup").value;
      var body = $("gm-mbody");
      var stats = $("gm-mstats");
      if (!gid) { body.innerHTML = ""; stats.textContent = ""; return; }
      var only = $("gm-monly").value;
      var q = $("gm-mq").value.trim();
      var url = "/api/tg-members/members?group_id=" + encodeURIComponent(gid) +
        "&only=" + encodeURIComponent(only) + "&q=" + encodeURIComponent(q) +
        "&sort=" + encodeURIComponent($("gm-msort").value) + "&limit=500";
      var r = await api(url);
      var items = (r.data && r.data.items) || [];
      stats.textContent = t("总 ", "total ") + (r.data.total || 0) +
        t(" · 可聊 ", " · active ") + (r.data.spoke_no_admin || 0) +
        t("（显示 ", " (showing ") + items.length + "）";
      body.innerHTML = items.map(function (m) {
        var name = (m.first_name || "") + (m.last_name ? " " + m.last_name : "");
        return "<tr><td>" + esc(m.user_id) + "</td><td>" + esc(name) +
          (m.username ? ' <span style="color:var(--dim)">@' + esc(m.username) + "</span>" : "") +
          "</td><td>" + scoreChip(m.score) + "</td><td>" +
          (m.spoke ? "✓" : "") + "</td><td>" +
          (m.is_admin ? '<span class="pill adm">admin</span>' : "") + "</td><td>" +
          esc(m.source_account_id) + "</td><td>" + esc(outreachLabel(m.outreach_state)) +
          "</td></tr>";
      }).join("");
      return r.data;
    }

    function outreachLabel(state) {
      var map = {
        none: t("未开口", "not sent"),
        queued: t("排队", "queued"),
        approved: t("已批准", "approved"),
        sending: t("发送中", "sending"),
        sent: t("已发", "sent"),
        replied: t("已回", "replied"),
        blocked: t("不可达", "unreachable"),
        skipped: t("跳过", "skipped"),
        closed: t("已封存", "closed")
      };
      return map[state] || (state || "");
    }

    var _outCache = {};

    function loadOutreach() {
      var acct = ($("gm-out-acct") && $("gm-out-acct").value) || "";
      var box = $("gm-out-list");
      var stats = $("gm-out-stats");
      if (!acct) {
        if (stats) stats.textContent = t("没有在线号", "No online account");
        if (box) box.innerHTML = "";
        return Promise.resolve();
      }
      return api("/api/tg-members/outreach/preview?account_id=" + encodeURIComponent(acct))
        .then(function (r) {
          if (!r.ok) {
            stats.textContent = (r.data && r.data.detail) || String(r.status);
            box.innerHTML = "";
            return;
          }
          var d = r.data || {};
          _outCache = {};
          var hold = d.hold ? (" · " + (d.hold === "paused"
            ? t("已急停", "paused") : t("风控冷却中", "flood hold"))) : "";
          var capTxt = (d.used_today || 0) + "/" + (d.effective_cap || d.cap || 0);
          if (d.warming_up) {
            capTxt += t("（新号爬坡", " (warming up") +
              (d.age_days != null ? t("，第 ", ", day ") + Math.floor(d.age_days) + t(" 天", "") : "") +
              t("，满 14 天到 ", ", reaches ") + (d.cap || 0) + t("）", " after 14 days)");
          }
          var hours = d.hours || {};
          var hoursTxt = t(" · 时段 ", " · window ") + (hours.start || 0) + ":00–" + (hours.end || 0) + ":00" +
            (hours.ok === false ? t("（现在不发）", " (closed now)") : "");
          var g = d.gate;
          var gateTxt = "";
          if (g) {
            gateTxt = t(" · 总发送 ", " · total sends ") + g.used + "/" + g.cap +
              (g.blocked ? t("（闸门已拦）", " (gate blocked)") : "");
          }
          stats.textContent = t("开口 ", "openers ") + capTxt +
            t(" · 排队 ", " · queued ") + (d.queued || 0) +
            t(" · 还能排 ", " · room ") + (d.remaining || 0) + hold + hoursTxt + gateTxt +
            ((d.unhashed > 0) ? t(" · 有 ", " · ") + d.unhashed +
              t(" 人还没有私聊凭证，用这个号再提取一次", " people have no chat credential; extract again with this account") : "");
          renderOutreachMeta(d);
          renderReplied(d);
          renderFollowups(d);
          var rows = (d.queue || []).concat(d.candidates || []);
          if (!rows.length) {
            box.innerHTML = '<div class="empty">' +
              t("今天没有可开口的人。先入库，并且提取时要由这个号拿到对方。",
                "Nobody to open today. Extract first, with this account capturing the person.") +
              "</div>";
            return;
          }
          box.innerHTML = rows.map(renderOpenerCard).join("");
          bindOpenerCards(box);
        }).catch(function () {
          stats.textContent = t("开口状态读取失败", "Could not load outreach");
        });
    }

    var _settingsDirty = false;

    // 模式 / 人设+目标 / 今日汇总 / 时段+条数
    function renderOutreachMeta(d) {
      var mode = $("gm-out-mode");
      if (mode && d.mode) mode.value = d.mode;
      // 全自动门槛：不够格就灰掉选项并写明原因（后端同样拒绝，这里只是别让人白点）
      var ae = d.auto_eligible || {};
      var autoOpt = mode ? mode.options[2] : null;
      if (autoOpt) {
        var why = { age: t("号未满 14 天", "account under 14 days"),
                    flood: t("近 7 天撞过风控", "flood limit in last 7 days"),
                    reply_rate: t("近 7 天回复率低于地板", "7-day reply rate below floor") };
        autoOpt.disabled = ae.ok === false && d.mode !== "auto";
        autoOpt.textContent = t("全自动（排队+拟稿+发）", "Fully automatic") +
          (ae.ok === false ? t(" · 不够格：", " · not eligible: ") + (why[ae.reason] || ae.reason) : "");
      }
      var p = d.persona || {}, g = d.goal || {};
      var pTxt = p.name ? t("人设：", "Persona: ") + p.name : t("人设：账号默认", "Persona: account default");
      var gTxt = g.name ? t(" · 目标：", " · Goal: ") + g.name : t(" · 目标：未设默认（回复后再挂）", " · Goal: none yet (attached after first reply)");
      $("gm-out-persona").textContent = pTxt + gTxt;
      var s = d.summary || {};
      var errs = s.errors || {};
      var reasonMap = {
        privacy: t("隐私设置", "privacy"), deactivated: t("账号注销", "deactivated"),
        peer_invalid: t("联系不上", "unreachable"), stop_contact: t("对方拒绝", "asked to stop"),
        operator_skip: t("人工跳过", "skipped by you"), stale_sending: t("发送超时", "send timed out"),
        opener_rejected: t("文案被拦", "opener rejected"), flood: t("风控", "flood"),
        inbound_first: t("对方先来找", "they messaged first")
      };
      var reasons = Object.keys(errs).filter(function (k) { return k && errs[k]; }).map(function (k) {
        return (reasonMap[k] || k) + " " + errs[k];
      });
      $("gm-out-summary").textContent = t("今日：发了 ", "Today: sent ") + (s.sent || 0) +
        t(" · 回了 ", " · replied ") + (s.replied || 0) +
        t(" · 跟进 ", " · follow-ups ") + (s.followups || 0) +
        t(" · 不可达 ", " · unreachable ") + (s.blocked || 0) +
        t(" · 跳过 ", " · skipped ") + (s.skipped || 0) +
        t(" · 封存 ", " · closed ") + (s.closed || 0) +
        t(" · 已批准待发 ", " · approved pending ") + (s.approved || 0) +
        (reasons.length ? t("（", " (") + reasons.join(t("，", ", ")) + t("）", ")") : "");
      var st = d.settings || {};
      if (!_settingsDirty) {
        if (st.hours) { $("gm-out-h0").value = st.hours[0]; $("gm-out-h1").value = st.hours[1]; }

    function bindOpenerCards(box) {
      function each(sel, fn) { Array.prototype.slice.call(box.querySelectorAll(sel)).forEach(fn); }

    function ago(ts) {
      var s = Math.max(0, Date.now() / 1000 - ts);
      if (s < 3600) return t(Math.floor(s / 60) + " 分钟前", Math.floor(s / 60) + " min ago");
      if (s < 86400) return t(Math.floor(s / 3600) + " 小时前", Math.floor(s / 3600) + " h ago");
      return t(Math.floor(s / 86400) + " 天前", Math.floor(s / 86400) + " d ago");
    }

    function cardText(key) {
      var ta = document.querySelector('textarea[data-out-text="' + key.replace(/"/g, '\\"') + '"]');

    }

    async function composeAll(force) {
      var acct = $("gm-out-acct").value;
      if (!acct) return;
      $("gm-out-stats").textContent = t("AI 拟稿中…", "Drafting…");
      var r = await postJSON("/api/tg-members/outreach/compose", { account_id: acct, force: !!force });

        $("gm-out-stats").textContent = (r.data && r.data.detail) || String(r.status);
      } else {
        var d = r.data || {};
        $("gm-out-stats").textContent = t("拟好 ", "Drafted ") + (d.composed || 0) +

    async function redraftOne(key) {
      var m = _outCache[key];
      var acct = $("gm-out-acct").value;
      if (!m || !acct) return;
      var reset = false;
      if (m.opener_source === "manual") {

        if (!reset) return;

      var r = await postJSON("/api/tg-members/outreach/compose", {
        account_id: acct, force: true, reset_manual: reset,
        items: [{ group_id: m.group_id, user_id: m.user_id }]

    async function approveOne(key) {

        ? t("已批准。手动模式下还要点「现在发这一条」。", "Approved. In manual mode click Send now.")
        : t("已批准，后台会在时段内发出。", "Approved; the scheduler sends it inside the window.");

    async function approveAll() {
      var acct = $("gm-out-acct").value;
      if (!acct) return;
      // 先把卡片里改过的文字落下去，再整队批准
      var items = [];
      Object.keys(_outCache).forEach(function (key) {
        var m = _outCache[key];
        if (m.outreach_state !== "queued") return;
        var text = cardText(key);
        if (text && text !== (m.opener_text || "")) items.push({ group_id: m.group_id, user_id: m.user_id, text: text });
      });
      if (items.length) await postJSON("/api/tg-members/outreach/approve", { account_id: acct, items: items });
      var r = await postJSON("/api/tg-members/outreach/approve", { account_id: acct });
      if (!r.ok) $("gm-out-stats").textContent = (r.data && r.data.detail) || String(r.status);
      else $("gm-out-stats").textContent = t("已批准 ", "Approved ") + ((r.data && r.data.approved) || 0) + (items.length ? " + " + items.length : "") +
        (($("gm-out-mode").value === "manual") ? t(" 条。手动模式下仍需逐条点发。", ". Manual mode: still send one by one.") : t(" 条，后台会在时段内每 25–90 分钟发一条。", ". The scheduler sends one every 25-90 min inside the window."));
      loadOutreach();
    }

    // 今日回音：对方回了什么、点进工作台接着聊（之后归回复链，这页不再管）
    // 第二跳状态：回了之后我方接没接上（AI 自动回 / 坐席 / 手机都算）
    function answeredPill(m, stalledHours) {
      var lastOut = Math.max(m.last_out_at || 0, m.answered_at || 0);
      var rebroken = m.answered_at && (m.last_in_at || 0) > lastOut;
      if (m.answered_at && !rebroken) return '<span class="pill ok">' + t("已接上", "answered") + "</span>";
      var since = rebroken ? m.last_in_at : m.replied_at;
      var h = since ? (Date.now() / 1000 - since) / 3600 : 0;
      if (h >= (stalledHours || 48)) {
        return '<span class="pill warn">' + (rebroken ? t("接上后又断了 ", "went quiet again ") : t("没接上 ", "unanswered ")) +
          Math.floor(h) + "h</span>";
      }
      return '<span class="pill">' + t("待我方回", "awaiting our reply") + "</span>";
    }

    function replyCard(m, stalledHours, cls) {
      var name = (m.first_name || "") + (m.last_name ? " " + m.last_name : "");
      var href = "/workspace?conv=" + encodeURIComponent(m.conversation_id || "");
      var first = m.outreach_error === "inbound_first";
      return '<div class="ocard ' + cls + '"><div class="ohd"><div>' +
        (m.conversation_id

          : "<b>" + esc(name || m.user_id) + "</b> ") +

        (first ? t("对方先来找", "they messaged first") : t("回了", "replied")) + "</span> " +
        (m.replied_at ? '<span class="pill">' + esc(ago(m.replied_at)) + "</span> " : "") +
        answeredPill(m, stalledHours) + "</div></div>" +
        (first ? "" : '<div class="osaid">' + t("你发的：", "You sent: ") + "<q>" + esc(m.opener_text || "") + "</q></div>") +
        '<div class="osaid">' + t("TA 回：", "They replied: ") + "<q>" + esc(m.reply_text || "…") + "</q></div></div>";
    }

    function renderReplied(d) {

          "</div>" + stalled.map(function (m) { return replyCard(m, sh, "replied stalled"); }).join("");

          "</div>" + rows.map(function (m) { return replyCard(m, sh, "replied"); }).join("");

    function pct(v) { return v == null ? "–" : Math.round(v * 100) + "%"; }

    var VARIANT_LABEL = null;

      if (!VARIANT_LABEL) VARIANT_LABEL = {

    // 回复率热度：按样本量显示条长，按回复率上色（样本 <10 一律灰，别被小样本骗）
    function rateBar(r, max) {
      var w = Math.round(40 * (r.sent || 0) / max);
      var cls = (r.sent || 0) < 10 ? "" : (r.rate >= 0.15 ? " hot" : (r.rate >= 0.05 ? " warm" : " cold"));
      return ' <span class="bar' + cls + '" style="width:' + w + 'px"></span>';
    }

    function statsTable(title, rows, keyLabel, keyFmt) {
      if (!rows || !rows.length) return "";
      var max = Math.max.apply(null, rows.map(function (r) { return r.sent || 0; }).concat([1]));
      return '<div><h3>' + esc(title) + "</h3><table><thead><tr><th>" + esc(keyLabel) + "</th><th>" +
        t("发出", "sent") + "</th><th>" + t("回了", "replied") + "</th><th>" + t("回复率", "rate") + "</th></tr></thead><tbody>" +
        rows.map(function (r) {
          var k = keyFmt ? keyFmt(r.key) : (keyLabel === "h" ? (r.key + ":00") : r.key);
          return "<tr><td>" + esc(k) + "</td><td>" + (r.sent || 0) + rateBar(r, max) + "</td><td>" +
            (r.replied || 0) + "</td><td>" + pct(r.rate) + "</td></tr>";
        }).join("") + "</tbody></table></div>";
    }

    function durShort(sec) {
      if (sec == null) return "–";
      if (sec < 3600) return t(Math.round(sec / 60) + " 分钟", Math.round(sec / 60) + " min");
      if (sec < 86400) return t((sec / 3600).toFixed(1) + " 小时", (sec / 3600).toFixed(1) + " h");
      return t((sec / 86400).toFixed(1) + " 天", (sec / 86400).toFixed(1) + " d");

      var d = r.data || {};
      var f = d.funnel || {};
      var lat = d.reply_latency || {};
      var srcLabel = { ai: "AI", template: t("模板", "template"), manual: t("手改", "edited"), unknown: "?" };

      box.innerHTML =
        '<div class="funnel">' +
          "<span>" + t("入库 ", "members ") + "<b>" + (f.members || 0) + "</b></span><span class='arr'>→</span>" +

          "<span>" + t("发出 ", "sent ") + "<b>" + (f.sent || 0) + "</b></span><span class='arr'>→</span>" +
          "<span>" + t("回了 ", "replied ") + "<b>" + (f.replied || 0) + "</b> (" + pct(f.sent ? f.replied / f.sent : null) + ")</span><span class='arr'>→</span>" +
          "<span>" + t("接上了 ", "answered ") + "<b>" + (f.answered || 0) + "</b></span>" +
          '<span class="msg" style="margin-left:8px">' + t("封存 ", "closed ") + (f.closed || 0) + t(" · 不可达 ", " · unreachable ") + (f.blocked || 0) + t(" · 跳过 ", " · skipped ") + (f.skipped || 0) +
            ((f.inbound_first || 0) ? t(" · 对方先来找 ", " · they messaged first ") + f.inbound_first : "") + "</span>" +
        "</div>" +
        '<div class="msg">' + t("切片只算真正发出的（近 ", "Slices count real sends only (last ") + (d.days || days) + t(" 天）。样本小于 10 的行先别下结论。", " days). Rows under 10 sends are noise.") +
          (lat.n ? t(" · 首回时延：中位 ", " · first reply after: median ") + durShort(lat.median_sec) + " · P75 " + durShort(lat.p75_sec) + t("（", " (") + lat.n + t(" 人）", ")") : "") +
          "</div>" +
        '<div class="stats-grid">' +
          statsTable(t("按切入方式", "By opener angle"), d.by_variant, t("切入", "angle"), function (k) { return k === "-" ? t("模板/手写", "template/manual") : variantLabel(k); }) +
          statsTable(t("按文案来源", "By opener source"), bySrc, t("来源", "source")) +
          statsTable(t("按人设", "By persona"), d.by_persona, t("人设", "persona")) +
          statsTable(t("按发出小时", "By hour sent"), d.by_hour, "h") +
          (scope === "all" ? statsTable(t("按账号", "By account"), d.by_account, t("账号", "account")) : "") +
        "</div>" +
        ((d.recent_replies || []).length
          ? '<div class="msg" style="margin-top:10px"><b>' + t("最近回音", "Recent replies") + "</b></div>" +
            d.recent_replies.map(function (m) { return replyCard(m, 48, "replied"); }).join("")
          : "");
    }

    async function skipOne(key) {
      var m = _outCache[key];
      if (!m) return;
      var r = await postJSON("/api/tg-members/outreach/skip", {
        account_id: $("gm-out-acct").value, group_id: m.group_id, user_id: m.user_id
      });
      if (!r.ok) $("gm-out-stats").textContent = (r.data && r.data.detail) || String(r.status);
      loadOutreach();
    }

    async function changeMode() {
      var acct = $("gm-out-acct").value;
      var mode = $("gm-out-mode").value;
      if (!acct) return;
      if (mode === "auto" && !window.confirm(t(
        "全自动：这个号会自己排队、AI 拟稿、在时段内自动发，不再经你批准。所有额度/时段/风控闸门照旧。确定？",
        "Fully automatic: this account queues, drafts and sends on its own inside the window, without your approval. All caps/window/flood gates still apply. Continue?"))) {
        loadOutreach();
        return;
      }
      var r = await postJSON("/api/tg-members/outreach/mode", { account_id: acct, mode: mode });
      if (!r.ok) $("gm-out-stats").textContent = (r.data && r.data.detail) || String(r.status);
      loadOutreach();
    }

    async function saveSettings() {
      var h0 = parseInt($("gm-out-h0").value, 10), h1 = parseInt($("gm-out-h1").value, 10);
      var cap = parseInt($("gm-out-cap").value, 10);
      var body = {};
      if (!isNaN(h0) && !isNaN(h1)) body.hours = [h0, h1];
      if (!isNaN(cap)) body.daily_cap = cap;
      var r = await postJSON("/api/tg-members/outreach/settings", body);
      _settingsDirty = false;
      $("gm-out-save-note").textContent = r.ok
        ? t("已保存，对所有号即时生效", "Saved; applies to every account now")
        : ((r.data && r.data.detail) || String(r.status));
      loadOutreach();
    }

    async function buildOutreachQueue() {
      var acct = $("gm-out-acct").value;
      if (!acct) return;
      var r = await api("/api/tg-members/outreach/queue", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ account_id: acct })
      });
      loadMembers();
      await loadOutreach();
      var stats = $("gm-out-stats");
      if (!r.ok) stats.textContent = (r.data && r.data.detail) || String(r.status);
      else if (r.data && r.data.empty) stats.textContent = emptyPoolText(r.data.empty);
    }

    function emptyPoolText(e) {
      if (!e.pool) {
        return e.unhashed
          ? t("一个都没排进：这个号提的 " + e.unhashed + " 人没拿到私聊凭证，请用这个号重新提取一次再排。",
              "Nothing queued: none of the " + e.unhashed + " people this account extracted came with a DM credential. Re-extract with this account, then queue again.")
          : t("一个都没排进：这个号还没提取过任何人，先在第①步用这个号提取。",
              "Nothing queued: this account has not extracted anyone yet. Extract with it in step 1 first.");
      }
      return t("一个都没排进：这个号能私聊的 " + e.pool + " 人里，" + e.silent + " 人没在群里发过言（只对发过言的人开口），" +
               e.admin_or_bot + " 人是管理员或机器人，" + e.touched + " 人已经开过口。换个活跃的群、用默认过滤器「发过言」提取。",
               "Nothing queued: of the " + e.pool + " people this account can DM, " + e.silent + " never spoke in the group (we only open to people who spoke), " +
               e.admin_or_bot + " are admins or bots, " + e.touched + " were already contacted. Extract from a more active group with the default \"spoke\" filter.");
    }

    async function sendOne(key) {
      var m = _outCache[key];
      var acct = $("gm-out-acct").value;
      if (!m || !acct) return;
      var text = cardText(key);
      if (!text) { $("gm-out-stats").textContent = t("先写一句或点「AI 拟稿」", "Write a line or click AI draft first"); return; }
      if (!window.confirm(t("现在就用这个号发给 ", "Send now from this account to ") + (m.first_name || m.user_id) + "？\n\n" + text)) return;
      var r = await postJSON("/api/tg-members/outreach/release", {
        account_id: acct, group_id: m.group_id, user_id: m.user_id, text: text, confirm: true
      });
      var kind = (r.data && (r.data.detail || r.data.kind)) || "";
      $("gm-out-stats").textContent = outNote(kind) || outNote(r.data && r.data.kind) || kind || String(r.status);
      loadOutreach();
      loadMembers();
    }

    async function stopOutreach() {
      var acct = $("gm-out-acct").value || "*";
      await api("/api/tg-members/outreach/stop", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ account_id: acct })
      });
      loadOutreach();
    }

    async function resumeOutreach() {
      var acct = $("gm-out-acct").value || "*";
      await api("/api/tg-members/outreach/resume", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ account_id: acct })
      });
      loadOutreach();
    }

    function doExport() {
      var gid = $("gm-mgroup").value;
      if (!gid) return;
      window.open("/api/tg-members/members/export?group_id=" + encodeURIComponent(gid) +
        "&only=" + encodeURIComponent($("gm-monly").value), "_blank");
    }

    async function init() {
      setText();
      // 探一下功能状态（quota 端点：403=未开启；其它非 200=后端未就绪/维护中）
      var probe = await api("/api/tg-members/quota");
      if (!probe.ok) {
        var b = $("gm-disabled");
        b.hidden = false;
        if (probe.status === 403) {
          b.textContent = t(
            "群成员提取未开启：打开开发者工具，在「内部功能显隐」勾选「群成员提取」，然后刷新本页。",
            "Group member extraction is off. Open Developer Tools, tick Group member extraction under Internal feature visibility, then refresh.");
        } else {
          b.textContent = t(
            "群成员提取正在就绪（后端需一次重启加载最新组件），请稍后再试。",
            "Group member extraction is initializing (pending a service restart to load the latest build); please retry shortly.");
        }
      }
      $("gm-start").addEventListener("click", startExtract);
      $("gm-refresh").addEventListener("click", loadMembers);
      $("gm-export").addEventListener("click", doExport);
      $("gm-out-acct").addEventListener("change", loadOutreach);
      $("gm-out-mode").addEventListener("change", changeMode);
      $("gm-out-queue").addEventListener("click", buildOutreachQueue);
      $("gm-out-compose").addEventListener("click", function () { composeAll(false); });
      $("gm-out-approve-all").addEventListener("click", approveAll);
      $("gm-out-stop").addEventListener("click", stopOutreach);
      $("gm-out-resume").addEventListener("click", resumeOutreach);
      $("gm-out-save").addEventListener("click", saveSettings);
      $("gm-out-stats-btn").addEventListener("click", loadStats);
      $("gm-out-stats-days").addEventListener("change", function () { if (!$("gm-out-statsbox").hidden) loadStats(); });
      $("gm-out-stats-scope").addEventListener("change", function () { if (!$("gm-out-statsbox").hidden) loadStats(); });
      ["gm-out-h0", "gm-out-h1", "gm-out-cap"].forEach(function (id) {
        $(id).addEventListener("input", function () { _settingsDirty = true; });
      });
      $("gm-mgroup").addEventListener("change", loadMembers);
      $("gm-monly").addEventListener("change", loadMembers);
      $("gm-mq").addEventListener("keydown", function (e) { if (e.key === "Enter") loadMembers(); });
      $("gm-msort").addEventListener("change", loadMembers);
      $("gm-group-sel").addEventListener("change", _updateGroupNote);
      $("gm-eg-refresh").addEventListener("click", function () {
        selectedAccounts().forEach(function (a) { delete _extractGroupsCache[a]; });
        onAccountsChanged();
      });
      $("gm-group-adv-toggle").addEventListener("click", function (e) {
        e.preventDefault();
        var adv = $("gm-group-adv");
        adv.hidden = !adv.hidden;
      });
      loadAccounts();
      loadJobs();
      loadGroups();
    }

    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", init);
    } else { init(); }
  })();
  </script>
</body>
</html>
