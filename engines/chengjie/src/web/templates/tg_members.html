{% extends "base.html" %}
{% block title %}{{ (i18n or {}).get('gm_nav', '群成员提取') }}{% endblock %}
{% block page_title %}{{ (i18n or {}).get('gm_nav', '群成员提取') }}{% endblock %}
{% block head %}
  <style>
    /* 颜色跟后台令牌走。只在本页根上补本页用的别名，不改 :root，免得侧栏被带跑。 */
    .gm-page, .gm-page * { box-sizing: border-box; }
    .gm-page {
      --border: var(--bd, #e5e7eb);
      --text: var(--t, #1f2937);
      --dim: var(--t3, #6b7280);
      --accent: var(--p, #1e8cf2);
      --ok: var(--green, #0f9d75);
      --warn: var(--amber, #d97706);
      --danger: var(--red, #dc2626);
      color: var(--text);
      font: 14px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, "Microsoft Yahei", sans-serif;
    }
    .gm-page .wrap { max-width: 1080px; margin: 0 auto; padding: 4px 0 40px; }
    .gm-page h1 { display: none; }
    .gm-page .sub { color:var(--dim); font-size:12.5px; margin-bottom:16px; }
    .gm-page .card { background:var(--card); border:1px solid var(--border); border-radius:12px;
            padding:16px; margin-bottom:16px; overflow:visible; }
    .gm-page .card::before { display:none; }
    .gm-page .card:hover { transform:none; box-shadow:none; }
    .gm-page .card h2 { display:block; font-size:15px; margin:0 0 12px; padding:0;
            border-bottom:0; }
    .gm-page .row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:10px; }
    .gm-page label { color:var(--dim); font-size:12.5px; }
    .gm-page input, .gm-page select { font:inherit; padding:6px 9px; border:1px solid var(--border);
                    border-radius:8px; background:var(--card); color:var(--text);
                    width:auto; max-width:100%; }
    .gm-page input[type=text], .gm-page input[type=number] { min-width:200px; }
    .gm-page button { font:inherit; cursor:pointer; border:1px solid var(--border); background:var(--card);
             color:var(--text); border-radius:8px; padding:6px 12px; }
    .gm-page button:hover { border-color:var(--accent); }
    .gm-page button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
    .gm-page button[disabled] { opacity:.5; cursor:not-allowed; }
    .accts { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:10px; }
    .accts label { display:inline-flex; align-items:center; gap:6px; padding:5px 10px;
                   border:1px solid var(--border); border-radius:999px; color:var(--text); font-size:12.5px; }
    .accts label.off { opacity:.45; }
    /* 后台壳的 .msg 是带内边距的横幅（display:flex）。本页同名类只是小字说明，必须扳回来。 */
    .gm-page .msg { display:inline; padding:0; margin:0; border-radius:0; font-weight:400;
            font-size:12.5px; color:var(--dim); background:none; animation:none; gap:0; }
    .gm-page div.msg { display:block; margin-top:6px; }
    .gm-page .banner { display:block; background:#fef3c7; color:#92400e; border:1px solid #fcd34d;
              border-radius:10px; padding:10px 12px; margin-bottom:16px; font-size:13px; }
    /* 壳里 .banner{display:flex} 会盖过 hidden 属性，空横幅变成一条黄条。 */
    .gm-page [hidden] { display:none !important; }
    .gm-page table { width:100%; border-collapse:collapse; font-size:13px; }
    .gm-page th, .gm-page td { text-align:left; padding:7px 8px; border-bottom:1px solid var(--border);
            text-transform:none; letter-spacing:0; }
    .gm-page th { color:var(--dim); font-weight:600; font-size:12px; }
    .gm-page details.gm-fold { margin-bottom: 16px; }
    .gm-page details.gm-fold > summary { cursor:pointer; font-weight:700; padding:12px 16px;
      background:var(--card); border:1px solid var(--border); border-radius:12px; color:var(--text); }
    .pill { display:inline-block; padding:1px 8px; border-radius:999px; font-size:11.5px; }
    .pill.run { background:color-mix(in srgb, var(--bl-growth,#1e8cf2) 14%, transparent); color:var(--accent); }
    .pill.done { background:rgba(15,157,117,.14); color:var(--ok); }
    .pill.err { background:rgba(220,38,38,.14); color:var(--danger); }
    .pill.adm { background:rgba(217,119,6,.14); color:var(--warn); }
    .job { border:1px solid var(--border); border-radius:10px; padding:10px 12px; margin-bottom:8px; }
    .job .jhd { display:flex; justify-content:space-between; gap:8px; align-items:center; }
    .gm-page .empty { color:var(--dim); padding:8px 2px; text-align:left; }
    /* 接话 / 私聊开口：每人一张卡 */
    .ocard { border:1px solid var(--border); border-radius:10px; padding:10px 12px; margin-bottom:10px; }
    .ocard.approved { border-color:rgba(15,157,117,.5); }
    .ocard .ohd { display:flex; justify-content:space-between; gap:8px; align-items:center; flex-wrap:wrap; }
    .ocard .osaid { color:var(--dim); font-size:12.5px; margin:6px 0 4px; }
    .ocard .osaid q { font-style:italic; }
    .ocard textarea { width:100%; min-height:54px; font:inherit; padding:7px 9px; border:1px solid var(--border);
                      border-radius:8px; background:var(--card); color:var(--text); resize:vertical; }
    .ocard .oact { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-top:6px; }
    .ocard .ocount { color:var(--dim); font-size:11.5px; margin-left:auto; }
    .pill.ai { background:rgba(30,140,242,.14); color:var(--accent); }
    .pill.tpl { background:rgba(107,114,128,.16); color:var(--dim); }
    .pill.man { background:rgba(217,119,6,.14); color:var(--warn); }
    .pill.ok { background:rgba(15,157,117,.14); color:var(--ok); }
    .ocard.fu { border-style:dashed; }
    .ocard.replied { border-color:rgba(15,157,117,.5); background:rgba(15,157,117,.04); }
    .ocard.replied.stalled { border-color:rgba(217,119,6,.6); background:rgba(217,119,6,.05); }
    .pill.warn { background:rgba(217,119,6,.14); color:var(--warn); }
    .gm-page .msg.warn { color:var(--warn); }
    .ocard.replied a { color:inherit; text-decoration:none; }
    .ocard.replied a:hover { text-decoration:underline; }
    .funnel { display:flex; gap:6px; flex-wrap:wrap; align-items:center; margin:8px 0; font-size:12.5px; }
    .funnel b { font-size:15px; }
    .funnel .arr { color:var(--dim); }
    .stats-grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(min(100%, 420px), 1fr)); gap:12px; }
    .stats-grid > div { min-width:0; overflow-x:auto; }
    .stats-grid th, .stats-grid td { white-space:nowrap; }
    .stats-grid table { font-size:12.5px; }
    .stats-grid h3 { font-size:13px; margin:0 0 6px; color:var(--dim); }
    .bar { display:inline-block; height:8px; background:var(--dim); opacity:.55; border-radius:4px; vertical-align:middle; }
    .bar.hot { background:var(--ok); opacity:1; }
    .bar.warm { background:var(--accent); opacity:1; }
    .bar.cold { background:var(--danger); opacity:.8; }
    /* 账号卡片（头像+昵称+@+在线点，多选） */
    .gm-acct-card { display:inline-flex; align-items:center; gap:8px; padding:5px 12px 5px 5px;
                    border:1px solid var(--border); border-radius:999px; cursor:pointer;
                    background:var(--card); user-select:none; }
    .gm-acct-card.sel { border-color:var(--accent); box-shadow:0 0 0 1px var(--accent) inset; }
    .gm-acct-card input { position:absolute; opacity:0; width:0; height:0; }
    .gm-av { width:30px; height:30px; border-radius:50%; object-fit:cover; flex:none;
             display:inline-flex; align-items:center; justify-content:center; color:#fff;
             font-size:12px; font-weight:700; }
    .gm-acct-meta { display:flex; flex-direction:column; line-height:1.2; }
    .gm-acct-nm { font-size:12.5px; font-weight:600; color:var(--text); }
    .gm-acct-un { font-size:11px; color:var(--dim); }
    .gm-dot { width:7px; height:7px; border-radius:50%; background:var(--ok); flex:none; }
    /* 可聊度色块 */
    .sc { display:inline-block; min-width:24px; text-align:center; padding:1px 7px;
          border-radius:999px; font-size:11.5px; font-weight:700; }
    .sc.hi { background:rgba(15,157,117,.16); color:var(--ok); }
    .sc.mid { background:rgba(217,119,6,.16); color:var(--warn); }
    .sc.lo { background:rgba(107,114,128,.16); color:var(--dim); }
    .adv-toggle { font-size:11.5px; color:var(--accent); cursor:pointer; text-decoration:none; }
    .gm-acct-q { font-size:10.5px; color:var(--dim); }
    /* 任务进度条 */
    .jbar { height:5px; background:var(--border); border-radius:999px; overflow:hidden; margin:8px 0 2px; }
    .jbar > i { display:block; height:100%; width:0; background:var(--accent);
                border-radius:999px; transition:width .4s ease; }
    .job.jdone .jbar > i { background:var(--ok); }
    .job.jerr  .jbar > i { background:var(--danger); }
    /* 配额迷你条（选号卡片内） */
    .qbar { display:inline-block; width:34px; height:4px; background:var(--border);
            border-radius:999px; overflow:hidden; vertical-align:middle; margin-right:4px; }
    .qbar > i { display:block; height:100%; background:var(--accent); }
    /* 顶部步骤条 + 开口账号条（吸顶：往下翻到接话 / 开口时还看得见用的是哪个号） */
    .steps { display:flex; gap:6px; align-items:center; flex-wrap:wrap; margin:0 0 14px; font-size:12.5px;
             background:transparent; width:auto; }
    .steps a { flex:0 0 auto; width:auto; color:var(--accent); text-decoration:none; padding:3px 10px;
               border:1px solid var(--border); border-radius:999px; background:var(--card); }
    .steps a:hover { border-color:var(--accent); }
    .steps .arr { color:var(--dim); }
    .gm-acct-bar { position:sticky; top:0; z-index:5; padding:10px 16px; }
    .ocard .gt-confirm { margin-top:8px; padding:8px 10px; border:1px dashed var(--accent); border-radius:8px; }
    .ocard .gt-confirm q { font-style:italic; }
  </style>
{% endblock %}
{% block content %}
<div class="gm-page">
  <div class="wrap">
    <h1 id="t-title"></h1>
    <div class="sub" id="t-sub"></div>
    <nav class="steps" id="gm-steps">
      <a href="#gm-gtouch" id="t-step1"></a><span class="arr">→</span>
      <a href="#gm-effect" id="t-step2"></a>
      <a href="#gm-outreach" id="t-step3" hidden></a>
      <a href="#gm-extract" id="t-step4" hidden></a>
    </nav>
    <div class="banner" id="gm-disabled" hidden></div>
    <div class="msg" id="t-accts-l"></div>
    <div class="accts" id="gm-accts"><span class="empty" id="gm-accts-empty"></span></div>
    <div class="row" id="gm-reply-pick" hidden>
      <label id="t-out-acct-l" for="gm-out-acct"></label>
      <select id="gm-out-acct"></select>
    </div>
    <p class="msg" id="gm-reply-hint" hidden></p>

    <section class="card" id="gm-gtouch">
      <h2 id="t-gtouch"></h2>
      <div class="msg" id="t-gtouch-l"></div>
      <div class="row">
        <button type="button" id="gm-gt-refresh"></button>
        <button type="button" id="gm-gt-compose-all"></button>
        <span class="msg" id="gm-gt-stats"></span>
      </div>
      <details>
        <summary id="t-gt-more"></summary>
        <div class="msg" id="gm-gt-stats-more"></div>
      </details>
      <div class="msg" id="gm-gt-note"></div>
      <div id="gm-gt-list"></div>
      <div id="gm-gt-sent"></div>
    </section>

    <section class="card" id="gm-effect">
      <h2 id="t-effect"></h2>
      <div class="row">
        <select id="gm-out-stats-days">
          <option value="7"></option><option value="14"></option><option value="30"></option>
        </select>
        <select id="gm-out-stats-scope">
          <option value="all"></option><option value="acct"></option>
        </select>
      </div>
      <div id="gm-out-statsbox" hidden></div>
    </section>

    <details class="gm-fold" id="gm-pull">
      <summary id="t-pull">还要拉新人</summary>
    <section class="card" id="gm-extract">
      <h2 id="t-extract"></h2>
      <div class="msg" id="gm-accts-total"></div>
      <div class="row">
        <label id="t-group-l" for="gm-group-sel"></label>
        <select id="gm-group-sel"><option value=""></option></select>
        <button type="button" id="gm-eg-refresh" title="刷新群列表">⟳</button>
        <a href="#" id="gm-group-adv-toggle" class="adv-toggle"></a>
      </div>
      <div class="row" id="gm-group-adv" hidden>
        <label id="t-group-manual-l" for="gm-group-manual"></label>
        <input type="text" id="gm-group-manual" placeholder="-1001234567890 / @username" />
      </div>
      <div class="msg" id="gm-group-note"></div>
      <div class="row">
        <label id="t-filter-l" for="gm-filter"></label>
        <select id="gm-filter">
          <option value="spoke_no_admin"></option>
          <option value="spoke"></option>
          <option value="all"></option>
        </select>
        <label id="t-cap-l" for="gm-cap"></label>
        <input type="number" id="gm-cap" value="200" min="1" max="100000" />
      </div>
      <button class="primary" id="gm-start"></button>
      <div class="msg" id="gm-start-msg"></div>
    </section>

    <section class="card">
      <h2 id="t-jobs"></h2>
      <div id="gm-jobs"><div class="empty" id="gm-jobs-empty"></div></div>
    </section>

    <section class="card">
      <h2 id="t-members"></h2>
      <div class="row">
        <label id="t-mgroup-l" for="gm-mgroup"></label>
        <select id="gm-mgroup"></select>
        <select id="gm-monly">
          <option value="spoke_no_admin"></option>
          <option value="spoke"></option>
          <option value=""></option>
          <option value="admins"></option>
        </select>
        <select id="gm-msort">
          <option value="score"></option>
          <option value="recent"></option>
        </select>
        <input type="text" id="gm-mq" />
        <button id="gm-refresh"></button>
        <button id="gm-export"></button>
      </div>
      <div class="msg" id="gm-mstats"></div>
      <table>
        <thead><tr>
          <th id="th-user"></th><th id="th-score"></th>
          <th id="th-spoke"></th><th id="th-admin"></th><th id="th-src"></th>
          <th id="th-state"></th>
        </tr></thead>
        <tbody id="gm-mbody"></tbody>
      </table>
    </section>
    </details>

    <details class="gm-fold" id="gm-cold">
      <summary id="t-cold">备用：冷私聊，更容易停号</summary>
    <section class="card gm-acct-bar" id="gm-acct-pick">
      <div class="row" style="margin-bottom:0">
        <label id="t-out-mode-l" for="gm-out-mode"></label>
        <select id="gm-out-mode">
          <option value="manual"></option>
          <option value="approve"></option>
          <option value="auto"></option>
        </select>
        <label id="t-out-persona-l" for="gm-out-persona-sel"></label>
        <select id="gm-out-persona-sel"></select>
        <span class="msg" id="gm-out-persona"></span>
      </div>
    </section>

    <section class="card" id="gm-outreach">
      <h2 id="t-outreach"></h2>
      <div class="msg" id="t-outreach-l"></div>
      <div class="row">
        <button type="button" id="gm-out-queue"></button>
        <button type="button" id="gm-out-compose"></button>
        <button type="button" class="primary" id="gm-out-approve-all"></button>
        <button type="button" id="gm-out-stop"></button>
        <button type="button" id="gm-out-resume"></button>
      </div>
      <div class="row gm-out-settings">
        <label id="t-out-hours-l"></label>
        <input type="number" id="gm-out-h0" min="0" max="23" style="min-width:64px;width:64px" />
        <span>–</span>
        <input type="number" id="gm-out-h1" min="1" max="24" style="min-width:64px;width:64px" />
        <label id="t-out-cap-l"></label>
        <input type="number" id="gm-out-cap" min="5" max="10" style="min-width:64px;width:64px" />
        <button type="button" id="gm-out-save"></button>
        <span class="msg" id="gm-out-save-note"></span>
      </div>
      <div class="row">
        <label id="t-out-age-l" for="gm-out-age"></label>
        <input type="number" id="gm-out-age" min="0" max="3650" style="min-width:80px;width:80px" />
        <button type="button" id="gm-out-age-save"></button>
        <span class="msg" id="gm-out-age-note"></span>
      </div>
      <div class="msg" id="gm-out-stats"></div>
      <div class="msg" id="gm-out-summary"></div>
      <div id="gm-out-list"></div>
      <div id="gm-out-replied"></div>
      <div id="gm-out-followups"></div>
    </section>
    </details>
  </div>
</div>
<script>
  (function () {
    "use strict";
    var EN = (document.documentElement.lang || "").toLowerCase().indexOf("en") === 0;
    function t(zh, en) { return EN ? en : zh; }
    function $(id) { return document.getElementById(id); }
    function esc(s) {
      return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
        return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
      });
    }
    function csrfToken() {
      var m = document.cookie.match(/(?:^|;\s*)csrf_token=([^;]+)/);
      return m ? decodeURIComponent(m[1]) : "";
    }
    async function api(url, opts) {
      opts = opts || {};
      var headers = Object.assign({ Accept: "application/json" }, opts.headers || {});
      var method = (opts.method || "GET").toUpperCase();
      if (method !== "GET" && method !== "HEAD") {
        var tok = csrfToken();          // 同源 POST 中间件走 Origin 放行；带上 token 更稳
        if (tok) headers["X-CSRF-Token"] = tok;
      }
      var res = await fetch(url, Object.assign(
        { credentials: "same-origin" }, opts, { headers: headers }));
      var data = {};
      try { data = await res.json(); } catch (e) { data = {}; }
      return { ok: res.ok, status: res.status, data: data };
    }

    var _jobPoll = null;
    var _extractGroupsCache = {};   // account_id -> [{id,title,members}] | null（发起区群下拉缓存；null=拉过但失败）
    var _egMembers = {};            // group_id -> members_count（并集口径，取最大）
    var _egCoverage = {};           // group_id -> [account_ids]（所选号里谁在这个群）
    var _acctName = {};             // account_id -> 展示名（self_name||label||id）
    var _jobRate = {};              // job_id -> {pulled, ts}（相邻轮询算速率估 ETA）

    function avatarColor(seed) {
      var s = String(seed || ""), h = 0;
      for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) & 0xffffff;
      return "hsl(" + (h % 360) + ",42%,45%)";
    }
    function initial(name) {
      var s = String(name || "").trim();
      return s ? s.charAt(0).toUpperCase() : "#";
    }
    function scoreChip(s) {
      if (s == null || s === "") return "";
      var cls, word;
      if (s >= 80) { cls = "hi"; word = t("值得接话", "Worth a reply"); }
      else if (s >= 60) { cls = "mid"; word = t("一般", "Ordinary"); }
      else { cls = "lo"; word = t("先放着", "Leave for later"); }
      return '<span class="sc ' + cls + '" title="' + esc(s) + '">' + word + "</span>";
    }
    function fmtDur(sec) {
      sec = Math.max(0, Math.round(sec));
      if (sec < 60) return sec + "s";
      var m = Math.floor(sec / 60), s = sec % 60;
      if (m < 60) return m + "m" + (s ? " " + s + "s" : "");
      var h = Math.floor(m / 60); m = m % 60;
      return h + "h" + (m ? " " + m + "m" : "");
    }

    function setText() {
      $("t-title").textContent = t("Telegram 群成员提取", "Telegram group member extraction");
      $("t-sub").textContent = t(
        "先在群里接有意向的人的话。提取只是把人放进库，不发消息。",
        "Reply in the group first. Extraction only puts people in the library and sends nothing.");
      $("t-step1").textContent = t("① 在群里接话", "1 · Reply in the group");
      $("t-step2").textContent = t("② 看效果", "2 · Results");
      $("t-pull").textContent = t("还要拉新人", "Pull more people");
      $("t-cold").textContent = t("备用：冷私聊，更容易停号", "Backup: cold DM, easier to get stopped");
      $("t-effect").textContent = t("看效果", "Results");
      $("gm-gt-compose-all").textContent = t("AI 拟稿今天这批", "AI-draft today's batch");
      $("t-extract").textContent = t("① 发起提取", "① Start extraction");
      $("t-accts-l").textContent = t("用这个号在群里接话。只显示在线的 Telegram 号。",
        "Reply in the group with this account. Online Telegram accounts only.");
      $("t-group-l").textContent = t("目标群（选号后自动列出）", "Target group (auto-listed after picking accounts)");
      $("gm-eg-refresh").title = t("刷新群列表", "Refresh groups");
      $("gm-group-adv-toggle").textContent = t("高级：手输群 id / @用户名", "Advanced: manual id / @username");
      $("t-group-manual-l").textContent = t("手输群", "Manual group");
      $("t-filter-l").textContent = t("拉哪些人", "Who to pull");
      $("t-cap-l").textContent = t("每号每日上限", "Daily cap / account");
      $("gm-start").textContent = t("发起提取", "Start extraction");
      $("t-jobs").textContent = t("提取任务", "Extraction jobs");
      $("gm-jobs-empty").textContent = t("暂无任务", "No jobs yet");
      $("t-members").textContent = t("成员库", "Member DB");

    async function loadAccounts() {
      var box = $("gm-accts");
      var r = await api("/api/accounts");
      var list = (r.data && r.data.accounts) || [];
      var tg = list.filter(function (a) {

          t("没有在线的 Telegram 号", "No online Telegram accounts") + "</span>";

          $("gm-out-stats").textContent = t("没有在线的 Telegram 号", "No online Telegram accounts");
        }
        return;
      }
      _acctName = {};
      box.innerHTML = tg.map(function (a) {
        var id = esc(a.account_id);

        _acctName[a.account_id] = nm;

          ? '<img class="gm-av" src="' + esc(a.self_avatar) + '" alt="" />'

        return '<label class="gm-acct-card">' +

          '<span class="gm-acct-meta"><span class="gm-acct-nm">' + esc(nm) + "</span>" +
          (un ? '<span class="gm-acct-un">' + esc(un) + "</span>" : "") +

    // 每号今日配额余量（"今日 used/cap"）填进卡片 chip；满额标红。未开启/失败静默跳过。
    async function loadAcctQuotas(list) {
      var chips = {};
      Array.prototype.slice.call(document.querySelectorAll(".gm-acct-q"))
        .forEach(function (el) { chips[el.getAttribute("data-q")] = el; });
      var got = 0, _quotaLines = [];
      await Promise.all(list.map(function (a) {
        return api("/api/tg-members/quota?account_id=" + encodeURIComponent(a.account_id))
          .then(function (r) {
            if (!r.ok) return;
            var used = r.data.used_today || 0, cap = r.data.cap || 0;
            got++;
            var chip = chips[a.account_id];
            if (chip) chip.textContent = "";
            _quotaLines.push((_acctName[a.account_id] || a.account_id) + " " + used + "/" + cap);
          }).catch(function () {});
      }));
      var tot = $("gm-accts-total");
      if (tot) {
        if (got && _quotaLines.length) {
          tot.textContent = t("今日入库 ", "Pulled today ") + _quotaLines.join(" · ");
        } else { tot.textContent = ""; }
      }
    }

    function selectedAccounts() {
      return Array.prototype.slice.call(document.querySelectorAll(".gm-acct:checked"))

    function syncReplyAccount() {
      var sel = selectedAccounts();
      var osel = $("gm-out-acct");
      var hint = $("gm-reply-hint");
      var pick = $("gm-reply-pick");
      if (!osel) return;
      if (!sel.length) {
        if (hint) {
          hint.hidden = false;
          hint.textContent = t("先点一个号，才能看今天可以接的话。",
            "Pick an account above to see who you can reply to today.");
        }
        if (pick) pick.hidden = true;
        return;
      }
      if (hint) hint.hidden = true;
      if (sel.indexOf(osel.value) < 0) osel.value = sel[0];
      if (pick) pick.hidden = sel.length < 2;
      loadGtouch();
      if (typeof loadOutreach === "function") loadOutreach();
    }

    // 选号变化 → 并行列出「所有所选号」的群，合并成并集填进下拉；记录每群被哪些号覆盖。
    async function onAccountsChanged() {
      var accts = selectedAccounts();
      var sel = $("gm-group-sel");
      $("gm-group-note").textContent = "";
      if (!accts.length) {
        sel.innerHTML = '<option value="">' +
          t("先选账号，自动列出其群", "pick account(s) to list groups") + "</option>";
        return;
      }
      sel.innerHTML = '<option value="">' + t("加载群列表…", "loading groups…") + "</option>";
      var need = accts.filter(function (a) { return _extractGroupsCache[a] === undefined; });
      if (need.length) {
        await Promise.all(need.map(function (a) {
          return api("/api/tg-members/account-groups?account_id=" + encodeURIComponent(a))
            .then(function (r) { _extractGroupsCache[a] = r.ok ? (r.data.groups || []) : null; })
            .catch(function () { _extractGroupsCache[a] = null; });
        }));
      }
      var union = {}, failed = [];
      accts.forEach(function (a) {
        var gs = _extractGroupsCache[a];
        if (gs == null) { failed.push(a); return; }
        gs.forEach(function (g) {
          var u = union[g.id] || (union[g.id] = { title: g.title || g.id, members: 0, accts: [] });
          if (g.title) u.title = g.title;
          if (g.members && g.members > u.members) u.members = g.members;
          u.accts.push(a);
        });
      });
      var ids = Object.keys(union);
      _egMembers = {}; _egCoverage = {};
      if (!ids.length) {
        sel.innerHTML = '<option value="">' + (failed.length
          ? t("所选号都无法列群，用下方「手输」", "can't list groups; use manual below")
          : t("所选号没有群", "no groups for selected accounts")) + "</option>";
        return;
      }
      var total = accts.length;
      ids.sort(function (a, b) {
        var d = union[b].accts.length - union[a].accts.length;
        return d !== 0 ? d : (union[b].members - union[a].members);
      });
      sel.innerHTML = '<option value="">' + t("选择群…", "select a group…") + "</option>" +
        ids.map(function (gid) {
          var u = union[gid];
          _egMembers[gid] = u.members;
          _egCoverage[gid] = u.accts.slice();
          var cov = (u.accts.length < total)
            ? " · " + t("覆盖 ", "cov ") + u.accts.length + "/" + total : "";
          return '<option value="' + esc(gid) + '">' + esc(u.title) +
            (u.members ? " (" + u.members + ")" : "") + cov + "</option>";
        }).join("");
      if (failed.length) {
        $("gm-group-note").textContent = t("注：", "Note: ") + failed.length +
          t(" 个号无法列群（离线？），未计入。", " account(s) couldn't list groups (offline?), excluded.");
      }
    }

    function acctName(id) { return _acctName[id] || id; }

    function _updateGroupNote() {
      var gid = $("gm-group-sel").value;
      if (!gid) { $("gm-group-note").textContent = ""; return; }
      var n = _egMembers[gid], cov = _egCoverage[gid] || [];
      var accts = selectedAccounts();

      if (n) s += t("该群约 ", "~") + n + t(" 人 · ", " members · ");
      s += t("所选 ", "") + accts.length + t(" 号中 ", " picked, ") +
        cov.length + t(" 个在此群", " in this group");
      if (notIn.length) {

      }

    async function startExtract() {
      var accounts = selectedAccounts();
      var manualEl = $("gm-group-manual");
      var manual = (!$("gm-group-adv").hidden && manualEl) ? manualEl.value.trim() : "";
      var group = manual || $("gm-group-sel").value;
      var filter = $("gm-filter").value;
      var cap = parseInt($("gm-cap").value, 10) || 200;
      var msg = $("gm-start-msg");
      if (!accounts.length || !group) {
        msg.textContent = t("请先选号并选群（或用高级手输）", "Pick account(s) and a group (or manual id)");
        return;
      }
      $("gm-start").disabled = true;
      msg.textContent = t("发起中…", "Starting…");
      var r = await api("/api/tg-members/jobs", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ account_ids: accounts, group: group, filter: filter,
                               daily_cap_per_account: cap })
      });
      $("gm-start").disabled = false;
      if (!r.ok) {
        msg.textContent = t("失败：", "Failed: ") + esc((r.data && r.data.detail) || r.status);
        return;
      }
      var skipped = (r.data.skipped || []);
      msg.textContent = t("已发起 ", "Started ") + (r.data.jobs || []).length +
        t(" 个任务（分片 ", " job(s) (shards ") + (r.data.shards || 1) + "）" +
        (skipped.length ? t("；跳过离线号 ", "; skipped offline ") + skipped.join(",") : "");
      loadJobs();
    }

    function jobStatusPill(st) {
      var cls = st === "done" ? "done" : (st === "error" ? "err" : "run");
      return '<span class="pill ' + cls + '">' + esc(st) + "</span>";
    }

    async function loadJobs() {
      var box = $("gm-jobs");
      var r = await api("/api/tg-members/jobs?limit=40");
      var jobs = (r.data && r.data.jobs) || [];
      if (!jobs.length) {
        box.innerHTML = '<div class="empty">' + t("暂无任务", "No jobs yet") + "</div>";
        return;
      }
      box.innerHTML = jobs.map(function (j) {
        var acct = (j.account_ids || []).join(",");
        var running = j.status === "running";
        var cap = j.daily_cap_per_account || 0;
        var pulled = j.pulled_total || 0;
        var pct = cap > 0 ? Math.min(100, Math.round(pulled / cap * 100)) : 0;
        var jcls = j.status === "done" ? " jdone" : (j.status === "error" ? " jerr" : "");
        var bar = cap > 0 ? '<div class="jbar"><i style="width:' + pct + '%"></i></div>' : "";
        // 客户端估算：相邻两次轮询的入库增量算速率 → 剩余配额 ÷ 速率 = ETA；停滞且有限速 → 等待提示
        var etaTxt = "";
        var prev = _jobRate[j.job_id], now = Date.now();
        if (running) {
          if (prev && pulled > prev.pulled && now > prev.ts) {
            var rate = (pulled - prev.pulled) / ((now - prev.ts) / 1000);
            if (rate > 0 && cap > pulled) etaTxt = " · " + t("约剩 ", "~") + fmtDur((cap - pulled) / rate);
          } else if (prev && pulled === prev.pulled && j.floodwaits) {
            etaTxt = ' · <span style="color:var(--warn)">' +
              t("⏳ 限速等待中", "⏳ waiting (floodwait)") + "</span>";
          }
          _jobRate[j.job_id] = { pulled: pulled, ts: now };
        } else { delete _jobRate[j.job_id]; }
        return '<div class="job' + jcls + '"><div class="jhd">' +
          "<div><b>" + esc(j.group_title || j.group_id) + "</b> · " + esc(acct) + "</div>" +
          "<div>" + jobStatusPill(j.status) +
          (running ? ' <button data-stop="' + esc(j.job_id) + '">' +
            t("停止", "Stop") + "</button>" : "") +
          (j.group_id ? ' <button data-view="' + esc(j.group_id) + '">' +
            t("看成员", "Members") + "</button>" : "") + "</div></div>" + bar +
          '<div class="msg">' + t("已入库 ", "pulled ") + pulled +
          (cap > 0 ? "/" + cap + " (" + pct + "%)" : "") + etaTxt +
          t(" · 去重 ", " · dedup ") + (j.dedup_skipped || 0) +
          t(" · 剔管理员 ", " · admins ") + (j.admins_excluded || 0) +
          (j.floodwaits ? t(" · 限速 ", " · floodwait ") + j.floodwaits : "") +
          (j.last_error ? ' · <span style="color:var(--danger)">' + esc(j.last_error) + "</span>" : "") +
          "</div></div>";
      }).join("");
      Array.prototype.slice.call(box.querySelectorAll("button[data-stop]")).forEach(function (b) {
        b.addEventListener("click", function () { stopJob(b.getAttribute("data-stop")); });
      });
      Array.prototype.slice.call(box.querySelectorAll("button[data-view]")).forEach(function (b) {
        b.addEventListener("click", function () { jumpToMembers(b.getAttribute("data-view")); });
      });
      if (jobs.some(function (j) { return j.status === "running"; })) {
        if (!_jobPoll) _jobPoll = setInterval(loadJobs, 3000);
      } else if (_jobPoll) { clearInterval(_jobPoll); _jobPoll = null; }
    }

    async function stopJob(jid) {
      await api("/api/tg-members/jobs/" + encodeURIComponent(jid) + "/stop", { method: "POST" });
      loadJobs();

    async function loadGroups(preferGid) {
      var sel = $("gm-mgroup");
      var prev = preferGid || sel.value;   // 保留当前选中（轮询/直达刷新不打断查看）
      var r = await api("/api/tg-members/groups");
      var groups = (r.data && r.data.groups) || [];
      sel.innerHTML = groups.map(function (g) {
        return '<option value="' + esc(g.group_id) + '">' +
          esc(g.group_title || g.group_id) + " (" + g.total +
          (g.spoke ? " · " + g.spoke + t(" 可聊", " active") : "") + ")</option>";
      }).join("");
      if (prev) {
        var has = Array.prototype.some.call(sel.options, function (o) { return o.value === prev; });
        if (has) sel.value = prev;
      }
      if (sel.value) loadMembers();
      else if (groups.length) { sel.selectedIndex = 0; loadMembers(); }
      var pull = $("gm-pull");
      if (pull && !preferGid) pull.open = !groups.length;
      return groups;
    }

    // 从任务卡「看成员」直达：确保群在下拉里（缺则刷新）→ 选中 → 加载 → 滚到成员区。
    async function jumpToMembers(gid) {
      if (!gid) return;
      var sel = $("gm-mgroup");
      var has = Array.prototype.some.call(sel.options, function (o) { return o.value === gid; });
      if (!has) await loadGroups(gid);
      sel.value = gid;
      // 直达自带「最该聊的人」视角：只看发言非管理员 + 可聊度优先；清掉残留搜索词免藏结果
      $("gm-monly").value = "spoke_no_admin";
      $("gm-msort").value = "score";
      $("gm-mq").value = "";
      var d = await loadMembers();
      // 兜底：该群有成员但「发言非管理员」为空（多为按「全部」提取的群）→ 自动切「全部」再看一次
      if (d && !((d.items || []).length) && (d.total || 0) > 0) {
        $("gm-monly").value = "";
        await loadMembers();
      }
      var gt = $("gm-gtouch");
      if (gt && gt.scrollIntoView) gt.scrollIntoView({ behavior: "smooth", block: "start" });
      loadGtouch();
    }

    async function loadMembers() {
      var gid = $("gm-mgroup").value;
      var body = $("gm-mbody");
      var stats = $("gm-mstats");
      if (!gid) { body.innerHTML = ""; stats.textContent = ""; return; }
      var only = $("gm-monly").value;
      var q = $("gm-mq").value.trim();
      var url = "/api/tg-members/members?group_id=" + encodeURIComponent(gid) +
        "&only=" + encodeURIComponent(only) + "&q=" + encodeURIComponent(q) +
        "&sort=" + encodeURIComponent($("gm-msort").value) + "&limit=500";
      var r = await api(url);
      var items = (r.data && r.data.items) || [];
      stats.textContent = t("总 ", "total ") + (r.data.total || 0) +
        t(" · 可聊 ", " · active ") + (r.data.spoke_no_admin || 0) +
        t("（显示 ", " (showing ") + items.length + "）";
      body.innerHTML = items.map(function (m) {
        var name = (m.first_name || "") + (m.last_name ? " " + m.last_name : "");
        var who = name || m.username || m.user_id;
        return "<tr><td><b>" + esc(who) + "</b>" +
          (m.username ? ' <span style="color:var(--dim)">@' + esc(m.username) + "</span>" : "") +
          '<div class="msg">' + esc(m.user_id) + "</div></td><td>" + scoreChip(m.score) + "</td><td>" +
          (m.spoke ? "✓" : "") + "</td><td>" +
          (m.is_admin ? '<span class="pill adm">admin</span>' : "") + "</td><td>" +
          esc(m.source_account_id) + "</td><td>" + esc(outreachLabel(m.outreach_state)) +
          "</td></tr>";
      }).join("");
      return r.data;
    }

    function outreachLabel(state) {
      var map = {
        none: t("未开口", "not sent"),
        queued: t("排队", "queued"),
        approved: t("已批准", "approved"),
        sending: t("发送中", "sending"),
        sent: t("已发", "sent"),
        replied: t("已回", "replied"),
        blocked: t("不可达", "unreachable"),
        skipped: t("跳过", "skipped"),
        closed: t("已封存", "closed")
      };
      return map[state] || (state || "");
    }

    var _outCache = {};

    function clockFmt(ts) {
      var n = Number(ts || 0);
      if (!n) return "";
      try { return window.wsFmtDateTime(n); } catch (e) { return ""; }
    }

    function compareSentence(c) {
      if (!c) return "";
      var warm = c.dm_warm || {}, cold = c.dm_cold || {};
      if (!(warm.sent || cold.sent)) return "";
      return t(
        " 近 7 天：先接话再私聊回复率 " + pct(warm.rate) + "（" + (warm.sent || 0) + " 人），冷私聊 " +
          pct(cold.rate) + "（" + (cold.sent || 0) + " 人）。",
        " Last 7 days: reply-in-group then DM " + pct(warm.rate) + " (" + (warm.sent || 0) +
          "), cold DM " + pct(cold.rate) + " (" + (cold.sent || 0) + ").");
    }

    function statusLine(d) {
      var left = (d.remaining == null ? 0 : d.remaining);
      var until = clockFmt(d.hold_until);
      var when;
      if (d.hold === "paused") {
        when = t("这个号已急停，冷私聊和群里接话都先停。", "This account is manually stopped. Cold DMs and group replies both wait.");
      } else if (d.hold === "flood") {
        when = t("冷私聊先停" + (until ? "到 " + until : "一天") + "。群里接话还能发。",
          "Cold DMs wait" + (until ? " until " + until : " a day") + ". Group replies can continue.");
      } else if (d.hold === "flood_wait") {
        when = t("发得太密，等到 " + (until || t("那一小段时间", "the short wait")) + " 再发，不用停一整天。",
          "Sending was too fast. Wait until " + (until || "the short timer") + ", not a full day.");
      } else if ((d.gap_wait_sec || 0) > 0) {
        when = t("下一条大约 " + Math.ceil(d.gap_wait_sec / 60) + " 分钟后可以发。",
          "The next one can go in about " + Math.ceil(d.gap_wait_sec / 60) + " min.");
      } else if (d.hours && d.hours.ok === false) {
        when = t("现在不在时段，下一段从 " + (d.hours.start || 0) + ":00 开始。",
          "Outside the window. Next window starts at " + (d.hours.start || 0) + ":00.");
      } else {
        when = t("现在可以发。", "Ready to send.");
      }
      var intent = d.intent_configured ? "" : t(
        " 未按目标客户筛选，只是最近说过话的人。",
        " Not filtered to target customers; these are just people who spoke recently.");
      var hash = (d.unhashed > 0)
        ? t(" 有 " + d.unhashed + " 人还没有私聊凭证，用这个号再提取一次。",
            " " + d.unhashed + " people have no chat credential; extract again with this account.")
        : "";
      return when + t(" 今天还剩 " + left + " 条。", " " + left + " left today.") + intent + compareSentence(d.path_compare) + hash;
    }

    function loadOutreach() {
      var acct = ($("gm-out-acct") && $("gm-out-acct").value) || "";
      var box = $("gm-out-list");
      var stats = $("gm-out-stats");
      if (!acct) {
        if (stats) stats.textContent = t("没有在线号", "No online account");
        if (box) box.innerHTML = "";
        return Promise.resolve();
      }
      return api("/api/tg-members/outreach/preview?account_id=" + encodeURIComponent(acct))
        .then(function (r) {
          if (!r.ok) {
            stats.textContent = (r.data && r.data.detail) || String(r.status);
            box.innerHTML = "";
            return;
          }
          var d = r.data || {};
          _outCache = {};
          stats.textContent = statusLine(d);
          renderOutreachMeta(d);
          renderReplied(d);
          renderFollowups(d);
          loadGtouch();
          var rows = (d.queue || []).concat(d.candidates || []);
          if (!rows.length) {
            box.innerHTML = '<div class="empty">' +
              t("今天没有可开口的人。先入库，并且提取时要由这个号拿到对方。",
                "Nobody to open today. Extract first, with this account capturing the person.") +
              "</div>";
            return;
          }
          box.innerHTML = rows.map(renderOpenerCard).join("");
          bindOpenerCards(box);
        }).catch(function () {
          stats.textContent = t("开口状态读取失败", "Could not load outreach");
        });
    }

    var _settingsDirty = false;
    var _ageDirty = false;
    var _personaList = null;
    var _personaLoading = null;
    var _personaSyncing = false;

    function loadPersonaList() {
      if (_personaList) return Promise.resolve(_personaList);
      if (_personaLoading) return _personaLoading;
      _personaLoading = api("/api/personas/profiles").then(function (r) {
        var summary = (r.data && r.data.summary) || [];
        _personaList = summary.filter(function (s) { return s && s.id; }).map(function (s) {
          return { id: String(s.id), name: String(s.name || s.id) };
        });
        _personaList.sort(function (a, b) {
          return a.name.localeCompare(b.name, "zh");
        });
        return _personaList;
      }).catch(function () {
        _personaList = [];
        return _personaList;
      });
      return _personaLoading;
    }

    function fillPersonaSelect(currentId, currentName) {
      var sel = $("gm-out-persona-sel");
      if (!sel) return;
      loadPersonaList().then(function (list) {
        var html = '<option value="">' +
          t("不单独绑定（用默认）", "Use the default") + "</option>";
        var seen = false;
        (list || []).forEach(function (p) {
          if (p.id === currentId) seen = true;
          html += '<option value="' + esc(p.id) + '">' + esc(p.name) + "</option>";
        });
        if (currentId && !seen) {
          html += '<option value="' + esc(currentId) + '">' +
            esc(currentName || currentId) + "</option>";
        }
        _personaSyncing = true;
        sel.innerHTML = html;
        sel.value = currentId || "";
        _personaSyncing = false;
      });
    }

    async function savePersona() {
      if (_personaSyncing) return;
      var acctEl = $("gm-out-acct");
      var sel = $("gm-out-persona-sel");
      var acct = acctEl ? acctEl.value : "";
      if (!acct || !sel) return;
      sel.disabled = true;
      var r = await api("/api/persona/account-persona", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          platform: "telegram",
          account_id: acct,
          profile_id: sel.value || ""
        })
      });
      sel.disabled = false;
      if (!r.ok) {
        $("gm-out-persona").textContent = t("人设没绑上：", "Persona not saved: ") +
          ((r.data && (r.data.detail || r.data.error)) || r.status);
        return;
      }
      loadOutreach();
    }

    // 模式 / 人设+目标 / 今日汇总 / 时段+条数
    function renderOutreachMeta(d) {
      var mode = $("gm-out-mode");
      if (mode && d.mode) mode.value = d.mode;
      // 全自动门槛：不够格就灰掉选项并写明原因（后端同样拒绝，这里只是别让人白点）
      var ae = d.auto_eligible || {};
      var autoOpt = mode ? mode.options[2] : null;
      if (autoOpt) {
        var why = { age: t("号未满 14 天", "account under 14 days"),
                    flood: t("近 7 天冷私聊被限制过", "cold DMs were limited in the last 7 days"),
                    reply_rate: t("近 7 天回复率低于地板", "7-day reply rate below floor") };
        autoOpt.disabled = ae.ok === false && d.mode !== "auto";
        autoOpt.textContent = t("全自动（排队+拟稿+发）", "Fully automatic") +
          (ae.ok === false ? t(" · 不够格：", " · not eligible: ") + (why[ae.reason] || ae.reason) : "");
      }
      var p = d.persona || {}, g = d.goal || {};
      fillPersonaSelect(p.id || "", p.name || "");
      var gTxt = g.name ? t("目标：", "Goal: ") + g.name : t("目标：未设默认（回复后再挂）", "Goal: none yet (attached after first reply)");
      $("gm-out-persona").textContent = gTxt;
      var s = d.summary || {};
      var errs = s.errors || {};
      var reasonMap = {
        privacy: t("隐私设置", "privacy"), deactivated: t("账号注销", "deactivated"),
        peer_invalid: t("联系不上", "unreachable"), stop_contact: t("对方拒绝", "asked to stop"),
        operator_skip: t("人工跳过", "skipped by you"), stale_sending: t("发送超时", "send timed out"),
        opener_rejected: t("文案被拦", "opener rejected"), flood: t("冷私聊被限制", "cold DM limited"),
        flood_wait: t("发得太密", "sent too fast"),
        inbound_first: t("对方先来找", "they messaged first"),
        gtouch_inbound: t("群里接话后来找", "came after a group reply")
      };
      var reasons = Object.keys(errs).filter(function (k) { return k && errs[k]; }).map(function (k) {
        return (reasonMap[k] || k) + " " + errs[k];
      });
      $("gm-out-summary").textContent = t("今日：发了 ", "Today: sent ") + (s.sent || 0) +
        t(" · 回了 ", " · replied ") + (s.replied || 0) +
        t(" · 跟进 ", " · follow-ups ") + (s.followups || 0) +
        t(" · 不可达 ", " · unreachable ") + (s.blocked || 0) +
        t(" · 跳过 ", " · skipped ") + (s.skipped || 0) +
        t(" · 封存 ", " · closed ") + (s.closed || 0) +
        t(" · 已批准待发 ", " · approved pending ") + (s.approved || 0) +
        (reasons.length ? t("（", " (") + reasons.join(t("，", ", ")) + t("）", ")") : "");
      var st = d.settings || {};
      if (!_settingsDirty) {
        if (st.hours) { $("gm-out-h0").value = st.hours[0]; $("gm-out-h1").value = st.hours[1]; }
        if (st.daily_cap != null) $("gm-out-cap").value = st.daily_cap;
      }
      var ro = st.writable === false;
      ["gm-out-h0", "gm-out-h1", "gm-out-cap", "gm-out-save"].forEach(function (id) { $(id).disabled = ro; });
      $("gm-out-save-note").textContent = ro
        ? t("这台实例不能在线改，请改 config.yaml 的 companion.group_members", "Read-only here; edit companion.group_members in config.yaml")
        : "";
      var ag = d.age || {};
      if (!_ageDirty) $("gm-out-age").value = ag.declared_days != null ? Math.floor(ag.declared_days) : "";
      $("gm-out-age").disabled = $("gm-out-age-save").disabled = ro;
      $("gm-out-age-note").textContent =
        t("登进本系统 ", "In this system ") + (ag.registry_days != null ? Math.floor(ag.registry_days) : "?") + t(" 天", " d") +
        (ag.declared_days != null ? t(" · 申报 ", " · declared ") + Math.floor(ag.declared_days) + t(" 天", " d") : "") +
        t(" · 每天条数不再按号龄少给。填过号龄也不拦全自动。冷私聊被限制后，申报会作废",
          " · the daily count no longer shrinks with account age. Declaring an age does not block full auto. A cold-DM limit voids the declaration");
      var manual = (d.mode || "manual") === "manual";
      $("gm-out-approve-all").textContent = manual
        ? t("一键批准今日队列", "Approve whole queue")
        : t("一键批准 → 后台自动发", "Approve all → scheduler sends");
    }

    function sourcePill(src) {
      if (src === "ai") return '<span class="pill ai">AI</span>';
      if (src === "manual") return '<span class="pill man">' + t("手改", "edited") + "</span>";
      if (src === "template") return '<span class="pill tpl">' + t("模板", "template") + "</span>";
      return "";
    }

    function renderOpenerCard(m) {
      var key = m.group_id + "|" + m.user_id;
      _outCache[key] = m;
      var name = (m.first_name || "") + (m.last_name ? " " + m.last_name : "");
      var state = m.outreach_state || "none";
      var inQueue = state === "queued" || state === "approved";
      var said = m.last_msg_text
        ? '<div class="osaid">' + t("TA 在群里说：", "They said in the group: ") + "<q>" + esc(m.last_msg_text) + "</q>" +
          (m.last_msg_ts ? ' <span>' + esc(ago(m.last_msg_ts)) + "</span>" : "") + "</div>"
        : '<div class="osaid">' + t("没抓到 TA 的发言内容", "No message text captured") + "</div>";
      var why = (m.online ? '<span class="pill ok">' + t("在线", "online") + "</span> " : "") +
        (m.gtouch_state === "sent" ? '<span class="pill ok">' + t("刚接过话", "replied in the group") + "</span> " : "") +
        (m.intent > 0 ? '<span class="pill ok" title="' + t("按人设的意向关键词命中", "matched the persona's intent keywords") + '">' +
          t("提到 ", "mentioned ") + esc((m.intent_hits || []).join("、")) + "</span> " : "");
      var head = '<div class="ohd"><div><b>' + esc(name || m.user_id) + "</b> " +
        (m.username ? '<span style="color:var(--dim)">@' + esc(m.username) + "</span> " : "") +
        esc(m.group_title || "") + (m.lang_code ? ' <span class="pill tpl">' + esc(m.lang_code) + "</span>" : "") +
        (why ? "<div class=\"msg\">" + why + "</div>" : "") +
        "</div><div>" + (state === "approved" ? '<span class="pill ok">' : '<span class="pill">') +
        esc(outreachLabel(state)) + "</span> " + sourcePill(m.opener_source) +
        (m.opener_variant && m.opener_source === "ai" ? ' <span class="pill" title="' + t("切入方式（A/B）", "opener angle (A/B)") + '">' + esc(variantLabel(m.opener_variant)) + "</span>" : "") +
        (m.followup_text ? ' <span class="pill tpl">' + t("已跟进", "nudged") + "</span>" : "") + "</div></div>";
      if (!inQueue) {
        return '<div class="ocard">' + head + said +
          '<div class="msg">' + t("点「生成今日队列」后才会拟稿和发送", "Queue them first to draft and send") + "</div></div>";
      }
      var text = m.opener_text || m.suggested_opener || "";
      return '<div class="ocard ' + esc(state) + '" data-out-key="' + esc(key) + '">' + head + said +
        '<textarea data-out-text="' + esc(key) + '" maxlength="300" placeholder="' +
        t("还没有文案，点「AI 拟稿」或自己写一句", "No opener yet - click AI draft or write one") + '">' + esc(text) + "</textarea>" +
        '<div class="oact">' +
        (state === "queued"
          ? '<button type="button" class="primary" data-out-approve="' + esc(key) + '">' + t("批准", "Approve") + "</button>"
          : "") +
        '<button type="button" data-out-send="' + esc(key) + '">' + t("现在发这一条", "Send now") + "</button>" +
        '<button type="button" data-out-redraft="' + esc(key) + '">' + t("重新拟稿", "Redraft") + "</button>" +
        '<button type="button" data-out-skip="' + esc(key) + '">' + t("跳过", "Skip") + "</button>" +
        '<span class="ocount" data-out-count="' + esc(key) + '">' + text.length + "</span>" +
        "</div></div>";
    }

    function bindOpenerCards(box) {
      function each(sel, fn) { Array.prototype.slice.call(box.querySelectorAll(sel)).forEach(fn); }
      each("button[data-out-send]", function (b) {
        b.addEventListener("click", function () { sendOne(b.getAttribute("data-out-send")); });
      });
      each("button[data-out-approve]", function (b) {
        b.addEventListener("click", function () { approveOne(b.getAttribute("data-out-approve")); });
      });
      each("button[data-out-skip]", function (b) {
        b.addEventListener("click", function () { skipOne(b.getAttribute("data-out-skip")); });
      });
      each("button[data-out-redraft]", function (b) {
        b.addEventListener("click", function () { redraftOne(b.getAttribute("data-out-redraft")); });
      });
      each("textarea[data-out-text]", function (ta) {
        ta.addEventListener("input", function () {
          var c = box.querySelector('[data-out-count="' + ta.getAttribute("data-out-text").replace(/"/g, '\\"') + '"]');
          if (c) c.textContent = ta.value.length;
        });
      });
    }

    function ago(ts) {
      var s = Math.max(0, Date.now() / 1000 - ts);
      if (s < 3600) return t(Math.floor(s / 60) + " 分钟前", Math.floor(s / 60) + " min ago");
      if (s < 86400) return t(Math.floor(s / 3600) + " 小时前", Math.floor(s / 3600) + " h ago");
      return t(Math.floor(s / 86400) + " 天前", Math.floor(s / 86400) + " d ago");
    }

    function cardText(key) {
      var ta = document.querySelector('textarea[data-out-text="' + key.replace(/"/g, '\\"') + '"]');
      return ta ? ta.value.trim() : "";
    }

    function postJSON(url, body) {
      return api(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    }

    var OUT_NOTE = null;
    function waitText(data) {
      if (!data) return "";
      var kind = data.kind || "";
      var until = clockFmt(data.hold_until);
      if (kind === "flood_wait") {
        var sec = Number(data.wait_sec || 0);
        var mins = sec ? Math.max(1, Math.ceil(sec / 60)) : 0;
        return t(
          "发得太密，大约 " + (mins || "几") + " 分钟后再发" + (until ? "（到 " + until + "）" : "") +
            "。人还在队列里，不用停一整天。",
          "Sending was too fast. Try again in about " + (mins || "a few") + " min" +
            (until ? " (until " + until + ")" : "") + ". They stay in the queue; this is not a full-day stop.");
      }
      if (kind === "flood" || kind === "peer_flood") {
        return t(
          "冷私聊先停" + (until ? "到 " + until : "一天") + "。群里接话还能发。解除急停清不掉这次等待。",
          "Cold DMs wait" + (until ? " until " + until : " a day") +
            ". Group replies can continue. Clearing the manual stop does not clear this.");
      }
      return "";
    }

    function outNote(kind) {
      if (!OUT_NOTE) OUT_NOTE = {
        sent: t("已发出。对方回复后会出现在收件箱。", "Sent. A reply shows up in the inbox."),
        flood: t("冷私聊先停一天。群里接话还能发。解除急停清不掉这次等待。",
          "Cold DMs stop for a day. Group replies can continue. Clearing the manual stop does not clear this."),
        peer_flood: t("冷私聊先停一天。群里接话还能发。解除急停清不掉这次等待。",
          "Cold DMs stop for a day. Group replies can continue. Clearing the manual stop does not clear this."),
        flood_wait: t("发得太密，只等 Telegram 说的那段时间。人还在队列里。",
          "Sending was too fast. Wait only as long as Telegram asked. They stay in the queue."),
        slowmode: t("这条群有慢速限制，这个号的私聊没有因此停掉。",
          "That group is in slow mode. This account's DMs were not stopped for it."),
        privacy: t("对方不接收陌生人私聊，已标不可达。", "Their privacy blocks this. Marked unreachable."),
        deactivated: t("对方账号不可用，已标不可达。", "That account is gone. Marked unreachable."),
        peer_invalid: t("这个号还联系不上对方，已标不可达。", "This account cannot reach them. Marked unreachable."),
        retryable: t("这次没发出去，人还在队列里。", "Not sent. They stay in the queue."),
        gap: t("距上一条太近。", "Too soon after the last opener."),
        cap: t("今天的额度用完了。", "Today's cap is used."),
        hours: t("不在开口时段，队列留着。", "Outside the window; the queue stays."),
        gate: t("这个号总发送量到闸门了，今天别再开口。", "Overall send gate hit; no more openers today."),
        followup_cap: t("今天的跟进条数用完了。", "Today's follow-up quota is used."),
        followup_early: t("发出还不到 72 小时，先别催。", "Under 72h since the opener; wait."),
        followup_state: t("这个人现在不能跟进。", "This person is not follow-up eligible now.")
      };
      return OUT_NOTE[kind] || "";
    }

    async function composeAll(force) {
      var acct = $("gm-out-acct").value;
      if (!acct) return;
      $("gm-out-stats").textContent = t("AI 拟稿中…", "Drafting…");
      var r = await postJSON("/api/tg-members/outreach/compose", { account_id: acct, force: !!force });
      if (!r.ok) {
        $("gm-out-stats").textContent = (r.data && r.data.detail) || String(r.status);
      } else {
        var d = r.data || {};
        $("gm-out-stats").textContent = t("拟好 ", "Drafted ") + (d.composed || 0) +
          t(" 条（AI ", " (AI ") + (d.ai || 0) + t("，模板 ", ", template ") + (d.template || 0) + t("）", ")") +
          ((d.template || 0) > 0 && !(d.ai || 0) ? t(" · 全是模板：AI 没就绪或都没过守卫", " · all templates: AI unavailable or every draft failed the guard") : "");
      }
      loadOutreach();
    }

    async function redraftOne(key) {
      var m = _outCache[key];
      var acct = $("gm-out-acct").value;
      if (!m || !acct) return;
      var reset = false;
      if (m.opener_source === "manual") {
        reset = window.confirm(t("这条是你手改过的。放弃手改，让 AI 重新拟一句？",
          "This one was hand-edited. Discard your edit and let AI redraft?"));
        if (!reset) return;
      }
      var r = await postJSON("/api/tg-members/outreach/compose", {
        account_id: acct, force: true, reset_manual: reset,
        items: [{ group_id: m.group_id, user_id: m.user_id }]
      });
      if (!r.ok) $("gm-out-stats").textContent = (r.data && r.data.detail) || String(r.status);
      loadOutreach();
    }

    async function approveOne(key) {
      var m = _outCache[key];
      var acct = $("gm-out-acct").value;
      if (!m || !acct) return;
      var text = cardText(key);
      if (!text) { $("gm-out-stats").textContent = t("先写一句或点「AI 拟稿」", "Write a line or click AI draft first"); return; }
      var r = await postJSON("/api/tg-members/outreach/approve", {
        account_id: acct, items: [{ group_id: m.group_id, user_id: m.user_id, text: text }]
      });
      if (!r.ok) $("gm-out-stats").textContent = (r.data && r.data.detail) || String(r.status);
      else $("gm-out-stats").textContent = ($("gm-out-mode").value === "manual")
        ? t("已批准。手动模式下还要点「现在发这一条」。", "Approved. In manual mode click Send now.")
        : t("已批准，后台会在时段内发出。", "Approved; the scheduler sends it inside the window.");
      loadOutreach();
    }

    async function approveAll() {
      var acct = $("gm-out-acct").value;
      if (!acct) return;
      // 先把卡片里改过的文字落下去，再整队批准
      var items = [];
      Object.keys(_outCache).forEach(function (key) {
        var m = _outCache[key];
        if (m.outreach_state !== "queued") return;
        var text = cardText(key);

      if (!window.confirm(t("现在就用这个号发给 ", "Send now from this account to ") + (m.first_name || m.user_id) + "？\n\n" + text)) return;
      var r = await postJSON("/api/tg-members/outreach/release", {
        account_id: acct, group_id: m.group_id, user_id: m.user_id, text: text, confirm: true
      });
      var kind = (r.data && (r.data.detail || r.data.kind)) || "";
      var note = waitText(r.data) || outNote(r.data && r.data.kind) || outNote(kind) || kind || String(r.status);
      await loadOutreach();
      loadMembers();
      $("gm-out-stats").textContent = note;
    }

    async function stopOutreach() {
      var acct = $("gm-out-acct").value || "*";
      await api("/api/tg-members/outreach/stop", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ account_id: acct })
      });
      loadOutreach();
    }

    async function resumeOutreach() {
      var acct = $("gm-out-acct").value || "*";
      await api("/api/tg-members/outreach/resume", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ account_id: acct })
      });
      loadOutreach();
    }

    async function saveAge() {
      var acct = $("gm-out-acct").value;
      var days = parseFloat($("gm-out-age").value);
      if (!acct) return;
      if (isNaN(days)) days = 0;
      var r = await postJSON("/api/tg-members/outreach/age", { account_id: acct, days: days });
      _ageDirty = false;
      $("gm-out-stats").textContent = r.ok
        ? (days > 0 ? t("号龄已申报，开口额度按新号龄重算", "Account age saved; the daily ramp is recalculated")
                    : t("已撤销号龄申报", "Declared age cleared"))
        : ((r.data && r.data.detail) || String(r.status));
      loadOutreach();
    }

    // ── ② 群里先接话 ──
    var _gtCache = {};

    function gtKey(m) { return m.group_id + ":" + m.user_id; }

    function gtNote(kind) {
      var map = {
        flood: t("冷私聊会停一天，群里接话还能发", "Cold DMs stop for a day; group replies can continue"),
        peer_flood: t("冷私聊会停一天，群里接话还能发", "Cold DMs stop for a day; group replies can continue"),
        flood_wait: t("发得太密，等到点再发，不用停一整天", "Too fast; wait out the short timer, not a full day"),
        slowmode: t("群开着慢速模式，稍后再发", "The group is in slow mode; try again later"),
        group_denied: t("这个号在这个群发不了言，这个群不再列人", "This account cannot post in this group; it will not be listed again"),
        msg_gone: t("TA 那条消息已经没了", "Their message is gone"),
        retryable: t("没发出去，稍后再试", "Not sent; try again later")
      };
      return map[kind] || "";
    }

    function renderGtCard(m) {
      var key = gtKey(m);
      _gtCache[key] = m;
      var name = (m.first_name || "") + (m.last_name ? " " + m.last_name : "");
      return '<div class="ocard" data-gt-key="' + esc(key) + '"><div class="ohd"><div><b>' + esc(name || m.user_id) + "</b> " +
        (m.username ? '<span style="color:var(--dim)">@' + esc(m.username) + "</span> " : "") + esc(m.group_title || "") +
        ' <span class="pill ok">' + t("意向 ", "intent ") + esc(String(m.intent || 0)) + "：" + esc((m.intent_hits || []).join("、")) + "</span>" +
        (m.dm_blocked ? ' <span class="pill tpl" title="' + t("TA 设了隐私，私聊发不到，群里接话是唯一的路", "Privacy settings block DMs; a group reply is the only way") + '">' + t("私聊不可达", "DM blocked") + "</span>" : "") +
        "</div></div>" +
        '<div class="osaid">' + t("TA 在群里说：", "They said in the group: ") + "<q>" + esc(m.last_msg_text || "") + "</q>" +
        (m.last_msg_ts ? " <span>" + esc(ago(m.last_msg_ts)) + "</span>" : "") + "</div>" +
        '<textarea data-gt-text="' + esc(key) + '" maxlength="280" placeholder="' +
        t("点「AI 拟稿」或自己写一句公开回复：帮上忙、不推销、不放链接、不说私聊我", "Click AI draft or write a public reply: be helpful, no pitch, no links, no 'DM me'") + '">' +
        esc(m.gtouch_text || "") + "</textarea>" +
        '<div class="row"><button type="button" data-gt-act="compose" data-gt-k="' + esc(key) + '">' + t("AI 拟稿", "AI draft") + "</button>" +
        '<button type="button" class="primary" data-gt-act="send" data-gt-k="' + esc(key) + '">' + t("发到群里…", "Post in group…") + "</button>" +
        '<button type="button" data-gt-act="skip" data-gt-k="' + esc(key) + '">' + t("跳过", "Skip") + "</button></div>" +
        '<div class="gt-confirm" data-gt-confirm="' + esc(key) + '" hidden></div></div>';
    }

    function gtConfirmHtml(m, key, text) {
      return '<div class="msg" style="margin-top:0">' + t("在「", "Post publicly in \"") + esc(m.group_title || "") +
        t("」里公开回复，挂在 TA 这条下面：", "\", threaded under:") + " <q>" + esc(m.last_msg_text || "") + "</q></div>" +
        '<div style="margin:6px 0">' + t("你要发的：", "You will post: ") + "<q>" + esc(text) + "</q></div>" +
        '<div class="row" style="margin-bottom:0"><button type="button" class="primary" data-gt-act="confirm" data-gt-k="' + esc(key) + '">' +
        t("确认发出", "Post it") + "</button>" +
        '<button type="button" data-gt-act="cancel" data-gt-k="' + esc(key) + '">' + t("再改改", "Edit more") + "</button>" +
        '<span class="msg">' + t("群里所有人都看得到，发出后撤不回来", "Everyone in the group sees it; it cannot be taken back") + "</span></div>";
    }

    function gtGoto(where) {
      if (where === "extract") {
        var pull = $("gm-pull");
        if (pull) pull.open = true;
        var acct = $("gm-out-acct").value;
        var box = Array.prototype.slice.call(document.querySelectorAll(".gm-acct")).filter(function (c) { return c.value === acct; })[0];
        if (box && !box.checked) { box.checked = true; box.dispatchEvent(new Event("change")); }
        $("gm-extract").scrollIntoView({ behavior: "smooth", block: "start" });
      }
    }

    async function gtComposeAll() {
      var acct = $("gm-out-acct").value;
      var note = $("gm-gt-note");
      var keys = Object.keys(_gtCache).filter(function (k) {
        var ta = document.querySelector('[data-gt-text="' + CSS.escape(k) + '"]');
        return ta && !ta.value.trim();
      });
      if (!acct || !keys.length) { note.textContent = t("没有待拟稿的人", "Nobody left to draft"); return; }
      var btn = $("gm-gt-compose-all");
      btn.disabled = true;
      var ok = 0;
      for (var i = 0; i < keys.length; i++) {
        var m = _gtCache[keys[i]];
        note.textContent = t("AI 拟稿中 ", "Drafting ") + (i + 1) + "/" + keys.length + "…";
        var r = await postJSON("/api/tg-members/gtouch/compose", { account_id: acct, group_id: m.group_id, user_id: m.user_id });
        var ta = document.querySelector('[data-gt-text="' + CSS.escape(keys[i]) + '"]');
        if (r.ok && r.data && r.data.text && ta) { ta.value = r.data.text; ok++; }
        if (r.data && r.data.reason === "no_ai") break;
      }
      btn.disabled = false;
      note.textContent = t("拟好 ", "Drafted ") + ok + "/" + keys.length +
        t("。逐条看一眼再发；没拟出的自己写一句。", ". Read each before posting; write the rest yourself.");
    }

    function personaSalesHref(d) {
      var id = d && d.persona && d.persona.id;
      if (!id) return "/personas";
      return "/personas#profile=" + encodeURIComponent(id) + "&tab=style&focus=pe-sales-kw";
    }

    function loadGtouch() {
      var acct = ($("gm-out-acct") && $("gm-out-acct").value) || "";
      var box = $("gm-gt-list"), stats = $("gm-gt-stats"), sent = $("gm-gt-sent");
      if (!acct) { box.innerHTML = ""; sent.innerHTML = ""; stats.textContent = ""; return Promise.resolve(); }
      return api("/api/tg-members/gtouch/preview?account_id=" + encodeURIComponent(acct)).then(function (r) {
        if (!r.ok) { stats.textContent = (r.data && r.data.detail) || String(r.status); box.innerHTML = ""; return; }
        var d = r.data || {};
        _gtCache = {};
        var left = Math.max(0, (d.cap || 0) - (d.used_today || 0));
        var headline;
        if (d.hold === "paused") headline = t("这个号已急停。", "This account is stopped.");
        else if (d.gap_wait_sec > 0) headline = t("还要等 ", "Wait ") + Math.ceil(d.gap_wait_sec / 60) + t(" 分钟才能接下一条。", " min before the next reply.");
        else if (d.hours_ok === false) headline = t("现在不在可接话的时段。", "Outside the reply window.");
        else if (!d.intent_configured) {
          var pname = (d.persona && d.persona.name) || "";
          headline = (d.persona && d.persona.id)
            ? (pname
              ? t("「", "\"") + pname + t("」还没填目标客户。", "\" has no target customer.")
              : t("这个人设还没填目标客户。", "This persona has no target customer."))
            : t("这个号还没绑人设。", "This account has no persona.");
        }
        else headline = t("今天还能接 ", "Replies left today: ") + left + t(" 条。", ".");
        stats.textContent = headline;
        var more = $("gm-gt-stats-more");
        if (more) more.textContent = t("今天已接 ", "Replied today ") + (d.used_today || 0) + "/" + (d.cap || 0) +
          t(" · 每群每天最多 ", " · max per group/day ") + (d.group_cap || 0) +
          t(" · 只接 ", " · only messages from the last ") + (d.max_msg_age_hours || 0) + t(" 小时内的发言", " h") +
          (d.hold === "flood_wait" ? t(" · 短时等待到 ", " · short wait until ") + (clockFmt(d.hold_until) || "") : "") +
          (d.dm_hold === "flood" && !d.hold ? t(" · 冷私聊已停，这里还能发", " · cold DMs are stopped; group replies can continue") : "") +
          ((d.persona || {}).name ? t(" · 人设：", " · persona: ") + d.persona.name : "");
        var rows = d.candidates || [];
        if (!rows.length) {
          box.innerHTML = '<div class="empty">' + (d.intent_configured
            ? t("近 ", "Nothing to reply to in the last ") + (d.max_msg_age_hours || 48) +
              t(" 小时没有可接的话。", " h.") +
              ' <a href="#gm-extract" data-gt-goto="extract">' + t("去拉新人", "Pull more people") + "</a>"
            : t("填上意向关键词，这里才会列出可以接的人。", "Fill intent keywords and people to reply to will show up here.") +
              ' <a href="' + esc(personaSalesHref(d)) + '" target="_blank" rel="noopener">' +
              t("去填写意向关键词", "Fill intent keywords") + "</a>") + "</div>";
        } else {
          box.innerHTML = rows.map(renderGtCard).join("");
        }
        var done = d.sent || [];
        var reps = d.replies || [];
        var repHtml = reps.length
          ? '<div class="msg" style="margin-top:10px"><b>' + t("群里回你了（近 3 天）", "Replied to you in the group (last 3 days)") + "</b></div>" +
            reps.map(function (m) {
              var who = m.gtouch_reply_self ? esc(m.first_name || m.user_id) : t("群里别人", "someone else");
              var link = m.group_conversation_id
                ? ' · <a href="/workspace?conv=' + encodeURIComponent(m.group_conversation_id) + '" target="_blank" rel="noopener">' + t("去群里接着聊 ↗", "Continue in the group ↗") + "</a>"
                : "";
              return '<div class="msg">' + who + " · " + esc(m.group_title || "") + " · " +
                t("你：", "you: ") + "<q>" + esc(m.gtouch_text || "") + "</q> → " + t("回：", "reply: ") + "<q>" + esc(m.gtouch_reply_text || "") + "</q> · " +
                esc(ago(m.gtouch_reply_at)) + link + "</div>";
            }).join("")
          : "";
        sent.innerHTML = repHtml + (done.length
          ? '<div class="msg" style="margin-top:10px"><b>' + t("今天在群里接过的话", "Group replies today") + "</b></div>" +
            done.map(function (m) {
              return '<div class="msg">' + esc(m.first_name || m.user_id) + " · " + esc(m.group_title || "") + " · " +
                t("TA：", "they: ") + "<q>" + esc(m.last_msg_text || "") + "</q> → " + t("你：", "you: ") + "<q>" + esc(m.gtouch_text || "") + "</q> · " +
                esc(ago(m.gtouch_at)) + (m.gtouch_reply_self ? t(" · TA 在群里回了", " · they replied in the group") : "") + "</div>";
            }).join("")
          : "");
      }).catch(function () { stats.textContent = t("接话列表读取失败", "Could not load group replies"); });
    }

    async function gtAction(act, key) {
      var m = _gtCache[key];
      var acct = $("gm-out-acct").value;
      if (!m || !acct) return;
      var stats = $("gm-gt-note");
      var body = { account_id: acct, group_id: m.group_id, user_id: m.user_id };
      var ta = document.querySelector('[data-gt-text="' + CSS.escape(key) + '"]');
      if (act === "compose") {
        stats.textContent = t("AI 拟稿中…", "Drafting…");
        var r = await postJSON("/api/tg-members/gtouch/compose", body);
        if (r.ok && r.data && r.data.text) { if (ta) ta.value = r.data.text; stats.textContent = t("拟好了，看一眼再发", "Drafted; read it before posting"); }
        else stats.textContent = (r.data && r.data.detail) || t("AI 没拟出合适的，自己写一句", "AI could not draft a usable line; write one yourself");
        return;
      }
      if (act === "skip") {
        await postJSON("/api/tg-members/gtouch/skip", body);
        loadGtouch();
        return;
      }
      var cf = document.querySelector('[data-gt-confirm="' + CSS.escape(key) + '"]');
      if (act === "cancel") { if (cf) { cf.hidden = true; cf.innerHTML = ""; } if (ta) ta.focus(); return; }
      var text = ta ? ta.value.trim() : "";
      if (!text) { stats.textContent = t("先写一句或点「AI 拟稿」", "Write a line or click AI draft first"); return; }
      if (act === "send") {
        if (cf) { cf.innerHTML = gtConfirmHtml(m, key, text); cf.hidden = false; }
        return;
      }
      if (act !== "confirm") return;
      if (cf) cf.querySelectorAll("button").forEach(function (b) { b.disabled = true; });
      body.text = text;
      body.confirm = true;
      var s = await postJSON("/api/tg-members/gtouch/send", body);
      var kind = (s.data && s.data.kind) || "";
      var note = waitText(s.data) || gtNote(kind) || kind;
      if (s.ok && kind === "sent") {
        var hrs = (s.data && s.data.dm_after_hours) || 0;
        note = m.dm_blocked
          ? t("已发到群里。TA 设了隐私收不到私聊，等 TA 在群里回你或主动来私聊；来私聊会算进这条线的回音。",
              "Posted in the group. Their privacy settings block DMs, so wait for them to reply in the group or DM you; a DM from them counts as a reply here.")
          : t("已发到群里。", "Posted in the group. ") +
            (hrs ? t(hrs + " 小时后这个人排到私聊开口最前面", "In " + hrs + " h this person moves to the front of the DM queue") : t("这个人排到私聊开口最前面", "This person moves to the front of the DM queue")) +
            ((s.data && s.data.requeued)
              ? ($("gm-out-mode").value === "auto"
                  ? t("；TA 排着的私聊开场已退回，后台会重拟成接上群里这句的版本。", "; their queued DM opener was sent back and will be redrafted to pick up this reply.")
                  : t("；TA 排着的私聊开场已退回重拟，会接上群里这句，拟好后要重新批准。", "; their queued DM opener was sent back for a redraft that picks up this reply. Approve it again once drafted."))
              : t("。", "."));
      }
      if (s.data && s.data.requeued) await loadOutreach(); else await loadGtouch();
      stats.textContent = s.ok ? note : (waitText(s.data) || (s.data && s.data.detail) || String(s.status));
    }

    function doExport() {
      var gid = $("gm-mgroup").value;
      if (!gid) return;
      window.open("/api/tg-members/members/export?group_id=" + encodeURIComponent(gid) +
        "&only=" + encodeURIComponent($("gm-monly").value), "_blank");
    }

    async function init() {
      setText();
      // 探一下功能状态（quota 端点：403=未开启；其它非 200=后端未就绪/维护中）
      var probe = await api("/api/tg-members/quota");
      if (!probe.ok) {
        var b = $("gm-disabled");
        b.hidden = false;
        if (probe.status === 403) {
          b.textContent = t(
            "群成员提取未开启：打开开发者工具，在「内部功能显隐」勾选「群成员提取」，然后刷新本页。",
            "Group member extraction is off. Open Developer Tools, tick Group member extraction under Internal feature visibility, then refresh.");
        } else {
          b.textContent = t(
            "群成员提取正在就绪（后端需一次重启加载最新组件），请稍后再试。",
            "Group member extraction is initializing (pending a service restart to load the latest build); please retry shortly.");
        }
      }
      $("gm-start").addEventListener("click", startExtract);
      $("gm-refresh").addEventListener("click", loadMembers);
      $("gm-export").addEventListener("click", doExport);
      $("gm-out-acct").addEventListener("change", function () { loadGtouch(); loadOutreach(); });
      $("gm-out-mode").addEventListener("change", changeMode);
      $("gm-out-persona-sel").addEventListener("change", savePersona);
      $("gm-out-queue").addEventListener("click", buildOutreachQueue);
      $("gm-out-compose").addEventListener("click", function () { composeAll(false); });
      $("gm-out-approve-all").addEventListener("click", approveAll);
      $("gm-out-stop").addEventListener("click", stopOutreach);
      $("gm-out-resume").addEventListener("click", resumeOutreach);
      $("gm-out-save").addEventListener("click", saveSettings);
      $("gm-out-stats-days").addEventListener("change", loadStats);
      $("gm-out-stats-scope").addEventListener("change", loadStats);
      ["gm-out-h0", "gm-out-h1", "gm-out-cap"].forEach(function (id) {
        $(id).addEventListener("input", function () { _settingsDirty = true; });
      });
      $("t-out-age-l").textContent = t("这个号的真实号龄（天）", "Real account age (days)");
      $("gm-out-age-save").textContent = t("申报", "Save");
      $("gm-out-age").addEventListener("input", function () { _ageDirty = true; });
      $("gm-out-age-save").addEventListener("click", saveAge);
      $("t-gtouch").textContent = t("在群里接话", "Reply in the group");
      $("t-gtouch-l").textContent = t(
        "先从这里开始。用上面选的号，在群里公开回复有意向的人刚说的那句（挂在 TA 那条下面）：先帮上忙，过几个小时再私聊。" +
        "冷私聊被停的时候，这里仍然可以发。只逐条点发，不会自动刷屏；每号每天 5 条、每群每天 2 条。",
        "Start here. Using the account picked above, reply publicly to a recent message from someone with intent (threaded under their message), then DM a few hours later. " +
        "This still works when cold DMs are stopped. One confirmation at a time, never an automatic blast; 5 per account and 2 per group per day.");
      $("gm-gt-refresh").textContent = t("刷新", "Refresh");
      $("gm-gt-refresh").addEventListener("click", loadGtouch);
      $("gm-gt-compose-all").addEventListener("click", gtComposeAll);
      $("gm-gt-list").addEventListener("click", function (e) {
        var b = e.target.closest("[data-gt-act]");
        if (b) gtAction(b.getAttribute("data-gt-act"), b.getAttribute("data-gt-k"));
      });
      $("gm-gtouch").addEventListener("click", function (e) {
        var a = e.target.closest("[data-gt-goto]");
        if (!a) return;
        e.preventDefault();
        gtGoto(a.getAttribute("data-gt-goto"));
      });
      $("gm-mgroup").addEventListener("change", loadMembers);
      $("gm-monly").addEventListener("change", loadMembers);
      $("gm-mq").addEventListener("keydown", function (e) { if (e.key === "Enter") loadMembers(); });
      $("gm-msort").addEventListener("change", loadMembers);
      $("gm-group-sel").addEventListener("change", _updateGroupNote);
      $("gm-eg-refresh").addEventListener("click", function () {
        selectedAccounts().forEach(function (a) { delete _extractGroupsCache[a]; });
        onAccountsChanged();
      });
      $("gm-group-adv-toggle").addEventListener("click", function (e) {
        e.preventDefault();
        var adv = $("gm-group-adv");
        adv.hidden = !adv.hidden;
      });
      loadAccounts();
      loadJobs();
      loadGroups();
      loadStats();
    }

    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", init);
    } else { init(); }
  })();
  </script>
{% endblock %}
