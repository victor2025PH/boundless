<!DOCTYPE html>
<html lang="{{ 'zh-CN' if (ui_lang|default('zh'))=='zh' else 'en-US' }}" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{ (i18n or {}).get('lg_s000', "登录") }} · {{ product_name|default((i18n or {}).get('brand.product', '智聊')) }}</title>
{% include "_brand_head.html" %}
<!-- 无界品牌令牌 SSOT（--bl-*，由 platform/brand/brand.css 同步而来）：认证表面的
     主色/渐变全部派生自它，与工作台 --tk-brand 同源，消掉「登录页紫、进去变蓝」。 -->
<link rel="stylesheet" href="/static/brand/brand.css?v=20260730a">
<link rel="stylesheet" href="/static/brand/brand-fonts.css?v=20260730a"><!-- 品牌拉丁字 Montserrat（CJK 自动回落系统字），与工作台同一字形 -->
<link rel="stylesheet" href="/static/brand/brand-lockup.css">
<link rel="stylesheet" href="/static/brand/auth-surface.css?v=20260730b"><!-- 认证表面品牌层（单一源）；勿在下方内联 <style> 重复定义 --p/--ps/--g、body 字体、orb 底色 -->
<link rel="stylesheet" href="/static/fonts/inter.css"><!-- 自托管 Inter；离线可用，替代原 Google Fonts 外链 -->
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
/* 只放**中性表面**变量。主色 --p/--ps/--g、body 字体、orb 底色由
   /static/brand/auth-surface.css 独占 —— 内联 <style> 排在那个 <link> 之后、
   特异性相同，在这里重复定义会把品牌层整份覆盖掉（历史上它就是这么失效的）。 */
:root{
  --bg:#eef1f8;--card:#fff;--t:#111827;--t2:#6b7280;--bd:rgba(0,0,0,.09);
  --input:#f4f6fc;--red:#ef4444;--rs:rgba(239,68,68,.1);
}
[data-theme="dark"]{
  --bg:#080c14;--card:rgba(15,21,36,.9);--t:#e2e8f0;--t2:#94a3b8;--bd:rgba(255,255,255,.07);
  --input:rgba(20,28,46,.8);
}
body{background:var(--bg);color:var(--t);min-height:100vh;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;transition:background .3s}
[data-theme="dark"] body{background:#080c14}
/* animated orbs */
.orb{position:fixed;border-radius:50%;filter:blur(80px);opacity:.35;pointer-events:none;animation:float linear infinite}
/* orb 底色见 auth-surface.css（品牌三系光环：智连蓝 / brand cyan / 幻境紫）；
   这里只留几何与动画，别把 background 写回来。 */
.orb1{width:520px;height:520px;top:-180px;left:-180px;animation-duration:22s}
.orb2{width:440px;height:440px;bottom:-160px;right:-140px;animation-duration:18s;animation-direction:reverse}
.orb3{width:300px;height:300px;top:50%;left:60%;animation-duration:26s;opacity:.2}
@keyframes float{0%{transform:translate(0,0) rotate(0)}33%{transform:translate(30px,-20px) rotate(120deg)}66%{transform:translate(-20px,25px) rotate(240deg)}100%{transform:translate(0,0) rotate(360deg)}}
/* card */
.login-card{position:relative;z-index:10;background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:2.6rem 2.4rem 2.4rem;width:380px;max-width:90vw;box-shadow:0 20px 60px rgba(0,0,0,.15),0 0 0 1px var(--bd);animation:up .5s cubic-bezier(.4,0,.2,1)}
[data-theme="dark"] .login-card{backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);background:rgba(14,20,35,.88);box-shadow:0 24px 64px rgba(0,0,0,.7)}
@keyframes up{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
/* logo — see /static/brand/brand-lockup.css */
.logo{margin-bottom:0}
/* form */
.f-lbl{display:block;font-size:.8rem;font-weight:600;color:var(--t2);margin-bottom:.45rem}
.f-inp-wrap{position:relative;margin-bottom:1.3rem}
.f-inp{width:100%;padding:.62rem .95rem;border:1.5px solid var(--bd);border-radius:10px;font-size:.9rem;font-family:inherit;background:var(--input);color:var(--t);outline:none;transition:all .2s}
.f-inp:focus{border-color:var(--p);box-shadow:0 0 0 3px var(--ps)}
.eye-btn{position:absolute;right:.8rem;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--t2);display:flex;align-items:center;padding:.2rem}
.eye-btn svg{width:16px;height:16px}
/* submit */
/* 按钮光晕见 auth-surface.css（--bl-shadow-primary）；此处不再硬编码 periwinkle 光 */
.btn-login{width:100%;padding:.7rem;background:var(--g);color:#fff;border:none;border-radius:10px;font-size:.95rem;font-weight:700;font-family:inherit;cursor:pointer;transition:all .2s;position:relative;overflow:hidden}
.btn-login:hover{transform:translateY(-1px)}
.btn-login:active{transform:translateY(0)}
/* error */
.err{background:rgba(239,68,68,.1);color:#ef4444;border:1px solid rgba(239,68,68,.2);border-radius:9px;padding:.6rem .9rem;font-size:.83rem;font-weight:500;margin-bottom:1rem;display:flex;align-items:center;gap:.5rem}
.err svg{width:15px;height:15px;flex-shrink:0}
/* footer */
.login-foot{text-align:center;margin-top:1.2rem}
.th-link{background:none;border:none;cursor:pointer;font-size:.8rem;color:var(--t2);font-family:inherit;transition:.2s;padding:.3rem .5rem;border-radius:6px}
.th-link:hover{color:var(--p);background:var(--ps)}
</style>
</head>
<body>
<div class="orb orb1"></div>
<div class="orb orb2"></div>
<div class="orb orb3"></div>

<div class="login-card">
  <div class="logo">
    {% with variant='login' %}{% include "_brand_lockup.html" %}{% endwith %}
  </div>
  {% if error %}
  <div class="err">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
    {{ error }}
  </div>
  {% endif %}
  {% if has_users %}
  <!-- Multi-user login -->
  <form method="post" action="/login" id="form-user">
    <div class="f-inp-wrap" style="margin-bottom:.9rem">
      <label class="f-lbl">{{ (i18n or {}).get('set_js_075', "用户名") }}</label>
      <input class="f-inp" type="text" name="username" placeholder="{{ (i18n or {}).get('set_js_075', '用户名') }}" required autofocus autocomplete="username">
    </div>
    <div class="f-inp-wrap">
      <label class="f-lbl">{{ (i18n or {}).get('us_s012', "密码") }}</label>
      <input class="f-inp" type="password" id="pwd-inp" name="password" placeholder="{{ (i18n or {}).get('us_s012', '密码') }}" required autocomplete="current-password">
      <button type="button" class="eye-btn" onclick="togglePwd()">
        <svg id="eye-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
      </button>
    </div>
    <button type="submit" class="btn-login">{{ (i18n or {}).get('login_btn', '登 录') }}</button>
    <div style="text-align:center;margin-top:.8rem">
      <button type="button" class="th-link" onclick="toggleLoginMode()" style="font-size:.75rem">{{ (i18n or {}).get('lg_s002', "使用 Token 登录") }}</button>
    </div>
  </form>
  <!-- Token login (hidden by default) -->
  <form method="post" action="/login" id="form-token" style="display:none">
    <label class="f-lbl">{{ (i18n or {}).get('lg_s006', '管理密码') }}</label>
    <div class="f-inp-wrap">
      <input class="f-inp" type="password" id="pwd-inp2" name="auth_token" placeholder="{{ (i18n or {}).get('lg_s003', '请输入访问令牌') }}" autocomplete="current-password">
    </div>
    <button type="submit" class="btn-login">{{ (i18n or {}).get('login_btn', '登 录') }}</button>
    <div style="text-align:center;margin-top:.8rem">
      <button type="button" class="th-link" onclick="toggleLoginMode()" style="font-size:.75rem">{{ (i18n or {}).get('lg_s004', "使用帐号密码登录") }}</button>
    </div>
  </form>
  {% else %}
  <form method="post" action="/login">
    <label class="f-lbl">{{ (i18n or {}).get('lg_s006', '管理密码') }}</label>
    <div class="f-inp-wrap">
      <input class="f-inp" type="password" id="pwd-inp" name="auth_token" placeholder="{{ (i18n or {}).get('lg_s003', '请输入访问令牌') }}" required autofocus autocomplete="current-password">
      <button type="button" class="eye-btn" onclick="togglePwd()">
        <svg id="eye-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
      </button>
    </div>
    <button type="submit" class="btn-login">{{ (i18n or {}).get('login_btn', '登 录') }}</button>
  </form>
  {% endif %}
  <div class="login-foot">
    <button class="th-link" onclick="toggleTheme()">🌓 {{ (i18n or {}).get('lg_s005', "切换深色 / 浅色") }}</button>
    <a class="th-link" style="text-decoration:none" href="/set_lang?lang={{ 'en' if (ui_lang|default('zh'))=='zh' else 'zh' }}">🌐 {{ (i18n or {}).get('lang_switch_label', '切换语言') }} ({{ 'EN' if (ui_lang|default('zh'))=='zh' else 'ZH' }})</a>
  </div>
</div>

<script>
/* 主题偏好与工作台同源：工作台读 localStorage('cp_theme')（auto|light|dark），
   而本页原先只认另一把键 'theme' —— 于是「坐席在工作台设了暗色，登录页仍刷成白的」。
   读：cp_theme 优先（auto=跟随系统），回落旧键 theme；写：两把键都写，双向生效。 */
(function(){
  function sysDark(){try{return window.matchMedia&&window.matchMedia('(prefers-color-scheme:dark)').matches}catch(_){return false}}
  var p=null;try{p=localStorage.getItem('cp_theme')||localStorage.getItem('theme')}catch(_){}
  document.documentElement.setAttribute('data-theme',(!p||p==='auto')?(sysDark()?'dark':'light'):p);
})();
function toggleTheme(){
  var h=document.documentElement,n=h.getAttribute('data-theme')==='dark'?'light':'dark';
  h.setAttribute('data-theme',n);
  try{localStorage.setItem('cp_theme',n);localStorage.setItem('theme',n)}catch(_){}
}
function togglePwd(){
  const i=document.getElementById('pwd-inp')||document.getElementById('pwd-inp2');
  if(!i)return;
  i.type=i.type==='password'?'text':'password';
  const icon=document.getElementById('eye-icon');
  if(icon)icon.innerHTML=i.type==='password'?'<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>':'<path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>';
}
function toggleLoginMode(){
  const fu=document.getElementById('form-user'),ft=document.getElementById('form-token');
  if(!fu||!ft)return;
  if(fu.style.display==='none'){fu.style.display='';ft.style.display='none'}
  else{fu.style.display='none';ft.style.display=''}
}
</script>
</body>
</html>
