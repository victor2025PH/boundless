# Example only. deploy_controller.sh does not install this file.
#
# Production already has a tighter hand-installed limit: 6r/m burst 5 on
# `location = /fleet/api/fleet/enroll`, in
# /etc/nginx/snippets/chatx-fleet-enroll-ratelimit.conf and
# /etc/nginx/conf.d/fleet-ratelimit.conf. This example is 10r/m burst 4 and is
# not a copy of that live config. Batch office installs must stay under 6/min
# per egress IP or the live zone returns 429.
#
# A whole room shares one public IP. Poll is every 15s per PC, so that zone stays loose.
# Paste the zone lines into http {}. Paste the locations into the server, before `location ^~ /fleet/api/`.

# --- paste into http { } ---
limit_req_zone $binary_remote_addr zone=fleet_enroll:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=fleet_enroll_poll:10m rate=30r/s;
limit_req_status 429;

# --- server { }  (uncomment limit_req together with the zones above) ---
location = /fleet/api/fleet/enroll {
    limit_req zone=fleet_enroll burst=4 nodelay;
    proxy_pass         http://127.0.0.1:18798/api/fleet/enroll;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
    client_max_body_size 1m;
}

location = /fleet/api/fleet/enroll/poll {
    limit_req zone=fleet_enroll_poll burst=60 nodelay;
    proxy_pass         http://127.0.0.1:18798/api/fleet/enroll/poll;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
    client_max_body_size 1m;
}
