# Example only. deploy_controller.sh does not install this file, and nothing here is applied
# to production by this repo.
#
# A whole room shares one public IP. Poll is every 15s per PC, so that zone stays loose.
# The enroll zone is the tight one (code guessing). Paste the zone lines into http {}.
# Paste the locations into the bd2026.cc server, before `location ^~ /fleet/api/`.

# --- paste into http { } ---
limit_req_zone $binary_remote_addr zone=fleet_enroll:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=fleet_enroll_poll:10m rate=30r/s;
limit_req_status 429;

# --- server { }  (uncomment limit_req together with the zones above) ---
location = /fleet/api/fleet/enroll {
    limit_req zone=fleet_enroll burst=4 nodelay;
    proxy_pass         http://127.0.0.1:18798/api/fleet/enroll;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
    client_max_body_size 1m;
}

location = /fleet/api/fleet/enroll/poll {
    limit_req zone=fleet_enroll_poll burst=60 nodelay;
    proxy_pass         http://127.0.0.1:18798/api/fleet/enroll/poll;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
    client_max_body_size 1m;
}
