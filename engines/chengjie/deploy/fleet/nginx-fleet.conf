# nginx-fleet.conf -- 智控主控反代。两段，按需各自启用：
#
# A) 主站 bd2026.cc 内的 /fleet/ 前缀（节点 Agent + 独立下载/安装页）——挂进现有 server{} 块：
#      include /etc/nginx/snippets/chatx-fleet-main.conf;
#    只新增 /fleet/ 一个前缀，官网其余 location（Next.js 3000）一律不动。
#    Agent 的 controller_url = https://bd2026.cc/fleet，它请求 <controller_url>/api/fleet/...
#    → 公网路径 /fleet/api/fleet/... → 后端 /api/fleet/...（下面第一条 location 做前缀剥离）。
#    下载物走官网静态目录 /downloads/fleet/（website/public/downloads/fleet/，publish_agent.ps1 上传）。
#
# B) 控制台子域 fleet.bd2026.cc（操作员登录 / 控制台 / 静态资源整站反代）——独立 server{}：
#    控制台要用 web_admin 的 /login、/static/ 等非 /fleet 前缀路径，不能塞进主站，用子域整站代理最干净。
#    证书：certbot --nginx -d fleet.bd2026.cc（属改生产，需授权）。
#
# Agent 长轮询 /api/fleet/tasks/pull?wait=25 → proxy_read_timeout 必须 > 25s（这里 60s）。

# ───────── A) /etc/nginx/snippets/chatx-fleet-main.conf ─────────
location ^~ /fleet/api/ {
    proxy_pass         http://127.0.0.1:18798/api/;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
    proxy_buffering    off;
    client_max_body_size 2m;
    # 注册 / 心跳按 IP 限速可在此加 limit_req（zone 需在 http{} 定义），首版不加，避免误伤同一出口的机房整排电脑
}

location /fleet/ {
    proxy_pass         http://127.0.0.1:18798/fleet/;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
}

location = /fleet {
    return 301 /fleet/;
}

