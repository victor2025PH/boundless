# Example fail2ban filter. Not installed by deploy_controller.sh.
# The live jail on the production VPS is already installed by hand; see FLEET_DEPLOY.md.
# Matches only guesses and a real code/room lockout:
#   fleet enroll_fail ip=1.2.3.4 reason=bad_code
#   fleet enroll_fail ip=1.2.3.4 reason=bad_room_key
#   fleet enroll_fail ip=1.2.3.4 reason=lockout
# exhausted, expired, revoked, and the pending-queue rate limit are not bans.
# A whole room behind one NAT retrying an expired key must not drop existing nodes.

[Definition]
failregex = fleet enroll_fail ip=<HOST> reason=(?:bad_code|bad_room_key|lockout)\b
ignoreregex =
datepattern = {^LN-BEG}%%Y-%%m-%%d[ T]%%H:%%M:%%S
