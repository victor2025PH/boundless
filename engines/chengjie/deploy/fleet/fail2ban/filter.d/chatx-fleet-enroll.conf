# Example fail2ban filter. Not installed by deploy_controller.sh.
# Matches the controller log line:
#   fleet enroll_fail ip=1.2.3.4 reason=bad_code
# Copy to /etc/fail2ban/filter.d/chatx-fleet-enroll.conf when you choose to enable it.

[Definition]
failregex = fleet enroll_fail ip=<HOST> reason=\S+
ignoreregex =
datepattern = {^LN-BEG}%%Y-%%m-%%d[ T]%%H:%%M:%%S
