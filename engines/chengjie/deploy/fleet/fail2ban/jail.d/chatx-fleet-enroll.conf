# Example jail. Not installed by deploy_controller.sh and not applied on the VPS from this repo.
# The controller writes "fleet enroll_fail ip=<ip> reason=<token>" to stdout (journald).
# Server-side lockout is already 8 code failures / 10 minutes per IP; this jail is the network ban.
# Set enabled = true only after the filter file is installed. Leave it false in git.

[chatx-fleet-enroll]
enabled = false
backend = systemd
filter = chatx-fleet-enroll
journalmatch = _SYSTEMD_UNIT=chatx-fleet.service
maxretry = 8
findtime = 600
bantime = 3600
port = http,https
