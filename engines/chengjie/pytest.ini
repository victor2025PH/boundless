[pytest]
testpaths = tests
asyncio_mode = auto
addopts = -p no:warnings --tb=short -m "not benchmark"
markers =
    benchmark: 性能基准测试（默认 CI 跳过；显式 -m benchmark 才跑）
    packaging: 种子边车交付物（要 node_modules 与随包 Chromium）。单元回归作业用 -m "not packaging" 排除；打包检查作业装完边车再跑。不在 pytest.ini 的 addopts 里排除，免得本地默认收集把它丢掉。
