<!DOCTYPE html>
<!-- 单一前端 App 壳(三层架构 §6)。唯一一份业务 UI,网页与桌面壳 iframe 共用。
     入口参数:?theme=light|dark · ?cid=<conversation_id> · #token=<bearer>
     驱动:postMessage({type:'cp-context', conversationId, chatKey, platform, accountId, caps?, customer?}) 由宿主壳喂入会话。
     宿主指令:postMessage({type:'cp-cmd', cmd:'focus-draft'|'focus-voice'|'set-tab'|'set-theme', tab?, theme?}) 供壳浮钮深链/主题热切。
     (set-theme:宿主切亮暗时热同步——?theme= 只在 iframe 加载那一刻读一次,没有这条指令,
      宿主切亮色后本壳永远停在加载时的主题,2026-08-17「亮色下右栏仍暗」实锤。)
     回吐宿主:cp-ready / cp-fill / cp-send。
     单一来源 shared/copilot/,网页挂 /copilot/app.html。 -->
<html lang="zh" data-cp-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Copilot</title>
  <link rel="stylesheet" href="/copilot/tokens.css" />
  <link rel="stylesheet" href="/copilot/theme-dark.css?v=20260831g" />
  <link rel="stylesheet" href="/copilot/theme-light.css?v=20260831g" />
  <style>
    html, body { margin: 0; height: 100%; background: var(--cp-bg, #f8fafc); }
    /* 文档级(shadow 外)内滚区统一细滚动条：thumb 随主题、track 透明；
       shadow 内由 cp-panel-base BASE_CSS 同规格注入，两层观感一致。 */
    * { scrollbar-width: thin; scrollbar-color: var(--cp-sb-thumb, rgba(100,116,139,.45)) transparent; }
    body { font-family: 'Inter','PingFang SC','Microsoft YaHei',system-ui,sans-serif;
           color: var(--cp-text, #1e293b); display: flex; flex-direction: column; }
    .cp-app { flex: 1; min-height: 0; overflow-y: auto; padding: var(--cp-gap, 10px);
              display: flex; flex-direction: column; gap: var(--cp-gap, 10px); }
    .cp-app > h4, .cp-sec > h4 { font-size: var(--cp-fs-sm, 12px); color: var(--cp-text-dim, #64748b);
                   margin: 2px 0; text-transform: uppercase; letter-spacing: .04em; }
    .cp-app-empty { color: var(--cp-text-tiny, #94a3b8); font-size: var(--cp-fs-sm, 12px);
                    text-align: center; padding: 24px 8px; }
    /* 三 tab(回复/洞察/客户),与网页/桌面同款 */
    .cp-tabs { display: flex; gap: 4px; flex-shrink: 0; border-bottom: 1px solid var(--cp-border, #e2e8f0);
               padding: 0 0 0 0; position: sticky; top: 0; background: var(--cp-bg, #f8fafc); z-index: 2; }
    .cp-tab { flex: 1; font: inherit; font-size: 12px; cursor: pointer; padding: 8px 0; border: none;
              background: transparent; color: var(--cp-text-dim, #64748b); border-bottom: 2px solid transparent;
              transition: color .15s, border-color .15s; white-space: nowrap;
              display: inline-flex; align-items: center; justify-content: center; gap: 4px; min-width: 0; overflow: hidden; }
    .cp-tab:hover { color: var(--cp-text, #1e293b); }
    .cp-tab.active { color: var(--cp-accent, #6366f1); border-bottom-color: var(--cp-accent, #6366f1); font-weight: 600; }
    .cp-tab-ic { display: inline-flex; align-items: center; flex-shrink: 0; opacity: .85; }
    .cp-tab.active .cp-tab-ic { opacity: 1; }
    /* i18n P0 UX（2026-08-20）：EN 标签比 zh 长 1.5-2.5 倍，窄壳（≤400px）曾把
       "Reply desk" 硬剪成 "Reply desl"（无省略号暗示）；label 允许收缩省略，全名走 title */
    .cp-tab > span[data-cp-i18n] { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
    /* tab 状态圆点（P2，与网页 ws-cp-tab-badge 同构）：草稿高风险=红、关系冲突/链失败=按 tone */
    .cp-tab-badge { display: inline-block; width: 7px; height: 7px; border-radius: 50%;
                    background: var(--cp-danger, #dc2626); font-size: 0; line-height: 0; flex-shrink: 0; }
    .cp-tab-badge:empty { display: none; }
    .cp-tab-badge.warn { background: var(--cp-warn, #d97706); }
    .cp-tab-badge.accent { background: var(--cp-accent, #6366f1); }
    .cp-sec { display: none; flex-direction: column; gap: var(--cp-gap, 10px); }
    .cp-sec.active { display: flex; }
    /* AI 对话分析 */
    .cp-analyze-btn { font: inherit; font-size: 12px; cursor: pointer; padding: 6px 10px; border-radius: 8px;
                      border: 1px solid var(--cp-accent, #6366f1); background: var(--cp-accent, #6366f1); color: #fff; }
    .cp-analyze-btn[disabled] { opacity: .6; cursor: default; }
    .cp-analyze-box { font-size: 12px; line-height: 1.5; }
    .cp-summary { background: var(--cp-bg-soft, #f1f5f9); border-left: 3px solid var(--cp-accent, #6366f1);
                  padding: 6px 8px; border-radius: 4px; margin-bottom: 6px; color: var(--cp-text, #1e293b); }
    .cp-chips { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 6px; }
    .cp-chip { font-size: 11px; padding: 2px 7px; border-radius: 10px; background: var(--cp-bg-soft, #f1f5f9);
               color: var(--cp-text-dim, #64748b); }
    .cp-chip.danger { background: rgba(239,68,68,.14); color: #dc2626; }
    .cp-rep { border: 1px solid var(--cp-border, #e2e8f0); border-radius: 8px; padding: 7px 9px; margin-bottom: 5px; }
    .cp-rep .it-meta { font-size: 10px; color: var(--cp-text-tiny, #94a3b8); margin-bottom: 3px; }
    .cp-rep-acts { display: flex; gap: 6px; margin-top: 5px; }
    .cp-rep-acts button { font: inherit; font-size: 11px; cursor: pointer; padding: 3px 8px; border-radius: 6px;
                          border: 1px solid var(--cp-border, #e2e8f0); background: var(--cp-bg-soft, #f1f5f9);
                          color: var(--cp-text, #1e293b); }
    .cp-cust-row { display: flex; justify-content: space-between; gap: 8px; padding: 4px 0;
                   border-bottom: 1px solid var(--cp-border, #e2e8f0); font-size: 12px; }
    .cp-cust-row .k { color: var(--cp-text-dim, #64748b); }
    .cp-cust-row .v { color: var(--cp-text, #1e293b); text-align: right; word-break: break-all; }
    /* 可折叠卡片（与网页 unified_inbox 同款；核心逻辑复用 sidebar-chrome.createCardController） */
    .cp-card { border: 1px solid var(--cp-border, #e2e8f0); border-radius: 10px; background: var(--cp-surface, #fff); overflow: hidden; }
    .cp-card-hd { display: flex; align-items: center; gap: 8px; width: 100%; padding: 9px 12px;

                  color: var(--cp-text, #1e293b); transition: background .12s; }
    .cp-card-hd:hover { filter: brightness(0.98); }
    .cp-card-ttl { flex: 1; min-width: 0; font-size: 12px; font-weight: 700; color: var(--cp-text, #1e293b);

    .cp-card-ic { display: inline-flex; align-items: center; vertical-align: middle; margin-right: 5px; color: var(--cp-text-dim, #64748b); opacity: .88; flex-shrink: 0; }
    .cp-card-pill { flex-shrink: 0; font-size: 10px; font-weight: 600; color: var(--cp-accent, #6366f1);
                    background: rgba(99,102,241,.12); border-radius: 999px; padding: 1px 8px; line-height: 1.6; }
    .cp-card-pill:empty { display: none; }
    .cp-card-pill.pill-ok { color: #16a34a; background: rgba(22,163,74,.14); }
    .cp-card-pill.pill-warn { color: #d97706; background: rgba(217,119,6,.16); }
    .cp-card-pill.pill-danger { color: #dc2626; background: rgba(220,38,38,.14); }
    .cp-card-chev { flex-shrink: 0; width: 7px; height: 7px; border-right: 2px solid var(--cp-text-tiny, #94a3b8);
                    border-bottom: 2px solid var(--cp-text-tiny, #94a3b8); transform: rotate(45deg); transition: transform .18s; margin-right: 1px; }
    .cp-card.collapsed .cp-card-chev { transform: rotate(-45deg); }
    .cp-card-bd { padding: 10px 12px; }
    .cp-card.collapsed .cp-card-bd { display: none; }
    /* ── 空态卡（P0 2026-08-12）：无会话时 tabs 仍常显可点，各 tab 出各自引导，
         替代旧「等待会话上下文…」一行灰字（被误读成死按钮的根因之一） ── */
    .cp-empty-card { display: none; }
    .cp-app.no-ctx .cp-empty-card { display: flex; flex-direction: column; align-items: center; gap: 7px;
      text-align: center; padding: 30px 14px; border: 1px dashed var(--cp-border, #e2e8f0);
      border-radius: 12px; background: var(--cp-surface, #fff); }
    .cp-empty-card .cp-empty-ic { color: var(--cp-text-tiny, #94a3b8); opacity: .8; }
    .cp-empty-card .ttl { font-size: 13px; font-weight: 700; color: var(--cp-text, #1e293b); }
    .cp-empty-card .sub { font-size: 12px; line-height: 1.7; max-width: 250px; color: var(--cp-text-dim, #64748b); }
    /* 无会话时隐藏业务卡（内容都是空壳），只留空态引导（账号管理已出滚动流：tabs 行入口 + 空态 CTA） */
    .cp-app.no-ctx .cp-sec > .cp-card { display: none; }
    /* 翻译工具卡弱会话依赖（2026-08-17 工具箱重组）：无会话也可用，豁免 no-ctx 隐藏 */
    .cp-app.no-ctx .cp-sec > .cp-card[data-cp-card="xlate"] { display: block; }
    /* 生成图片/智能养号同为弱会话依赖（2026-08-22 App 收敛）：无会话也可生成/配置，
       豁免 no-ctx；:not([hidden]) 保住桌面壳运行时 hidden（display:block 会压过 UA
       [hidden] 规则——tgm 入口卡踩过的坑，勿去掉） */
    .cp-app.no-ctx .cp-sec > .cp-card[data-cp-card="image"]:not([hidden]),
    .cp-app.no-ctx .cp-sec > .cp-card[data-cp-card="nurture"]:not([hidden]) { display: block; }
    /* 回复台一次性搬家提示（语音/人设/知识库迁工具箱）：localStorage 记忆，点掉即走 */
    .cp-moved-hint { display: flex; align-items: center; gap: 7px; padding: 6px 10px;
      font-size: 11px; line-height: 1.5; color: var(--cp-text-dim, #64748b);
      background: var(--cp-bg-soft, #f1f5f9); border: 1px dashed var(--cp-border, #e2e8f0);
      border-radius: 8px; }
    .cp-moved-hint[hidden] { display: none; }
    .cp-moved-hint .mh-txt { flex: 1; min-width: 0; }
    .cp-moved-hint button { font: inherit; font-size: 11px; cursor: pointer; flex-shrink: 0;
      border: 1px solid var(--cp-border, #e2e8f0); background: var(--cp-surface, #fff);
      color: var(--cp-text, #1e293b); border-radius: 6px; padding: 2px 8px; }
    .cp-moved-hint button:hover { border-color: var(--cp-accent, #6366f1); color: var(--cp-accent, #6366f1); }
    /* 空态能力橱窗（P2 2026-08-12）：数据单源 /copilot/cp-capabilities.js——把「还没选会话」
       的空白第一屏变成差异化能力曝光（AI 拟稿/人审出站/知识库/关系画像/语音克隆）。 */
    .cp-empty-showcase { display: flex; flex-direction: column; gap: 7px; text-align: left;
      width: 100%; max-width: 260px; margin-top: 12px; padding-top: 12px;
      border-top: 1px dashed var(--cp-border, #e2e8f0); }
    .cp-empty-showcase:empty { display: none; }
    .cp-empty-showcase .sc-head { font-size: 11px; font-weight: 700; letter-spacing: .02em;
      color: var(--cp-text-dim, #64748b); }
    .cp-empty-showcase .sc-item { display: flex; flex-direction: column; gap: 1px; }
    .cp-empty-showcase .sc-item b { font-size: 12px; color: var(--cp-text, #1e293b); }
    .cp-empty-showcase .sc-item span { font-size: 11px; line-height: 1.55; color: var(--cp-text-dim, #64748b); }
    /* ── 账号管理出滚动流（P0.2 2026-08-12）：全局资源回全局层——tabs 行常驻小图标
         （掉线红点）+ 整幅覆盖层，不再以卡片住在三个 tab 的滚动流里（「每个 tab 都有
         账号管理」的直诉根因）。宿主自带账号入口（?hostAccounts=1 / caps.accountsEntry）
         时图标自动隐藏，空态 CTA 仍可打开本层（永不做死按钮）。 ── */
    .cp-tabs-tool { flex: 0 0 auto; position: relative; border: none; background: transparent;
                    cursor: pointer; padding: 6px 10px; color: var(--cp-text-dim, #64748b);
                    display: inline-flex; align-items: center; font: inherit; }
    .cp-tabs-tool[hidden] { display: none; }   /* display:inline-flex 会盖掉 hidden 的 UA 样式，须显式钉回 */
    .cp-tabs-tool:hover { color: var(--cp-accent, #6366f1); }
    .cp-acct-dot { position: absolute; top: 4px; right: 5px; width: 7px; height: 7px;
                   border-radius: 50%; background: var(--cp-danger, #dc2626); }
    .cp-acct-layer { display: none; flex: 1; min-height: 0; flex-direction: column;
                     background: var(--cp-bg, #f8fafc); }
    body.acct-open .cp-acct-layer { display: flex; }
    body.acct-open .cp-app { display: none; }
    .cp-acct-layer-hd { display: flex; align-items: center; gap: 8px; padding: 8px 10px;
                        border-bottom: 1px solid var(--cp-border, #e2e8f0); flex-shrink: 0; }
    .cp-acct-layer-hd .ttl { font-size: 12px; font-weight: 700; color: var(--cp-text, #1e293b); }
    .cp-acct-back { font: inherit; font-size: 12px; cursor: pointer; border: 1px solid var(--cp-border, #e2e8f0);
                    background: var(--cp-surface, #fff); color: var(--cp-text, #1e293b);
                    border-radius: 7px; padding: 3px 10px; }
    .cp-acct-back:hover { border-color: var(--cp-accent, #6366f1); color: var(--cp-accent, #6366f1); }
    .cp-acct-layer-bd { flex: 1; min-height: 0; overflow-y: auto; padding: var(--cp-gap, 10px); }
    .cp-empty-acct-btn { font: inherit; font-size: 12px; cursor: pointer; padding: 6px 14px;
                         border-radius: 8px; border: 1px solid var(--cp-border, #e2e8f0);
                         background: var(--cp-surface, #fff); color: var(--cp-text, #1e293b); }
    .cp-empty-acct-btn:hover { border-color: var(--cp-accent, #6366f1); color: var(--cp-accent, #6366f1); }
    .cp-empty-acct-btn.primary { background: var(--cp-accent, #6366f1); border-color: transparent;
                                 color: #fff; font-weight: 600; }
    /* 执行结果 snackbar（cp-action-done 反馈）：桌面 iframe / 独立 PWA 宿主没有
       unified_inbox 那套 _toast 出口，失败原因（如「会话未关联客户档案」）此前被
       静默吞掉＝坐席眼里的「点了没反应」（2026-08-13 坐席机实锤）。本壳自带出口。 */
    #cp-app-toast { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%) translateY(6px);
                    max-width: 86%; padding: 7px 14px; border-radius: 8px; z-index: 60;
                    background: var(--cp-ok, #0f9d75); color: #fff; font-size: 12px; line-height: 1.5;
                    box-shadow: 0 4px 16px rgba(0, 0, 0, .28); opacity: 0; pointer-events: none;
                    transition: opacity .18s ease, transform .18s ease; }
    #cp-app-toast.show { opacity: .97; transform: translateX(-50%) translateY(0); }
    #cp-app-toast.err { background: var(--cp-danger, #dc2626); }
    /* tab 切换 150ms 渐入（reduced-motion 尊重系统偏好）；卡片展开同款（display 翻转重触发动画） */
    @media (prefers-reduced-motion: no-preference) {
      .cp-sec.active { animation: cpSecIn .15s ease-out; }
      .cp-card-bd { animation: cpSecIn .15s ease-out; }
      @keyframes cpSecIn { from { opacity: 0; transform: translateY(3px); } to { opacity: 1; transform: none; } }
    }
  </style>

  <script>
  /* 扩展语 overlay 按语言条件装载（i18n_desktop_ext 生成 per-lang 文件）。
     document.write 同步注入＝写入点即当前解析位置，先于组件渲染；
     非扩展语零动作零开销。本页无 CSP 内联限制（既有内联脚本先例）。 */
  (function () {
    var m = '';
    try { m = new URLSearchParams(location.search).get('lang') || ''; } catch (e) { m = ''; }
    m = m.trim().toLowerCase().replace(/-/g, '_');
    if (m === 'zh_tw' || m === 'zh_hk') m = 'zh_hant';
    if (m === 'zh_hant' || m === 'vi' || m === 'th' || m === 'id') {
      document.write('<script src="/copilot/i18n/cp-i18n-ext.' + m + '.js?v=20260908a"><\/script>');
    }
  })();
  </script>

  <script>
  /* 宿主级 CSRF + Bearer 兜底（与 workspace_base 同款补丁思路，2026-07-31/08-01）：
     copilot-client 的方法已自带鉴权，但个别组件（如 cp-goal 的 _api）直接裸 fetch
     /api——iframe App 宿主没有 workspace_base 的页面补丁：① 写请求在 Referer 被
     抑制的环境缺 CSRF 必 403；② 桌面 token 模式（壳放 #token=，无 session cookie）
     裸 fetch 全部 401。在客户端脚本之后、组件脚本之前装补丁，罩住存量与未来的
     裸 fetch。Authorization 只补**同源相对路径**（"/" 开头），绝不把 token 带给
     任何绝对 URL 第三方。 */
  (function(){
    var _f = window.fetch;
    window.fetch = function(url, opts){
      opts = opts || {};
      var m = (opts.method || 'GET').toUpperCase();
      function setH(name, val){
        opts.headers = opts.headers || {};
        if (opts.headers instanceof Headers) { if (!opts.headers.get(name)) opts.headers.set(name, val); }
        else if (!opts.headers[name]) { opts.headers[name] = val; }
      }
      if (m !== 'GET' && m !== 'HEAD' && m !== 'OPTIONS') {
        var t = document.cookie.match(/(?:^|;\s*)csrf_token=([^;]*)/);
        if (t) setH('X-CSRF-Token', t[1]);
      }
      if (typeof url === 'string' && url.charAt(0) === '/' &&
          window.CopilotShared && typeof window.CopilotShared.authHeaders === 'function') {
        try {
          var ah = window.CopilotShared.authHeaders();
          if (ah && ah.Authorization) setH('Authorization', ah.Authorization);
        } catch (_e) { /* 鉴权头缺失时按原样发出，由服务端如实 401 */ }
      }
      return _f.call(this, url, opts);
    };
  })();
  </script>

<body>
  <!-- 陈旧前端提醒（2026-07-31「切换失败」事故收尾）：iframe App 不在 workspace_base
       的 ui-build 横幅覆盖面里——桌面壳/长开 iframe 的旧组件可以无限期活着，
       「修好了坐席还在踩」由此复发。探针见 body 尾部脚本。 -->
  <div id="cp-stale" style="display:none;flex-wrap:wrap;align-items:center;gap:8px;
       padding:6px 10px;font-size:12px;line-height:1.5;
       background:var(--cp-accent-bg,#eef2ff);color:var(--cp-accent,#4f46e5);
       border-bottom:1px solid var(--cp-border,#e2e8f0);">
    <span style="flex:0 0 auto;display:inline-flex;" data-cp-ic="refresh"></span>

  <!-- 账号管理（2026-08-12 P0.2 出滚动流）：全局资源回全局层。前一版「沉底折叠卡」
       仍让三个 tab 各看到一份账号管理（卡挂在 tab 分区外＝每个 tab 都渲染，坐席读不出
       「全局」pill 的语义，只觉得重复）。现改整幅覆盖层：入口＝tabs 行常驻图标（掉线
       红点）+ 空态「管理账号」CTA；宿主自带账号入口（?hostAccounts=1 / caps.accountsEntry）
       时图标自动隐藏；Esc / 返回 / 切 tab 均可退出。 -->
  <div class="cp-acct-layer" id="cp-acct-layer">
    <div class="cp-acct-layer-hd">
      <button type="button" class="cp-acct-back" id="cp-acct-back" data-cp-i18n="cp.app.acct_back">← 返回</button>
      <span class="ttl" data-cp-i18n="cp.app.h_accounts">账号管理</span>
      <span class="cp-card-pill" data-cp-i18n="cp.app.pill_global">全局</span>
    </div>
    <div class="cp-acct-layer-bd"><cp-accounts id="accounts" hide-title></cp-accounts></div>
  </div>
  <script>
    (function () {
      var qs = new URLSearchParams(location.search);
      // i18n：cp-i18n.js 已按 ?lang= / <html lang> / cookie 解析语言；同步 <html lang> 并替换静态文案
      var CPS = window.CopilotShared || {};
      var LANG = CPS.lang || "zh";
      function T(k, vars) { return CPS.t ? CPS.t(k, vars) : k; }
      try { document.documentElement.setAttribute("lang", LANG === "en" ? "en" : "zh-CN"); } catch (_) {}
      if (CPS.applyI18n) CPS.applyI18n(document);
      // 空态能力橱窗：数据单源 cp-capabilities.js（与桌面原生空态同一份）；
      // 文件缺席/加载失败静默——空态引导文案仍在，橱窗只是增强
      try {
        if (typeof capabilityShowcase === "function") {
          var _scWrap = document.getElementById("cp-empty-showcase");
          var _scItems = capabilityShowcase() || [];
          if (_scWrap && _scItems.length) {
            var _scEn = LANG === "en";
            var _scHtml = '<div class="sc-head">' + esc(
              typeof showcaseHeadline === "function" ? showcaseHeadline(_scEn ? "en" : "zh") : "") + "</div>";
            _scItems.forEach(function (it) {
              _scHtml += '<div class="sc-item"><b>' + esc(_scEn && it.title_en ? it.title_en : it.title) +
                "</b><span>" + esc(_scEn && it.desc_en ? it.desc_en : it.desc) + "</span></div>";
            });
            _scWrap.innerHTML = _scHtml;
          }
        }
      } catch (_) { /* 静默：橱窗是空态增强，绝不阻断 App 启动 */ }
      // 主题
      var theme = qs.get("theme") === "dark" ? "dark" : "light";
      document.documentElement.setAttribute("data-cp-theme", theme);
      // 鉴权 token(桌面 iframe 由壳放 #token=;浏览器靠同源 cookie 不需要)
      var hash = new URLSearchParams((location.hash || "").replace(/^#/, ""));
      var token = hash.get("token") || qs.get("token") || "";
      if (token && window.CopilotShared) window.CopilotShared.setAuthToken(token);

      var client = window.CopilotShared ? window.CopilotShared.createCopilotClient() : null;
      var appEl = document.getElementById("cp-app");

      // ── 账号管理全局层（P0.2）：宿主协商 + 懒加载 + 掉线红点 ──
      // 组件懒挂 client（打开层才拉列表）；红点走独立轻量探针（120s），失败静默不动 UI。
      var HOST_ACCTS = qs.get("hostAccounts") === "1";   // 宿主自带账号入口（如网页工作台左栏抽屉）
      var acctOpenBtn = document.getElementById("cp-acct-open");
      function syncAcctEntry() { if (acctOpenBtn) acctOpenBtn.hidden = !!HOST_ACCTS; }
      syncAcctEntry();
      function openAcct() {
        var el = document.getElementById("accounts");
        if (el && client) { if (!el.client) el.client = client; else el.reload(); }
        document.body.classList.add("acct-open");
      }
      function closeAcct() {
        if (!document.body.classList.contains("acct-open")) return;
        document.body.classList.remove("acct-open");
        refreshAcctBadge();   // 刚在层里加号/启停过 → 红点与空态 CTA 立即对齐
      }
      document.addEventListener("click", function (e) {
        var t = e.target;
        if (!t || !t.closest) return;
        if (t.closest("#cp-acct-open") || t.closest("[data-acct-cta]")) { openAcct(); return; }

        // 能力协商：accountsEntry=宿主自带账号入口（网页工作台左栏抽屉等）
        // → 隐藏本面板 tabs 行的账号图标，避免同屏双入口。
        // （2026-08-15 「全自动托管」HostBridge 开关整体下线：与收件箱「🚀 全自动」档
        //   auto_ai+受控出站队列功能重复且绕过服务端 send-gate/kill-switch，两开同会话
        //   还会双发；caps.autopilot 不再消费，全自动唯一入口=会话自动化档位。）
        var caps = (ctx && ctx.caps) || {};
        if (caps.accountsEntry) { HOST_ACCTS = true; syncAcctEntry(); }
        var panelCtx = {
          conversationId: cid, chatKey: ck,
          platform: CURRENT.platform, accountId: CURRENT.accountId,
          caps: caps
        };
        panels.forEach(function (el) { if (el) el.context = panelCtx; });
        if (tabCtrl && tabCtrl.getTab() === "tools") runAnalyze();
        if (tabCtrl && tabCtrl.getTab() === "customer") renderCustomer();
        if (!document.querySelector(".cp-sec.active")) setTab("reply");
      }

      // ── 宿主指令(壳浮钮深链)──
      function handleCmd(m) {
        var cmd = m && m.cmd;
        if (cmd === "set-theme") {   // 宿主主题热切（cpApplyTheme→postMessage），零 reload 不丢面板状态
          document.documentElement.setAttribute("data-cp-theme", m.theme === "dark" ? "dark" : "light");
          return;
        }
        if (cmd === "set-tab") { setTab(m.tab || "reply"); return; }
        if (cmd === "open-accounts") { openAcct(); return; }   // 宿主深链（壳头部图标可转发到此）
        if (cmd === "focus-draft") {
          setTab("reply");
          var el = document.getElementById("draft");
          try { el.scrollIntoView({ behavior: "smooth", block: "nearest" }); } catch (_) {}
          var btn = el && el.shadowRoot ? el.shadowRoot.querySelector('button[data-act="gen"]') : null;
          if (btn) btn.click();
          return;
        }
        if (cmd === "focus-voice") {
          setTab("tools");   // 2026-08-17 工具箱重组：语音卡已迁 tools，深链跟着走
          var v = document.getElementById("voice");
          try {
            var vc = document.querySelector('[data-cp-card="voice"]');
            if (vc) vc.classList.remove("collapsed");
            v.scrollIntoView({ behavior: "smooth", block: "center" });
          } catch (_) {}
          return;
        }
      }

      // 入口 1:URL ?cid= (&ck= 可选)
      var cid0 = qs.get("cid");
      if (cid0) setContext({ conversationId: cid0, chatKey: qs.get("ck") || "" });

      // 入口 2:宿主壳 postMessage
      window.addEventListener("message", function (e) {
        var msg = e && e.data;
        if (!msg || !msg.type) return;
        if (msg.type === "cp-context" && msg.conversationId) setContext(msg);
        else if (msg.type === "cp-cmd") handleCmd(msg);
      });

      // 告知宿主壳:App 就绪,可以开始喂 context
      if (tabCtrl) tabCtrl.restore();
      else setTab("reply");
      post("cp-ready");
    })();
  </script>
  <script>
    (function () {
      /* 陈旧副驾探针（与 workspace_base 的 ui-build 横幅同口径，2026-07-31）：
         首查 /static/workspace/ui-build.txt 首行为基线（即本页所载版本），此后每
         5 分钟（+回前台时）复查，token 变化 → 出条请坐席刷新。location.reload()
         保留 ?theme= 与 #token=，桌面 iframe 重载后自动重新鉴权。
         探针失败一律静默（老后端没有该文件 / 网络抖动都不该打扰坐席）。 */
      var BUILD_URL = "/static/workspace/ui-build.txt";
      var SNOOZE_KEY = "cp_stale_snooze";
      var baseline = "";
      var shown = false;
      var bar = document.getElementById("cp-stale");
      if (!bar) return;
      function snoozed() {
        try { return Number(sessionStorage.getItem(SNOOZE_KEY) || 0) > Date.now(); }
        catch (_) { return false; }
      }
      async function tick() {
        if (shown) return;
        try {
          var r = await fetch(BUILD_URL + "?_=" + Date.now(),
            { cache: "no-store", credentials: "same-origin" });
          if (!r.ok) return;
          var t = await r.text();
          var cur = String((t || "").split(/\r?\n/)[0] || "").trim();
          if (!cur) return;
          if (!baseline) { baseline = cur; return; }   // 首查=基线
          if (cur !== baseline && !snoozed()) {
            bar.style.display = "flex";
            shown = true;                              // 已提醒；贪睡按钮会复位继续盯
          }
        } catch (_) { /* 静默 */ }
      }
      var go = document.getElementById("cp-stale-go");
      if (go) go.addEventListener("click", function () { location.reload(); });
      var x = document.getElementById("cp-stale-x");
      if (x) x.addEventListener("click", function () {
        try { sessionStorage.setItem(SNOOZE_KEY, String(Date.now() + 2 * 3600 * 1000)); } catch (_) {}
        bar.style.display = "none";
        shown = false;                                 // 贪睡到期后若仍是新版会再次提醒
      });
      tick();
      setInterval(tick, 300000);
      document.addEventListener("visibilitychange", function () {
        if (document.visibilityState === "visible") tick();
      });
    })();
  </script>
</body>
</html>
