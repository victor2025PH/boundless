      min_sec: 2
      max_sec: 9
      adaptive: true
  voice_reply:
    enabled: true
    trigger: when_peer_voice
    backend: avatar_clone
    voice: zh-CN-XiaoxiaoNeural
    voice_profile:
      enabled: true
      owner_consent: true
      backend: avatar_clone
      reference_audio_path: config/voice_refs/lin_xiaoyu.wav
      emotion_default: neutral
    emotion:
      enabled: true
