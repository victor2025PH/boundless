        at_intimacy_100: 12
      cooldown_hours:
        base: 48
        at_intimacy_0: 96
        at_intimacy_100: 24
    no_reply_backoff:
      enabled: true
      multiplier: 3.0
      max_backoff_hours: 720
      stop_after: 0
      stop_after_never_replied: 2
    variety:
      enabled: true
      similarity_threshold: 0.6
    optout:
      enabled: true
      mute_days: 30
    response_pacing:
      enabled: true
      min_obs: 4
      low_rate: 0.15
      stretch: 1.5
      high_rate: 0.6
      relax: 0.85
      auto_thresholds:
        enabled: true
        low_percentile: 25
        high_percentile: 75
        min_population: 12
        min_separation: 0.15
    media_feedback:
      enabled: true
      min_sent_per_arm: 8
      lookback_days: 14
