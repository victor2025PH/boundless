# ── ChatX 内测版 overlay 种子（v1.004，2026-08-04）────────────────────────────
# 目标：安装包开箱 = 与 117 生产机（zhiliao 实例）同一形态——12 个人设、克隆语音、
# 人设相册、主动触达、全自动回复（人审档）、本地 MT 翻译、LAN 视觉/嵌入/LLM 兜底全部点亮。
#
# ⚑ 内测口径（2026-08-01 拍板）：内测期**唯一打包形态就是本形态**——`npm run dist*`
#   一律先 stage:internal（见 desktop/package.json predist* + after-pack.js 硬闸），
#   不存在「标准包/内测包」两种产物。A/B/C 交付分级与 config.desktop.min.yaml
#   语义保留（服务将来正式售卖），但内测期不投产标准形态。
#
# 用法：随内测包放进 resources/seed-data/config.local.internal.yaml；后端首启由
# ConfigManager._ensure_seeded_extras 拷成 <数据区>/config/config.local.yaml
# （已有 overlay 时只补缺失键——用户显式写过的值永远尊重；存量内测机升级后
# 下次启动自动获得本文件新增的键）。
#
# 铁律：
#   · 本文件是**公开分发物**：绝不写任何密钥/token/生产账号数据（AI Key 走官网托管
#     网关 ensure_hosted_ai；Telegram api_id 走设备令牌粘定派发；均不落盘）。
#   · v1.004（2026-08-04）：与 zhiliao overlay 重新净差分对齐（1.0.10 四机部署前）——
#     补 8/2-8/3 新开关（分条回复参数/入站合并/出站防双发/peer_bot_guard/fresh_guard/
#     语音分条/voice_iou/interject_absorb/tg_history_autosync/daily_topics/user_clock/
#     care 影子档/趋势卡/reply_variety）；修 hub_fish 档名映射（旧英文档名在 hub 404
#     =语音断档实锤）、ai.fallback 改 173 qwen14b（176 30b 按显存纪律不可加载=配置性
#     死亡）、口语化改写 local_first（173/198 LAN 端点）；vision/嵌入/MT 端点序对齐
#     140 首位；automation_mode 对齐生产机 auto_ai。
#   · v1.003 起为**混合形态**（非局域网机器也可用算力）：视觉/克隆语音/语音识别三段带
#     `_lan_seed: true` 标记——hosted_gateway 启动时探测 LAN 端点，可达＝直连（办公室
#     低延迟），不可达＝自动切官网网关 bd2026.cc（经 117→VPS 反向隧道回同一批 GPU，
#     设备令牌鉴权）。标记只授权注入器动「种子写的端点」，用户自配端点仍绝不覆盖。
#     未走网关的能力出了 LAN 仍软降级（本地 MT→DeepSeek 翻译、嵌入→关键词召回、
#     hub_fish→普通克隆链），聊天主链不受影响。
#   · 与生产 zhiliao 合并视图（config.yaml ⊕ config.local.yaml）的差异只有四类
#     （2026-08-01 用 config.yaml⊕overlay 三方净差分逐键核对过）：
#     ①密钥/凭据/生产账号数据剔除——ai.api_key、telegram.api_id/api_hash、
#       web_admin.auth_token/secret_key、credpool.*（LAN 中央池+共享令牌，公网不可达
#       且明文令牌不可进公开分发物）、goals.order_hook.token / order_pull.admin_key、
#       licensing.trial.fulfiller_watch.*（发货机运维，客户机无 admin key 可用）、
#       group_show.linkage_overrides / companion_send_gate.exempt_peers /
#       telegram.group_reply.allowlist_chat_ids（生产账号/群 id）；
#     ②127.0.0.1:7852（本机 TTS）改写为 192.168.0.117:7852（LAN 可达）；
#     ③本机进程内 ASR（sensevoice cuda）与 faster_whisper 本地回落改为
#       176 GPU ASR + 140 AvatarHub 远程端点（冻结包无 torch，本地模型跑不动）；
#     ④companion.selfie.provider.command_args（ComfyUI 现场生图）不随包——
#       它要 python 解释器 + 仓库 tools/comfy_infer.py，冻结包两者皆无，
#       相册档（backend=album）已全量可用，生成档属生产机专属能力。

domain: conversion

brand:
  company_name: 无界科技
  product_name: 智聊 ChatX
  site_name: 无界科技 · 智聊
  site_name_short: 智聊 ChatX
  sidebar_name: 无界 · 智聊
  login_subtitle: 管理控制台

web_admin:
  site_name: 无界科技 · 智聊

inbox:
  enabled: true
  realtime_poll_sec: 3
  # 多句分条回复（与生产机对齐）：base 已开 bubbles.enabled，这里补齐节奏参数
  reply_style:
    bubbles:
      enabled: true
      max_parts: 3
      max_chars: 60
      gap_sec_lo: 0.8
      gap_sec_hi: 2.5
      holdout_pct: 0.1
  # Telegram 历史自动补缺口：停机/断线窗口的消息不再永久缺失
  tg_history_autosync:
    enabled: true
  persona_conv_override:
    enabled: true
  auto_draft:
    enabled: true
    # v1.004：对齐生产机 auto_ai（此前 review 人审档）——「与本机一致」口径 2026-08-04 拍板
    automation_mode: auto_ai
    skip_group_chats: true
    # 入站爆发合并（防同义双发·治因）：几秒内连发多条合并成一次拟稿
    inbound_merge:
      enabled: true
      window_sec: 8
      max_wait_sec: 25
      max_texts: 6
  # 出站近重复守卫（防同义双发·治果）：投递前与最近出站核对，近重复静默跳过
  outbound_dup_guard:
    enabled: true
    window_sec: 180
    block_similar: true
  # 对方机器人守卫：确定级降 manual、复读/秒回熔断降 review、单会话日预算
  peer_bot_guard:
    enabled: true
    # 内测/演示档预算放宽（2026-08-04 198 实锤：默认 40 轮在高强度试聊场景
    # 一下午就触顶——双账号互测 + 手发混聊烧得更快）。预算语义 P2 起＝
    # 「自动链回复轮次/日」（人工手发不再挤占）；触顶后真人会话软停转
    # 人审拟稿 + 收件箱出横幅可救济，不再静默哑火。正式租户用默认 40。
    daily_reply_budget: 200
  l2_autosend:
    enabled: true
    deliver: true
    # 草稿过期守卫：拟稿后客户又说了新话 → 旧稿不投（计 skip 不计 error）
    fresh_guard:
      enabled: true
    voice:
      enabled: true
      trigger: always
      no_edge_fallback: true
      max_chars: 110
      # 分条语音：>40 字连发 2-3 条短语音；全部合成成功才逐条发，任一失败回落单条
      split_send:
        enabled: true
        min_total_chars: 40
        part_max_chars: 36
        max_parts: 3
  sla_watcher:
    escalate_hours: 24
  # 覆盖 config.desktop.min.yaml 的桌面默认关（P1-198）：内测口径=与生产机对齐，
  # 生产机该入口是开的（代码默认 true、overlay 未动）。
  next_actions:
    follow_up_task: true

voice_lang_route:
  enabled: true
  cantonese:
    voice: zh-HK-HiuMaanNeural
  follow_text:
    enabled: true
    reject_unmapped: true

lang_prior:
  enabled: true
  phone_platforms:
  - whatsapp

# ── 克隆语音（AvatarHub CosyVoice3 @117 + 备点 140；hub_fish 高保真 @176）────
# _lan_seed: 授权 hosted_gateway 做混合注入——LAN 可达时网关殿后兜底，不可达时
# 网关排首位（外网机器克隆语音经 bd2026.cc → 隧道 → 7852）。hub_fish 无健康预检，
# 外网不可达时会被注入器就地禁用（回内网自动恢复）。
avatar_voice:
  enabled: true
  _lan_seed: true
  policy:
    no_edge_fallback: true
  synth_timeout_sec: 75
  retries: 0
  emotion_channel_threshold: 2
  paralinguistic:
    enabled: true
    max_marks: 2
  synth_verify:
    enabled: true
    cer_threshold: 0.3
    max_retries: 1
  colloquial:
    enabled: true
    mode: llm
    rewrite_intensity: vivid
    generated: true
    disfluency: true
    disfluency_every: 5
    human_ticks: true
    think_prob: 0.28
    laugh_prob: 0.08
    # LLM 改写走 LAN 端点列表（173 qwen14b 主 / 198 qwen3:8b 备，逐端点冷却 failover），
    # 全 LAN 挂了才落云端，最后才规则档——零 API 费主路 + 双 GPU 冗余
    provider: local_first
    temperature: 0.5
    llm_endpoints:
    - base_url: http://192.168.0.173:11434
      model: qwen14b-fallback
      timeout_sec: 6.0
    - base_url: http://192.168.0.198:11434
      model: qwen3:8b
      timeout_sec: 6.0
    llm_timeout_sec: 12.0
    min_chars: 12
    lead_prob: 0.5
    fillers: true
    lexical: true
    sentence_final: false
  prosody:
    enabled: true
    flow_temperature: 1.08
  base_urls:
  - http://192.168.0.117:7852
  - http://192.168.0.140:7852
  - http://192.168.0.173:7852
  voice_consistency: strict
  hub_fish:
    enabled: true
    base_url: http://192.168.0.176:9000
    timeout_sec: 75.0
    best_of: 2
    # 分条单条 1 候选（整段仍 2）：分条×best_of 是 hub GPU 的主要放大器
    best_of_parts: 1
    # IndexTTS-2 情感/音色解耦（无 7852 的音色税）：0.35 放行日常闲聊情绪
    emotion_threshold: 0.35
    # ⚠️ 档名必须是 hub 上真实存在的中文档：旧英文档名（chengjie_* 等）在 hub 404 →
    # strict 拒发 → 全语音回落文字（2026-08-02 生产实锤），勿回退
    persona_allowlist:
    - lin_xiaoyu
    - lin_jiaxin
    - marcus_wei
    - chen_mo
    - mizuki
    - su_wan
    - chen_meiling
    - haruko_traveler
    - zhao_laoshi
    - zhang_jingguang
    profile_map:
      lin_xiaoyu: 林小雨-智聊
      lin_jiaxin: 林佳欣-智聊
      mizuki: 美月-智聊
      su_wan: 苏婉
      chen_meiling: 陈美玲-智聊
      haruko_traveler: 晴子-智聊
      zhao_laoshi: 赵明德-智聊
      zhang_jingguang: 张景光-智聊
      marcus_wei: 魏卡斯-智聊
      chen_mo: 陈默
    response_format: ogg

voice_clone_lan:
  enabled: false

# ── AI（Key 不随包：托管网关派发；这里只带行为参数 + LAN 嵌入/兜底）──────────
ai:
  # 反复读治理：出站口头禅账本，超限注入多样性硬约束
  reply_variety:
    enabled: true
  ai_name: 顾嘉
  system_prompt: "你是「顾嘉」（英文名 Gary），无界科技（BOUNDLESS）的资深方案顾问，8 年 AI 产品方案经验，\n既懂技术也懂生意。你正在在线聊天窗口接待访客。\n\
    \n【公司与产品】无界科技主打七款 AI 产品（按商业主线）：\n· 通译 LingoX：多平台实时聊天翻译（文字+语音双向互译）\n· 通传 VoxX：会议/直播实时语音同传（克隆音同传+双语字幕）\n\
    · 智拓 ReachX：真机多号自动获客（自动加友/打招呼/群提取）\n· 智聊 ChatX：聚合 AI 聊天客服，全程自动开发客户、推进成交\n· 幻声\
    \ VoiceX：AI 声音克隆配音与语音合成\n· 幻颜 FaceX：图片/视频 AI 换脸\n· 幻影 LiveX：实时直播换脸换声分身\n一套私有化底座，产品可单选也可组合成获客到成交的完整闭环。\n\
    \n【说话方式】\n- 专业、热情、简洁：每次回复 1-3 句说到点子上，先正面回答再延伸，绝不长篇大论。\n- 像真人顾问在打字：自然口语、少用感叹号堆砌、不用「亲」、不油腻、不客服腔。\n\
    - 主动引导：搞清访客的行业、场景、痛点，把话题引向匹配的产品与下一步\n  （预约演示 / 领试用 / 留联系方式），一次只推进一小步，不硬塞。\n- 绝不过度承诺：不编造效果数据、不承诺做不到的事；拿不准的说「这个我和技术同事确认后给您准信」。\n\
    - 客户用什么语言提问就用什么语言回答。\n\n【身份底线（必须遵守）】\n- 平时以顾问顾嘉的身份自然交流，不主动强调自己是 AI，也绝不谎称是人类。\n\
    - 当客户直接问「你是不是机器人/AI/真人吗」这类问题时，诚实但弱化地回答，比如：\n  「我是无界的智能顾问，日常咨询我直接处理，复杂问题会请人工同事跟进」——绝不欺骗、绝不否认。\n"
  max_tokens: 2048
  timeout: 40
  max_conversation_history: 8
  persona_block_detail: compact
  num_ctx: 8192
  # 端点序对齐生产机：140 首位（宕机端点排首位=每个冷却窗过期先吃一次连接超时的尾延迟税）
  embedding_base_url: http://192.168.0.140:11434
  embedding_base_urls:
  - http://192.168.0.140:11434
  - http://192.168.0.176:11434
  embedding_model: bge-m3
  fallback:
    enabled: true
    # 173 qwen14b 7x24 常驻（176 30b 按集群显存纪律不可加载=配置性死亡，2026-08-01 实锤）；
    # 同时服务：① 主链 DeepSeek 断时的回复兜底 ② colloquial local_first 的口语化改写
    base_url: http://192.168.0.173:11434
    model: qwen14b-fallback
    api_key: ollama
    timeout: 90
    keep_alive: 8h
    num_ctx: 8192
    think: false
  reply_defaults:
    length: detailed

memory:
  extract:
    match_all: true
  vector:
    enabled: true
    backfill_periodic:
      enabled: true
      interval_hours: 6
      limit: 100
  consolidation:
