    split_send:
      enabled: true
    # 语音补欠账：诚实回落说了「回头补给你」→ 该会话下一回合语音链恢复时强制兑现
    voice_iou:
      enabled: true
    text_first:
      # 对方发语音在等语音条：40s 预算内不落文字占位
      budget_sec: 40
  reply_logic:
    follow_up:
      lookback_count: 10
  # 插话吸收：连发短消息出队合并成一条输入；生成期间对方补话则放弃过期回复（仅私聊文本）
  interject_absorb:
