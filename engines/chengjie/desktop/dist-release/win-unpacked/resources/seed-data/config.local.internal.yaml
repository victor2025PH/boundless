      daily_budget: 150
  # 客户侧时钟（时空一致性：对方当地时间事实行 + 时差桥 + 出站星期守卫）
  user_clock:
    enabled: true
  multiplatform_deferred:
    enabled: true
  proactive_topic:
    enabled: true
    dry_run: false
    min_silent_hours: 24
    cooldown_hours: 48
    max_per_tick: 2
    quiet_start_hour: 23
    quiet_end_hour: 8
    adaptive_pacing:
