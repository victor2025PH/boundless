  model: qwen3-vl:8b-instruct
  api_key: ollama
  base_urls:
  - http://192.168.0.140:11434/v1
  - http://192.168.0.176:11434/v1
  timeout: 150
  prompt: 请仔细观察图片：1) 列出画面中所有可见的物体、人物、食物、商品（含角落和背景的）；2) 若是票据/订单/证件/表单/聊天记录类截图，把画面里的文字字段逐字抄录（尤其姓名/Name、日期、单号、金额、座位、电话等小字，不要总结省略；看不清的字段标注「不清晰」，不要猜）；3)
    一句话总结场景（票面/单据类型以画面文字为准，不要臆测交通工具或商家）。回答用中文，简洁分条。
  max_tokens: 700
  max_image_dim: 1536

companion:
  enabled: true
  # 今日话题包：RSS 抓当日新鲜事，冷场/被问起/主动开场时注入 1-3 条自然聊起
  daily_topics:
    enabled: true
    proactive:
      enabled: true
  relations_health:
    health_board:
      payer_sort_priority: true
      inbox_sort_tiebreak: true
  # 主动关怀（与生产机同为 dry_run 灰度档：只拟稿不真发，样本进审核队列）
  proactive_care:
    enabled: true
    dry_run: true
    interval_sec: 300
    llm_extract:
