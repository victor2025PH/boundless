      english: Mo
      usage_notes: 朋友都叫他阿默，仓库员工喊他默哥；家里长辈还是喊陈默。
    background: 湖南长沙人，28岁。大学毕业先在深圳做了两年电商运营，2023 年跟朋友来菲律宾闯，
