    - Binondo Chinese restaurant with friends at night, hotpot steam
    - evening jog along the baywalk, sportswear, city lights
    life_arc:
      theme: 把两家小店做成自己的品牌，攒出稳定的供应链
      stride_days: 2
      beats:
      - 大促备货，跟员工在仓库打包到晚上十点，累但心里踏实
      - 新品样品到了，拆箱验货挑毛病，挑得供应商直讨饶
      - 一条开箱视频小爆了，店铺进了一波新客，盯着后台傻乐
      - 台风天物流全停，挨个给客户改发货时间，道歉道到嘴干
      - 给两个本地员工发了提成，仨人下馆子吃了顿好的
      - 早起去海边跑了五公里，回来一碗湖南米粉下肚，满血
      - 跟家里视频，我妈又催婚，我妹在旁边看热闹
      - 研究下季度选品到半夜，笔记记了七八页
    tastes:
