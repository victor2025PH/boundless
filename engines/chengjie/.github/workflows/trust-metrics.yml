name: trust-metrics

# 定时刷新对外「可信指标」公开产物（website/public/metrics/*.json → /proof-metrics 页引用）。
# 数字必须真：由确定性门禁 run_eval 生成，不手填。此前只能手动跑 scripts/gen-trust-metrics.py，
# 本 workflow 让它每周自动刷新 + 可手动触发，保证营销站引用的评测数字始终新鲜。
#
# 设计：
# - schedule 每周一次 + workflow_dispatch 手动；push 到本文件/评测相关代码时也跑一次（自检不回归）。
# - 只在产物**真的变化**时提交（git diff 判定），避免每周一个空提交。
# - 缺资源的评测（翻译/FAQ/记忆需 key/KB）由 gen-trust-metrics 自身优雅 skip，不 fail。

on:
  schedule:
    # 每周一 03:17 UTC（错开整点，避开 runner 高峰）。cron 用 UTC。
    - cron: '17 3 * * 1'
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - 'engines/chengjie/scripts/gen-trust-metrics.py'
      - 'engines/chengjie/scripts/run_eval.py'
      - 'engines/chengjie/src/eval/**'
      - 'engines/chengjie/config/eval/**'
      - 'engines/chengjie/.github/workflows/trust-metrics.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: engines/chengjie
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: engines/chengjie/requirements-ci.txt

      - name: Install CI deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt

      - name: Regenerate trust metrics (deterministic gates; missing-resource evals skip)
        run: python scripts/gen-trust-metrics.py --out website/public/metrics

      - name: Commit refreshed metrics if changed
        # 仅当产物真的变了才提交（否则每周攒空提交）。跳过 CI 防触发死循环。
        run: |
          if [ -n "$(git status --porcelain website/public/metrics)" ]; then
            git config user.name  "trust-metrics-bot"
            git config user.email "trust-metrics-bot@users.noreply.github.com"
            git add website/public/metrics
            git commit -m "chore(trust-metrics): scheduled refresh [skip ci]"
            git push
          else
            echo "no trust-metrics changes; nothing to commit"
          fi
