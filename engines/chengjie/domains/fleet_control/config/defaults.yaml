  version: "0.1"

# 主控实例不聊天：不挂任何技能。
skills:
  enabled: []

kb:
  categories: []

# ── 说明：以下是「根 config.yaml」里的键（不是域包私有配置），写在这里只作文档。
# fleet_control:
#   db_path: ""                 # 空 → <配置目录>/fleet_control.db
#   heartbeat_sec: 30           # 下发给 Agent 的心跳间隔
#   offline_after_sec: 120      # 超过 N 秒没心跳 → 节点标 offline
#   enroll_code_ttl_min: 15     # 注册码有效期（分钟）；新码是 12 位 Crockford，默认 15 分钟
#   public_url: "https://bd2026.cc/fleet"   # Agent 连的公网地址（注册码页 / 安装说明里展示）
#   console_api_base: ""        # 控制台 API 前缀；只允许 /a/b 形式（非法值按空处理）。空 → /api/fleet/...
#   remote_ops_default_min: 30  # 远程操作默认多少分钟后自动关（1–240，越界夹到范围内）
#   download:                   # 独立主页 /fleet/ 展示的安装包信息（由发布流程写入）
#     version: ""
#     installer_url: ""
#     sha256: ""
#     changelog_url: ""
#     agent_zip_url: ""
