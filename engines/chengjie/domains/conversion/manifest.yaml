name: conversion
display_name: "无界科技 · 智聊"
version: "1.0"
description: "多语言情感陪伴与日常闲聊；口语活泼、去 AI 腔。支付/通道等为独立插件域。"

skills: []

config_files:
  - defaults.yaml

kb:
  categories: kb/categories.yaml
  # N-3 #241：按业务域的分类变体——陪伴运营（business_domain=companion）不装
  # 「产品价值 / 转化话术 / 异议处理 / 命理」，装陪伴知识库分类；销售域仍用上面主文件
  categories_by_business_domain:
    companion: kb/categories.companion.yaml
  seeds: kb/seeds.yaml

prompts:
  system_prompt: prompts/system_prompt.txt

hooks: true

i18n:
  zh: i18n/zh.yaml
  en: i18n/en.yaml

web_routes: false
