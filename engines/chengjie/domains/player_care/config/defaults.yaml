domain:
  name: player_care
  display_name: "玩家朋友（WA / TG）"
  version: "0.1"

ai:
  reply_style: concise
  ai_name: "Jomar"
  reply_defaults:
    length: short
    emoji_level: minimal
    tone_hint: "Taglish 朋友口吻，像给熟人回消息；不提 AI，不推销，不编数字"

# 不挂模板技能：greeting / complaint 等技能会用现成中文模板抢答；本域全部走人设 + LLM。
skills:
  enabled: []

kb:
  categories:
    - "闲聊"
    - "游戏"
    - "账户"
    - "其他"

emotion_enhancer_skip:
  phrases: []
  patterns: []

# ── 说明：以下两段是「根 config.yaml」里的键（不是域包私有配置），写在这里只作文档。
# player_gateway（运营方玩家网关，默认关；与另一台电脑 chengjie 树 wujie_player.py 同键）：
#   player_gateway:
#     enabled: true
#     url: "http://165.154.233.219"      # 同一局域网直连；只在智聊 player 实例调用
#     key: ""                            # 留空则读环境变量 key_env（默认 GATEWAY_KEY），密钥不进 git
#     key_env: GATEWAY_KEY
#     timeout_sec: 4                     # 超时 = 没资料，不编数字
#     cache_ttl_sec: 60                  # 同一联系人短缓存，一句话里多次触发不重复打网关
#     lookup_path: /lookup
# 域激活：domain: player_care（一个实例只能激活一个域——本域跑在与 story_matrix 不同的实例）
# player_care.profile（B2 画像 + 阶段旁表 player_profiles，写在 contacts.db 同一文件；默认开）：
#   player_care:
#     profile:
#       enabled: true
#       db_path: ""                        # 空 → contacts.db_path → <配置目录>/contacts.db
#       dormant_after_days: 7              # 沉默超过 N 天 → dormant；再来消息回到原阶段
#       active_min_deposit_days: 2         # 不同自然日充值 ≥ N 次 → active
#     sync:                                # B3：巡检里定时拉活跃联系人网关资料写画像（仅 domain=player_care 实例跑）
#       enabled: true
#       interval_min: 30                   # 节流 + 同一画像两次 lookup 最小间隔（下限 5）
#       active_days: 7                     # 只刷 last_seen 在 N 天内、有手机号/UID 的画像
#       batch: 50                          # 每轮最多查多少个
#       goals:                             # 沉默→player_reengage、新充值→player_after_deposit（需 companion.goals.enabled）
#         enabled: true
#         autonomy: auto
#         max_per_day: 20
#     commandbus:                          # B4：智聊→智拓手机 外呼指令出箱（契约 huoke docs/CHATX_COMMANDBUS_CONTRACT.md）
#       enabled: false                     # 默认关：智拓侧 reengage/stop/note executor 对齐后再开
#       db_path: ""                        # 空 → <配置目录>/player_commandbus.db
#       reengage_on_dormant: true          # sync 置 dormant 且有手机号 → 入箱 reengage
#       stop_on_keyword: true              # 对方整句 STOP/别再发/tanggalin → 入箱 stop（同号其它指令作废）
#       pull_limit: 20
# 日报：.venv\Scripts\python.exe -m domains.player_care.report --config config_player\config.yaml [--day YYYY-MM-DD] [--json]
