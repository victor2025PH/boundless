# 自家阵营在推活动登记表（#147，2026-09-02）——「别拆自家台」的事实源。
# 实锤：客户提到收件箱里「佳士得夏季拍卖·充值奖励」推广（我方其他人设在推），
# 另一人设连讽四条「silly top-up bonuses / flashy ad / auction houses don't beg
# for deposits」——LLM 反诈直觉对自家推广素材开火。登记在这里的活动/产品：
#   ① 人设 prompt 注入「自家在推活动」硬约束块（不质疑真伪/不贬损/不主动推销）；
#   ② 出站贬损守卫：命中登记词 + 负面定性词（骗局/广告/愚蠢/乞求/spam/scam…）的
#      句子确定性剥离；客户刚提过登记活动时，连「充值奖励/保证金/等级」这类机制泛词
#      +负面词的句子也剥（跨轮语境）。
# 词表另外自动并入：上面 offers 里当日有效的活动文案 + products 的产品名。
# 护栏刻意比 offers 松：不要求同域 url / for_churn——登记的是「别嘲讽」的事实，
# 不是「可以主动引用」的促销。enabled 显式 true + authorized_by 留痕 + 未过期即可；
# valid_until 可省（长期活动）。改动即时生效（目录 mtime 热加载）。
camp_promotions: []

