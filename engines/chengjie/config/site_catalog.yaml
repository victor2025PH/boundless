# 官网产品目录（bd2026.cc）——聊天带货的单一事实源（site_catalog.py 消费）。
#
# 镜像来源（改价先改上游，再同步这里）：
#   - website/lib/pricing.ts        价格/币种（2026-07-18 定价决议，USD）
#   - website/lib/order-lines.ts    自助下单 plan 键（/order?plan=<key>）
#   - products/*/product.yaml       产品事实
# 收录纪律：只收公开货架产品；gated 线（ReachX/FaceX 类）绝不入目录。
# pains 关键词 = 选品匹配面（对方画像 need/channel/occupation 文本命中计分）。

site:
  base_url: https://bd2026.cc
  order_path: /order
  calc_url: https://bd2026.cc/#autochat          # AI 成交收益试算器所在区块
  support_contact: "Telegram @WJKJ2026（官网页脚同号，谨防仿冒）"

products:
  - id: chatx
    name_zh: 智聊 ChatX
    name_en: ChatX
