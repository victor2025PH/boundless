    # 的』就立刻回暖」是机器人破绽。求和先进记仇期（级别∝骂战轮数、真道歉打折、
    # 敷衍开脱会被点破），逐轮消气+TTL 时间冲淡；记仇期再骂＝重燃且轮数续算；
    # 危机信号即刻散仇让位（安全 > 脾气）。默认开（同 enabled 的分叉理由：
    # 老板点名的行为修复，默认 false 会静默退回破绽行为）。
    grudge_enabled: true     # false=回「求和立刻停火」旧行为
    grudge_max_level: 3      # 记仇轮数封顶（0=同关闭；客户是收入，冷淡期必须有界）
    grudge_ttl_sec: 5400     # 记仇窗时限（秒）：没互动这么久气自然消，夹 [300,21600]
    output_guard: true       # 出站认输句否决器（P1-b）：骂战轮剥「懒得跟你吵/我睡觉去了/
                             #   换个话题」认输句、记仇轮剥「没事啦/不生气了」秒原谅句——
                             #   指令层压不住模型时的确定性最后防线（剥尾保头零延迟；熔断
                             #   收场与翻篇轮的退场/和解语义合法不剥）。false=纯指令层
  proactive_topic:
    enabled: false           # 总开关（默认关）
    dry_run: false           # 灰度：只计划不真发（先看 preview + 试发采样确认无误再关）
    interval_sec: 900        # 调度循环间隔（秒）
    scan_limit: 200          # 每轮扫描最近多少条会话
    min_silent_hours: 24     # 沉默至少这么久才主动（低于不打扰活跃用户）
    cooldown_hours: 72       # 同一会话两次主动开场最小间隔（防骚扰）
    max_per_tick: 3          # 每轮最多主动开场会话数
    quiet_start_hour: 23     # 安静时段起（不打扰），24h 制
    quiet_end_hour: 8        # 安静时段止
    # 实施92b 与跟进 SOP 链划界（默认开）：会话有在途工作链（running/paused）
    # 时业务节奏由链主导（到点提醒/自动拟稿），本闲聊回访让路跳过——防「链刚
    # 跟进完 15 分钟又来一条没话找话」双打扰。预览页 skip 原因=chain_running。
    yield_to_chains: true
    # 冷启动隔离（2026-08-04 智拓机 .198 事故根因闸，默认开；代码默认亦为开，即便本段
    # 缺失也生效——安全 floor 不依赖配置）：新登录/新接入的账号在预热窗内一律不主动
    # 外呼。根因＝目录同步把手机历史会话灌进来后，个个「沉默数月」立刻满足沉默阈值，
    # 新号登录第一个 tick 就把同行/bot/群当「老朋友」群发问候 → 当场被识破 + 向风控
    # 表演自动化 + 烧光试用额度。这三条只压**主动外呼**，用户手动发送不受影响；
    # judgement 为纯函数 src/inbox/outbound_gate.may_contact。（入站自动回复由下面
    # 单独一条 warmup_review 管，语义不同，别混为一谈。）
    cold_start:
      enabled: true
      warmup_hours: 72                    # 账号接入不足这么久 → 不主动外呼（0=关这层）
      require_inbound_since_connect: true # 只有导入历史（接入后对方从未开口）的会话不冷开场，
                                          #   等对方先开口再纳入沉默回访（真实关系不受影响）
      quota_gate: true                    # 授权/试用字符额度用尽 → 停系统自主外呼（人工不受限）
      warmup_review: false                # 闭环另一半（入站侧）：true 时预热窗内**入站自动回复**
                                          #   降级为 review——AI 照常拟稿，人点一下再发。事故里真正
                                          #   被对方识破、真正烧穿额度的正是这条链（新号一登录，
                                          #   导入的历史关系里谁开口都被全自动接管，而他们认识
                                          #   的是号主本人）。判据取账号注册表 created_at，判不出
                                          #   就不封顶（存量账号升级零行为变更）。
                                          #   2026-08-09 出厂默认改为 false：它压的是用户买的核心
                                          #   功能（有人来消息时自动回），而上面三条压的只是系统
                                          #   主动外呼。实测 .198/.104 装完开全自动 → 72h 内零自动
                                          #   回复、稿子堆待审队列，且无 UI 入口可关，用户只会判定
                                          #   「功能坏了」。要恢复保护改回 true。
                                          #   注意代码默认（outbound_gate._DEFAULTS）仍为 True：
                                          #   本段整体缺失时按保守封顶，安全 floor 不依赖配置。
    # 未回退避（P0 2026-07-29，默认开）：上一条主动开场没得到任何回应 → 下一次
    # 冷却按 multiplier^streak 拉长（如 48h→6天→18天→封顶月频），对方一开口立即
    # 复位正常节奏。修实锤事故：冷却只看时间不看响应 → 对从不回复的联系人每到
    # 冷却点就再发一条「好久没联系」（近 14 天 45% 的主动发送是对空气连发）。
    # 只会让发送更少更克制，不新增任何发送；enabled: false 回旧行为。
    no_reply_backoff:
      enabled: true
      multiplier: 3.0          # 每多一次未回，冷却翻的倍数
      max_backoff_hours: 720   # 退避封顶（30 天＝死联系人渐进降到月频）
      stop_after: 0            # 连续 N 次未回后彻底停发（0=不硬停，靠封顶月频）
      # P1：从未开口（last_in_ts=0）的联系人连续 N 条主动没回 → 彻底出圈。
      # 0 互动不属于陪伴回访语义；比普通月频保底更严。对方一开口即自动恢复。0=关。
      stop_after_never_replied: 2
    # 开场变体守卫（P0，默认开）：生成文案与「上次主动开场 / 末尾连续未回的出站
    # 消息」相似度 ≥ 阈值 → 换写一次，仍雷同则本轮放弃（宁可不发也不做复读机；
    # 生产实锤同句式「好久没联系啦，最近怎么样」x3/x2/x2 连发）。
    variety:
      enabled: true
      # 归一化比率（去标点/emoji/中文语气助词后 difflib）。0.6 按生产语料校准：
      # 近重复问候对 0.667~1.0、真换切入点的开场 ≤0.242，落干净分隔带中。
      similarity_threshold: 0.6
    # P1 opt-out：对方明说「别再发了/stop messaging me」→ 静默 mute_days 天不再主动
    # （只拦主动触达，对方再来消息照常回）。对方开口即提前解除。词表保守，宁漏勿误伤。
    optout:
      enabled: true
      mute_days: 30
    # P2 回复率反哺节奏（默认开）：账本半衰滑窗累计「主动→是否得到回应」长期观察。
    # streak 退避是急性信号（这一轮连着没回），回复率是慢性信号（TA 历来回不回）——
    # 慢性低回复冷却×stretch（在退避之外再拉长记性，封顶仍 720h）；慢性高回复可配
    # relax<1 略提频（提频=增加发送，运营决策，默认 1.0 不提）。样本 < min_obs 不判。
    response_pacing:
      enabled: true
      min_obs: 4               # 至少攒几次「发送→结局」观察才启用比率信号
      low_rate: 0.15           # 长期回复率 ≤ 此值 → 冷却×stretch
      stretch: 1.5
      high_rate: 0.6           # 长期回复率 ≥ 此值 → 冷却×relax（仅 relax<1 时生效）
      relax: 1.0               # 夹在 [0.5, 1.0]；1.0=不提频
      # P6 分位阈值自适应（默认关）：low/high 不用上面的冷启动固定值，改按账本
      # 各会话长期回复率分布的分位数校准——人群整体回复率高（0.15 永不触发）或
      # 低（0.6 永不触发）的部署各得其所。合格人群 < min_population 或分布同质
      # （P75-P25 < min_separation，分层=追噪声）自动回落固定值；看板出生效值。
      auto_thresholds:
        enabled: false
        low_percentile: 25
        high_percentile: 75
        min_population: 12
        min_separation: 0.15
    # P3 媒体形态反哺（默认关）：voice/photo 发送概率按 outreach_log 分形态回复率
    # 相对 text 基线自校准——factor=clamp(sqrt(kind率/text率), max_cut, max_boost)，
    # 有效概率=配置概率×factor 夹 [0.02,0.95]。**只换形态不换总量**（消息数由
    # pacing 层决定）；min_intimacy/modes/daily_cap 护栏全不动；双臂各 ≥
    # min_sent_per_arm 才动，冷启动照配置值探索攒样本。已知偏差：photo 只发熟客
    # 回复率天然偏高，boost 后仍要过亲密度闸，风险有界。
    media_feedback:
      enabled: false
      min_sent_per_arm: 8      # 该形态与 text 基线各至少发过几条才启用
      lookback_days: 14        # 只看近 N 天的触达（新鲜度）
      response_window_days: 3  # 触达后几天内有入站算「回复」
      max_boost: 1.5           # 概率上调封顶
      max_cut: 0.5             # 概率下调保底
    # P5 checkin 效能门控（默认关）：数据证明「什么钩子都没有」的温和问候回复率
    # 远低于富开场（记忆回访/生活分享/天气/剧情）时，按差距比例本日跳过部分裸
    # checkin——skip=clamp(1-checkin率/富开场率, 0, max_skip)。只减发送不增；
    # crc32(会话#日期) 确定性跳过（tick 重掷会把「跳过」磨成「延迟」）；两臂样本
    # 不足恒 0（机制先上线，数据到位自动激活）；max_skip 封顶保留探索量，
    # checkin 回复率永远可被重新测量。
    mode_gate:
      enabled: false
      min_checkin_sent: 30     # checkin 臂近 lookback 天至少发过几条
      min_rich_sent: 15        # 富开场臂合计至少发过几条
      max_skip: 0.5            # 跳过概率封顶
      lookback_days: 14
      response_window_days: 3
    crisis_guard_days: 14    # 情绪护栏回看窗（天）：近 N 天内有危机事件则抑制主动打扰——
    #   severe（自伤/轻生）→ 完全不主动（交人工/关怀）；elevated（深度绝望）→ 抑制剧情邀约、
    #   仅保留温和问候。避免在情绪低谷期推「播放性」内容（如约会剧情邀约）。常驻安全护栏。
    crisis_care_escalation: true  # 危机关怀升级：severe 被护栏拦下的沉默用户不只静默，
    #   而是排一条高优先 care 待办（topic=情绪关怀），交关怀/坐席兜底——把"静默"变"接住"。
    #   幂等（排进后该会话整段让路，不重排）；需 care 子系统就绪（care_schedule store 已挂）。
    # few-shot 风格示范：把人工高赞/差评改写样本作为「口吻示范」拼进生成 prompt
    # （只学风格不照抄内容）。默认关——先用「调参建议」人审样本质量，再开此自我改进环。
    few_shot:
      enabled: false         # 默认关（人审样本后再开）
      max_examples: 3        # 最多注入几条示范
    # Stage R：生日主动采集——把最没话说的 gentle_checkin 开场，在「关系够深 + 还不知道生日 +
    #   距上次问够久」时升级成"顺势自然问一句生日"，让 Stage Q 的生日仪式真正转得起来
    #   （否则没人主动说生日就永远触发不了）。只升级 gentle_checkin（有记忆钩子时回访更优先）；
    #   危机/低落时不问；生日已知则永不问；问过 cooldown_days 内不再问。
    birthday_ask:
      enabled: false         # 默认关（companion 预设里默认开）
      min_intimacy: 45       # 关系够深才问（比每日问候/节点门槛都高，问生日更私人）
      cooldown_days: 30      # 问过这么多天内不再问同一人（避免反复打听）
    # Stage T：称呼主动采集——同生日采集一套框架（升级最没话说的 gentle_checkin 顺势问），
    #   补足"该怎么称呼TA"这项最高频个性化信息。称呼 capture 已由 heuristic（叫我X/我是X）落库，
    #   这里只补"主动问"。门槛比生日低（称呼比生日没那么私人，可早点问）。多槽位按 birthday→name 择一问。
    name_ask:
      enabled: false         # 默认关（companion 预设里默认开）
      min_intimacy: 35       # 关系略熟即可问（比生日门槛低，称呼没那么私人）
      cooldown_days: 30      # 问过这么多天内不再问同一人
    # 城市主动采集：只问「没有 replace 时钟」且「像海外」的会话（外语 /
    # 行为钟相对国内 ≥3h）。国内中文即开了开关也不问。答句落 residence 记忆
    # 并作废时钟缓存 → 下次 tick 按自述城市 replace。默认关。
    city_ask:
      enabled: false
      min_intimacy: 40       # 问住址比称呼私人、比生日轻
      cooldown_days: 45      # 问过这么多天内不再问同一人
    # Stage L：每日仪式感主动问候（晨安 / 晚安）——竞品对标的日活留存核心钩子。
    #   与上面「沉默回访」互补：那条沉默驱动（久未联系才回访记忆），本条时段驱动（每天到点问候）。
    #   每日每档去重（一天最多一句早安 + 一句晚安）；共用情绪护栏（危机不发欢快问候）+ care 去重。
    #   个性化择时：按用户历史入站消息活跃时段推断 TA 习惯的晨 / 晚点，只在那个点问候。
    daily_ritual:
      enabled: false               # 默认关（companion 预设里默认开）
      morning_window: [7, 10]      # 早安时段 [起,止)（闭开区间）；个性化点落此内才采纳，否则取起点
      night_window: [21, 24]       # 晚安时段 [起,止)
      min_intimacy: 20             # 关系太浅不做仪式问候（不对刚认识的人道"早安亲爱的"）
      min_quiet_gap_hours: 3       # 距上次互动不足此时长不问候（人还在场，道早晚安多余）
      max_per_tick: 5              # 每轮最多问候人数
      personalize_active_hour: true  # 按用户历史活跃时段择时；关则统一在窗口起点问候
    # Stage P：纪念日·节日仪式（认识 N 天 / 节日）——事件/日期驱动的高情感节点问候。
    #   在每日晨/晚安之上，对标 Replika/星野的「我们在一起 N 天了」「节日快乐」体验。
    #   复用每日仪式同一冷却表去重（纪念日永久一次 / 节日每年一次）；节点优先于晨/晚安。
    milestone_ritual:
      enabled: false               # 默认关（companion 预设里默认开）
      greet_hour: 10               # 节点问候只在这个整点触发一次（与晨/晚安错开，避免扎堆）
      min_intimacy: 30             # 关系够深才庆节点（比每日问候门槛高）
      max_per_tick: 5              # 每轮最多问候人数
      celebrate_birthday: true     # 生日仪式（最高优先级）：从记忆扫出生日，当天庆生；关则不查生日
      anniversary_days: [7, 30, 100, 180, 365, 520, 1000, 1314]  # 认识 N 天里程碑
      # 节日日历（"月-日": 名称）；只放公历固定日期。农历（春节/中秋）逐年漂移，按年自配当年公历日期。
      holiday_calendar:
        "01-01": "元旦"
        "02-14": "情人节"
        "12-24": "平安夜"
        "12-25": "圣诞节"
        "12-31": "跨年夜"
  # Phase ②：关系成长系统（Bond Level）——把 intimacy_score 升华为「看得见的成长」。
  # 等级/进度/里程碑由 relations-health 健康卡 API 透出（运营/MiniApp 可见）；
  # 此开关只控「是否给 AI 注入关系厚度感知块」（默认关；开后仅在 intimate/steady 或
  # 刚达成里程碑时给一句背景，让 AI 自然流露深度而非游戏化播报）。
  bond_level:
    enabled: false
    # 按关系等级解锁的「预览」映射（键可为 1..4 或阶段 code initial/warming/intimate/steady）。
    # 仅供前端展示「这段关系配解锁什么」；是否真放行仍由 monetization tier gating 决定，
    # 本映射绝不作为绕过付费的后门。默认空=不解锁任何东西。
    # unlocks:
    #   warming: [voice_reply]
    #   intimate: [exclusive_album, story_ch1]
    #   steady: [all_story]
