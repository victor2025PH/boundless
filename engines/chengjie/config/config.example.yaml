      platform_messenger: "msg_auto"
      platform_line: ""
      platform_whatsapp: ""
  - name: "line-wa"
    description: "LINE + WhatsApp（不含 Messenger）"
    fields:
      platform_messenger: ""
      platform_line: "line_auto"
      platform_whatsapp: "wa_auto"

# Facebook Messenger 客户端 RPA（ADB + Vision；与 Telegram/LINE 共用 Skill/AI）
# 多账号模式：在 accounts[] 下为每台手机写一条；device_coordinator.platforms 里
# 用 account_id 对应到具体账号，每账号自动使用独立 state DB。
messenger_rpa:
  enabled: false
  autostart: true
  adb_serial: ""        # 单账号模式保留此字段；多账号时由 accounts[].adb_serial 覆盖
  adb_user_id: 0
  messenger_package: com.facebook.orca
  # 多账号示例（4台手机各1个Messenger账号）：
  # accounts:
  #   - account_id: msg_ij8
  #     adb_serial: IJ8HZLORS485PJWW
  #   - account_id: msg_q4n
  #     adb_serial: Q4N7AM7HMZGU4LZD
  #   - account_id: msg_vwn
  #     adb_serial: VWNJFUNRV4LF4XTS
  #   - account_id: msg_xw8
  #     adb_serial: XW8TQKEQIVJRQO69
  # 更聪明的轮询：通知监听会立即触发；普通空闲轮询也不要拖到 30s+。
  interval_sec: 8.0
  min_interval_sec: 2.0
  max_interval_sec: 60.0
  backoff_multiplier: 1.25
  max_inbox_per_run: 2
  # run_once 开始位置：
  # - smart_current_thread: 已经在目标聊天页时直接读取并回复
  # - force_chats: 每次强制回 Chats 列表扫描
  run_once_start_mode: smart_current_thread
  thread_title_vision_fallback: true
  # MIUI lowmemkill 时 uiautomator dump 返回 "Killed"，XML/Vision/搜索三个
  # title 校验 fallback 全部失败；UI XML tap 已经像素精确点中目标行，此时
  # 信任 target.name 而不阻塞发送（true=系统能继续工作；false=严格校验）
  trust_xml_tap_target_name: true
  # P0-A peer message quiet window：生成 LLM 回复前等一小段，给对方把后续消息
  # 发完，避免"对方连发→机器人对每条单独回复"的重复。peer_typing 探测到打字
  # 时会自动延长到 detector 建议时间（封顶 max_sec）。设 0 即禁用。
  peer_message_quiet_window_sec: 1.8
  peer_message_quiet_window_max_sec: 10.0
  pre_thread_self_xml_guard: true
  stale_peer_after_self_guard: true
  stale_peer_after_self_window_sec: 900
  stale_peer_after_self_overlap_threshold: 0.45
  reply_mode: auto
  default_reply_lang: zh
  language_alignment: auto
  notif_watch_enabled: true
  notif_poll_ms: 700
  use_adb_keyboard: true
  adb_keyboard_ime: com.android.adbkeyboard/.AdbIME
  adb_keyboard_package: com.android.adbkeyboard
  thread_self_media_xml_guard: true
  audio_pipeline:
    enabled: false
    backend: faster_whisper
    model_size: base
    model: whisper-1
    device: cpu
    compute_type: int8
    language: auto
    download_root: models/whisper
    fallback_enabled: false
    fallback_backend: openai
    fallback_model: whisper-1
    min_text_chars: 3
    fallback_on_low_confidence: false
    min_avg_logprob: -0.8
    min_language_probability: 0.35
    cb_cooldown_sec: 300
  voice_input:
    enabled: false
    prefer_transcribe: true
    capture_mode: run_as        # run_as | helper_session | helper_app | screenrecord | external_file | ack_only
    record_sec: 8
    timeout_sec: 30
    fallback: ack_and_approve
    helper_apk_path: tools/audio_capture_helper/build/MrpAudioBridge.apk
    helper_package: com.codex.mrpaudiobridge
    helper_auto_install: true
    helper_wait_sec: 12
    silence_max_abs: 120
    find_voice_scroll_attempts: 2
    # voice_tap_xy: [158, 374]  # 可选：指定播放按钮坐标，留空则自动识别
    audio_pipeline:
      enabled: false
      backend: faster_whisper   # faster_whisper | openai | disabled
      model_size: base
      model: whisper-1
      device: cpu
      compute_type: int8
      language: auto
      download_root: models/whisper
      fallback_enabled: false
      fallback_backend: openai
      fallback_model: whisper-1
      min_text_chars: 3
      fallback_on_low_confidence: false
      min_avg_logprob: -0.8
      min_language_probability: 0.35
      cb_cooldown_sec: 300
  voice_output:
    enabled: false
    mode: approval_only         # approval_only | text_plus_voice | auto_voice
    trigger: when_peer_voice
    backend: edge_tts           # edge_tts | pyttsx3 | openai | disabled
    voice: zh-CN-XiaoxiaoNeural
    model: gpt-4o-mini-tts
    format: mp3
    out_dir: tmp_voice_replies
    voice_profile:
      enabled: false
      owner_consent: true       # 仅允许使用本人/已授权声音
      speaker_id: my_voice
      reference_audio_path: D:/workspace/telegram-mtproto-ai/voice_samples/my_voice.wav
      backend: voice_clone_command
      # 优先使用 command_args，避免 Windows 路径/引号问题；必须输出到 {out}
      command_args: [python, D:/workspace/telegram-mtproto-ai/tools/qwen_tts_wrapper.py, --region, cn, --text, "{text}", --out, "{out}", --voice-profile, D:/workspace/telegram-mtproto-ai/voice_samples/qwen_my_voice.json, --language-type, Japanese]
      # command_template 作为兼容旧脚本的 shell 字符串方案
      # command_template: python tools/glm_tts_infer.py --text {text} --ref {reference_audio} --out {out}
      command_timeout_sec: 120
    timeout_sec: 30
    max_seconds: 20
    max_text_chars: 220
    send_text_summary: true
    night_quiet: true
    fallback: text
    auto_find_share_send_button: true
    auto_search_share_recipient: true
    send_audit_dir: tmp_messenger_rpa
    # auto_voice 模式下用于 Messenger 分享页；默认用 chat_name 从 UI XML 自动找 Send 按钮
    # 若 UI XML 在部分手机上不可用，会搜索联系人并用截图识别蓝色 Send 按钮
    # share_recipient_name: Victor Zan
    # share_recipient_tap_xy: [600, 640]
    # share_send_tap_xy: [616, 634]
  mobile_auto:
    root_path: D:/workspace/mobile-auto0423
    api_base: http://127.0.0.1:18080
    openclaw_db_path: D:/workspace/mobile-auto0423/data/openclaw.db
  # Messenger 多人设 / 语言锁。按联系人名或 chat_key 命中；未命中走 default。
  reply_profiles:
    default: warm_companion
    profiles:
      - id: warm_companion
        language: auto
        style_hint: |
          你是自然的 Messenger 私聊对象，不是客服机器人。优先短句、口语、像真人聊天。
          用户很短时只回一小句；用户认真倾诉时先接住情绪，再轻问一个问题。
        persona:
          name: 小灵
          role: 朋友式陪聊与转化助手
          personality:
            traits: [温柔, 机灵, 有边界感]
            style: 轻松自然的私聊口吻
          speaking:
            language_follow: true
            reply_length: concise
            max_reply_sentences: 3
            forbidden_phrases: [作为一个AI, 有什么可以帮您, 请问有什么需要]
      - id: professional_support
        match_names: []
        language: auto
        style_hint: |
          面向明确咨询、订单、付款、商务问题时使用。先给结论，再给下一步动作。
          避免恋爱腔，避免大段解释。
        persona:
          name: 小灵
          role: 专业但不生硬的客户沟通助手
          speaking:
            language_follow: true
            reply_length: concise
            max_reply_sentences: 4

# ── 局域网语音克隆（LAN 优先 → 云端兜底）─────────────────────────────────────
# 声音克隆放到局域网语音主机（fish_speech_s2 / AvatarHub）上跑：192.168.0.188:7855。
# 合成时先快速健康探测（含 model_loaded）：在线 → 局域网零样本克隆（WAV）；
# 不可用/失败 → 自动回落云端 Qwen。登记同理：LAN 在线时零样本登记（不烧云端配额）。
# 接口契约：POST /v1/tts/clone {text, reference_audio_b64, reference_text, language, return_base64}
#          → {ok, audio_base64(WAV), sample_rate}；GET /health → {model_loaded:true}
# enabled=false 时完全保持现状（仅走云端）。
voice_clone_lan:
  enabled: true
  base_url: http://192.168.0.188:7855    # fish_speech 语音克隆主机（7855；8000 是换脸，勿混）
  protocol: fish_speech
  clone_path: /v1/tts/clone              # 零样本克隆合成端点
  health_path: /health                   # 健康探测端点（含 model_loaded）
  health_timeout_sec: 2.0                # 探测超时；超了即判「局域网不可用」
  health_cache_sec: 30                   # 探测结果进程级缓存秒数（避免每条都探）
  synth_timeout_sec: 300                 # 单次克隆合成超时（fish_speech 建议 ≥300s）
  language: zh                            # 默认合成语种（zh/en/ja...）
  api_key: ""                            # 主机需鉴权时填（Bearer）
  cloud_fallback: true                   # 局域网不可用/失败 → 回落云端 Qwen
  # P-RT：克隆主机若支持自然语言情感指令（如 MiniCPM-o），情绪经结构化 instructions
  # 字段下发（不会被读出，零 garble，默认开）；fish_speech 内联标记仍 opt-in：
  emotion_inline_tags: false             # 仅 fish_speech S2 这类「内联标记」主机才开

# companion.proactive_topic.voice（Phase13）：主动开场语音化——按概率把主动打招呼
# 发成克隆声语音条（复用 autosend 语音全套+人设灰度名单；失败回落文本）：
#   voice: {enabled: false, probability: 0.5, min_chars: 4, max_chars: 80}

# ── AvatarHub 本机语音服务（CosyVoice3 情感克隆 + Qwen3-TTS 批量 + 远端 Whisper STT）──
# 本机作为 AvatarHub 集群 TTS 节点时（D:/faceX/mfys 常驻服务，计划任务开机自启），
# backend=avatar_clone 走 7852 情感克隆（在线主力，2~4s/句，原生 emotion 标签 +
# ── 出站语音按语言路由（粤语客户场景）────────────────────────────────
# 克隆声（CosyVoice/avatar_clone）是普通话音色，读粤语文本"唔咸唔淡"。开启后：
# 回复文本检测为粤语书写（嘅/咁/唔/哋 等特征字达阈值）→ 该条切 Edge zh-HK 粤语
# 音色合成；普通话/外语照走原克隆链。属主动选择而非兜底 → 不受 no_edge_fallback
# 拒发约束。注意：Edge 粤语音色非人设克隆音（音色会变）；要"同一把声讲粤语"
# 需 CosyVoice2 粤语克隆（把 backend/voice 指过去即可复用本路由）。
voice_lang_route:
  enabled: false
  cantonese:
    enabled: true
    backend: edge_tts
    voice: zh-HK-HiuMaanNeural    # 女声；男声 zh-HK-WanLungNeural / 另一女声 zh-HK-HiuGaaiNeural
    min_markers: 2                # 粤语特征分阈值（单字1分/词组2分），越高越保守
  # follow_text（2026-07-23）：通用「音色跟随文本语种」——Edge 音色按语言训练，
  # ja 音色念中文=「日本腔中文」（生产实锤被客户当"讲日语"投诉）。开启后 edge 链
  # 每条合成前检测文本语种，与当前音色语言前缀不一致 → 换该语种映射音色
  # （内置 22 语映射见 src/ai/lang_voice_route.EDGE_VOICE_BY_LANG，voices 可覆写）；
  # Multilingual 系音色（自适应语种）与克隆链主后端不动（克隆原生跟随文本语种，
  # 仅对齐其 edge fallback_voice）；语种明确但无映射 → 拒发语音回落文字（宁缺毋滥）。
  follow_text:
    enabled: true                 # 随父开关（voice_lang_route.enabled=false 时整体关）
    reject_unmapped: true         # 无音色可映射时拒发语音（false=保持原音色照发）
    voices: {}                    # 语种前缀→音色覆写，如 {en: en-US-AriaNeural}
  # clone_langs（P2 2026-08-31 全语种克隆）：通用「语种 → 克隆节点」路由，粤语
  # 专线机制的泛化——参考音跟人设走＝**同一把声讲外语**。命中语种把本次合成
  # 改派到指定克隆节点（fish /v1/tts/clone 契约直连），并携带闸门放行标记
  # （TTSPipeline 语种能力闸对该语种放行）。缺省空映射=不启用零行为变化。
  # ⚠ 开闸前置：节点×语种×参考音必先过
  #     python tools/verify_clone_lang.py --clone-url <节点> --ref <参考音> \
  #       --cases <语种>:<标注> --lang-tag
  #   全 PASS + 人耳抽检通过才落配置（配置即背书，闸门按标记放行）。
  # 实测钉子（2026-08-31，117:7852 CosyVoice3）：clone_text_prefix 语言标签
  # **必配**——缺了=日文汉字按中文读音念出（"今日は"→"今儿我"怪声实锤）；
  # 该部署 ja/ko 语言正确（CER 0.07/0.0），es 不支持（英语音系胡念）。
  # clone_langs:
  #   ja:
  #     backend: minicpm_clone
  #     voice_profile:
  #       clone_base_url: http://127.0.0.1:7852
  #       clone_text_prefix: "<|ja|>"
  #     fallback_voice: ja-JP-NanamiNeural
  #   ko:
  #     backend: minicpm_clone
  #     voice_profile:
  #       clone_base_url: http://127.0.0.1:7852
  #       clone_text_prefix: "<|ko|>"
  #     fallback_voice: ko-KR-SunHiNeural

# ── 新会话初始语言先验（lang_prior，2026-07-23）────────────────────────
# 新好友第一条消息常是 "Hi"/emoji/贴图——语言中性判不出证据，决策链落空到
# default=zh，给菲律宾/泰国客户回中文首句。开启后在**全链落空时**按
# ① 账号级配置（platform:account 精确键 > platform 平台键）
# ② 电话号码国码（仅 phone_platforms 白名单平台，chat_key=E.164 号码；
#    内置 ~70 国码映射见 src/ai/lang_prior.PHONE_CC_LANG，country_overrides 可覆写）
# 供给首句语言。这是「先验」不是「覆写」：客户任何真实语言证据/明确请求/
# 历史窗口/上一轮粘滞都优先，一旦有语言状态先验即让位。
lang_prior:
  enabled: false
  phone_platforms: [whatsapp]     # chat_key 是电话号码的平台（tg 数字 id 形似号码，勿加）
  account_defaults: {}            # {"whatsapp": "en", "whatsapp:639270135480": "en"}
  country_overrides: {}           # {"63": "en"} 国码→语言，覆写/补充内置表

# instruct 自由语气 + register_spk 预热）。**只 HTTP 调用，严禁本进程加载模型**。
# 人设参考音：voice_profile.reference_audio_path 指 3~10s 干净单人声 WAV；
# 同目录同名 .txt 为逐字稿（自动读取，显著提升音色相似度）。
avatar_voice:
  enabled: false                         # 总开关（新子系统默认关）
  # 语音降级策略全局默认（2026-07-14 Phase21b）：A 线(telegram.voice_reply)/B 线
  # (inbox.l2_autosend.voice)/中文主动触达共用同一口径——运营配一次即全链继承。
  # 局部块仍可就地覆写（局部显式值优先于此全局默认）。
  policy:
    no_edge_fallback: false              # 7852/克隆不可达时不发 edge 通用声（防音色分裂），回落文字；预渲染命中除外
    # 真出图 GPU 占用期间 defer 语音——仅当「发图与语音克隆共享同一 GPU」（单机部署）才有益：
    # 并发出图抢显存会拖垮合成。若发图在独立主机/GPU（如 ComfyUI 在 5090、7852 克隆在本机
    # 3060），全局 in-flight 计数会因别的会话出图而把本会话语音降级为文字，无收益反伤体验 →
    # 分离拓扑应置 false。默认 true 保守护住单机部署。
    defer_during_image: true
  base_url: http://127.0.0.1:7852        # A：CosyVoice3 情感克隆（在线回复主力）
  qwen_base_url: http://127.0.0.1:7858   # B：Qwen3-TTS（仅离线批量预渲染，RTF≈2.8）
  # 幻声 hub Fish-Speech 高保真优先（Phase B, 2026-07-24）：avatar_clone 人设合成时
  # 先走幻声机(.176:9000)的 /api/tts_only（Fish-Speech-1.5 零样本克隆, 44.1kHz），
  # 命中即用最高保真音；不可达/失败 → 贯穿回落本机 CosyVoice3(7852)，绝不阻塞出站。
  # 前提：人设 id 与 hub 声纹档同名（lin_jiaxin/zhao_laoshi/... 已在 hub 注册参考音）。
  # 音色一致性（2026-07-27）：strict=hub 挂了拒发语音（回落文字），绝不让本机 7852
  # 另一份参考音静默顶班换声；lenient=旧行为（贯穿回落本地克隆）。
  voice_consistency: lenient
  # 繁→简发音输入（P0-3 2026-08-31，默认开）：克隆引擎按简体建模、繁简同音——
  # 繁体文本（zh-tw 译声/繁体客户）在合成前转简体防念错字，展示层（译稿/消息
  # 记录）不动；日文/粤语/非中文主体内建豁免。这是纠正既有缺陷非新子系统
  # （简体文本恒等转换，行为不变）；个别部署要原样直送置 false。
  # clone_t2s: true
  # 克隆主路可念语种显式覆写（运营最了解自家节点；缺省由引擎能力表自动推导，
  # 见 lang_voice_route.CLONE_ENGINE_LANGS）。设置后 effective-config.voice_langs
  # 警示与合成层语种闸都按此表判。例：voice_langs: [zh, en, ja]
  # ⚠ #161（2026-09-03）起缺省表**只登记实测念对的语种**，日语/韩语一律不在内
  # （1.0.71 实录：日语三次 CER>0.35、重合成仍「ゾオパパパ」乱音）。要开日语等
  # 语种，先跑 tools/verify_clone_lang.py 过全套机器判据 + 人耳抽检，再在此显式
  # 覆写——这个键的语义就是「部署方为这份能力背书」。
  # voice_langs: []
  # 合成后 ASR 回转校验门（默认关；开=坏 take 自动重合成取较优，fail-open 绝不
  # 阻塞发声）。多语轨（P2-9 2026-08-31）：非中文文本按目标语种强制转写 + 通用
  # 字符级 CER（旧行为「非中文不评」＝新语种开闸后最需要质检的语种零回验）；
  # multilingual: false 回旧行为，foreign_cer_threshold 为外语轨独立阈值
  # （字符级对拉丁语种天然偏严，缺省 0.35 略宽于中文轨 0.30）。
  # synth_verify:
  #   enabled: true
  #   cer_threshold: 0.3
  #   max_retries: 1
  #   multilingual: true
  #   foreign_cer_threshold: 0.35
  hub_fish:
    enabled: false                       # 默认关（opt-in；本机 overlay 开）
    base_url: http://192.168.0.176:9000  # 幻声 hub 单一 LAN 网关
    timeout_sec: 30.0                    # 单句合成超时（跨机 + Fish 推理）
    # 真活探针（health_watchdog.true_probe）打本域的超时，与业务 timeout_sec 分开：
    # 探针必须等到 hub 内部「换引擎/换副本」重试跑完，否则提前放弃留下在途请求，
    # hub 判该副本「疑似挂死」并让后续路由规避它＝探针反伤业务（2026-08-21 实锤）。
    # 默认 90.0，地板 60.0（配更小无效）。
    probe_timeout_sec: 90.0
    best_of: 1                           # >1 多 seed 择优(campplus 挑最像)，牺牲耗时换音质
    # best_of_parts: 1                   # 分条发送的单条独立候选数（缺省=沿用 best_of）。分条 2-3 条 ×
    #                                    # best_of=2 是 hub GPU 的主要放大器；synth_verify 已兜坏 take，
    #                                    # 分条降 1 候选可把 hub 压力近乎砍半（与直播/出图共卡更稳，2026-08-01）
    persona_allowlist: []                # 空=所有 avatar_clone 人设；非空=仅名单内启用
    # 人设 id → hub 声纹档名（与幻影共用同一档=音色天然一致；缺省＝persona_id 同名）。
    # 例：profile_map: {lin_xiaoyu: 林小玲}。换角色克隆音只改这里。
    profile_map: {}
    # 请求级钉住 TTS 引擎（空=沿用 hub 档配置）。需 hub /api/tts_only 认 tts_engine 键。
    # tts_engine: moss_ttsd
    # 语种→引擎改派（P1 2026-08-31 全语种克隆）：钉住引擎念不了的语种按语种改派
    # 到 hub 上另一台引擎（如主链 index_tts 只会中英，日文改派 fish_speech）。
    # 键=BCP47 语言前缀，值=hub 引擎名；缺省空映射=旧行为（tts_engine 一刀切）。
    # 语种能力闸（lang_voice_route.CLONE_ENGINE_LANGS/clone_voice_langs）读同一份
    # 配置：映射语种若在目标引擎能力表内，自动计入「可念语种」（effective-config
    # 的 voice_langs 与合成层闸门同步放行）；映射到未登记引擎的语种不虚报能力。
    # 改派后的引擎照常吃目录预检/超时熔断/采样率指纹闸（prefer 语义防顶包三件套）。
    # ⚠ 开闸前置（2026-08-31 实测沉淀）：引擎语言能力 ≠ 「你的声纹档×该引擎」
    # 可用——档按 A 引擎形态注册时 B 引擎可能消费不到参考音（实测 fish 对
    # IndexTTS-2 形态档全语种翻车：别人的声音/哑音）。任何映射落 overlay 前必跑
    #   python tools/verify_clone_lang.py --profile <档名> --cases <语种>:<引擎>
    # 全 PASS + 人耳抽检通过才开闸。
    # lang_engines:
    #   ja: fish_speech
    #   es: fish_speech
    # ⚠ 钉了引擎就必须知道 hub 的引擎解析是 **prefer 语义**：点名引擎在
    # /api/engines 目录里 available:false（显存吃紧被 idle_park 泊车/掉登记）时，
    # hub **静默换一个引擎**合成——客户听到的是另一个人的声音，而引擎进程自身
    # /health 200、model_loaded:true，老探针全绿（2026-08-22「fish 冒充
    # IndexTTS-2」事故，潜伏两小时）。下面两个键就是这条缝的补丁：
    #
    # verify_engine（默认 true）＝双重校验。合成前读引擎目录（确定性前兆），
    # 合成后按 **WAV 采样率指纹**核对归属（IndexTTS-2=22050 / MOSS=24000 /
    # fish=44100，指纹表另从目录的 capabilities.sample_rate 动态学习，新引擎零
    # 改码即受保护）。判不了一律放行（目录不可达/引擎未登记/ogg 转码抹平指纹）。
    # 被顶包时的处置由 avatar_voice.voice_consistency 决定：strict=拒发语音回落
    # 文字（宁缺毋滥），lenient=照发但计数上报。置 false 只留计数不拦（排障档）。
    verify_engine: true
    # auto_wake（默认 true）＝撞见「目录说离线」时后台请求 hub 把它拉起来
    # （POST /api/services/ensure，wait_s=0 不阻塞本条，进程内 90s/引擎 节流）。
    # idle_park 本就是「按需换回」的设计，而「有人现在要合成」就是那个需求信号：
    # 只靠看门狗（宽限 20min）意味着客户侧降级窗口最坏 20 分钟，挂在合成路径上
    # 收缩到一次冷载（IndexTTS-2 实测 ~18s）＝下一条消息就对了。
    # 共享 hub 上若运营是**刻意**泊掉该引擎的，置 false（别跟人抢显存）；
    # 合成路径与看门狗**共用这一个键**，关一次即全关。
    auto_wake: true
    # timeout_breaker（默认 true）＝超时熔断。上面两个键管的是「引擎在不在岗」，
    # 这个管「在岗但答不上来」：2026-08-22 实测目录 available:true + 引擎 /health
    # 200 + model_loaded:true，而同卡显存 97% 满（唱歌 5.7G + 10G 无主 python 进程
    # + 两个 ollama 模型）→ 8 字短句 36~69s vs timeout_sec=30 ⇒ **每一发都超时**。
    # 前两道闸都不响（预检看 available、指纹闸要先拿到音频），于是每条消息白等 30
    # 秒再拒发/顶包——客户先干等半分钟，然后没有语音（strict）或听到别人的声音
    # （lenient）。熔断＝连续 2 次**超时**开路 5 分钟，开路期直接跳过 hub（strict
    # 的最终结果一模一样，只是客户立刻拿到文字），窗口到点放一发探路，成了即闭合，
    # 任何一次成功立即清零。刻意只认实测超时：HTTP 4xx/5xx 是快败（无延迟税可省）、
    # 引擎冒名另有指纹闸，混进来会在「hub 答得很快只是拒绝了」时误开路；也刻意
    # **不**按显存数字推断（推断会在引擎其实还答得上来时误杀语音）。
    # 看板：ops「🎙️ AvatarHub 语音」卡「引擎在岗」行的「熔断开路 (Nmin)」角标。
    timeout_breaker: true
    # 响应音频格式：wav（默认=旧行为）/ ogg（hub 侧 ffmpeg 直出 opus 48k，省本机发送前
    # 一次转码；hub ffmpeg 异常会静默回退 wav——chengjie 按响应字节魔数落对后缀，兼容）。
    # 灰度开法：overlay 里改 response_format: ogg（缓存键含此值，翻开关自动失效旧缓存）。
    response_format: wav
    # hub 专属情感阈值（P0-3 2026-08-03）：全局 emotion_channel_threshold 是 7852
    # CosyVoice 的「情感标签→instruct2→音色漂移」权衡；hub 底座 IndexTTS-2 情感与
    # 音色**解耦**（无音色税）→ 可单独放低阈值让弱情绪（日常闲聊 0.4-0.7）也带情感
    # 标签，不再全部塌缩成 neutral 平板念稿。缺省（注释掉）=沿用全局阈值，旧行为。
    # emotion_threshold: 0.35
    # 慢速拟人编排（2026-08-19 v3 投产，src/ai/voice_pacing.py）：分句逐段合成 +
    # 句间真实停顿 + 分段情绪 + ffmpeg 变速不变调降速 + 底床/参考音真呼吸。
    # 排除面自动回落整段单发：分条单条 / 交互链（interactive: true 才开）/ 非中文 /
    # 短文本(<min_chars) / 预算不足 / numpy 缺席。软依赖 numpy+ffmpeg 不入 requirements。
    pacing:
      enabled: false                     # 默认关（opt-in；本机 overlay 开）
      tempo: 0.93                        # 普通段变速（<1=放慢，变速不变调）
      think_tempo: 0.90                  # 思考段（嗯……）更慢
      min_chars: 24                      # 短回复不编排（本就一句话）
      max_chunks: 8                      # 段数上限（超出从尾部合并）
      chunk_timeout_sec: 30.0            # 单段合成超时
      bed: true                          # 底床：残料「同房间安静」/回落 -56dB 暖褐噪
      breath: true                       # 真呼吸：hub 参考音四道闸提取，提不出=不放
      interactive: false                 # 交互链（试听/直发）默认不编排（坐席在等）
      inject_think: true                 # 整段无思考词时确定性补一处「嗯……」
  health_timeout_sec: 3.0
  health_cache_sec: 30
  synth_timeout_sec: 90.0                # 单请求超时（并发纪律）
  retries: 1                             # 失败重试次数
  default_emotion: neutral               # ⚠ neutral=保真路径(zero_shot+逐字稿,音色最像)
  emotion_channel_threshold: 0.7         # 强情绪阈值：≥才切 instruct2 情感路径(音色换表现力)
  dynamic_instruct: false                # 模板库自由语气指令（走 instruct2 有音色代价，opt-in）
  paralinguistic:                        # Phase7 活人感：叹气/气口/笑声内联标记注入
    enabled: false                       # （确定性/情绪对路才注/每条≤max_marks；不读出）
    max_marks: 2
  colloquial:                            # 活人感 P0(2026-07-14)：书面语→口语化改写（减「念稿感」）
    enabled: false                       # 总开关（默认关）：书面词→口语词 + 句首迟疑/软化词
    mode: rule                           # rule=规则档(零延迟/确定性) · llm=本地模型深度口语化(更自然,失败自动回落 rule)
    rewrite_intensity: natural           # 口语重塑力度(AI Live OS Agent6)：light=仅换词拆句 · natural=+句首连接/语气词(默认) · vivid=+主观口吻「说真的/我跟你讲」+停顿感(主播味最强)
    #                                    # 三档共享事实红线：数字/时间/人名/金额/承诺不改、不编造、不串语言。llm 档 + Phase G 生成层都吃。
    llm_timeout_sec: 8.0                 # llm 档单次超时(秒)；超时/熔断/校验不过 → 回落规则档。走 ai.fallback 本地模型(不占云)
    # provider: local                    # llm 档落点：local=LAN(llm_endpoints 或 ai.fallback) · cloud=主云端模型 ·
    #                                    # auto=云端优先回落本地 · local_first=LAN 优先、全端点失败才落云端(推荐生产档)
    # temperature: 0.5                   # 改写采样温度（改写要保真，比对话档 0.7 收敛；进缓存键）
    # llm_endpoints:                     # 口语化专属 LAN 端点列表(2026-08-01)：与 ai.fallback 解耦——兜底要 30B 出
    # - base_url: http://192.168.0.198:11434   # 对话质量，改写 7-9B 快模型足矣。逐端点失败冷却(90s) failover，
    #   model: qwen3:8b                  # 全列表失败才按 provider 顺位落下一档；不配=沿用 ai.fallback（行为不变）。
    #   timeout_sec: 6.0                 # 单端点超时；Ollama 端点自动走原生 /api/chat（think:false）
    # 成功改写会落盘缓存（<数据根>/config/voice_colloquial_cache.db，键含提示词版本）——
    # 重启不清缓存；失败/被拒**不**落盘（临时故障不固化）。观测：/api/voice/avatar-status .colloquial
    generated: false                     # Phase G 生成层口语分叉：会发语音的中文会话让主 LLM 同次调用多产 [口语版]
    #                                    # （书面进镜像/记忆，口语直送 TTS，省一次改写往返；文本被守卫改写自动失效回落本链）
    disfluency: false                    # ⑥ 口误自纠：约 1/7 轮次允许口语版带一处「明天…啊不对后天」式轻自纠
    #                                    # （确定性 crc 低频，LLM/生成层两档都吃；最像真人也最易做作，默认关）
    min_chars: 12                        # 短句 no-op 阈值（≤此长度不改；保预渲染命中 + 短句本就口语）
    max_inserts: 2                       # 「加词」总量上限（句首迟疑 + 句末助词）；词替换不占额度
    opener_dedupe: true                  # P0-2(2026-08-03) 开场词会话级去重：同一会话最近几条语音重复同款
    #                                    # 开场词（嘿/哎呀/哈哈…）→ 剥除（「嘿病」修复；剥的是话语标记零语义损失）。
    #                                    # 与 polish_hub_speak_text 剥连环假笑同性质的缺陷守卫，默认开；false 关。
    lexical: true                        # 书面词→口语词等义替换（因此→所以 / 但是→不过 / 目前→现在）
    fillers: true                        # 句首迟疑/软化词（其实，/ 话说，）——情绪门控 + 低频
    lead_prob: 0.5                       # 句首迟疑词命中概率（0~1；真机盲听校准，过高会做作）
    sentence_final: false                # 句末语气助词（呀/啦，最易做作，默认关）
    # 情绪门控：serious/apologetic 只做中性词替换（保书面）；sad/empathetic 句首让位副语言 [sigh]；
    # 非中文文本自动跳过（中文口语词会 garble 外语）。**只作用于送引擎的合成文本**，镜像/记忆
    # 用原文（分「眼睛看的字」与「耳朵听的口语」两版）。人设级可关：voice_profile.colloquial: false
    # voice_profile.catchphrase：逗号分隔的显式句首口头禅（优先于 quirks 引号解析）
  prosody:                               # Phase C：7852 韵律方差（减播音腔/模板化）
    enabled: true                          # 服务端 fresh CFM noise（EMOTION_TTS_PROSODY 对齐）
    flow_temperature: 1.08               # 0=仅服务端 env 默认；1.0–1.18，过高会飘
    llm_top_k: 32                          # speech-token top_k；0=服务端默认
  ambience:                              # ⑤ 环境底噪（活人感）：克隆 WAV 混极低增益环境声
    enabled: false                       # ffmpeg anoisesrc 生成式（无需素材），去「录音棚干净感」=AI 味
    amplitude: 0.03                      # 底噪振幅（0.001~0.12；建议 ≤0.04，盲听校准）
    # outdoor_amplitude: 0.045           # 可选：户外档独立振幅（户外环境本就更响；缺省=amplitude）
    profile: room                        # room=室内闷响 | outdoor=户外风声起伏 | auto=按人设「此刻场景」
    #                                    # （Phase18 resolve_current_scene 同源——文本/照片/语音背景三通道一致；深夜恒 room）
    night_factor: 0.6                    # 深夜(23–6)增益系数（夜里更静）
    # lowpass_hz: 400                    # 可选：低通截止覆盖（缺省按 profile：room 400 / outdoor 1100）
  # ── 情绪分库参考音（①）：人设 voice_profile.reference_audio_by_emotion ──
  # zero_shot 复刻参考音的「说话状态」——开心的参考音每句自带笑意，比 emotion
  # 标签自然且零音色代价。强情绪(≥emotion_channel_threshold)轮次自动换用：
  #   voice_profile:
  #     reference_audio_path: config/voice_refs/x.wav        # 默认（neutral 主路）
  #     reference_audio_by_emotion:
  #       happy: config/voice_refs/x_happy.wav               # happy/excited/playful 吸附
  #       sad:   config/voice_refs/x_sad.wav                 # sad/empathetic 吸附
  #       calm:  config/voice_refs/x_calm.wav                # calm/serious/apologetic 吸附
  # 每段 5~8s + 同名 .txt 逐字稿（scripts/trim_reference_audio --out 一键切段+STT 产稿）；
  # 命中后 emotion 标签归 neutral（纯保真路径，韵律情绪由参考音承担）。
  prerender:                             # Phase2：固定台词预渲染命中（零 GPU 零延迟）
    enabled: true
    base_dir: assets/voices
    miss_track_max_chars: 16             # ≤该字数的短句未命中记「备货缺口」Top-N
    auto_stock:                          # Phase5：高频缺口自动入台词库（守卫+每日预算）
      enabled: false
      min_count: 5                       # 缺口次数达标才入库（一次性措辞不进）
      max_per_day: 10                    # 每日自动入库上限
  chunk_max_chars: 80                    # 长回复按句切块（单次合成 ≤80 字）
  chunk_gap_ms: 120
  cloud_fallback: true                   # 失败回落 edge_tts（绝不阻塞聊天）
  boot_tasks:                            # health 不通时的计划任务自愈（仅预热/预渲染场景）
    emotion_tts: EmotionTTS_Boot
    qwen3_tts: Qwen3TTS_Boot
  boot_cooldown_sec: 120
  stt:                                   # C：远端 Whisper STT（跨机需 X-AH-Svc 令牌）
    base_url: http://192.168.0.140:7854
    # 令牌运行时读取、勿入库。留空＝按 avatar_voice.resolve_service_token 三级解析：
    # 本键 → 网关设备令牌（AITR_HOSTED_AI_KEY，托管部署由官网下发）→ 开发机路径。
    # #161（2026-09-03）：此前本键的内置默认是开发机私有路径，客户机上恒不存在却
    # 让解析看起来「配过了」，STT 二级回落遂静默失败（22:54 实录）。自建 LAN 部署
    # 照常在此写自己的令牌文件路径；托管部署留空即可。
    token_file: D:/faceX/mfys/secrets/service_token.txt
    timeout_sec: 30
    language: zh
    max_no_speech_prob: 0.85             # 静音概率超此值判无人声（防幻觉转写）

# ── 实时共情语音通话（P-RT，新产品面）：浏览器麦克风 ⇄ 网关 ⇄ MiniCPM-o 4.5 全双工 ──
# 「最佳声音感情」+ 新产品面：MiniCPM-o 4.5 自托管 speech-language 模型——中英母语、
# 全双工实时（边听边说/可打断/主动开口）、情感表达 SOTA、短参考音即克隆，亲密内容不出本地。
# 主力中文走它；英/日等高级语种可另接 Hume EVI4-mini（不支持中文，故非主力）。
# 部署参考服务端：tools/minicpm_o_server.py（实现 /health + /v1/realtime + /v1/tts/clone）。
# 默认 **关**；开了才挂 /api/voice/live(WS) 与 /ops/voice-call(试拨页)。
realtime_voice:
  enabled: false                         # 总开关（新子系统默认关）
  base_url: http://192.168.1.49:7860     # MiniCPM-o 语音主机（实测 RTX 5090 32GB / WLAN）
  ws_path: /v1/realtime                  # 全双工实时 WebSocket
  health_path: /health                   # 健康探测（含 model_loaded）
  oneshot_path: /v1/tts/clone            # 一次性克隆合成（消息渠道情感语音条复用）
  load_path: /v1/model/load              # 显存按需：看板「启动引擎」→ 主机载入模型
  unload_path: /v1/model/unload          # 显存按需：看板「释放显存」→ 主机卸载、还回 ~21GB
  model: minicpm-o-4_5
  default_voice: ""                      # 无参考音时用的主机内置音色名
  default_language: zh                    # zh | en
  sample_rate: 16000                      # 上行 PCM16 采样率
  health_timeout_sec: 1.5
  health_cache_sec: 30
  session_idle_timeout_sec: 90            # 静默多久判定挂断
  max_session_sec: 1800                   # 单次通话上限（仿 EVI 30 分钟）
  api_key: ""                            # 主机需鉴权时填（Bearer）
  access_token: ""                       # 浏览器握手口令（公网暴露务必设；空=开发放行）
  guidance: ""                           # 覆盖默认「实时语音共情守则」（留空用内置）
  # B 线：实时语音退化告警（health_watchdog → ops_incidents + webhook，默认关）
  alert:
    enabled: false                       # true = 周期巡检并落 kind=realtime_voice 事件
    min_attempts: 3                      # 接通率判定最少通话尝试；不足静默
    min_health_probes: 2                 # 主机健康判定最少探测；不足静默
    health_ok_rate_warn: 0.80            # 健康率 < 此 → warn(yellow)
    health_ok_rate_fail: 0.50            # 健康率 < 此 → fail(red)
    connect_rate_warn: 0.50              # 接通率 < 此 → warn(yellow)
    connect_rate_fail: 0.30              # 接通率 < 此 → fail(red)
  # E 线：按日落库 → ops 看板 sparkline + 告警校准历史回放（默认关；开后 stats 旁路 upsert）
  trend_log: false
  trend_retention_days: 90

# ── Telegram 原生语音通话（native calls，实验线 2026-07）──────────────────────
# 目标：AI 全自动接听 Telegram 原生电话，极致真人感情感陪护（非 Mini App，非卖产品）。
# 架构：传输层(pytgcalls WebRTC / tg2sip 网关) ⇄ 通话桥(src/voicecall) ⇄ 实时语音大脑。
#   - brain=cascade（推荐/默认）：流式 ASR + 既有 generate_reply 全链（人设/记忆/情绪/
#     危机安全网/persona_guard 一行不改全量生效）+ CosyVoice3 流式（与消息语音条**同一个
#     克隆声**）——音色主权 + 内容连续性 + 全安全栈，情感陪护真人感的护城河都在这条链。
#   - brain=s2s（备选/AB）：MiniCPM-o 4.5 全双工端到端（原生打断/backchannel，但克隆保真
#     需过声纹探针、安全栈无法「出口前拦截」）。仅作对照与灰度实验。
# 纯函数核心（接听护栏/状态机/10ms 帧数学/拟人调度）在 src/voicecall/core.py，门禁
# tests/test_voicecall_core.py。默认**全关**（遵新子系统约定 + 高账号风险，须测试号先行）。
telegram_calls:
  enabled: false
  transport: ntgcalls              # ntgcalls（进程内直连，py-tgcalls 3.0）| tg2sip（SIP 网关，call layer 全覆盖）
  # 传输层已验证闸：ntgcalls #44 进向音频/tg2sip 网关是运行时无法自证的最大未知。跑过
  # `python -m tools.tg_call_poc` 三闸门（接听/出向/进向音频都通）后，运营手动置 true。
  # 就绪度体检据此判定——未验证=blocker（哪怕主机在线也不算就绪，防误判绿灯后真机收不到来电）。
  transport_verified: false
  # 2026-07-14 实测修正：本机 3060 上 CosyVoice 克隆流式 TTFB 48-63s→cascade 的「嘴」当前
  # 硬件达不到实时；5090 上 MiniCPM-o S2S 本就流式 ~1.3s。故 **P1 现实默认 s2s**（复用
  # realtime_voice 大脑，零新增显存、延迟达标；安全栈走转写并行监测）。cascade=未来态，
  # 需专职流式克隆嘴 GPU 才落地（音色主权+全安全栈的理想架构）。详见 docs/TG_NATIVE_CALL_POC.md。
  brain: s2s                       # s2s（MiniCPM-o 全双工，P1 现实默认）| cascade（音色主权，需专用 GPU）
  # 接听决策护栏（decide_incoming_call）：安全/反风控优先→反打扰→容量；
  # 「够格熟人但此刻不便」一律拒接+补偿消息，绝不无声空响（ring-out 是陪护大忌）。
  answer:
    min_intimacy: 30               # 亲密度阈值（生人阶段不接，接了像营销电话）
    languages: [zh, en]            # 通话支持语种（克隆声念不了的外语→礼貌拒接+语音条兜底）
    require_auto_ai: true          # 仅 auto_ai 会话自动接（review/off 会话不接）
    max_concurrent: 1              # 并发通话数（单卡单 MiniCPM-o worker=1；起 INT4 双实例可调 2）
    ring_delay_min_sec: 2.0        # 接听前先响几声（秒接=机器人）
    ring_delay_max_sec: 4.0
  # 帧参数：ntgcalls AudioSink 实测 10ms/帧（发 20ms 会 jitter underrun）→ 默认 10 勿改。
  frame:
    sample_rate: 48000
    frame_ms: 10
    channels: 1
  # 拟人编排（真人感的差异化来源，全部复用现有预渲染克隆声资产）：
  humanize:
    filler_after_ms: 700           # LLM 思考超此毫秒未出话→插「嗯…」填充音（掩蔽半级联首音延迟）
    filler_min_gap_ms: 2500        # 两次填充最小间隔（防连珠炮）
    backchannel: true              # 对方长段倾诉时插「嗯嗯/然后呢」（cascade 需要；s2s 原生自带）
    backchannel_after_sec: 3.5     # 对方持续说够此秒数才首插
    backchannel_gap_sec: 4.0       # 两声倾听反馈最小间隔
    backchannel_max_per_turn: 3    # 每轮封顶（插太频=敷衍/打断）
  # 账号级通话预算/健康（与文本 send_gate 正交、更保守——一通 AI 语音通话是极强 userbot
  # 特征，比发条消息风险高一档）。超额/风控红灯 → 拒接+补偿（熟人只是今天聊太多/号要歇歇），
  # 绝不空响。ctx 的 calls_today/minutes_today/account_light 由 wiring 从 call_stats +
  # account_health 组装。
  budget:
    daily_calls_cap: 20            # 单号日自动接听上限（0=不限该维度）
    daily_minutes_cap: 60          # 单号日通话分钟上限（0=不限该维度）
    block_on_red: true             # 账号风控红灯（account_health light=red）时停自动接，防催封号
  session:
    max_sec: 1800                  # 单次通话上限（仿 EVI 30min）
    idle_timeout_sec: 45           # 静默多久自动收尾
  quiet_hours:
    enabled: true
    start_hour: 23                 # 安静时段（跨午夜）：23→8 不主动、来电走拒接+补偿
    end_hour: 8

# ── ElevenLabs v3 付费情感旗舰档（P2-Cloud）────────────────────────────────────
# 「真人感情」语音：v3 通过内联音频标签 + voice_settings（stability 调低更听情绪、
# style 放大个性）做高表现力合成；非实时，适合聊天语音条。需先在 ElevenLabs 控制台
# 用参考音频做「克隆音色」，把得到的 voice_id 填到人设 voice_profile.voice。
# 用法：把人设 voice_profile.backend 设为 elevenlabs（或 telegram.voice_reply.backend）。
# 失败时：缺 key/voice_id（本地 misconfig）→ 硬失败暴露；API 401/配额 → 回落 edge 出声。
# 成本：贵（按字符计）；TTS 输出缓存（见 voice_reply.tts_cache）对问候/FAQ 命中率高，显著降本。
elevenlabs:
  api_key: ""                            # ElevenLabs xi-api-key
  model_id: eleven_v3                     # eleven_v3（最具表现力）| eleven_flash_v2_5（低延迟）
  base_url: https://api.elevenlabs.io
  similarity_boost: 0.75                  # 与克隆音源相似度（越高越像，但放大原录音底噪）
  timeout_sec: 120

# ── 语音引擎分层路由（P3）：按端用户会员档位选 TTS 后端 ────────────────────────
# 把「真人感情语音」做成付费溢价点 + 天然控成本：免费/普通走便宜/自建后端，
# VIP/SVIP 走 ElevenLabs 旗舰。降级到非克隆后端时会自动关克隆门（含 LAN 优先），
# 确保免费档拿通用音色而非偷偷克隆 → 真正省钱。
# 接入：调用方拿到端用户 tier（get_entitlement(contact_key)["tier"]）后，
#       resolve_voice_cfg(persona_id, config, tier=tier)。tier=None 或 enabled=false → 不路由。
# enabled=false 时完全保持现状。
voice_routing:
  enabled: false
  default_backend: edge_tts               # 未在 tiers 列出的档（含 free）用此后端；空=不改
  tiers:
    vip: elevenlabs
    svip: elevenlabs
  # TTS 成本费率（USD / 1000 字符），仅对按字符计费的 provider 有意义；供成本看板记账。
  # 按你与 provider 的实际合同覆盖（ElevenLabs 价随档位浮动）。
  cost_per_1k_chars:
    elevenlabs: 0.30
  # P4-B：成本按日落库（供 ops 看板 /admin/ops 画近 N 天花费/缓存命中曲线）。
  # 默认关 → record_tts_cost 恒 no-op（无 voice 用量部署零 IO）；开后落 config/tts_cost.db。
  cost_log:
    enabled: false
    retention_days: 90                    # 超过此天数的日聚合自动清理（读端点顺手 prune）

# WhatsApp RPA（ADB + uiautomator；与 Telegram/LINE/Messenger 共用 Skill/AI）
# 与 messenger_rpa 结构类似，accounts[] 下为每台手机一条
whatsapp_rpa:
  enabled: false
  accounts:
    - account_id: wa_q4n
      adb_serial: Q4N7AM7HMZGU4LZD
      use_business_app: false   # true → com.whatsapp.w4b
      reply_mode: auto          # auto | approve | off
      default_reply_lang: zh
      daily_cap: 200
      dedup_window_sec: 10
      catchup_limit: 3          # 发完后最多追补几轮漏消息
      # 语音识别（STT）— 直接从 WhatsApp 文件系统读取 .opus 文件
      voice_input:
        enabled: false
        max_age_sec: 600        # 语音文件最大年龄（秒）
        batch_max: 5            # 连续多条语音最多批量转写几条
      # 语音回复（TTS）— 通过 share intent 发送
      voice_output:
        enabled: false
        mode: approval_only     # approval_only | auto_voice
        trigger: when_peer_voice  # when_peer_voice | always | random
        voice_probability: 0.3  # trigger=random 时的概率
        max_text_chars: 220     # TTS 最大文本长度
        max_seconds: 20         # 音频最长秒数
        timeout_sec: 30         # TTS 合成超时
      # 多条消息引用回复（Quote Reply）
      # 当用户连续发送多条消息时，AI 先判断意图关系，再逐条引用回复
      multi_msg_reply_enabled: false  # 默认关闭，稳定后可开启
      multi_msg_max_count: 5          # 最多处理几条新消息（超出取最新 N 条）
      auto_quote_reply: false         # 单条主流程也用引用回复（long-press→回复），combined 模式始终生效
      # 多模态媒体理解 — 图片/视频/贴纸/GIF/文件
      media_input:
        enabled: false
        use_vision: true        # true=截图裁剪+VLM描述; false=仅 placeholder
        crop_padding: 24        # 裁剪媒体气泡时的边距 (px)
        max_image_dim: 960      # 送 VLM 前缩放最长边上限
        timeout_sec: 30         # VisionClient 超时
        # vision_cfg:           # 可覆盖全局 vision 配置（如单独超时/模型）
        #   timeout: 25
      human_pacing:
        enabled: true
        typing_cpm_lo: 240
        typing_cpm_hi: 480
      service:
        interval_sec: 30
        autostart: false

# ── 顶层人设池（跨平台复用：TG / Messenger / LINE）───────────────────────
# messenger_rpa.reply_profiles 继续有效（向后兼容 alias，读取时优先级最低）
# Telegram 通过 telegram.voice_reply 和本节 voice_profile 选择音色
personas:
  default: warm_companion
  profiles:
    - id: warm_companion
      name: 小灵
      enabled: true
      style_hint: |
        你是自然的私聊对象，不是客服机器人。优先短句、口语、像真人聊天。
      # voice_profile 留空则继承 telegram.voice_reply 全局设置
      voice_profile:
        enabled: false
        backend: edge_tts
        voice: zh-CN-XiaoxiaoNeural
        owner_consent: true
        speaker_id: warm_companion_voice
        reference_audio_path: ""
        command_args: []
        command_timeout_sec: 120
    - id: professional_support
      name: 小灵
      enabled: true
      style_hint: |
        面向明确咨询、订单、付款、商务问题时使用。先给结论，再给下一步动作。
      voice_profile:
        enabled: false
        backend: edge_tts
        voice: zh-CN-XiaoxiaoNeural

# 人工客服转接：同问多次追加 @ 人工；值班状态存 SQLite human_escalation.db
human_escalation:
  enabled: false
  repeat_threshold: 3
  repeat_window_sec: 600
  min_message_len: 6
  # 成功 @ 人工后，对「同一归一化问句」再次 @ 的最短间隔（秒）
  cooldown_sec: 120
  # per_normalized_question（默认）| per_user_chat（旧：同用户全群共享一条冷却）
  escalation_cooldown_scope: per_normalized_question
  duty_mode: always
  timezone: Asia/Shanghai
  mention_joiner: " "
  mention_mode: all
  agents: []
  agent_teams: []
  team_fallback_to_global: true
  team_pick_mode: union
  mention_round_robin_scope: global
  schedule_estimate_step_minutes: 15
  # 近端细扫窗口（小时）：0=关闭细扫，仅用粗步进；默认 24
  schedule_estimate_fine_horizon_hours: 24
  # GET /api/human-escalation/schedule-status 内「排班估计」短时缓存（秒），0=关闭
  schedule_status_cache_ttl_sec: 30
  work_hours: {}
  work_exceptions: {}
  # work_exceptions 示例（本地日历 YYYY-MM-DD；[] 为全天休息）:
  # work_exceptions:
  #   "2026-01-01": []
  #   "2026-03-21": [["10:00", "14:00"]]
  human_username: ""
  human_user_id: 0
  only_when_shift_online: false
  message_off_shift: ""
  escalation_line: "已多次询问同类问题，请人工客服协助："
  # 转接时附带用户问句：可点击跳转到该条消息（公开群 t.me/username/msg，无 username 的超级群 t.me/c/...，私聊 tg://openmessage）
  include_user_question_link: true
  user_question_max_len: 200
  user_question_line_prefix: "原文："
  # 触发 @ 人工且群内 AI 回复发送成功后，把用户该条群消息「转发」到各客服私聊（与 mention 名单一致，便于点转发条回到群内原话）
  forward_user_message_to_agents: true
  # 转发后再发一条私聊：内联按钮 + t.me/tg:// 直达链接（解决部分客户端转发条无法跳回群内指定消息）
  forward_private_jump_hint: true
  # agents 示例（优先于单客服字段）:
  # agents:
  #   - user_id: 123456789
  #     username: ""
  #     display_name: "白班-小王"
  #   - user_id: 0
  #     username: "night_staff"
  #     display_name: "夜班"
  # work_hours 示例（键 mon…sun，值为 [["HH:MM","HH:MM"], ...]）:
  # work_hours:
  #   mon: [["09:00","12:00"], ["13:00","18:00"]]
  #   tue: [["09:00","18:00"]]
  #   sat: []

# 收窄回复：仅处理客服在线 / 通道状态·限额·成功率 等（详见各子项）；enabled: false 恢复全量应答
narrow_reply:
  enabled: false
  allowed_intents:
    - greeting
    - channel_info
    - status_check
  cs_online_substrings: ["在吗", "在不", "有人吗", "客服", "人工", "在线吗", "上班吗", "有没有客服", "真人", "在不在"]
  greeting_substrings: ["你好", "您好", "hello", "hi", "嗨", "hey", "早上好", "下午好", "晚上好", "早", "在么"]
  channel_topic_substrings:
    - "通道"
    - "额度"
    - "限额"
    - "成功率"
    - "代收"
    - "代付"
    - "维护"
    - "波动"
    - "稳定"
    - "交易"
    - "跑单"
    - "正常"
    - "单笔"
    - "限制"
    - "状态"
    - "ep"
    - "jc"
    - "费率"
    - "手续费"
  deny_substrings:
    - "订单号"
    - "单号"
    - "查单"
    - "查订单"
    - "投诉"
    - "退款"
    - "凭证"
    - "截图"
    - "没到账"
    - "未到账"
    - "钱没到"
  inherit_followup_seconds: 120

# Web 保存的默认人设落盘（与 config.yaml 同目录；重启后覆盖域包 persona.yaml）
persona_persistence:
  enabled: true
  path: ""   # 空则使用 persona_runtime.yaml；可填相对 config 目录的路径

# AI 提供商配置
# ⚠️ 重要：ai_client.py 只实现两条分支——gemini（默认，native google-genai）
#   与 openai_compatible（OpenAI SDK + base_url，用于 DeepSeek/Ollama/vLLM）。
#   provider 写 "deepseek" 不是独立分支，会 fall-through 到 gemini！
#   要真正用 DeepSeek，必须 provider: openai_compatible + 下方 base_url/model。
ai:
  provider: "openai_compatible"   # gemini | openai_compatible（DeepSeek/Ollama/vLLM 走这条）
  # ── 主对话链走云还是走本地（P1，自托管 / 隐私敏感客户）────────────────────
  # cloud（默认）：云主链 → 备用 Key 池 → 本地兜底 → canned（完全维持既有行为）。
  # local        ：**本地模型即主链**（用下方 fallback 段的端点）；本地失败仍可回落云端。
  # local_only   ：本地模型即主链，且**绝不把用户内容发往云端**（严格隐私）；本地失败
  #                → canned 占位（宁可不出话，也不泄数据）。云端 key 可以完全不配。
  # ⚠ 覆盖面如实说明：本键只管**主对话链**（数据量最大的那条）。嵌入 / 视觉 / 翻译
  #   各有自己的端点配置（推荐一并指向 LAN GPU），不由本键代管。
  # ⚠ 前置：local/local_only 必须配好下方 `fallback`（enabled+base_url+model），
  #   否则启动时记 ERROR 并自动退回 cloud（不把聊天变砖）。
  primary: "cloud"                # cloud | local | local_only
  # 老板锁（2026-08-22 事故沉淀，见 src/ai/ai_primary_audit.py 模块头）：非空＝主链
  # 档位锁死为该值。任何途径（接口/手改文件/外部自动化）把 primary 改成别的值，
  # 装载时都会被强制回锁值 + 回写 + 告警；治理接口直接拒绝不符的切换请求。
  # 所有切换/强制动作落审计台账 logs/ai_primary_audit.jsonl。空串＝不锁（默认）。
  primary_lock: ""                # "" | cloud | local | local_only
  api_key: "YOUR_API_KEY"         # 对应 provider 的 API 密钥
  # 无 Key 免费试用（厂商侧）：实例/桌面进程注入环境变量，永不写进本文件或 overlay——
  #   AITR_HOSTED_AI_KEY / AITR_HOSTED_AI_BASE_URL / AITR_HOSTED_AI_MODEL
  # 仅当 api_key 为空/占位时生效；用户保存自有 Key 后永远优先自有。
  base_url: "https://api.deepseek.com"  # openai_compatible 时必填（如 DeepSeek）
  model: "deepseek-v4-flash"      # 使用的模型（DeepSeek 已废弃 deepseek-chat 旧名）
  temperature: 0.7                # 温度参数 (0.0-1.0)
  max_tokens: 1024                # 最大回复token数
  timeout: 30                     # API调用超时(秒)
  # 启动连接探针的独立上限(秒)：冷启动时若云端限流/抖动，这一次探针会占满 timeout(30s)，
  # 把「进程起来→/login 可服务」窗口拖到分钟级(seat 撞加载超时)。探针结果启动流程并不消费
  # (仅日志+坏key告警)，故给它更短上限；超时=按未验证放行(首个真实请求确认健康)，坏 key 走
  # 401 快败仍即时告警。默认 6；设 0/负=关闭上限(回退旧行为)。
  boot_probe_timeout_sec: 6
  # P1-3：会话历史轮数。10 偏短，话题切换时模型容易忘记上下文导致跳话题；
  # 16 是质量/成本平衡点（多 60% token 但显著改善连贯性）。配合 _build_contents
  # 的字符上限 12000 双重截断，不会超长。
  max_conversation_history: 16
  # ── 内容与风格全局默认（P0-style，2026-08-02；「自动回复设置」页可视化编辑）──
  # 表达层兜底：length/max_sentences/emoji_level 只对**没有自己设置**的人设生效
  # （人设工作室 speaking.reply_length / max_reply_sentences / emoji_level 永远优先，
  #  人设只填句数上限时全局 length 也整体退出，绝不反转覆盖）；tone_hint 语义不同——
  # 对**全部人设**追加一条统一说话要求。全部留空 = 完全不干预（旧行为）。
  # 消费点 persona_manager 活读 config，保存即生效无需重启。
  reply_defaults:
    length: ""              # "" | concise(1-2句) | moderate(2-4句) | detailed(4-6句)
    max_sentences: 0        # 0=不限制；1-10；选了 length 档时此项不生效（长度档优先）
    emoji_level: ""         # "" | none | minimal | moderate | rich
    tone_hint: ""           # 一句话全局风格（≤120 字），如「多用短句和口语语气词」
  # 出站口头禅账本（2026-08-02，「哈哈」14 天 327 次复读治理）：统计最近 window 条
  # 出站回复的超限口头禅（笑词/句尾语气/重复开头/人设场景词/高频 bigram），超限则在
  # prompt 末端注入「本轮多样性硬约束」。A 线取会话历史、B 线取 inbox 权威历史，
  # 纯字符串统计零额外 DB 读。核心纯函数 src/ai/reply_variety.py。默认关。
  reply_variety:
    enabled: false
    window: 12              # 统计最近多少条出站
    max_items: 4            # 提示里最多点名几项
    # laugh_limit: 2 / tail_limit: 3 / head_limit: 2 / scene_limit: 2 / keyword_limit: 3
    # （各类超限阈值，条数 ≥ limit 记超限；置 0 关闭该类检测）
  # 是否在实时通道数据里向模型注入「费率=」行（默认 false；对客不宣读具体费率数值）
  channel_status_include_fee: false
  # 后台人设注入：full 完整 | compact 精简（减与域 system_prompt 重复）| none 不注入（仅用域提示）
  persona_block_detail: full

  # ── 真人感文本层（platform/spoken_style 交付包桥接，见 src/ai/spoken_style_bridge.py）──
  # avatarhub 线交付的「像真人说话」提示词层：说话稿自然度档位 + 意图感知篇幅 + 出口清洁。
  # 与自有的 spoken_variant / voice_colloquial* 语义相近但作用位置不同（这层让书面主回复
  # 本身口语化），试点期建议二选一。挂包前后效果对照见 platform/spoken_style/docs/AB_SAMPLES.md。
  spoken_style:
    enabled: false        # 总开关（默认关）
    level: 2              # 自然度 0=播音 1=口语流畅 2=日常唠嗑 3=故事陪伴（故事意图自动升 3）
    zh_only: true         # 仅当用户消息以中文为主体时注入尾注（模板是中文口语指令，勿污染外语对话）
    role: ""              # 可选静态兜底：说话指纹角色名。留空即可——桥接会自动用本会话人设的
                          # 口称名（resolve_spoken_name 输出）当指纹键去 platform/spoken_style/
                          # data/speech_prints.json 分流；给常驻人设配指纹时，键必须写人设口称名
                          # （样例见包内 speech_prints.json 的美月/秦震条目）。无指纹=通用口语层照常
    paraling: false       # 副语言标记提示（[呼吸]→句尾停顿；语音部署才有意义）
    emotion_tags: false   # 情绪标记协议（LLM 自报情绪 → TTS 情绪键；文字聊天保持关）
    rewrite: false        # L4 口语化改写：本地小模型整段重写+事实锁把关，失败原句直通。
                          # 需 role 在包内 speech_prints.json 有说话指纹；会增加约 1~5s 出口延迟
                          # （文字聊天可接受再开；与 voice_colloquial_llm 只开一个）
    rewrite_llm: ""       # 改写后端（OpenAI 兼容 chat/completions；空=包缺省 .173 qwen14b）
    rewrite_model: ""     # 改写模型名（空=包缺省）
    # #40 地区语气档（2026-09-04，随 enabled 总闸）：让中文回复「像本地人说话」
    # ——zh-TW 台灣口語（啦/耶/喔/欸 + 禁大陸/北方口語與網路詞）、zh-HK 港式粵文
    # （繁體 + 係/唔/嘅/咩）。zh-CN 档恒不追加任何指令（存量 prompt 逐字不变）。
    # 档位解析优先级（SSOT=src/ai/persona_region.py）：人设 speaking.region 显式字段
    # → 人设 voice_profile.dialect_flavor=cantonese（→zh-HK）→ 人设居住地 location
    # 的国家码 TW/HK（region_from_location 开时）→ 会话「发→zh-tw / yue」铆定
    # → 下面的全局默认 region → zh-CN。禁用词只**观测**（命中计数+INFO，不改文本）。
    region_enabled: true        # false=全部按 zh-CN（一键回旧行为）
    region: ""                  # 全局默认档位：zh-CN / zh-TW / zh-HK（空=zh-CN）
    region_from_location: true  # 人设居住地在台北/香港 → 视为该档（false=只认显式字段与会话铆定）
    # 灰度观测：spoken_style_bridge.stats() 有进程内计数（L1/L2 注入、zh_only 拦截、
    # L4 尝试/生效/直通），L4 每 20 次尝试自动打一行 INFO 汇总——直通率>30% 说明
    # 事实锁在大量拒绝或改写后端超时，该调模型/提示词/超时了。

  # ── 文本嵌入（embedding）provider —— 记忆向量召回 + 语义去重的真实向量源 ──
  # 主对话 LLM（DeepSeek 等）多无 embedding 端点 → 需单独配嵌入源，否则 memory.vector /
  # consolidation.semantic_dedup 无向量可用（降级为纯关键词 / 仅 hash 去重）。
  # 任选其一（OpenAI 兼容端点，本地/云均可）：
  #   - Ollama 本地：  embedding_base_url: http://127.0.0.1:11434  embedding_model: nomic-embed-text
  #   - LM Studio：    embedding_base_url: http://127.0.0.1:1234   embedding_model: text-embedding-nomic-embed-text-v1.5
  #   - OpenAI 云：    embedding_base_url: https://api.openai.com  embedding_model: text-embedding-3-small  embedding_api_key: sk-...
  # 留空=不启用嵌入（召回退关键词、去重退 hash）。embedding_api_key 留空时复用上面的 api_key。
  embedding_base_url: ""
  # 多端点双活（可选，优先于 embedding_base_url）：两台机各跑同名嵌入模型，
  # ai_client.embed() 按序尝试、异常端点 60s 冷却降权（不剔除）、全端点失败才全局熔断。
  # 仅覆盖 embed() 热路（记忆召回/翻译语义闸门）；KB embed-all 等批量口仍读单数键。
  # embedding_base_urls:
  #   - http://192.168.0.140:11434
  #   - http://192.168.0.176:11434
  embedding_model: ""
  embedding_api_key: ""

  # 主对话 LLM 容灾（可选，默认关）：云主模型（如 DeepSeek）不可达或熔断开路时，
  # 回落到本地 OpenAI 兼容端点（如 LAN Ollama）继续出真话，替代 canned 占位句。
  # 人设/记忆/上下文照常（复用主链已构建的 messages），语言守卫照常；
  # 兜底自身失败仍回 canned 占位——行为最差不劣于无兜底。仅 provider=openai_compatible 生效。
  # fallback:
  #   enabled: true
  #   base_url: http://192.168.0.176:11434   # 本地 Ollama
  #   model: qwen3:30b-a3b-instruct-2507-q4_K_M
  #   api_key: ollama
  #   timeout: 120        # 首次载入大模型可到 ~60s，留足；连接失败 5s 快败
  #   think: false        # qwen3 思考系防慢答；instruct 系无感
  #   # 无兜底纪律（2026-08-17）：chat_fallback=false → 云主链失败不本地顶班出话
  #   # （不回消息 + 主机弹窗「AI 不可用」+ ERROR 日志），端点仍服务口语化/工具
  #   # 改写与 ai.primary=local* 主链身份（那些是指定链路非兜底）。默认 true=旧行为。
  #   chat_fallback: true

  # ── 分级路由（可选，默认关）：按会话分级差异化调用参数（P5-4）────────────
  # 选档顺序（P4）：context.ai_tier（调用方显式注入，永远优先）→ 会员权益自动进档
  # （entitlement.tier 与下方档名对齐即用，如 monetization.catalog.tiers 的 vip/svip；
  #   需 monetization 就绪注册 resolver；story 或本节 enabled 时 A 线消息链与 B 线
  #   收件箱草稿链都会自动懒解析权益，5min TTL）
  # → default 档。tier 内键以 setdefault 合并进 strategy_overrides。
  # 支持 model / temperature / max_tokens / context_rounds，
  # 以及 **local_model**（P3 本地档分层）：ai.primary=local* 或本地兜底顶班时，本地链
  # 按档换模型——同一 Ollama 端点上 14B 常暖接长尾、30B 按需接高价值会话（14B 全人设
  # prompt 实测 ~56s，是否值得上 30B 看 cloud-credentials 出话分布里的分档延迟读数）。
  # tiers:
  #   enabled: true
  #   default: normal
  #   normal: { }                              # 空档=全用实例默认
  #   vip:                                     # 档名=会员档名 → VIP 自动进档
  #     local_model: qwen3:30b-a3b-instruct-2507-q4_K_M   # 仅本地链生效
  #     max_tokens: 1536

  # 云端 Key 备用池（可选，默认 keys 空=不启用）：主 Key 失效/云端主链双失败时，
  # 先按序切池内备用云 Key（质量与主链同级），全池失败才落上面的本地 fallback。
  # 条目缺省继承主链 base_url/model → 同厂商备用号只填 api_key 即可；也可跨厂商
  # （任意 OpenAI 兼容端点，如智谱/moonshot，需带 base_url+model）。
  # 失败的 key 进 120s 冷却；池 key 自身 401/欠费也会触发主机告警（防备用键悄悄过期）；
  # DeepSeek 系备用 key 的余额同样被 ops.cloud_credentials 周期巡检。仅 openai_compatible 生效。
  # key_pool:
  #   enabled: true
  #   keys:
  #     - name: ds-backup          # 可读名（告警/看板用）
  #       api_key: sk-xxxx         # 备用 DeepSeek 号
  #     - name: zhipu-glm
  #       api_key: xxxx.yyyy
  #       base_url: https://open.bigmodel.cn/api/paas/v4
  #       model: glm-4-flash

  # ── 多模型路由（像 Cursor 按任务挑模型；可选，默认空=不启用，行为不变）──────────
  # 与 key_pool（主 key 失效才顶班）正交：这里**主动按任务/调用方挑模型或端点**。
  #   models：命名模型档，每档 = 一个独立 OpenAI 兼容端点（本地 vLLM/Ollama 或任意云）。
  #           base_url/model 必填；api_key 空则复用上面的 ai.api_key（本地端点可不填）。
  #   task_routes：任务名 → 档名。命中即用该档跑「主尝试」；该档不在线/失败仍回落
  #           备用池 → 本地兜底 → canned（与主链同一条降级链，绝不因路由丢话）。
  #   已认任务名：assistant_planner（小智「替我做」规划）/ assistant_qa（小智问答）/
  #           computer_use（电脑操控 VLM）/ chat（默认对话；不配=用 ai.model）。
  # models:
  #   planner_local: { base_url: http://192.168.0.173:8001, model: chatx }
  #   qa_cheap:      { base_url: https://api.deepseek.com,   model: deepseek-v4-flash }
  #   cu_vlm:        { base_url: http://192.168.0.176:11434, model: qwen3-vl:8b-instruct }
  # task_routes:
  #   assistant_planner: planner_local
  #   assistant_qa:      qa_cheap
  #   computer_use:      cu_vlm

  # 系统提示词
  system_prompt: |
    你是智能助手小灵，为用户提供友好、专业的客服服务。
    请保持回复简洁、有帮助，并适当使用表情符号增加亲和力。
    回复时考虑对话上下文，保持连贯性。

  # P52：坐席 Copilot LLM 润色（默认关闭；仅预填/显式 polish 时触发）
  copilot_polish:
    enabled: false
    max_suggestions: 2      # 单次最多润色条数
    timeout_sec: 8
    temperature: 0.6
    max_tokens: 320
    model: ""               # 空=沿用 ai.model

# 陪伴关系阶段（conversion 域）；状态存 bot.db user_context JSON
companion:
  enabled: true
  # ── 外机自有号登记表（实施72 P2，2026-08-27；默认空=零行为变更）───────────
  # 登记「**另一台机器**运营的自有账号」（本机注册表里没有/已归档，但对端确实是
  # 自动化自有号）。命中的会话自动封 review（AI 只拟稿人审，防两台机器的 AI 隔着
  # 平台互聊=风控眼里互刷）+ 主动触达跳过。匹配：同平台 chat_key==account_id，或
  # 会话显示名与 name 归一相等（messenger e2ee 线程 chat_key=线程 id，只能靠名字；
  # 同名真客户被误命中的代价=多一次人审，软失败可接受，why_no_reply 可查）。
  # **刻意不对同库自有号对子封顶**：拿自己账号扮客户测试全自动是常态工作流。
  # own_fleet:
  #   extra:
  #   - platform: messenger
  #     account_id: "61584070255403"
  #     name: "Calixa Lopez"
  # 当地天气事实源（Open-Meteo，免 API key）。依赖人设 location.lat/lon
  # （见 persona_location.CITY_PRESETS / profiles_runtime.location / 人设编辑器
  # 「所在地」字段）。热路径只读缓存，绝不在出话链阻塞等 HTTP；缺数据/陈旧
  # >max_stale → 不注入（禁编数值）。
  # #104（实施91 2026-08-31）起**默认开**：默认关的旧态=AI 对人设当地天气零
  # 事实来源，「我这边也在下雨」全靠共情镜像编造（0831 实锤）。软失败零阻断，
  # 无所在地人设零改变；显式 false 可关。
  weather:
    enabled: true
    ttl_sec: 1800            # 新鲜缓存（秒）
    max_stale_sec: 10800     # 陈旧仍可用上限（秒）；再旧丢弃
    inject_chat: true        # 写入聊天 prompt 内部事实块
    proactive_hook: true     # 暴雨/雷暴/极端气温时给主动开场种子
    scene_filter: true       # 生图/场景轮换避开高置信天气冲突（沙滩×暴雨等）
    greeting_inject: true    # 早晚安/温和问候附「人设城市真实天气」素材行（daily_brief；随父开关）
    claim_guard: true        # #104 出站兜底：无天气事实剥「我这边在下雨」类断言/有事实剥冲突断言
  # ── 用户侧时钟（P2，默认关）──────────────────────────────────────────────
  # 主动触达此前全部锚定**服务器**时区（UTC+8），而客户遍布多时区 → 「早安」发到对方
  # 半夜。开启后按会话推断客户时区（src/companion/user_clock.py），择时/安静时段改按
  # 客户本地钟评估。信任三档是**安全设计**（详见该模块 docstring）：
  #   - 显式信号（自述城市 / WhatsApp 号码国码 / 行为+地区互证）→ 取代服务器钟；
  #   - 纯行为统计推断 → 只**收窄**发送窗口（服务器或客户任一为安静时段即不发），
  #     故推断错了最多少发一条，绝不会新开一个凌晨窗口；
  #   - 语种默认国家等弱信号 → 只供节日/展示，不参与调度。
  user_clock:
    enabled: false
    schedule: true           # 主动触达择时 / 安静时段按客户本地钟（需 enabled 同时为真）
    inject_chat: true        # prompt 注入「对方当地时间」内部事实行（只吃显式信号）
    min_samples: 12          # 行为推断最少入站消息数（不足则不猜）；12 由生产库标定——
                             # 8/12 收下的会话数相同，真正把关的是下面的边际门槛
    min_margin: 0.35         # 行为推断胜出边际门槛（0..1，占理论可分辨度的比例）
    ttl_sec: 21600           # 推断结果缓存（秒）；落 conversation_meta.tz_*
  # ── 双侧节日日历（P2，默认关）──────────────────────────────────────────────
  # 规则引擎（config/locale_holidays.yaml）：fixed / lunar / nth_weekday / easter_offset /
  # table / jieqi 六型，**一次写规则永久正确**——不再像 milestone_ritual.holiday_calendar
  # 那样要运营每年手填农历公历日期（必然腐烂）。农历与节气走 lunar_python（已在依赖）。
  # 「用户侧」＝按客户所在国（时区推断的 country → 回落语种默认国家）；
  # 「人设侧」＝按人设居住城市所在国，语义是**生活纹理**（街上气氛）而非群发问候。
  locale_holidays:
    enabled: false
    inject_chat: true            # 双侧节日作 prompt 内部事实块（安全，默认口径）
    greet_user_side: false       # 用户侧节日走主动问候（默认关：群发式节日祝福最像套话）
    persona_side_texture: true   # 人设所在国节日进人设生活纹理
    lookahead_days: 2            # 「快到了」预热窗（天）
  # 人设一致性守卫：回复生成后做确定性后置体检，剥离 LLM 漏出的禁用语
  # （persona.speaking.forbidden_phrases）与 AI 自曝身份（persona.identity.deny_ai）。
  # 默认开；仅当人设声明了上述项才实际生效（对无禁用项的默认人设零影响）。
  persona_guard:
    enabled: true
  # 共情策略选择器（蒸馏版 STRIDE-ED / 主动倾听）：在「情绪理解→回复生成」之间插一层
  # 显式策略提示（确认安抚 / 主动倾听探询 / 低能量陪伴 / 共享放大 / 顺势好奇 / 承接式倾听），
  # 按情绪维度×强度×弧线×关系阶段确定性选出并注入一行行动指令。纯 prompt 提示、零行为风险。
  empathy_strategy:
    enabled: true
  # 安全底线守卫（与 persona_guard 同为安全家族）：在「情绪理解→回复生成」前注入
  #   - 危机识别：自伤/轻生 / 深度绝望信号 → 注入「安全优先」应对指令（共情接住、不说教、
  #     不轻描淡写、温柔引导求助、绝不附和自伤）；保守匹配，"累死了/笑死/想死你了"等惯用语不误伤。
  #   - 反谄媚：仅在负向情绪或危机时附一条护栏（不为讨好而强化自毁/有害念头；开心闲聊不注入）。
  # 纯 prompt 提示、零行为风险（预防优于事后修剪）。默认开（漏接危机是最坏结果）。
  wellbeing:
    enabled: true            # 危机识别 + 安全优先指令 + 回复红线兜底(R6)
    anti_sycophancy: true    # 反谄媚护栏（负向情绪/危机时附加）
    crisis_resources: ""     # 可选求助热线文案；填写后仅在 severe 危机时自然附带
    # R6 事后兜底：回复自身鼓励自伤("那就去死吧") → 整段覆盖为温柔安全兜底（红线，随 enabled 默认开）。
    # 资源保障：severe 危机且回复未提求助时强制补一句热线（默认关，避免每条都附显机械）。
    crisis_resource_assurance: false
    # R8 危机人工接管：severe 连续命中 ≥ escalate_after → 触发 escalation_needed 告警
    # （category=crisis）让真人介入：桌面包点亮工作台「需人工」徽标 + 置顶会话 + 落案例，
    # 配了 webhook_settings.json 的部署再多发一路 webhook。
    # 出厂开（老板决策 D7 #185 2026-09-05 → D-L1 2026-09-06 进基础配置；此前默认关，
    # 只在 cloud_light / 内测种子里开，走 clean 包升级的机器一直没拿到）。
    # 与 feature_registry A 类基线同值：桌面存量安装由 _ensure_baseline 补齐，显式 false 尊重。
    crisis_escalation: true
    escalate_after: 1        # severe 连击达到此值即告警（1=首次 severe 即告警）
    # R9 审计落库：severe/elevated 危机事件落 bot.db 的 crisis_event 表（时间/等级/连击/
    # 是否升级/是否触发兜底/短摘要 ≤120 字），供复盘/合规/人工处置追踪。
    # 出厂开（同上 D7）：只存 ≤120 字短摘要不存全文，隐私靠页面角色门（主管/合规）而非关闭。
    crisis_audit: true
  # Phase O 主动关怀引擎：从入站消息抽取「时间约定/未来事件」（你说周五面试…），到点由 AI
  # 主动发一条引用具体事的关心消息。复用 reactivation 的 deferred 发送队列（享 gate/pacing/
  # quiet_hours/kill-switch）。把「沉默才捞」升级为「记得你说的事、到点主动关心」。默认全关。
  proactive_care:
    enabled: false           # 总开关：开启后才捕获入站约定 + 启动到期派发循环
    capture: true            # 是否捕获入站消息中的约定（enabled 时生效）
    min_confidence: 0.6      # 入库置信度阈值（挡无主题低质项）
    dedup_window_days: 3     # 同 contact+主题 邻近窗口去重
    max_per_tick: 3          # 每轮最多派发条数（限流）
    interval_sec: 600        # 派发循环间隔
    skip_if_no_context: true # 无可引用上下文 → 跳过不发空话
    quiet_start_hour: 23     # 安静时段开始（命中则顺延发送，不打扰）
    quiet_end_hour: 8        # 安静时段结束
    dry_run: false           # 灰度：只生成+log 不真发
    # 实施84 P0-4（2026-08-29）：dry_run 语义改为「快照不消费待办」——行保持
    # pending，转真发后仍按期发出。同一行每 tick 会再到期 → 重拟冷却防烧 LLM。
    dry_resample_hours: 24   # 同一待办两次试运行拟稿的最小间隔（小时，0=不冷却）
    grace_days: 1            # 逾期超此天数的待办标记 expired（错过时机不补发）
    # 实施84 P0-2（2026-08-29）：派发前跳过「近期已聊过该主题」的待办——只认
    # **出站**消息（客户自己反复提不算「我们已关心过」），0=关闭该护栏。
    already_discussed_hours: 48
    # 实施84 P0-2（2026-08-29）：拟稿增强块（全 best-effort，任一源失败退回旧口径）。
    memory_in_prompt: true   # episodic 记忆要点按约定主题重排后喂进拟稿 prompt
    goal_hint: true          # 该会话活跃 auto 档工作目标的背景/今日方向喂进拟稿
                             # （goals.enabled 关闭时自动为空；「今天只陪伴」的拍
                             # 会转成显式禁营销指令——人的驳回在 care 出口同样生效）
    # P2 2026-08-01：LLM 抽取影子模式（多语种召回升级的对照期）。shadow=true 时
    # LLM 与正则对同一入站流并跑，只写对照日志 logs/care_shadow/*.jsonl + 计数
    # （绝不入库、绝不发送）；enabled 为未来「LLM 真实捕获」预留，当前版本不消费。
    # 廉价门（time_like 多语种时间词）不过门的消息不烧 LLM；每日预算封顶防失控。
    llm_extract:
      shadow: false          # 影子对照开关（需 proactive_care.enabled=true 才生效）
      daily_budget: 150      # 每日 LLM 抽取次数上限
      # P4：LLM 真实捕获——llm_only（LLM 抓到、正则漏掉）的约定真实写入排程。
      # 切主流程：影子跑数日 → python -m scripts.care_shadow_report 复核 llm_only
      # 正确率达标 → 翻 true（overlay 热生效；前提=实例已装载 P4 代码，判据=
      # /api/care/health 的 shadow 快照含 captured 字段）。防双写三层见模块注释。
      enabled: false
    # 实施84 P0-3（2026-08-29）：软承诺捕获——「下次给你看照片/等我忙完这阵」这类
    # **无未来时间锚**的高价值回访点，硬约定层全部漏网（captured_24h=0 的主因之一）。
    # 默认关；开后 due=now+due_hours，置信独立把关；同句有时间锚让位硬约定层绝不双捕；
    # 问句/敷衍语（「下次再说」）不捕；per-contact pending 上限是防灌真护栏。
    capture_soft:
      enabled: false
      min_confidence: 0.55       # 软层独立置信阈值（有主题词 0.65 / 摘要兜底 0.55）
      due_hours: 72              # 软承诺回访时点 = 捕获后 N 小时
      max_pending_per_contact: 2 # 该联系人 pending 达上限则不再软捕获
    # P3 2026-08-01：每联系人主动预算（真发防打扰闸，默认开——只减发送不增）。
    # 读写共用 outreach_log 共享账本：proactive_topic 真发本就落账、care 真发也落账；
    # 该联系人今天已被主动摸够（max_daily_touches 含本次）或距上次太近（min_gap_hours）
    # → 本条 care 跳过（note=contact_budget）。dry_run 不拦（样本要流动），危机关怀豁免。
    contact_budget:
      enabled: true
      min_gap_hours: 4       # 距该联系人上次任何主动触达的最小间隔
      max_daily_touches: 2   # 本地自然日内主动触达上限（含本次 care）
    # 实施84 P1-1/P1-2（2026-08-29）：主动关怀 × 工作目标（companion.goals）联通。
    # enabled=true 后：① 捕获的约定回流该会话活跃目标的事件时间线（capture_events，
    # 坐席在目标卡「AI 做了什么」可见）；② auto 档活跃目标 deadline 前 days_before 天
    # 自动排一条「目标推进型关怀」（topic_norm=goal:*，走 care 全套预算/安静/人审/
    # dry_run 护栏；30 天 topic_norm 去重保证同一 deadline 只排一次）。
    # goals.enabled 关闭时本段自动空转零副作用。拟稿目标背景另由上方 goal_hint 控制。
    goal_link:
      enabled: false
      days_before: 3         # deadline 前几天排期到期关怀
      capture_events: true   # 捕获约定回流目标事件时间线
  # 多平台 deferred 发送队列：care/reactivation 的**非 messenger** 主动消息发送闭环。
  # messenger 仍走既有 RPA runner deferred 路径；本队列服务 telegram/line/whatsapp 等
  # 可编程发送平台——经编排器 worker 统一投递，复用 kill-switch/quiet_hours/pacing/
  # staleness 通用护栏。默认关；开启后 care 抽到的非 messenger 约定才会真发（否则丢弃）。
  multiplatform_deferred:
    enabled: false           # 总开关（默认关）
    interval_sec: 120        # drain 循环间隔（秒）
    max_per_tick: 3          # 每轮最多真发条数（慢清，防一波轰）
    min_gap_sec: 45          # 同 (platform,account) 两次发送最小间隔（pacing）
    quiet_start_hour: 23     # 安静时段起（命中则顺延，不打扰），24h 制
    quiet_end_hour: 8        # 安静时段止
    # 注册 sender 的平台白名单（留空用默认全集）；messenger 永不在此（走 RPA 路径）
    platforms: [telegram, line, whatsapp, instagram, zalo]
  # Phase4：入站表情回应轻量跟进——对端给**我方消息**点 ❤️👍 等正向反应 →
  # 短延迟经 multiplatform_deferred 回一句轻量确认（像真人看到回应后顺口接一句）。
  # 带会话冷却 + proactive 情绪护栏（severe 窗口 block）。默认关；依赖
  # companion.multiplatform_deferred.enabled 才有真发（否则入队返回 0）。
  reaction_followup:
    enabled: false
    platforms: [whatsapp]
    cooldown_hours: 6        # 同会话两次跟进最小间隔
    defer_sec: 45            # 看到反应后延迟多久发（秒）
    staleness_sec: 3600      # 超时未发则丢弃
    quiet_start_hour: 23
    quiet_end_hour: 8
  # 质量趋势持久化：周期把 companion_quality_overview（内存即时聚合）快照落地为时序，
  # 看板据此画「质量在变好还是变差」的趋势线（/api/companion/quality-trend）。默认关。
  quality_trend:
    enabled: false           # 总开关（默认关）
    interval_sec: 300        # 快照间隔（秒）
    window_hours: 24         # 每次快照统计的回看窗口（小时）
    retention_days: 30       # 时序保留天数（超期自动清理）
  # 群脉 CrowdX 真发（group_show.live）—— 双锁之一（另一把是调用方显式 confirm_live=True）。
  # 缺省关：任何一把没开齐，live.perform 一条都不发。开闸前先用
  # ``python -m scripts.group_show_live --check`` 跑预检，再用导播台/API 真发。
  # 单号场景请用 ``config/playbooks/solo_*.yaml``（四角剧本 + 一个号会被拒演，防自问自答）。
  group_show:
    live:
      enabled: false         # 配置侧那把锁（缺省关；出事时改这里即可全局急停）
      # quiet_hours: [23, 8] # 禁演时段（本地钟点，半开半闭）；配 [0, 0] ＝ 不禁
  # 主动话题调度（沉默驱动）：用户久未说话时，从其高置信记忆挑话题主动开场
  # （"上次你说在备考，后来怎么样？"）。仅 Telegram 协议号；只在「我方说完后冷场」时主动
  # （对方未回属 SLA，不在此）。与 proactive_care(承诺驱动) 互补，且对已排关怀的会话自动让路。
  # 预览/试发/评分回流端点（/api/companion/proactive/*）即便本块关闭也可用（开闸前先观测）。
  # 今日话题包（2026-08-02，「开新话题」能力从无到有）：RSS 抓当日新鲜事（默认
  # Google News zh-CN + BBC 中文；后台 daemon 刷新绝不阻塞出话）→ 保守屏蔽词过滤
  # （战争/灾难/凶案等不进闲聊）→ 按人设兴趣词优先挑 pick_k 条 → 冷场/被问起时注入
  # prompt 供 AI 自然聊起（同会话 cooldown_hours 冷却防刷屏）。核心 src/companion/daily_topics.py。
  daily_topics:
    enabled: false
    refresh_hours: 6         # 缓存刷新间隔（失败自带 600s 重试节流）
    pick_k: 3                # 每次注入几条
    cooldown_hours: 4        # 同会话两次话题注入最小间隔
    # offer_percent: 15      # 非触发词场景的注入概率（%）；「新闻为主」部署调高（实施55）
    # feeds: []              # 自定义 RSS 源列表（缺省用内置 Google News zh + BBC 中文）
    # blocklist: []          # 追加屏蔽词（在内置保守表之上）
    # 按人设分源（实施55，2026-08-22）：键=人设 id（人设级本土源）或居住地国家码
    # （CA/US/ES…，按 persona location 命中）；命中的区域独立缓存独立刷新，冷启动
    # 自动回落全局 feeds。人设聊「自己城市/国家的社会新闻」靠这里。
    # region_feeds:
    #   lin_xiaoyu: ["https://news.google.com/rss/search?q=哈尔滨&hl=zh-CN&gl=CN&ceid=CN:zh-Hans"]
    #   CA: ["https://news.google.com/rss?hl=zh-CN&gl=CA&ceid=CA:zh-Hans"]
    # ── 实施84 P2 内容策略（2026-08-29 老板拍板）────────────────────────────
    exclude_sports: true     # 不做球队赛事类分享/素材（默认开；生活方式类健身/
                             # 露营词不受影响，只剔赛事/球队语义）
    # prefer_kinds: [entertainment, news]  # 选题类别偏好序：社会/娱乐新闻为主
    # 新闻以「用户所在国家」为准（显式信号：自述城市/号码国码/语种默认国，
    # 经 user_clock 解析）：region_feeds[国家码] 运营配置优先，否则自动构造
    # 该国 Google News 源（按国家独立缓存 u-<CC>，冷启动回落全局池）。
    # 「用户在哪」优先于「人设在哪」（实施55 的人设分源降为第二优先级）。
    user_region:
      enabled: false
    # 主动触达也用新鲜事（2026-08-03）：升级链 生活分享 → news_share → 天气；
    # 72h/会话频控 + 缓存超 24h 视同无货（旧闻不当「今天」说）。需与 enabled 同开。
    proactive:
      enabled: false
      # upgrade_life_share: false  # 实施55「新闻为主」：true=news 有货时连 life_share
      #                            # 也让位（预写生活素材降为新闻无货/频控窗内的补位）
  # 被骂回怼（2026-08-12，src/companion/temper.py）：客户无端辱骂时按人设脾气
  # 顶回去而非客服腔安抚（陪伴场景「被骂还赔笑」＝当场穿帮）。A/B 两链
  # （原生 bot + 收件箱全自动/人审草稿）同一注入点。
  # 力度四档：off 不怼（商务顾问类）/ gentle 委屈+立边界 / sharp 阴阳嘲讽
  # 不带脏字 / feisty 直接骂回去可带脏字。
  # 每个人设的档位配在人设文件顶层 temper 字段（Studio 可编辑，热重载 ~3s）
  # ——这里刻意不做 per-persona 映射表，防两处源真相打架；本段只是治理层。
  # ⚠ enabled 默认 true（与「新子系统默认 false」约定分叉）：该行为 2026-08-12
  # 已在生产无闸运行并验证，加闸目的是「能关能调」，默认 false 会静默关掉
  # 运营已在用的行为。危机红线（crisis safety net）优先级恒高于本模块。
  temper:
    enabled: true            # kill switch：false=整块不跑，回 global_rules 共情旧行为
    force_level: ""          # 全员强制档：feisty=「骂人都必须怼」/ gentle=全员软怼 /
                             #   off=全员禁怼（仍记观测数）；空=按人设各自的 temper 字段
    default_level: gentle    # 没配 temper 字段的人设兜底档
    profanity: true          # false=feisty 封顶为 sharp（不降凶只去脏，平台风控收紧时用）
    sticky_window_sec: 600   # 骂战粘性窗：精确命中后窗口内的变体骂法继续保持怼的姿态
    max_rounds: 4            # 连怼熔断：同场骂战陪怼超过 N 轮 → 冷处理收场（真人不会
                             #   无限对轰；掉价+机器感+烧 token）。0=永不熔断
    taunt_response: true     # 激将接梗：「你太没脾气了/你倒是骂我啊」不是骂战，像真人
                             #   一样拽回去/俏皮反将（绝不上钩开骂、绝不客服腔）；false=关
    platform_caps: {}        # 平台风险封顶（压过 force）：如 {messenger: sharp} 把网页
