      scope: cultural
      greet: true
      rule: {type: nth_weekday, month: 9, weekday: 6, nth: 1}
    - key: nz_labour_day
      name_zh: 劳动节
      name_en: Labour Day
      scope: public
      greet: false
      rule: {type: nth_weekday, month: 10, weekday: 0, nth: 4}
    - key: nz_christmas
