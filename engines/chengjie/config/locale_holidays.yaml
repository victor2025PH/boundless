# ----------------------------------------------------------------------------
# - 印度教节日（Diwali / Holi）：印度阴阳历，各邦口径不一，无可信规则。
# - 泰/柬/缅佛历节日（Loy Krathong / Pchum Ben / Visak Bochea）：泰历≠中国农历，
#   用 lunar 规则会系统性错日子。
# - 巴厘岛 Nyepi（萨卡新年）、马来/新加坡 Deepavali：同上。
# - 加拿大维多利亚日、以色列独立日、新西兰 Matariki：规则含 nth_weekday 表达不了的
