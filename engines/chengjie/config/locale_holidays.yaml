  # ── 以色列 ────────────────────────────────────────────────────────────────
  # 全部走 table：希伯来历是算术历（下列日期为精确推算值），但规则引擎里没有希伯来历
  # 实现，故落成表。⚠ 犹太节日**从前一日日落开始**，这里记的是主日（公历白天那天）。
  # ⚠ 已知缺口：以色列独立日（Yom Ha'atzmaut）含「避开安息日」的逐年顺延规则，不收。
  IL:
    - key: il_new_year
      name_zh: 元旦
      name_en: New Year's Day
      scope: cultural
      greet: true
      rule: {type: fixed, month: 1, day: 1}
    - key: il_purim
      name_zh: 普林节
      name_en: Purim
      scope: religious
      greet: true
      rule: *heb_purim
    - key: il_pesach
      name_zh: 逾越节
      name_en: Passover (Pesach)
      scope: public
      greet: true
      rule: {<<: *heb_pesach, days: 7}
    - key: il_shavuot
      name_zh: 五旬节
      name_en: Shavuot
      scope: public
      greet: true
      rule: *heb_shavuot
    - key: il_rosh_hashanah
      name_zh: 犹太新年
      name_en: Rosh Hashanah
      scope: public
      greet: true
      rule: {<<: *heb_rosh_hashanah, days: 2}
    - key: il_yom_kippur
      name_zh: 赎罪日
      name_en: Yom Kippur
      scope: public
      greet: false      # 斋戒忏悔日，不道贺
      rule: *heb_yom_kippur
    - key: il_sukkot
      name_zh: 住棚节
      name_en: Sukkot
      scope: public
      greet: true
      rule: {<<: *heb_sukkot, days: 7}
    - key: il_hanukkah
      name_zh: 光明节
      name_en: Hanukkah
      scope: religious
      greet: true
      rule: {<<: *heb_hanukkah, days: 8}


