# ============================================================================
# 双侧本地节日日历（消费方：src/companion/locale_holidays.py）
# ============================================================================
#
# 【这是规则库，不是日期表】
# 绝不逐年手写公历日期。逐年表意味着每年年底必须有人记得来续，而人一定会忘——表一过期
# 系统不会报错，只会**静默地不再有任何节日**，或更糟：拿去年的日子发今年的祝福。所以每
# 条节日写的是「怎么算出它」的规则，一次写清、此后永久自动正确。
#
# 【规则类型（rule.type）】
#   fixed         公历固定月日。            {type: fixed, month: 4, day: 13}
#   lunar         农历月日 → 公历（lunar_python 动态算）。 {type: lunar, month: 1, day: 1}
#                 day 为负＝该农历月倒数第 N 天，-1 即除夕（腊月末日可能廿九也可能三十）。
#   nth_weekday   某月第 N 个星期几。weekday 用 Python date.weekday() 口径（0=周一，
#                 3=周四，6=周日）；nth 为负＝倒数第 N 个（-1=最后一个）。
#                 {type: nth_weekday, month: 11, weekday: 3, nth: 4}   # 美国感恩节
#   easter_offset 复活节 ± N 天（算法内置，零依赖）。
#                 {type: easter_offset, offset: -2}                    # Good Friday
#                 calendar: julian → 东正教（儒略历）复活节，与西方复活节常差 1-5 周。
#   table         逐年查表（见下方「为什么还需要查表」）。
#   jieqi         二十四节气（清明/冬至/春分/秋分…），天文事件、公历日逐年 ±1 天漂。
#                 {type: jieqi, name: 冬至}
#
# 所有类型都支持 days（可选，默认 1）＝从基准日起的连续天数：宋干节 3 天、俄罗斯新年假
# 5 天、光明节 8 天、谢肉节一周。
#
# 【为什么还需要 table（逐年查表）】
# 伊斯兰历依赖新月观测、希伯来历需要另一套完整历法实现，用现有依赖都算不准/算不了，
# 而引新依赖不在预算内。这类节日只能查表，且表**只到 2033 年**。
#   ⚠ 到了表尽头，该节日就**自动消失，而不是外推猜日子**。
#   「今天没节日」是无害降级；「把开斋节发错三天」是文化事故。宁可静默失效。
#   ⚠ 伊斯兰系日期为**近似观测日，各国宣布日可能 ±1 天**（沙特/印尼/土耳其常不同日）。
#     仅用于聊天氛围与共情，**绝不可用于任何承诺、排期、履约或对客告知**。
#   ○ 希伯来历是**算术历**（无需观测），表中日期为精确推算值，仅因规则引擎里没有希伯来
#     历实现才落成表。若将来加 hebrew 规则类型，这些表可整体删除。
#
# 【greet 字段的运营含义】
# 不是日历事实，而是「能不能给一个陌生/半熟用户主动送这条祝福」：
#   true  = 有普遍的私人互祝习俗（春节/圣诞/开斋节/母亲节/情人节/感恩节…）。
#   false = 政治性（国庆/独立日/革命纪念/主权日）、哀悼性（阵亡将士/国难日/扫墓节）、
#           军事纪念、纯行政假（银行假日/节礼日/补假）。这些只作**事实注入**，不群发祝福。
# 判不准一律保守设 false。「该祝贺却没祝贺」是遗憾，「在人家的国难日说节日快乐」是事故。
# 本表把**所有**国庆/独立日/主权日统一设 false（含美国 7/4、加拿大国庆）——口径一致比
# 逐国拍脑袋更可维护；某国确认可祝贺再单独放开。
#
# 【scope】public=法定假 | religious=宗教节 | cultural=民俗/商业节。
# 同一天撞多个节日时按 public → religious → cultural 排序（法定假最可能真被过到）。
#
# 【策展原则】每国 8-12 条，宁精不滥：新年 + 国庆 + 最重要的传统节日 + 与「陪聊问候」
# 真正相关的情感型节日（情人节/母亲节/父亲节/中秋/儿童节）。刻意留白的见文末「已知缺口」。
# ============================================================================

version: 1

# ── 共享规则（YAML 锚点：同一份日期表被多国引用，改一处即全体生效，避免抄多份腐烂） ──
# 用 `rule: *anchor` 直接引用，或 `rule: {<<: *anchor, days: 3}` 覆盖连续天数。
_shared_rules:

  # 斋月首日（1 Ramadan）。表历推算 + 1447AH=2026-02-18 观测锚点校准。
  ramadan_start: &ramadan_start
    type: table
    dates:
      2026: "02-18"
      2027: "02-08"
      2028: "01-28"
      2029: "01-16"
      2030: ["01-06", "12-26"]   # 伊斯兰年比公历短 ~11 天，同一公历年可撞两次
      2031: "12-15"
      2032: "12-04"
      2033: "11-23"

  # 开斋节（1 Shawwal / Eid al-Fitr / Idul Fitri / Hari Raya Puasa）
  eid_al_fitr: &eid_al_fitr
    type: table
    dates:
      2026: "03-20"
      2027: "03-10"
      2028: "02-27"
      2029: "02-15"
      2030: "02-05"
      2031: "01-25"
      2032: "01-14"
      2033: ["01-03", "12-23"]

  # 宰牲节（10 Dhu al-Hijja / Eid al-Adha / Hari Raya Haji / Kurban Bayramı）
  eid_al_adha: &eid_al_adha
    type: table
    dates:
      2026: "05-27"
      2027: "05-17"
      2028: "05-05"
      2029: "04-24"
      2030: "04-14"
      2031: "04-03"
      2032: "03-22"
      2033: "03-12"

  # ── 希伯来历（算术历，下列为精确推算值） ──
  purim: &heb_purim
    type: table
    dates:
      2026: "03-03"
      2027: "03-23"
      2028: "03-12"
      2029: "03-01"
      2030: "03-19"
      2031: "03-09"
      2032: "02-26"
      2033: "03-15"

  pesach: &heb_pesach
    type: table
    dates:
      2026: "04-02"
      2027: "04-22"
      2028: "04-11"
      2029: "03-31"
      2030: "04-18"
      2031: "04-08"
      2032: "03-27"
      2033: "04-14"

  shavuot: &heb_shavuot
    type: table
    dates:
      2026: "05-22"
      2027: "06-11"
      2028: "05-31"
      2029: "05-20"
      2030: "06-07"
      2031: "05-28"
      2032: "05-16"
      2033: "06-03"

  rosh_hashanah: &heb_rosh_hashanah
    type: table
    dates:
      2026: "09-12"
      2027: "10-02"
      2028: "09-21"
      2029: "09-10"
      2030: "09-28"
      2031: "09-18"
      2032: "09-06"
      2033: "09-24"

  yom_kippur: &heb_yom_kippur
    type: table
    dates:
      2026: "09-21"
      2027: "10-11"
      2028: "09-30"
      2029: "09-19"
      2030: "10-07"
      2031: "09-27"
      2032: "09-15"
      2033: "10-03"

  sukkot: &heb_sukkot
    type: table
    dates:
      2026: "09-26"
      2027: "10-16"
      2028: "10-05"
      2029: "09-24"
      2030: "10-12"
      2031: "10-02"
      2032: "09-20"
      2033: "10-08"

  hanukkah: &heb_hanukkah
    type: table
    dates:
      2026: "12-05"
      2027: "12-25"
      2028: "12-13"
      2029: "12-02"
      2030: "12-21"
      2031: "12-10"
      2032: "11-28"
      2033: "12-17"


# ── 语种 → 默认国家 ────────────────────────────────────────────────────────────
# en/es/pt/fr **刻意留空**：跨洲通用语（英语可能是美/英/加/澳/菲/印，西语可能是西班牙
# 或整个拉美），猜错的代价（给美国人发西班牙国庆祝福）远大于猜对的收益。留空则退回通用
# 路径。调用方若能给出显式区域子标签（en-US / zh-HK / pt-BR），消费方会优先采用——那是
# 数据而不是猜测。
lang_defaults:
  zh: CN
  ja: JP
  ko: KR
  th: TH
  vi: VN
  id: ID
  ms: MY
  tl: PH
  fil: PH
  km: KH
  hi: IN
  ar: AE
  tr: TR
  ru: RU
  he: IL
  de: DE
  it: IT
  en: ""     # 跨洲通用语，不猜
  es: ""     # 跨洲通用语，不猜
  pt: ""     # 跨洲通用语，不猜
  fr: ""     # 跨洲通用语，不猜


