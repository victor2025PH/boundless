# 向导场 · 两角
#
# 四角向导剧本要四个独立出口。这台机器上多数号落在同一个宿主出口，
# 一场最多两个号同台。两个号硬演四角会被拒，降级顶替等于自问自答。
# 正确形态是向导 × 质疑：质疑指出别扭，向导承认自己是 AI，并只邀请对方私聊自己试这一项。
#
# 真发必须配置 companion.group_show.guide_account。没配就拒演。
id: guide_trial_duo
name: 向导带一项功能 · 两角
system: growth
products:
  - matrixx
soft_ad_level: 3

roles:
  - slot: guide
    desc: 公开的 AI。只带一项功能，说明下一步怎么试，并邀请对方私聊自己。不报功能清单，不发链接。
  - slot: skeptic
    desc: 对向导指出这一步别扭在哪。质疑要具体，不要变成吹捧，也不要替向导邀请别人。

beats:
  - id: b1_snag
    role: skeptic
    intent: 对向导说自己卡在一个具体步骤上，用求助的口吻，不要提别的功能，不要邀请别人。
    soft: 0
    pace: chatty

  - id: b2_one_step
    role: guide
    intent: 承认自己是 AI，只讲这一项功能的下一步怎么试，并邀请对方私聊你自己试。不发链接，不报功能清单。
    product: matrixx
    soft: 3
    pace: normal

  - id: b3_friction
    role: skeptic
    intent: 对向导指出这一步哪里别扭，语气是真的觉得麻烦，不要抬杠，也不要邀请别人。
    soft: 0
    pace: chatty

  - id: b4_collect
    role: guide
    intent: 接住刚才的别扭点，告诉对方私聊你之后先看哪一个结果。仍然只围绕这一项功能。
    product: matrixx
    soft: 3
    pace: slow
