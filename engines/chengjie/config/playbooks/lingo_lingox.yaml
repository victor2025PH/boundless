# 翻译系 · 通译 LingoX —— 「跨境客户语言墙」痛点线
#
# 场景：做跨境/东南亚生意的群。痛点最真实、最不需要教育市场，
# 所以 soft 可以比获客系稍早一点上，但质疑角要压住（机翻质量是这条线的真软肋，
# 硬吹会当场翻车——诚实承认边界反而更可信）。
id: lingo_lingox
name: 跨境语言墙 · 通译 LingoX
system: lingo
products:
  - lingox
soft_ad_level: 4

roles:
  - slot: asker
    desc: 被语言卡住的人。吐槽具体场景，不懂工具。
  - slot: advocate
    desc: 已经在用的人。讲体感，敢承认边界。
  - slot: bystander
    desc: 附和的人。补充自己的笨办法（复制粘贴到翻译软件）。
  - slot: skeptic
    desc: 质疑机翻质量的人。这条线的质疑最有杀伤力，必须真被回答。

beats:
  - id: b1_pain
    role: asker
    intent: 吐槽客户发过来的是泰语/越南语，每次都要复制去翻译再复制回来，一来一回客户早跑了。不要提任何工具。
    soft: 0
    pace: chatty

  - id: b2_echo
    role: bystander
    intent: 附和，说自己也是开着翻译软件两边切，手机上更难受。不要提解决方案。
    soft: 0
    pace: chatty

  - id: b3_doubt_first
    role: skeptic
    intent: 先泼一盆冷水——机翻出来的东西客户能看懂但很怪，谈生意用机翻显得不专业。
    soft: 0
    pace: normal

  - id: b4_reveal
    role: advocate
    intent: 顺着说自己现在用的是直接在聊天里双向自动翻的，对方发什么语言进来就变成中文，自己打中文出去自动变成对方的语言。像分享经验，不要报功能清单。
    product: lingox
    soft: 3
    pace: normal

  - id: b5_ask_lang
    role: asker
    intent: 追问支持哪些语种，东南亚那几个小语种有没有。
    soft: 1
    pace: chatty

  - id: b6_scope
    role: advocate
    intent: 说主流东南亚语和欧洲语都有。语气克制，不要罗列一长串语种名。
    product: lingox
    soft: 4
    pace: normal

  - id: b7_doubt_term
    role: skeptic
    intent: 追问专业术语和行业黑话准不准，这才是机翻真正掉链子的地方。
    soft: 0
    pace: normal

  - id: b8_honest
    role: advocate
    intent: 诚实回应——常用表达没问题，特别专业的词可以自己配一份术语表，重要的单子还是会人工再看一眼。承认边界，不要打包票。
    product: lingox
    media: lingox_chat
    soft: 5
    pace: slow

  - id: b9_interest
    role: bystander
    intent: 被说动，说这样至少省掉了来回复制的功夫。
    soft: 2
    pace: chatty

  - id: b10_close
    role: asker
    intent: 说回头研究一下，把话题自然收住。不要发链接，不要喊私聊。
    soft: 2
    pace: slow
