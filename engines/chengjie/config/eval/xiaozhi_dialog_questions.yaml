# 小智对话回归金标（tools/xiaozhi_dialog_eval.py 消费）。
#
# 口径：每题真跑「BM25 检索 → LLM 引用作答」全链（与线上 /api/assistant/query
# 同一套路由代码），判定四态：
#   GUIDED  = 有来源 + 非拒答 + 命中 must_any 任一关键词（答案真的在引导）
#   WRONG   = 有来源作答但 must_any 全脱靶（答非所问，比拒答更糟）
#   REFUSED = 诚实拒答（语料缺口——补 help_terms / howto_pack，红线：只写真实行为）
#   NO-SOURCE = 零检索命中却出了话（检索层缺口）
#
# 纪律（2026-09-01 老板指令 · chatx-desktop-install.mdc「频道发版文案纪律」§3）：
# 每次发版要宣传的新功能，先在这里加金标题目再跑一轮——小智答不上不许发版。
# must_any 是「至少命中其一」的宽口径：抓跑偏，不逼措辞。
questions:
  - tag: sop_workflow
    q: "SOP 工作链怎么用？怎么给客户挂上跟进链条？"
    must_any: ["工作链", "/workflows"]
  - tag: deal_engine
    q: "成交引擎是什么？在哪里打开？"
    must_any: ["旅程", "工作链", "管理员"]
  - tag: vision_summary
    q: "客户发来的图片，AI 识别的内容摘要在哪里看？"
    must_any: ["AI 识图", "识图", "展开"]
  - tag: voice_clone_bind
    q: "怎么克隆客户的音色并绑定到人设？"
    must_any: ["克隆音色", "绑定", "语音行"]
  - tag: birthday_memory
    q: "客户说今天是他生日，AI 会记住吗？"
    must_any: ["记住", "记忆", "AI 记忆"]
  - tag: voice_fallback
    q: "发语音时为什么用了标准音色而不是克隆音色？"
    must_any: ["标准音色", "原因", "语言", "额度"]
  - tag: image_gen
    q: "AI 生成图片功能怎么用？点了没反应怎么办？"
    must_any: ["生成图片", "未启用", "工具箱"]
  - tag: app_update
    q: "怎么把智聊更新到最新版本？"
    must_any: ["重启更新", "下载页", "更新"]
  - tag: getting_started
    q: "这个软件怎么用？我第一次用该从哪开始？"
    must_any: ["账号", "人设", "工作台"]
  - tag: send_voice
    q: "怎么给客户发语音消息？"
    must_any: ["语音", "生成", "试听"]
  # ── 真实缺口批②（2026-09-01 gap_report 首跑高频未答，口径已核实/老板拍板）──
  - tag: greeting_draft
    q: "帮我写一句给客户的问候语"
    must_any: ["AI回复", "会话", "拟稿", "草稿"]
  - tag: export_phones
    q: "怎么导出所有客户的手机号？"
    must_any: ["手机号", "CSV", "客户列表"]
  - tag: douyin
    q: "支持抖音吗？"
    # 「不支持」宽判：LLM 可能答「不支持抖音」或「暂不支持」或给四平台清单，
    # 三种都是对的——判词抓事实立场，不逼措辞（首版只认「暂不支持」误判过）。
    must_any: ["不支持", "Telegram", "四个平台"]
  # ── v1.0.68 发版批（2026-09-02 发版纪律 §3：宣传的新入口先补金标再发版）──
  - tag: buried_archived_unread
    q: "「归档中还有 N 条未读」是什么意思？未读徽标数和列表对不上怎么回事？"
    must_any: ["归档", "未读", "徽标"]
  - tag: resume_deliver_gate
    q: "收件箱提示「全局已暂停真发」，自动回复不发了怎么恢复？"
    must_any: ["恢复真发", "横幅", "主管"]
  # ── v1.0.73 发版批（I-2 三项入口 + 全自动影子档）──
  - tag: acct_unread_open
    q: "未读数字怎么点？账号栏上的未读数字点开能看到哪几条会话？"
    must_any: ["未读", "账号", "会话"]
  - tag: bind_persona_yellow
    q: "账号黄点怎么绑人设？黄色小点是什么意思？"
    must_any: ["人设", "黄", "账号"]
  - tag: set_address_names
    q: "怎么设称呼？怎么让 AI 知道我怎么叫客户、客户怎么叫我？"
    must_any: ["称呼", "客户", "保存"]
  - tag: autosend_shadow
    q: "全自动就是全自动吗？高风险稿还会被扣住不发吗？"
    must_any: ["放行", "台账", "不拦", "全自动"]
