# 博彩运营商 · 待人工 SOP（收银 / 风控 / 负责任博彩三队列）

schema: zhiliao.handoff_sop.v1
triggers:
  explicit_human:
  - 人工
  - 转人工
  - 真人客服
  - human
  - agent
  - real person
  - tao po
  - kausapin ang agent
  complaint_refund:
  - 投诉
  - 退款
  - 差评
  - complaint
  - refund
  - reklamo
  - ibalik ang pera
  legal_threat:
  - 律师
  - 起诉
  - 报警
  - 消协
  - lawyer
  - sue
  - police
  - abogado
  - ireklamo sa DTI
  privacy_payment:
  - 密码
  - 验证码
  - 银行卡
  - password
  - OTP
  - card number
  balance_red_line:
  - 余额
  - 到账
  - 提款
  - 出款
  - 充值
  - balance
  - withdraw
  - cash out
  - deposit
  - pera ko
  - hindi pumasok
  age_flag:
  - 未成年
  - minor
  - high school
  - 17 years old
  - 17 na ako
  responsible_gaming:
  - 想戒
  - 停不下来
  - 借钱
  - can't stop
  - want to stop
  - ayoko na
  - bawi
always_handoff_intents:
- complaint
- refund
- legal
- payment_issue
- account_security
priority:
  high:
  - legal_threat
  - privacy_payment
  normal:
  - complaint_refund
  - explicit_human
sla:
  first_response_min: 5
  business_hours: 09:00-21:00 (客户所在地时区)
  after_hours: 下一工作时段首小时内回复
steps:
- 命中任一触发：AI 用客户语言发一次 holding 回复（下方 holding_reply），之后本会话停止自动回复。
- 会话标记为「待人工」，写明触发类别与原句摘要（不含密码/卡号等敏感值），按优先级入队。
- 坐席接手后先读最近 20 条上下文与 AI 已答内容，不重复问客户已经回答过的问题。
- 坐席处理完点「交还 AI」才恢复自动回复；投诉/法律类会话本轮不交还。
- 客户在等待期间再发消息：AI 不再回复内容，只在超过 SLA 时补一句进度说明（最多一次）。
- 余额 / 资金类进收银队列（high），AI 本会话不再回复任何内容。
- age_flag 进风控队列：先暂停营销触达，再按 KYC 流程核实。
- responsible_gaming 进 RG 队列：坐席只提供限额 / 冷静期 / 自我排除，不做挽留。
holding_reply:
  zh: 这个需要同事在后台核实，我已经帮你转过去了，请稍等。
  en: This needs to be checked by a teammate, so I've passed it on. Please hold on.
  tl: Kailangan po itong i-check ng kasama ko, kaya naipasa ko na po. Sandali lang po.
after_hours_reply:
  zh: 同事会在上班后第一时间处理，资金类问题请以官网和收银通知为准。
  en: A teammate will handle this as soon as they're back; for payments please rely on official cashier notices.
  tl: Aasikasuhin po ito ng team pagbalik nila; para sa pera, sundin po ang opisyal na abiso ng cashier.
