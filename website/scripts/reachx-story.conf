# 智拓 ReachX 故事频道方案站（静态导出，发合作方看）· 2026-09-10
# 线上：/etc/nginx/snippets/reachx-story.conf，由 sites-available/yuntech 的 bd2026.cc 443 块 include。
# 内容在 /var/www/reachx-story（智拓仓 scripts/content/story_site_publish.ps1 上传），独立于 Next 应用目录：
# 官网全站部署的 rsync --delete 不会碰到它，更新也不需要 pm2 restart。
location ^~ /reachx-story/ {
    alias /var/www/reachx-story/;
    index index.html;
    add_header X-Robots-Tag "noindex, nofollow";
    add_header Cache-Control "public, max-age=300";
}
location = /reachx-story { return 301 /reachx-story/; }
