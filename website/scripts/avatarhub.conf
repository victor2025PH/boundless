# AvatarHub 安装包下载站（/order /pricing /download 已迁入 Next.js 应用本体）
#
# 2026-09-10 起「R2 独立承担下载」（老板拍板，腾出 VPS 38 GB）：
# · /releases/ 下所有发布件二进制（组件包 .tar.zst、安装器 .exe、blockmap 等）一律 302 到 Cloudflare R2 边缘
#   dl.bd2026.cc，**不再区分是否带 Range、不再本机直出**；本机 /var/www/dl/releases 只保留清单类小文件
#   （manifest.json / versions.json / channels.json / notices.json / release_manifest.json / SHA256SUMS / *.md）。
# · 历史版本 1.0.1 / 1.3.0 / 1.4.0–1.4.2 已在 2026-09-10 补齐到 R2（与 1.4.3 同 inode 的包用 R2 服务端复制），
#   所以通配 302 不会把回滚下载打成 404；新版本发布仍需同步 R2（rclone），否则该版本的包会 404。
# · 取消的是 2026-08-12 加的「无 Range 走本机」兜底：用户到 Cloudflare 边缘不可达时安装器会失败，这是已接受的代价。
#   R2 全面故障应急：注掉下面第一个 location，rclone copy r2:avatarhub/releases /var/www/dl/releases（约 38 GB）后 reload。
location ~ ^/releases/.+\.(tar\.zst|zst|exe|blockmap|zip|7z|msi|whl|bin|safetensors|onnx|pth)$ {
    return 302 https://dl.bd2026.cc$request_uri;
}
location /releases/ { alias /var/www/dl/releases/; autoindex off; }

# 每日视频动态等媒体文件（发布机 scp 直传，nginx 直出，部署不影响）
location /media/ {
    alias /var/www/media/;
    expires 7d;
    add_header Cache-Control "public";
}

# AvatarHub 匿名遥测接收（2026-07-13）：反代到本机 stdlib ingest；体量极小、带令牌+限频
location /t/ {
    proxy_pass http://127.0.0.1:8787;
    proxy_set_header X-Real-IP $remote_addr;
    client_max_body_size 128k;
}
