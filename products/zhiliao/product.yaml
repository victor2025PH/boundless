  - { id: recharge-10000, name: { zh: 充值 10000U, en: Top up 10000U }, unit: one-time, price: "10000", currency: USD, note: "15,000,000 Token/首充 +40% 到账 21,000,000/实付 24 个月有效/大额档权益全含 + 团队用量分账报表 + API 对接支持" }
