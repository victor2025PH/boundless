# products/zhiliao/product.yaml — 智聊 ChatX（照 tongyi 模板）
#
# ── 2026-08-21 定价改版（充值唯一化：订阅全线停售，只留「免费开始 + 按充值计费」，老板拍板）──
# 免费开始（非 SKU 档位）：下载即用、标准翻译永久免费不限量（公平使用 200 万字符/日/授权）、
# 每月 1,000 Token、注册再送 10,000 体验 Token、1 账号防薅护栏——chatx-free 条目保留承载该口径。
# 充值八档（唯一付费通道）：6U 新人包 + 50/100/200/500/1000/5000/10000 USD；1 USD = 1,500 Token；
# 首笔充值按档一次性加赠 +5/10/20/30/35/40%（每人一次，履约侧按 账号+支付指纹+设备指纹 核验，
# 退款回收加赠）；新人包 6U=18,000（2 倍率，注册 72h 内、每账号一次、不占首充资格）。
# 大额档（≥5000U）附服务权益：专属客户经理/发票合同/优先支持；10000U 另含团队用量分账报表 + API 对接支持。
# 企业两形态（lead-based 面议，不走自助结算）：chatx-enterprise=企业合作年框（协议价/月结/发票/SLA）；
# chatx-private-deploy=企业级私有化部署（一次性实施 + 年授权维保，本地模型数据不出网，
# 承接旧旗舰版「可选私有化」叙事）。
# Token 计价（跨 ChatX/LingoX 通用）：AI 回复 10/条 · 专业翻译 10/千字符 ·
# DeepL 认证翻译 40/千字符 · 克隆语音 10/100字符 · AI 配图 50/张 · ASR 5/分钟；
# 标准翻译（内置引擎）0 Token 永久免费（公平使用 200 万字符/日/授权）。
# 充值实付 12 个月有效（≥500U 档 24 个月）、赠送 6 个月先扣；扣减顺序=先赠送、
# 再存量订阅含量（停售订阅履约期内仍有效）、后充值实付。
# 停售台账（保留条目供历史订单反查，勿删）：chatx-entry/chatx-team（2026-08-19）、
# chatx-team-seat 与 token-pack-s/m/l/xl（2026-08-20）、
# chatx-personal/chatx-pro/chatx-flagship 订阅三档（2026-08-21，存量按期履约到期转充值）。
# 展示单一真相：website/lib/chatx-pricing.ts（改价先改本文件再同步该文件）。
id: zhiliao
brand_key: chatx
name:   { zh: 智聊, en: ChatX }
category: growth
tagline:
  zh: 多平台统一收件箱 + AI 人设承接 + 免费翻译 + 转人工，全自动开发客户推进成交
  en: Omni-channel unified inbox + AI persona + free translation + human handoff
engine: chengjie
engine_services: [main.py]         # 统一收件箱/AI 承接/handoff（src/inbox·ai·integrations）

compliance:
  visibility: mixed                # 官方 API 企业版=公开主站；个人号版=隔离/准入
  risk: mid
  guard: 主站只放官方 API 企业版；个人号 RPA 版进准入区

website:
  landing: null                    # 首页 #autochat 段（无独立落地页）
  anchor: "#autochat"
  matrix_family: growth

# 充值唯一化（2026-08-21 决议；website/lib/chatx-pricing.ts 派生展示）；单位 USD、结算支持 USDT（dual）
skus:
